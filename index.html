ates cause SLUDGE with miosis and bradycardia. E: β-blockers cause bradycardia and hypotension.","source_slide":"L10 Clinical Toxicology, slides 10, 16, 20"},{"id":"FND-PHARM-L10-02","block":"Foundations","lecture":"L10 Clinical Toxicology","discipline":"Pharmacology","style":"LAU","stem":"On the lecture's lists of agents causing toxic hypotension and toxic bradycardia, which agent appears on both?","options":{"A":"Clonidine","B":"Cocaine","C":"Theophylline","D":"Reserpine","E":"Digoxin"},"answer":"A","explanation":"Clonidine (with calcium channel blockers) is listed for both hypotension and bradycardia. B: Cocaine (free base) causes tachycardia and hyperthermia. C: Theophylline also causes tachycardia and hyperthermia. D: Reserpine is listed for hypotension only. E: Digoxin is listed for bradycardia only.","source_slide":"L10 Clinical Toxicology, slides 18–20"},{"id":"FND-PHARM-L10-03","block":"Foundations","lecture":"L10 Clinical Toxicology","discipline":"Pharmacology","style":"LAU","stem":"A patient presents 6 hours after swallowing a large number of tablets. Which statement about emptying the stomach (emesis or lavage) is most accurate?","options":{"A":"It should be done before assessing airway and circulation","B":"It is most effective 4–8 hours after ingestion","C":"It enhances elimination of drug already absorbed","D":"It must be done before any antidote can be given","E":"Its benefit is now limited; it works mainly within 1–2 hours"},"answer":"E","explanation":"Emptying the stomach is effective only 1–2 h after ingestion; by 6 h most drug has left the stomach. A: Stabilizing vital signs (ABC) always comes first. B: The useful window is 1–2 h, not 4–8 h. C: It prevents absorption; enhanced elimination uses forced diuresis, multiple-dose charcoal, dialysis, hemoperfusion or urine alkalinization. D: Antidotes are given as soon as indicated; they must be used quickly.","source_slide":"L10 Clinical Toxicology, slides 23, 26"},{"id":"FND-PHARM-L10-04","block":"Foundations","lecture":"L10 Clinical Toxicology","discipline":"Pharmacology","style":"LAU","stem":"Naloxone reverses opioid toxicity by competing at μ-opioid receptors. How is it classified among antidote mechanisms?","options":{"A":"Chemical antidote (detoxifies the poison directly)","B":"Functional antagonist (reverses secondary effects)","C":"Pharmacological antidote (acts at receptors)","D":"Chelating agent","E":"Agent that enhances elimination"},"answer":"C","explanation":"Antidotes that act on receptors are pharmacological antidotes; naloxone displaces opioids from μ receptors. A: Chemical antidotes inactivate the poison itself (e.g., chelators, N-acetylcysteine detoxifying NAPQI). B: Functional antagonists reverse downstream effects through another mechanism. D: Chelators bind metals. E: Elimination enhancers include dialysis, charcoal, and urine alkalinization.","source_slide":"L10 Clinical Toxicology, slides 27, 30"},{"id":"FND-PHARM-L10-05","block":"Foundations","lecture":"L10 Clinical Toxicology","discipline":"Pharmacology","style":"LAU","stem":"A patient overdoses on a drug with strong antimuscarinic effects. He has hot dry skin, dilated pupils, tachycardia, and urinary retention. Which antidote is indicated?","options":{"A":"Atropine","B":"Physostigmine","C":"Naloxone","D":"Flumazenil","E":"Acetylcysteine"},"answer":"B","explanation":"Physostigmine, a cholinesterase inhibitor, raises acetylcholine and overcomes the muscarinic block. A: Atropine is itself antimuscarinic and would worsen this; it treats cholinergic (organophosphate) poisoning. C: Naloxone reverses opioids. D: Flumazenil reverses benzodiazepines. E: Acetylcysteine treats acetaminophen poisoning.","source_slide":"L10 Clinical Toxicology, slide 30"},{"id":"FND-PHARM-L10-06","block":"Foundations","lecture":"L10 Clinical Toxicology","discipline":"Pharmacology","style":"LAU","stem":"An unresponsive patient arrives with an unknown ingestion. His respirations are shallow and BP is 80/50. What should be done first?","options":{"A":"Identify the exact toxic agent with a urine drug screen","B":"Give a broad 'cocktail' of antidotes","C":"Perform gastric lavage","D":"Start hemodialysis","E":"Secure airway, breathing, and circulation"},"answer":"E","explanation":"Treat the patient, not the poison: maintaining respiration and circulation comes first. A: Identification proceeds in parallel and often only the class is found. B: Antidotes must have a clearly defined indication and can themselves be toxic. C: Decontamination follows stabilization and is time-limited. D: Enhanced elimination is for selected poisons after stabilization.","source_slide":"L10 Clinical Toxicology, slides 13–14, 23"},{"id":"FND-PHARM-L10-07","block":"Foundations","lecture":"L10 Clinical Toxicology","discipline":"Pharmacology","style":"Step1","stem":"A 45-year-old farmer collapses after spraying crops with an organophosphate. He has salivation, lacrimation, urination, diarrhea, vomiting, pinpoint pupils, and bradycardia. Which antidote should be given?","options":{"A":"Physostigmine","B":"Atropine","C":"Naloxone","D":"Flumazenil","E":"Desferrioxamine"},"answer":"B","explanation":"Organophosphates inhibit acetylcholinesterase, causing cholinergic excess (SLUDGE, miosis, bradycardia); atropine blocks the muscarinic effects. A: Physostigmine also inhibits acetylcholinesterase and would worsen toxicity. C: Naloxone is for opioids; pinpoint pupils alone don't make this opioid toxicity, and opioids don't cause SLUDGE. D: Flumazenil reverses benzodiazepines. E: Desferrioxamine treats iron poisoning.","source_slide":"L10 Clinical Toxicology, slides 21, 30"},{"id":"FND-PHARM-L10-08","block":"Foundations","lecture":"L10 Clinical Toxicology","discipline":"Pharmacology","style":"Step1","stem":"A 3-year-old is brought in after swallowing many of his pregnant mother's prenatal vitamins. He has vomiting, bloody diarrhea, and lethargy, with metabolic acidosis. Which antidote is indicated?","options":{"A":"Succimer","B":"N-acetylcysteine","C":"Deferoxamine (desferrioxamine)","D":"Methylene blue","E":"Fomepizole"},"answer":"C","explanation":"Iron overdose (GI hemorrhage, then acidosis and shock) is treated with the iron chelator deferoxamine. A: Succimer chelates lead and other heavy metals. B: NAC treats acetaminophen. D: Methylene blue treats methemoglobinemia. E: Fomepizole treats methanol and ethylene glycol.","source_slide":"L10 Clinical Toxicology, slide 30"},{"id":"FND-PHARM-L10-09","block":"Foundations","lecture":"L10 Clinical Toxicology","discipline":"Pharmacology","style":"LAU","stem":"A patient is admitted with a large aspirin overdose. Which measure from the lecture enhances aspirin elimination?","options":{"A":"Sodium bicarbonate infusion to alkalinize the urine","B":"Acidifying the urine","C":"Gastric lavage 10 hours after ingestion","D":"Desferrioxamine","E":"Ethanol infusion"},"answer":"A","explanation":"Alkaline urine ionizes the weak acid aspirin, trapping it in the tubule so more is excreted. B: Acid urine keeps aspirin un-ionized, so more is reabsorbed. C: Stomach emptying works only within 1–2 h. D: Desferrioxamine chelates iron. E: Ethanol is the antidote for methanol and ethylene glycol.","source_slide":"L10 Clinical Toxicology, slides 26, 30"},{"id":"FND-PHARM-L11-01","block":"Foundations","lecture":"L11 Drug Interactions and ADRs","discipline":"Pharmacology","style":"LAU","stem":"A patient on a usual dose of lisinopril develops a persistent dry cough. A second patient takes twice the prescribed dose of warfarin by mistake and develops a hematoma. Which classification is correct?","options":{"A":"Both are adverse drug reactions","B":"The cough is a medication error; the hematoma is an ADR","C":"Both are medication errors","D":"The cough is an ADR; the hematoma is an ADE but not an ADR","E":"Neither is an adverse drug event"},"answer":"D","explanation":"An ADR occurs at normal doses in normal use (the cough); harm from an overdose is an ADE that the ADR definition excludes. A: Overdose is excluded from the ADR definition. B: The cough involved no error in the process. C: The cough involved no error. E: Both are injuries from drug use, so both are ADEs.","source_slide":"L11 Drug Interactions and ADRs, slides 5–9"},{"id":"FND-PHARM-L11-02","block":"Foundations","lecture":"L11 Drug Interactions and ADRs","discipline":"Pharmacology","style":"LAU","stem":"Which feature best distinguishes type B (bizarre) from type A (augmented) adverse drug reactions?","options":{"A":"Type B reactions are unpredictable from the drug's known pharmacology","B":"Type B reactions are dose-dependent","C":"Type B reactions are common but rarely fatal","D":"Type B reactions resolve with dose reduction","E":"Type B reactions only appear after drug withdrawal"},"answer":"A","explanation":"Type B reactions are qualitatively abnormal, unpredictable, and not dose-related; rare but with high mortality. B: Dose-dependence characterizes type A. C: Common but rarely fatal describes type A. D: Lowering the dose doesn't prevent type B; the drug must be stopped. E: Reactions on withdrawal are type E.","source_slide":"L11 Drug Interactions and ADRs, slides 27–29"},{"id":"FND-PHARM-L11-03","block":"Foundations","lecture":"L11 Drug Interactions and ADRs","discipline":"Pharmacology","style":"LAU","stem":"A patient taking a non-selective β-blocker for angina develops bronchospasm. Which change best prevents this toxicity while keeping the benefit?","options":{"A":"Increase the dose to improve angina control","B":"Add a second non-selective β-blocker at low dose","C":"Switch to a β1-selective blocker","D":"Give the drug by IV infusion","E":"Add a muscarinic agonist"},"answer":"C","explanation":"Benefit (β1, heart) and toxicity (β2, airways) come from different receptor types, so functional selectivity separates them. A: A higher dose worsens β2 blockade. B: Still non-selective. D: The route doesn't change receptor selectivity. E: A muscarinic agonist would worsen bronchoconstriction.","source_slide":"L11 Drug Interactions and ADRs, slides 14, 17–18"},{"id":"FND-PHARM-L11-04","block":"Foundations","lecture":"L11 Drug Interactions and ADRs","discipline":"Pharmacology","style":"LAU","stem":"A patient on long-term prednisone stops it abruptly and develops hypotension, weakness, and hyponatremia. How is this reaction classified, and how could it have been prevented?","options":{"A":"Type A; by lowering the dose","B":"Type B; by never giving the drug again","C":"Type C; by limiting cumulative use","D":"Type D; by avoiding the drug in pregnancy","E":"Type E; by tapering the dose gradually"},"answer":"E","explanation":"Addisonian crisis after steroid withdrawal is an end-of-use (type E) reaction, avoided by tapering. A: Type A is an augmented effect during use. B: Type B is unpredictable and unrelated to stopping. C: Type C relates to cumulative long-term use (e.g., NSAID nephropathy). D: Type D is delayed (carcinogenesis, teratogenesis).","source_slide":"L11 Drug Interactions and ADRs, slides 27, 30"},{"id":"FND-PHARM-L11-05","block":"Foundations","lecture":"L11 Drug Interactions and ADRs","discipline":"Pharmacology","style":"LAU","stem":"Clavulanic acid has little antibacterial effect alone, but it makes amoxicillin effective against β-lactamase–producing bacteria. Which type of pharmacodynamic interaction is this?","options":{"A":"Additive","B":"Potentiation","C":"Antagonistic","D":"Synergistic","E":"Pharmacokinetic"},"answer":"B","explanation":"In potentiation one drug has little or no effect alone yet increases the other's effect. A: Additive means E(A+B) = E(A) + E(B), both active. C: Antagonistic means one reduces the other (naloxone + morphine). D: Synergism needs both drugs active, with a combined effect above the sum (TMP-SMX). E: The lecture classifies it as a PD effect-modification example.","source_slide":"L11 Drug Interactions and ADRs, slide 50"},{"id":"FND-PHARM-L11-06","block":"Foundations","lecture":"L11 Drug Interactions and ADRs","discipline":"Pharmacology","style":"LAU","stem":"A patient on digoxin starts amiodarone, which displaces digoxin from plasma proteins and also reduces its excretion. What is the expected result?","options":{"A":"Brief rise in free digoxin that settles without a dose change","B":"Fall in total digoxin with free digoxin unchanged","C":"Fall in free digoxin as more is excreted; dose must be raised","D":"Lasting rise in free and total digoxin; dose must be reduced","E":"Lasting rise in total digoxin only; free digoxin unchanged"},"answer":"D","explanation":"Displacement plus reduced excretion blocks the escape route, so free and total levels both rise and the dose must be adjusted. A: That's displacement alone (e.g., phenytoin): the extra free drug is cleared to a new steady state. B: That's the new steady state after displacement alone, not when excretion is also reduced. C: Excretion is reduced, not increased. E: Free (active) drug rises too.","source_slide":"L11 Drug Interactions and ADRs, slides 45–46"},{"id":"FND-PHARM-L11-07","block":"Foundations","lecture":"L11 Drug Interactions and ADRs","discipline":"Pharmacology","style":"LAU","stem":"A patient on lithium for bipolar disorder starts hydrochlorothiazide for hypertension. A week later she has coarse tremor, confusion, and vomiting. What is the mechanism?","options":{"A":"Thiazide inhibits lithium metabolism by CYP3A4","B":"Thiazide reduces lithium's renal excretion","C":"Thiazide displaces lithium from albumin","D":"Thiazide increases lithium absorption","E":"Pharmacodynamic synergism at the same receptor"},"answer":"B","explanation":"Thiazides (and NSAIDs) reduce renal lithium clearance → accumulation of a narrow-therapeutic-range drug. A: Lithium isn't metabolized by CYP enzymes. C: Lithium isn't protein-bound. D: Absorption is already near complete. E: The interaction is pharmacokinetic (excretion).","source_slide":"L11 Drug Interactions and ADRs, slides 40, 49"},{"id":"FND-PHARM-L11-08","block":"Foundations","lecture":"L11 Drug Interactions and ADRs","discipline":"Pharmacology","style":"Step1","stem":"A 34-year-old woman with osteomyelitis receives IV vancomycin over 10 minutes. Soon after, she develops flushing and pruritus of the face, neck, and upper torso, with mild hypotension. IgE testing is negative. What is the best way to prevent this with future doses?","options":{"A":"Permanently stop vancomycin","B":"Give epinephrine before each dose","C":"Switch to oral vancomycin for osteomyelitis","D":"Increase the dose and lengthen the interval","E":"Infuse vancomycin more slowly"},"answer":"E","explanation":"Vancomycin infusion reaction is non-IgE mast-cell histamine release linked to infusion rate (a rapid reaction); slowing the infusion (± antihistamine pretreatment) prevents it. A: It isn't a true allergy, so vancomycin can be continued. B: Epinephrine isn't preventive here. C: Oral vancomycin isn't absorbed and won't treat osteomyelitis. D: Larger doses given fast would worsen it.","source_slide":"L11 Drug Interactions and ADRs, slide 23"},{"id":"FND-PHARM-L11-09","block":"Foundations","lecture":"L11 Drug Interactions and ADRs","discipline":"Pharmacology","style":"Step1","stem":"A 22-year-old woman taking a combined oral contraceptive is started on rifampin for latent tuberculosis. Which advice is most appropriate?","options":{"A":"No change needed; rifampin doesn't affect contraceptives","B":"Stop the contraceptive during treatment, with no other precautions","C":"Use an additional or alternative non-hormonal contraceptive method","D":"Halve the contraceptive dose","E":"Take the two drugs at least 2 hours apart"},"answer":"C","explanation":"Rifampin strongly induces CYP450, lowering estrogen/progestin levels and risking contraceptive failure (the effect lasts until induction wears off after stopping). A: The interaction is well established. B: Stopping without an alternative leaves her unprotected. D: A lower dose would make failure worse. E: The interaction is enzyme induction, not absorption, so spacing the doses doesn't help.","source_slide":"L11 Drug Interactions and ADRs, slides 38, 47"},{"id":"FND-PHARM-L11-10","block":"Foundations","lecture":"L11 Drug Interactions and ADRs","discipline":"Pharmacology","style":"Step1","stem":"A 50-year-old man on rifampicin needed a higher warfarin dose to keep his INR in range. Rifampicin is stopped and the warfarin dose is left unchanged. Two weeks later he has gum bleeding and a high INR. What explains this?","options":{"A":"Enzyme levels fall after the inducer is stopped, so warfarin is cleared more slowly","B":"Rifampicin had displaced warfarin from plasma proteins","C":"Stopping rifampicin causes enzyme inhibition within hours","D":"Pharmacodynamic tolerance to warfarin has worn off","E":"Potentiation between rifampicin and warfarin"},"answer":"A","explanation":"Induction is slow on, slow off: after the inducer is removed, enzyme levels fall over days to weeks, and a warfarin dose raised to overcome induction becomes too high. B: Displacement would raise free warfarin while on rifampicin, not after stopping it. C: Removing an inducer isn't enzyme inhibition, and the change is gradual. D: The higher dose was needed because of faster metabolism (PK), not receptor tolerance. E: Potentiation needs both drugs present; rifampicin is gone.","source_slide":"L11 Drug Interactions and ADRs, slide 47"},{"id":"FND-PHARM-L12-01","block":"Foundations","lecture":"L12 Pharmacodynamics I","discipline":"Pharmacology","style":"LAU","stem":"Drug X has a KD of 1 nM and drug Y a KD of 100 nM at the same receptor. Which statement is correct?","options":{"A":"Y has 100 times higher affinity than X","B":"X occupies half the receptors at a concentration 100 times lower than Y","C":"X must have greater efficacy than Y","D":"X must be a full agonist","E":"Y reaches a higher maximal binding (Bmax)"},"answer":"B","explanation":"KD is the concentration for half-maximal binding; a lower KD means higher affinity, so X half-saturates at 1 nM vs 100 nM for Y. A: Reverses the relationship. C: Affinity says nothing about efficacy. D: Agonist vs antagonist isn't determined by KD. E: Bmax reflects receptor number, not the drug's KD.","source_slide":"L12 Pharmacodynamics I, slide 14"},{"id":"FND-PHARM-L12-02","block":"Foundations","lecture":"L12 Pharmacodynamics I","discipline":"Pharmacology","style":"LAU","stem":"At a receptor with significant constitutive activity, a drug reduces the response below the basal level, even with no agonist present. What is this drug?","options":{"A":"Full agonist","B":"Partial agonist","C":"Neutral competitive antagonist","D":"Inverse agonist","E":"Physiological antagonist"},"answer":"D","explanation":"Inverse agonists have negative efficacy, returning constitutively active R# to Ri (e.g., cetirizine at H1). A: A full agonist raises the response to maximum. B: A partial agonist raises it to a submaximal ceiling. C: A neutral antagonist alone leaves basal activity unchanged. E: A physiological antagonist works through a different receptor.","source_slide":"L12 Pharmacodynamics I, slides 16, 20–23"},{"id":"FND-PHARM-L12-03","block":"Foundations","lecture":"L12 Pharmacodynamics I","discipline":"Pharmacology","style":"LAU","stem":"In the presence of a fixed concentration of antagonist, the agonist's log dose–response curve shifts to the right in parallel, and the same maximal response is still reached. Which type of antagonist is this?","options":{"A":"Reversible competitive antagonist","B":"Irreversible competitive antagonist","C":"Non-competitive antagonist","D":"Physiological antagonist","E":"Chemical antagonist"},"answer":"A","explanation":"Reversible competitive antagonists are surmountable: a parallel right shift with unchanged Emax. B: An irreversible antagonist lowers the maximum. C: A non-competitive antagonist depresses the slope and the maximum. D: A physiological antagonist acts through another receptor and doesn't produce a simple parallel shift at the same receptor. E: A chemical antagonist inactivates the drug itself.","source_slide":"L12 Pharmacodynamics I, slides 29, 31, 33, 35"},{"id":"FND-PHARM-L12-04","block":"Foundations","lecture":"L12 Pharmacodynamics I","discipline":"Pharmacology","style":"LAU","stem":"A reversible competitive antagonist is present at a concentration equal to 4 × its KA. By how much must the agonist concentration be increased to restore the original response?","options":{"A":"2-fold","B":"4-fold","C":"3-fold","D":"It can't be restored","E":"5-fold"},"answer":"E","explanation":"Schild: dose ratio = [A]/KA + 1 = 4 + 1 = 5. A: 2-fold applies when [A] = KA. B: Forgets the +1. C: Subtracts 1 instead of adding it. D: Competitive reversible block is surmountable.","source_slide":"L12 Pharmacodynamics I, slide 32"},{"id":"FND-PHARM-L12-05","block":"Foundations","lecture":"L12 Pharmacodynamics I","discipline":"Pharmacology","style":"LAU","stem":"Epinephrine reverses histamine-induced bronchoconstriction in anaphylaxis. What type of antagonism is this?","options":{"A":"Chemical","B":"Pharmacokinetic","C":"Physiological","D":"Competitive","E":"Non-competitive"},"answer":"C","explanation":"Two agonists produce opposing effects through different receptors (H1 vs β2): physiological antagonism. A: Chemical means the two drugs combine directly. B: Pharmacokinetic means changing histamine's concentration. D: Epinephrine doesn't compete at H1 receptors. E: Non-competitive antagonism blocks the chain beyond the same agonist's receptor.","source_slide":"L12 Pharmacodynamics I, slide 36"},{"id":"FND-PHARM-L12-06","block":"Foundations","lecture":"L12 Pharmacodynamics I","discipline":"Pharmacology","style":"LAU","stem":"For an agonist at cardiac β-adrenoceptors, the EC50 for the contractile response is much lower than the KD for binding. What does this indicate?","options":{"A":"The agonist is a partial agonist","B":"The agonist binds irreversibly","C":"There is an inverse agonist present","D":"The tissue has spare receptors","E":"Receptor desensitization"},"answer":"D","explanation":"EC50 < KD means half-maximal response arrives before half the receptors are occupied: a receptor reserve (spare receptors). A: A partial agonist couldn't give the full response even at full occupancy. B: Irreversible binding isn't inferred from EC50 vs KD. C: An inverse agonist would reduce basal activity. E: Desensitization would raise the EC50.","source_slide":"L12 Pharmacodynamics I, slides 38–39"},{"id":"FND-PHARM-L12-07","block":"Foundations","lecture":"L12 Pharmacodynamics I","discipline":"Pharmacology","style":"Step1","stem":"A 32-year-old man on chronic methadone maintenance is given buprenorphine in the emergency department for pain. Within minutes he develops yawning, rhinorrhea, piloerection, and abdominal cramps. What best explains this?","options":{"A":"Buprenorphine is a full μ agonist and caused overdose","B":"Buprenorphine induced methadone metabolism","C":"Buprenorphine is an inverse agonist at μ receptors","D":"Allergic reaction to buprenorphine","E":"Buprenorphine is a high-affinity partial μ agonist that displaced methadone"},"answer":"E","explanation":"As a partial agonist with high affinity, buprenorphine displaces the full agonist and gives less receptor activation, acting as an antagonist and precipitating withdrawal. A: Full-agonist overdose causes miosis and respiratory depression, not withdrawal. B: Enzyme induction takes days. C: It isn't classified as an inverse agonist. D: The signs are classic opioid withdrawal, not allergy.","source_slide":"L12 Pharmacodynamics I, slide 17"},{"id":"FND-PHARM-L12-08","block":"Foundations","lecture":"L12 Pharmacodynamics I","discipline":"Pharmacology","style":"Step1","stem":"A 58-year-old man stops his long-term metoprolol abruptly because he ran out. Two days later he has palpitations, BP 175/100, and chest pain at rest. What is the mechanism?","options":{"A":"Downregulation of β receptors during treatment","B":"Tachyphylaxis to metoprolol","C":"Upregulation of β receptors during chronic blockade","D":"Hypersensitivity reaction to metoprolol","E":"Induction of catecholamine-degrading enzymes"},"answer":"C","explanation":"Chronic blockade upregulates β receptors; when the antagonist is removed, normal catecholamine levels act on excess receptors → overshoot (rebound tachycardia, hypertension, angina). Hence tapering. A: Downregulation follows chronic agonist exposure, not blockade. B: Tachyphylaxis is a fading response during repeated dosing. D: Hypersensitivity is immune-mediated. E: More enzyme would reduce catecholamine effects.","source_slide":"L12 Pharmacodynamics I, slide 43"},{"id":"FND-PHARM-L12-09","block":"Foundations","lecture":"L12 Pharmacodynamics I","discipline":"Pharmacology","style":"LAU","stem":"Phenoxybenzamine is given before surgery for pheochromocytoma. A day after the last dose the drug is barely detectable in plasma, yet α-blockade persists. Why?","options":{"A":"It is a reversible competitive antagonist with very high affinity","B":"It binds covalently, so recovery needs synthesis of new receptors","C":"It has an active metabolite with a long half-life","D":"It is a non-competitive antagonist acting beyond the receptor","E":"It up-regulates α-receptors during treatment"},"answer":"B","explanation":"Irreversible (covalent) antagonists act until receptors are replaced, so their duration depends on receptor turnover rather than drug elimination. A: A reversible block would fade as plasma levels fall. C: The block persists because the receptors themselves are inactivated, not because of a metabolite. D: Phenoxybenzamine binds the α-receptor itself; non-competitive antagonists (verapamil) act beyond it. E: Up-regulation would increase, not block, the response.","source_slide":"L12 Pharmacodynamics I, slides 29, 33–34"},{"id":"FND-PHARM-L12-10","block":"Foundations","lecture":"L12 Pharmacodynamics I","discipline":"Pharmacology","style":"Step1","stem":"A 40-year-old man with a morphine overdose wakes after IV naloxone. Ninety minutes later, with no further opioid use, he is drowsy again with a respiratory rate of 6/min. What best explains this?","options":{"A":"Naloxone is cleared faster than morphine, so morphine regains the receptors","B":"Naloxone is a partial agonist that adds to respiratory depression","C":"Tachyphylaxis to naloxone at μ receptors","D":"Naloxone binds irreversibly and then releases morphine","E":"Up-regulation of μ receptors by naloxone"},"answer":"A","explanation":"When an agonist and an antagonist compete, concentration decides: as the shorter-acting naloxone is cleared, morphine reoccupies μ receptors and respiratory depression returns. B: Naloxone is a pure antagonist with no intrinsic activity. C: Tachyphylaxis is a fading response to repeated agonist doses, not antagonist clearance. D: Naloxone is a reversible competitive antagonist. E: Up-regulation needs chronic blockade and wouldn't cause respiratory depression.","source_slide":"L12 Pharmacodynamics I, slides 29, 40"},{"id":"FND-PHARM-L13-01","block":"Foundations","lecture":"L13 Pharmacodynamics II","discipline":"Pharmacology","style":"LAU","stem":"Which receptor family produces a response within milliseconds because the receptor and the effector are the same protein?","options":{"A":"Ligand-gated ion channels","B":"G-protein-coupled receptors","C":"Receptor tyrosine kinases","D":"Cytokine (JAK-linked) receptors","E":"Nuclear receptors"},"answer":"A","explanation":"Ligand-gated ion channels (e.g., nicotinic ACh receptor) open directly on agonist binding, within milliseconds. B: GPCRs work over seconds via G-proteins and second messengers. C: Kinase-linked receptors take hours (gene transcription). D: Cytokine receptors also act over hours. E: Nuclear receptors need transcription and protein synthesis (hours).","source_slide":"L13 Pharmacodynamics II, slides 8–9"},{"id":"FND-PHARM-L13-02","block":"Foundations","lecture":"L13 Pharmacodynamics II","discipline":"Pharmacology","style":"LAU","stem":"Through which G-protein and second-messenger pathway do α1-adrenoceptors and M3 muscarinic receptors act?","options":{"A":"Gs → ↑ adenylyl cyclase → ↑ cAMP","B":"Gi → ↓ adenylyl cyclase → ↓ cAMP","C":"Direct opening of K⁺ channels by the G-protein","D":"Gq → phospholipase C → IP3 and DAG","E":"Guanylyl cyclase → cGMP"},"answer":"D","explanation":"α1 and M3 couple to Gq, activating phospholipase C (IP3/DAG → Ca²⁺). A: Gs/cAMP is used by β-adrenoceptors. B: Gi is used by α2. C: G-protein opening of K⁺ channels is the M2 mechanism in the heart. E: Guanylyl cyclase is linked to ANF receptors and isn't GPCR signaling here.","source_slide":"L13 Pharmacodynamics II, slide 10"},{"id":"FND-PHARM-L13-03","block":"Foundations","lecture":"L13 Pharmacodynamics II","discipline":"Pharmacology","style":"LAU","stem":"An asthmatic patient uses a salbutamol inhaler every hour for a day and notices each puff works less well. Which mechanism is mainly responsible for this rapid loss of response?","options":{"A":"Down-regulation by reduced receptor gene expression over weeks","B":"Receptor phosphorylation by βARK and binding of β-arrestin","C":"Enzyme induction speeding salbutamol metabolism","D":"Development of anti-drug antibodies","E":"Heterologous desensitization by glucocorticoids"},"answer":"B","explanation":"Rapid (seconds–minutes), reversible desensitization: GRK (βARK) phosphorylates the agonist-occupied receptor, then β-arrestin uncouples it from Gs. A: Down-regulation is slower (hours–days). C: Enzyme induction is a PK process that takes days. D: Antibodies aren't the mechanism. E: Glucocorticoids aren't involved, and they tend to restore β-receptor responsiveness.","source_slide":"L13 Pharmacodynamics II, slides 12–13"},{"id":"FND-PHARM-L13-04","block":"Foundations","lecture":"L13 Pharmacodynamics II","discipline":"Pharmacology","style":"LAU","stem":"In a population study, a drug has an ED50 of 10 mg for its therapeutic effect and a TD50 of 400 mg for a toxic effect. What is its therapeutic index?","options":{"A":"0.025","B":"4","C":"390","D":"4000","E":"40"},"answer":"E","explanation":"TI = TD50 / ED50 = 400 / 10 = 40. A: Inverts the ratio. B: Divides by 100. C: Subtracts instead of dividing. D: Multiplies instead of dividing.","source_slide":"L13 Pharmacodynamics II, slide 31"},{"id":"FND-PHARM-L13-05","block":"Foundations","lecture":"L13 Pharmacodynamics II","discipline":"Pharmacology","style":"LAU","stem":"Researchers count how many of 100 patients obtain headache relief at each dose of an analgesic. Which type of curve and parameter are they generating?","options":{"A":"Graded curve; EC50","B":"Graded curve; Emax","C":"Quantal curve; ED50","D":"Binding curve; KD","E":"Quantal curve; Bmax"},"answer":"C","explanation":"An all-or-none effect counted across a population gives a quantal curve; ED50 is the dose at which 50% respond. A: Graded curves measure response size in one individual (EC50). B: Emax belongs to graded curves. D: KD comes from binding studies. E: Bmax is the binding capacity, not a quantal parameter.","source_slide":"L13 Pharmacodynamics II, slides 22, 24, 28"},{"id":"FND-PHARM-L13-06","block":"Foundations","lecture":"L13 Pharmacodynamics II","discipline":"Pharmacology","style":"LAU","stem":"A patient's pain is unchanged when ibuprofen is increased above its usual maximal dose, but he develops dyspepsia. Which concept explains this?","options":{"A":"Threshold dose","B":"Tachyphylaxis","C":"Spare receptors","D":"Inverse agonism","E":"Ceiling effect"},"answer":"E","explanation":"Above the ceiling dose, further increases give no extra analgesia but add side effects. A: The threshold dose is the lowest dose with a detectable effect. B: Tachyphylaxis is a rapidly fading response to repeated doses. C: Spare receptors increase sensitivity. D: Inverse agonism reduces constitutive receptor activity.","source_slide":"L13 Pharmacodynamics II, slide 23"},{"id":"FND-PHARM-L13-07","block":"Foundations","lecture":"L13 Pharmacodynamics II","discipline":"Pharmacology","style":"Step1","stem":"A traveler develops profuse watery diarrhea after drinking contaminated water. Stool contains a toxin that ADP-ribosylates a G-protein α subunit. What is the direct intracellular consequence in enterocytes?","options":{"A":"Inhibition of Gi, preventing cAMP from falling","B":"Gs locked in the GTP-bound state → persistently ↑ cAMP","C":"Activation of Gq → ↑ IP3 and Ca²⁺","D":"Inhibition of guanylyl cyclase → ↓ cGMP","E":"Blockade of CFTR chloride channels"},"answer":"B","explanation":"Cholera toxin prevents Gsα from hydrolyzing GTP, so adenylyl cyclase stays on → high cAMP → CFTR opening and Cl⁻/water secretion. A: Gi inhibition is pertussis toxin's action. C: Gq isn't the target. D: Heat-stable E. coli toxin raises cGMP; it doesn't lower it. E: CFTR is opened, not blocked.","source_slide":"L13 Pharmacodynamics II, slide 11"},{"id":"FND-PHARM-L13-08","block":"Foundations","lecture":"L13 Pharmacodynamics II","discipline":"Pharmacology","style":"Step1","stem":"A 55-year-old nonsmoking woman has lung adenocarcinoma with an activating mutation in a receptor tyrosine kinase that normally binds epidermal growth factor. Which drug directly targets this receptor's kinase activity?","options":{"A":"Trastuzumab","B":"Tofacitinib","C":"Erlotinib","D":"Imatinib","E":"Rituximab"},"answer":"C","explanation":"Erlotinib is an EGFR tyrosine kinase inhibitor used in EGFR-mutant non-small cell lung cancer. A: Trastuzumab is an antibody against HER2. B: Tofacitinib inhibits JAK (cytokine receptor signaling). D: Imatinib inhibits BCR-ABL. E: Rituximab targets CD20 on B cells.","source_slide":"L13 Pharmacodynamics II, slides 16–17"},{"id":"FND-PHARM-L13-09","block":"Foundations","lecture":"L13 Pharmacodynamics II","discipline":"Pharmacology","style":"LAU","stem":"For the same quantal effect, drug A has an ED50 of 2 mg and drug B an ED50 of 50 mg. Which conclusion is justified?","options":{"A":"A produces a larger maximal effect than B","B":"A has a wider therapeutic index than B","C":"B is 25 times more potent than A","D":"A is 25 times more potent than B","E":"A is 25 times more selective than B"},"answer":"D","explanation":"Potency compares the doses needed for the same effect: 50 ÷ 2 = 25. A more potent drug isn't necessarily more effective or safer. A: Potency says nothing about maximal effect. B: The therapeutic index also needs the TD50. C: Reverses it; a lower ED50 means higher potency. E: Selectivity compares one drug's ED50 values for two different effects.","source_slide":"L13 Pharmacodynamics II, slide 29"},{"id":"FND-PHARM-L13-10","block":"Foundations","lecture":"L13 Pharmacodynamics II","discipline":"Pharmacology","style":"LAU","stem":"A patient with an acute asthma attack receives a systemic glucocorticoid plus an inhaled β2-agonist. Why can't the glucocorticoid be relied on alone for immediate relief?","options":{"A":"Its receptor alters gene transcription, so effects lag 30 min to hours","B":"Its G-protein-coupled receptor desensitizes within minutes","C":"It opens a ligand-gated channel that closes within milliseconds","D":"It is only a partial agonist at β2-adrenoceptors","E":"Its kinase-linked receptor is rapidly down-regulated"},"answer":"A","explanation":"Glucocorticoids are lipid-soluble and act on intracellular (nuclear) receptors; new proteins must be made, so effects take 30 min to hours and then outlast plasma levels. B: Glucocorticoid receptors aren't GPCRs; desensitization over minutes is a GPCR feature (e.g., β2). C: Ligand-gated channels act in milliseconds and would give rapid relief. D: Glucocorticoids don't act at β2-adrenoceptors. E: They don't act through kinase-linked receptors.","source_slide":"L13 Pharmacodynamics II, slides 8, 19"},{"id":"FND-PHARM-L14-01","block":"Foundations","lecture":"L14 Development, Evaluation and Control of Drugs","discipline":"Pharmacology","style":"LAU","stem":"A patient takes acetaminophen tablets bought in the US together with paracetamol tablets bought in Lebanon. How are these two names related?","options":{"A":"Brand name and generic name of the same drug","B":"Two different drugs of the same class","C":"USAN and INN of the same drug","D":"Chemical (IUPAC) name and generic name of the same drug","E":"INN and proprietary name of the same drug"},"answer":"C","explanation":"Acetaminophen is the US Adopted Name (USAN) and paracetamol is the WHO International Nonproprietary Name (INN); both are generic names for the same drug, so taking both risks a double dose. A: Brand names are Panadol, Tylenol. B: They are one drug. D: The IUPAC name is N-(4-hydroxyphenyl)acetamide. E: Neither is a proprietary (brand) name.","source_slide":"L14 Development, Evaluation and Control of Drugs, slides 6–7"},{"id":"FND-PHARM-L14-02","block":"Foundations","lecture":"L14 Development, Evaluation and Control of Drugs","discipline":"Pharmacology","style":"LAU","stem":"Before first-in-human dosing, a candidate drug is tested for whether it blocks the cardiac hERG potassium channel and prolongs the QT interval. Which preclinical task category is this?","options":{"A":"Safety pharmacology","B":"Preliminary toxicological testing","C":"Pharmacokinetic (ADME) testing","D":"Investigative toxicology","E":"Chemical and pharmaceutical development"},"answer":"A","explanation":"Safety pharmacology tests for hazardous acute effects such as arrhythmias and bronchoconstriction; hERG block is the slide's example. B: Genotoxicity and the maximum non-toxic dose. C: Absorption, distribution, metabolism, excretion in animals. D: Works out the mechanism of a toxic effect already found. E: Large-scale production, stability and formulation.","source_slide":"L14 Development, Evaluation and Control of Drugs, slides 15, 17"},{"id":"FND-PHARM-L14-03","block":"Foundations","lecture":"L14 Development, Evaluation and Control of Drugs","discipline":"Pharmacology","style":"LAU","stem":"Of drugs that enter Phase I, at which transition is a drug least likely to move on to the next stage?","options":{"A":"Phase I → Phase II","B":"Phase II → Phase III","C":"Phase III → submission","D":"Submission → approval","E":"Phase IV post-marketing"},"answer":"B","explanation":"Only ~29% of drugs pass from Phase II to Phase III; Phase II is the first real test of efficacy in patients, and lack of efficacy is the most common reason for failure. A: ~52% move on from Phase I. C: ~58% pass Phase III. D: ~91% of submissions are approved. E: Phase IV happens after approval; it monitors marketed drugs rather than being a development gate.","source_slide":"L14 Development, Evaluation and Control of Drugs, slides 24–25"},{"id":"FND-PHARM-L14-04","block":"Foundations","lecture":"L14 Development, Evaluation and Control of Drugs","discipline":"Pharmacology","style":"Step1","stem":"A new anti-inflammatory drug is approved after Phase III trials in about 3,000 patients showed no serious hepatic toxicity. Two years after marketing, spontaneous reports reveal fulminant hepatitis in about 1 in 10,000 users. What best explains why the trials missed this reaction?","options":{"A":"Phase I was done in healthy volunteers rather than patients","B":"The Phase III trials were not double-blinded","C":"The placebo response masked the adverse effect","D":"Preclinical carcinogenicity studies last only two years","E":"About 30,000 patients must be treated to see even one case"},"answer":"E","explanation":"By the rule of three, detecting a 1-in-10,000 reaction needs ~30,000 treated patients; Phase III enrolls 300–3,000, so such reactions appear only after marketing (pharmacovigilance, Phase IV). A: Phase II and III are in patients, and the problem is size. B: Blinding controls bias; it does not create rare events. C: Placebo response concerns perceived benefit, not hepatitis. D: Carcinogenicity is a separate animal tumor test.","source_slide":"L14 Development, Evaluation and Control of Drugs, slides 42–43"},{"id":"FND-PHARM-L14-05","block":"Foundations","lecture":"L14 Development, Evaluation and Control of Drugs","discipline":"Pharmacology","style":"LAU","stem":"The FDA approves a new monoclonal antibody, a biologic never approved before. How long is the marketing exclusivity granted at approval?","options":{"A":"3 years","B":"5 years","C":"7 years","D":"12 years","E":"20 years"},"answer":"D","explanation":"A new biological product receives 12 years of exclusivity. A: New clinical investigation (e.g., new indication). B: New chemical entity (small molecule). C: Orphan drug (<200,000 US patients). E: Patent term, counted from filing, granted by the patent office, not FDA exclusivity.","source_slide":"L14 Development, Evaluation and Control of Drugs, slides 46–48"},{"id":"FND-PHARM-L14-06","block":"Foundations","lecture":"L14 Development, Evaluation and Control of Drugs","discipline":"Pharmacology","style":"LAU","stem":"A patent on a lead compound was filed in 2012, and the drug was approved in 2022. Which statement about its US patent protection is correct?","options":{"A":"Up to 5 years may be restored, with at most 14 years left after approval","B":"It lasts 20 years counted from the date of approval","C":"It is granted by the FDA at the time of approval","D":"It can be renewed once for another 20 years","E":"It is what stops generics from referencing the brand's clinical data"},"answer":"A","explanation":"Patent term restoration can give back part of the time lost in testing and review: no more than 5 years, and no more than 14 years of patent life after approval. B: 20 years, non-renewable, counted from filing. C: Patents come from the USPTO; the FDA grants exclusivity. D: The term is non-renewable. E: That is marketing (data) exclusivity.","source_slide":"L14 Development, Evaluation and Control of Drugs, slides 46–47"},{"id":"FND-PHARM-L14-07","block":"Foundations","lecture":"L14 Development, Evaluation and Control of Drugs","discipline":"Pharmacology","style":"LAU","stem":"In 1961, thousands of babies were born with limb defects after their mothers took a sedative in pregnancy. What did the US law passed in response add to drug approval?","options":{"A":"Proof of safety before a drug can be marketed","B":"A shorter approval route for generic drugs","C":"Mandatory registration of clinical trials","D":"User fees in exchange for FDA review deadlines","E":"Proof of efficacy from controlled trials"},"answer":"E","explanation":"The thalidomide disaster led to the 1962 Kefauver–Harris Amendments: proof of efficacy as well as safety, from controlled trials, plus informed consent. A: 1938 Food, Drug, and Cosmetic Act (after elixir sulfanilamide). B: 1984 Hatch–Waxman Act. C: 2007 FDA Amendments Act. D: 1992 Prescription Drug User Fee Act.","source_slide":"L14 Development, Evaluation and Control of Drugs, slide 38"},{"id":"FND-PHARM-L14-08","block":"Foundations","lecture":"L14 Development, Evaluation and Control of Drugs","discipline":"Pharmacology","style":"Step1","stem":"In a randomized, placebo-controlled antidepressant trial, patients do not know which treatment they receive, but the psychiatrists rating their mood do. The drug group shows a larger improvement than expected. Which design change best addresses the most likely bias?","options":{"A":"Randomize the patients to treatment groups","B":"Add a placebo control group","C":"Make the trial double-blind","D":"Use a crossover design","E":"Enroll healthy volunteers instead of patients"},"answer":"C","explanation":"The trial is single-blind, so observer bias remains (raters see what they expect); double-blinding hides the treatment from both patient and observer. A, B: Already randomized and placebo-controlled. D: Crossover makes each patient his or her own control but does not hide the treatment from the rater. E: Efficacy must be tested in patients; this does not remove observer bias.","source_slide":"L14 Development, Evaluation and Control of Drugs, slide 26"},{"id":"FND-PHYS-L03-01","block":"Foundations","lecture":"L03 Electrical Properties of Cells","discipline":"Physiology","style":"LAU","stem":"With [K⁺]out = 4 mM and [K⁺]in = 140 mM at 37 °C, what is the approximate K⁺ equilibrium potential?","options":{"A":"+95 mV","B":"−61 mV","C":"−95 mV","D":"−70 mV","E":"−48 mV"},"answer":"C","explanation":"E_K = 61.5 × log(4/140) = 61.5 × (−1.54) ≈ −95 mV. A: The sign is wrong; [out] < [in] gives a negative log. B: 61 mV is the coefficient (and ≈ E_Na in magnitude), not the answer. D: −70 mV is the resting Vm, which also reflects Na⁺ and Cl⁻ permeability. E: Uses the divalent coefficient (30.75 mV, z = 2) instead of 61.5 mV.","source_slide":"L03 Electrical Properties of Cells, slides 15, 17"},{"id":"FND-PHYS-L03-02","block":"Foundations","lecture":"L03 Electrical Properties of Cells","discipline":"Physiology","style":"LAU","stem":"A neuron rests at −70 mV although its E_K is about −95 mV. What best explains the difference?","options":{"A":"A small resting Na⁺ permeability pulls Vm toward E_Na","B":"The Na⁺/K⁺-ATPase moves equal charge each way","C":"Resting Cl⁻ permeability exceeds K⁺ permeability","D":"Voltage-gated Na⁺ channels are inactivated at rest","E":"K⁺ is at electrochemical equilibrium at −70 mV"},"answer":"A","explanation":"Vm is a permeability-weighted average (GHK); P_K dominates, but resting P_Na is not zero, so Vm sits near, not at, E_K. B: The pump is electrogenic (3 Na⁺ out / 2 K⁺ in). C: P_K : P_Cl ≈ 1 : 0.45; K⁺ dominates. D: At rest Na⁺ channels are closed but available, not inactivated. E: At −70 mV K⁺ still has an outward driving force.","source_slide":"L03 Electrical Properties of Cells, slides 26, 32–33"},{"id":"FND-PHYS-L03-03","block":"Foundations","lecture":"L03 Electrical Properties of Cells","discipline":"Physiology","style":"LAU","stem":"Shortly after an action potential, a nerve fiber fires again only if the stimulus is stronger than normal. What explains this?","options":{"A":"Nearly all voltage-gated Na⁺ channels are still inactivated","B":"E_Na has fallen because Na⁺ entry abolished the gradient","C":"The Na⁺/K⁺-ATPase is saturated after the action potential","D":"Some Na⁺ channels have recovered, but K⁺ conductance is still high","E":"Voltage-gated K⁺ channels are all closed"},"answer":"D","explanation":"This is the relative refractory period: partial Na⁺ channel recovery plus lingering K⁺ conductance means a stronger stimulus is needed. A: That is the absolute refractory period, when no stimulus works. B: One AP barely changes ion gradients; E_Na stays positive. C: The pump doesn't set refractoriness. E: K⁺ conductance is elevated, not zero.","source_slide":"L03 Electrical Properties of Cells, slides 38, 41"},{"id":"FND-PHYS-L03-04","block":"Foundations","lecture":"L03 Electrical Properties of Cells","discipline":"Physiology","style":"LAU","stem":"A researcher holds a squid axon's membrane at 0 mV and records the current needed to keep it there. After tetraethylammonium is applied internally, the late outward current disappears. Which current did TEA abolish, and what technique was used?","options":{"A":"Na⁺ current, using tetrodotoxin","B":"Ca²⁺ current, using a current clamp","C":"Cl⁻ current, using a voltage clamp","D":"Leak current, using a current clamp","E":"K⁺ current, using a voltage clamp"},"answer":"E","explanation":"Voltage clamp fixes Vm and measures the injected current; internal TEA blocks K⁺ channels, removing the delayed outward K⁺ current. A: TTX blocks Na⁺ channels from outside and wasn't used. B: Holding voltage constant is voltage clamp, not current clamp. C: TEA blocks K⁺ channels, not Cl⁻ channels. D: Wrong technique, and TEA isn't a general leak blocker.","source_slide":"L03 Electrical Properties of Cells, slides 42–46"},{"id":"FND-PHYS-L03-05","block":"Foundations","lecture":"L03 Electrical Properties of Cells","discipline":"Physiology","style":"LAU","stem":"Compared with an action potential, an electrotonic (graded) potential:","options":{"A":"Has a fixed threshold","B":"Spreads faster but decays with distance","C":"Spreads only forward because of refractoriness","D":"Is regenerated at each patch of membrane","E":"Can only be depolarizing"},"answer":"B","explanation":"Electrotonic potentials are conducted faster than APs but attenuate rapidly (decremental), so they suit local integration, not long-distance signaling. A: They have no fixed threshold. C: They can spread both ways; refractoriness applies to APs. D: Regeneration is what makes APs nondecremental. E: They can be depolarizing (Na⁺) or hyperpolarizing (Cl⁻).","source_slide":"L03 Electrical Properties of Cells, slides 48–50, 53"},{"id":"FND-PHYS-L03-06","block":"Foundations","lecture":"L03 Electrical Properties of Cells","discipline":"Physiology","style":"Step1","stem":"A 68-year-old man with chronic kidney disease has K⁺ of 7.5 mEq/L and muscle weakness. What is the effect on his skeletal muscle resting membrane potential and excitability?","options":{"A":"Hyperpolarized; increased excitability","B":"Hyperpolarized; reduced excitability","C":"Depolarized; reduced excitability due to Na⁺ channel inactivation","D":"Unchanged; Na⁺/K⁺-ATPase compensates","E":"Depolarized; increased excitability due to K⁺ channel inactivation"},"answer":"C","explanation":"High [K⁺]out makes E_K less negative → resting depolarization; sustained depolarization inactivates voltage-gated Na⁺ channels → reduced excitability and weakness. A: Hyperpolarization occurs in hypokalemia. B: Also describes hypokalemia. D: The pump can't offset a large ECF K⁺ rise. E: Reduced, not increased, excitability, via Na⁺ (not K⁺) channel inactivation.","source_slide":"L03 Electrical Properties of Cells, slides 20, 35"},{"id":"FND-PHYS-L03-07","block":"Foundations","lecture":"L03 Electrical Properties of Cells","discipline":"Physiology","style":"Step1","stem":"A 30-year-old woman with multiple sclerosis has demyelinated axon segments. Which change in the demyelinated internode explains slowed or blocked conduction?","options":{"A":"Membrane resistance rises and capacitance falls","B":"Membrane resistance falls and capacitance rises","C":"Both membrane resistance and capacitance rise","D":"Both membrane resistance and capacitance fall","E":"Nodal Na⁺ channels become permanently inactivated"},"answer":"B","explanation":"Myelin raises membrane resistance and lowers capacitance; losing it does the opposite, so local current leaks out and charges the membrane before reaching the next node. A: That is the effect of myelin, which speeds conduction. C, D: Myelin moves the two in opposite directions. E: The problem is internodal current loss, not nodal channel inactivation.","source_slide":"L03 Electrical Properties of Cells, slide 52"},{"id":"FND-PHYS-L03-08","block":"Foundations","lecture":"L03 Electrical Properties of Cells","discipline":"Physiology","style":"LAU","stem":"Pulmonary interstitial edema triples the alveolar–capillary diffusion distance, and lung disease halves the surface area. With an unchanged O₂ gradient, O₂ diffusion becomes what fraction of normal?","options":{"A":"1/6","B":"1/3","C":"1/2","D":"2/3","E":"6 times normal"},"answer":"A","explanation":"Fick: J ∝ A·ΔC/Δx, so J changes by (1/2) × (1/3) = 1/6. B: Accounts only for the distance. C: Accounts only for the area. D: Treats the halved area as doubled. E: Inverts the relationship; thickness and area work in the opposite directions.","source_slide":"L03 Electrical Properties of Cells, slides 5, 11"},{"id":"FND-PHYS-L03-09","block":"Foundations","lecture":"L03 Electrical Properties of Cells","discipline":"Physiology","style":"LAU","stem":"Two coupled neurons fire in near-perfect synchrony, and current injected into either one immediately changes the voltage of the other. Their connection most likely:","options":{"A":"Uses ligand-gated channels on the postsynaptic cell","B":"Requires voltage-gated Ca²⁺ entry to transmit","C":"Amplifies the presynaptic signal","D":"Has a delay of about a millisecond","E":"Passes ionic current through connexons"},"answer":"E","explanation":"Gap junctions (connexons) couple cells directly: minimal delay, often bidirectional, synchronize groups of cells. A: Ligand-gated receptors belong to chemical synapses. B: Ca²⁺-triggered transmitter release is the chemical synapse. C: Amplification is possible at chemical synapses; gap junctions are passive. D: A millisecond-range delay is typical of chemical synapses.","source_slide":"L03 Electrical Properties of Cells, slides 55, 57–58"},{"id":"FND-PHYS-L04-01","block":"Foundations","lecture":"L04 Physiology of Calcium","discipline":"Physiology","style":"LAU","stem":"Which hormone lowers blood calcium by inhibiting intestinal Ca²⁺ absorption and increasing renal Ca²⁺ excretion?","options":{"A":"Calcitonin","B":"Growth hormone","C":"Glucocorticoids (cortisol)","D":"Parathyroid hormone","E":"Calcitriol"},"answer":"C","explanation":"Per the lecture, glucocorticoids decrease blood Ca²⁺ by inhibiting intestinal absorption and increasing renal excretion. A: Calcitonin also lowers Ca²⁺, but by inhibiting osteoclasts. B: GH raises Ca²⁺ by increasing intestinal absorption. D: PTH raises Ca²⁺ (bone resorption, renal reabsorption, calcitriol). E: Calcitriol raises Ca²⁺ by increasing intestinal absorption.","source_slide":"L04 Physiology of Calcium, slides 12–14"},{"id":"FND-PHYS-L04-02","block":"Foundations","lecture":"L04 Physiology of Calcium","discipline":"Physiology","style":"LAU","stem":"A signal opens Ca²⁺ channels for only milliseconds, yet local cytosolic Ca²⁺ rises 10–20-fold. What makes this possible?","options":{"A":"A ~10,000-fold inward Ca²⁺ gradient across PM and ER","B":"Ca²⁺-binding proteins release their bound Ca²⁺","C":"Mitochondria release their stored Ca²⁺","D":"Ca²⁺ diffuses freely across the lipid bilayer","E":"Ca²⁺ enters the cytosol by primary active transport"},"answer":"A","explanation":"Cytosolic Ca²⁺ (~10⁻⁷ M) is ~10,000-fold below ECF and ER Ca²⁺ (~10⁻³ M), so Ca²⁺ rushes into the cytosol as soon as channels open. B: Ca²⁺-binding proteins buffer (take up) Ca²⁺ and blunt the rise. C: Mitochondria take up Ca²⁺ as a removal mechanism. D: Ca²⁺ needs channels to cross. E: Entry is passive through channels; pumps remove Ca²⁺.","source_slide":"L04 Physiology of Calcium, slide 19"},{"id":"FND-PHYS-L04-03","block":"Foundations","lecture":"L04 Physiology of Calcium","discipline":"Physiology","style":"LAU","stem":"In a ventricular myocyte, which event directly triggers release of Ca²⁺ from the sarcoplasmic reticulum?","options":{"A":"IP₃ binding to IP₃ receptors on the SR","B":"Ca²⁺ entering via L-type channels and opening RyR2","C":"Phosphorylation of phospholamban","D":"Reverse-mode Na⁺/Ca²⁺ exchange","E":"Ca²⁺ binding to troponin C"},"answer":"B","explanation":"Trigger Ca²⁺ through L-type channels (LTCC) in the T-tubule opens RyR2 on the SR (calcium-induced calcium release). A: IP₃-gated channels release ER Ca²⁺ in Gq signaling, not the cardiac trigger. C: Phospholamban (PLB) regulates SERCA2a reuptake, i.e. relaxation. D: NCX removes Ca²⁺ during relaxation. E: Troponin binding follows SR release.","source_slide":"L04 Physiology of Calcium, slides 20, 28–29"},{"id":"FND-PHYS-L04-04","block":"Foundations","lecture":"L04 Physiology of Calcium","discipline":"Physiology","style":"LAU","stem":"Which ECG change and symptom pair fit a plasma calcium of 14 mg/dL?","options":{"A":"Prolonged QT; tetany","B":"Prolonged QT; constipation","C":"Shortened QT; tetany","D":"Shortened QT; constipation","E":"Normal QT; brisk reflexes"},"answer":"D","explanation":"Hypercalcemia (depressive effects above ~12 mg/dL) shortens QT and depresses nerves and gut smooth muscle (constipation, sluggish reflexes). A: QT prolongation and tetany suggest hypocalcemia. B: QT shortens in hypercalcemia. C: Tetany is hypocalcemia (~6 mg/dL). E: QT shortens and reflexes become sluggish.","source_slide":"L04 Physiology of Calcium, slides 16–17"},{"id":"FND-PHYS-L04-05","block":"Foundations","lecture":"L04 Physiology of Calcium","discipline":"Physiology","style":"Step1","stem":"Two days after total thyroidectomy, a 45-year-old woman has perioral tingling and carpal spasm when a BP cuff is inflated. Which change underlies her neuromuscular findings?","options":{"A":"Blocked voltage-gated K⁺ channels","B":"Excess PTH acting on motor neurons","C":"Loss of calcitonin's effect on nerves","D":"Raised intracellular neuronal Ca²⁺","E":"Increased neuronal Na⁺ permeability"},"answer":"E","explanation":"Inadvertent parathyroid removal → low PTH → hypocalcemia → increased neuronal Na⁺ permeability → easy AP initiation (tetany). A: K⁺ channel block isn't the lecture's mechanism. B: PTH is low, not high. C: Calcitonin loss doesn't cause tetany. D: The problem is low ECF Ca²⁺.","source_slide":"L04 Physiology of Calcium, slides 14, 16"},{"id":"FND-PHYS-L04-06","block":"Foundations","lecture":"L04 Physiology of Calcium","discipline":"Physiology","style":"LAU","stem":"Which protein lowers cytosolic Ca²⁺ by ATP-driven pumping into an intracellular store?","options":{"A":"Plasma membrane Ca²⁺-ATPase (PMCA)","B":"Na⁺/Ca²⁺ exchanger","C":"SERCA","D":"Mitochondrial Ca²⁺ import","E":"Cytosolic Ca²⁺-binding proteins"},"answer":"C","explanation":"SERCA is the ER/SR Ca²⁺ pump (regulated by phospholamban in the heart). A: PMCA uses ATP but pumps Ca²⁺ out of the cell. B: NCX uses the Na⁺ gradient to move Ca²⁺ out of the cell. D: Mitochondrial import is driven by the H⁺ gradient, not ATP directly. E: Binding proteins buffer Ca²⁺; they don't transport it.","source_slide":"L04 Physiology of Calcium, slides 21–22, 29"},{"id":"FND-PHYS-L04-07","block":"Foundations","lecture":"L04 Physiology of Calcium","discipline":"Physiology","style":"LAU","stem":"A researcher wants to measure cytosolic Ca²⁺ with a fluorescent indicator rather than a Ca²⁺-sensitive photoprotein. Which should she use?","options":{"A":"Aequorin","B":"Fura-2","C":"Ryanodine","D":"Tetrodotoxin","E":"IP₃"},"answer":"B","explanation":"Fura-2 and Fluo-3 are fluorescent Ca²⁺ markers. A: Aequorin is the jellyfish photoprotein, the other measurement method. C: Ryanodine is the plant alkaloid that names the SR release channel. D: TTX blocks Na⁺ channels. E: IP₃ releases ER Ca²⁺; it doesn't measure it.","source_slide":"L04 Physiology of Calcium, slides 20, 32"},{"id":"FND-PHYS-L04-08","block":"Foundations","lecture":"L04 Physiology of Calcium","discipline":"Physiology","style":"LAU","stem":"Which calcium-balance pattern is expected in a healthy 10-year-old during a growth spurt?","options":{"A":"Absorption exceeds urinary excretion; net bone deposition","B":"Urinary excretion exceeds absorption; net bone deposition","C":"Urinary excretion exceeds absorption; net bone resorption","D":"Absorption equals urinary excretion; no net bone change","E":"Absorption exceeds urinary excretion; net bone resorption"},"answer":"A","explanation":"Growing children are in positive Ca²⁺ balance: intestinal absorption > urinary excretion, and the excess is deposited in bone. B: Negative balance can't fund net deposition. C: Negative balance, seen in pregnancy and lactation. D: Describes a stable adult. E: A positive balance goes into bone, not out of it.","source_slide":"L04 Physiology of Calcium, slide 9"},{"id":"FND-PHYS-L05-01","block":"Foundations","lecture":"L05 Transport Across the Cell Membrane","discipline":"Physiology","style":"LAU","stem":"Urea is 45 mg/100 mL in proximal tubular fluid and 15 mg/100 mL in blood. Permeability is 2×10⁻⁵ cm/s and area 100 cm². What is the urea flux?","options":{"A":"6×10⁻⁴ mg/s, blood to lumen","B":"6×10⁻⁴ mg/s, lumen to blood","C":"6×10⁻² mg/s, lumen to blood","D":"9×10⁻⁴ mg/s, lumen to blood","E":"3×10⁻⁴ mg/s, lumen to blood"},"answer":"B","explanation":"J = P·A·ΔC = (2×10⁻⁵ cm/s)(100 cm²)(30 mg/100 mL = 0.3 mg/cm³) = 6×10⁻⁴ mg/s, from higher (lumen) to lower (blood). A: Wrong direction. C: Uses 30 mg/cm³; forgets that 1 mL = 1 cm³ and the /100 mL. D: Uses the lumen concentration (45) instead of the difference. E: Drops the factor of 2 in P.","source_slide":"L05 Transport Across the Cell Membrane, slides 19–20"},{"id":"FND-PHYS-L05-02","block":"Foundations","lecture":"L05 Transport Across the Cell Membrane","discipline":"Physiology","style":"LAU","stem":"A transport process moves its solute downhill, shows saturation, transports D- but not L-glucose, and is unaffected by ouabain. Which process is it?","options":{"A":"Facilitated diffusion","B":"Simple diffusion","C":"Primary active transport","D":"Na⁺-coupled cotransport","E":"Na⁺-coupled countertransport"},"answer":"A","explanation":"Downhill, carrier-mediated (saturable, stereospecific), no energy → facilitated diffusion. B: Simple diffusion isn't saturable or stereospecific. C: Primary active transport moves solute uphill. D, E: Secondary active transport is uphill and is inhibited by ouabain (loss of the Na⁺ gradient).","source_slide":"L05 Transport Across the Cell Membrane, slides 12, 22, 28"},{"id":"FND-PHYS-L05-03","block":"Foundations","lecture":"L05 Transport Across the Cell Membrane","discipline":"Physiology","style":"LAU","stem":"In the intestinal epithelium, which pair of transporters accounts for transcellular glucose absorption?","options":{"A":"Apical GLUT2; basolateral SGLT","B":"Apical SGLT; basolateral GLUT2","C":"Apical GLUT1; basolateral Na⁺/K⁺-ATPase","D":"Apical NKCC1; basolateral CFTR","E":"Apical H⁺/K⁺-ATPase; basolateral GLUT1"},"answer":"B","explanation":"Apical SGLT uses the Na⁺ gradient (secondary active); basolateral GLUT2 lets glucose out by facilitated diffusion; the basolateral Na⁺/K⁺-ATPase maintains the gradient. A: Reversed. C: The pump is basolateral, but glucose entry needs SGLT to go uphill. D: NKCC1 and CFTR mediate Cl⁻ secretion. E: H⁺/K⁺-ATPase is the gastric parietal-cell pump.","source_slide":"L05 Transport Across the Cell Membrane, slide 49"},{"id":"FND-PHYS-L05-04","block":"Foundations","lecture":"L05 Transport Across the Cell Membrane","discipline":"Physiology","style":"LAU","stem":"Which epithelium is best suited to maintain a large transepithelial osmotic gradient?","options":{"A":"Renal proximal tubule","B":"Duodenum","C":"Terminal colon","D":"Urinary bladder","E":"Jejunum"},"answer":"D","explanation":"Tight epithelia maintain steep gradients, and the lecture names the urinary bladder as the tightest of all (claudins set paracellular permeability). A, B, E: Leaky epithelia do bulk, nearly isosmotic transport. C: The colon is tight, but less so than the bladder.","source_slide":"L05 Transport Across the Cell Membrane, slides 50–51"},{"id":"FND-PHYS-L05-05","block":"Foundations","lecture":"L05 Transport Across the Cell Membrane","discipline":"Physiology","style":"LAU","stem":"In the renal collecting tubule, Na⁺ enters through apical ENaC and is pumped out basolaterally. How is Cl⁻ absorbed with it?","options":{"A":"Apical primary active Cl⁻ pump","B":"Apical Na⁺-K⁺-2Cl⁻ cotransport","C":"Paracellularly, driven by a lumen-negative voltage","D":"Paracellularly, driven by a lumen-positive voltage","E":"Paracellularly, by solvent drag with water"},"answer":"C","explanation":"The Na⁺/K⁺ pump moves positive charge from lumen to interstitium, making the lumen negative; this drives passive Cl⁻ absorption across the tight junctions. A: There is no primary Cl⁻ pump in this model. B: NKCC2 is the thick ascending limb transporter. D: The lumen becomes negative, and a lumen-positive voltage would hold Cl⁻ in the lumen. E: Solvent drag is described for leaky epithelia like the proximal tubule.","source_slide":"L05 Transport Across the Cell Membrane, slides 55, 57"},{"id":"FND-PHYS-L05-06","block":"Foundations","lecture":"L05 Transport Across the Cell Membrane","discipline":"Physiology","style":"Step1","stem":"A 25-year-old man has LDL of 350 mg/dL and tendon xanthomas. His LDL receptors bind LDL normally but fail to internalize it. What is the most likely defect?","options":{"A":"Absent LDL receptor synthesis","B":"Defective apoB-100 binding domain","C":"Lysosomal acid lipase deficiency","D":"Receptor unable to cluster into clathrin-coated pits","E":"Failure of receptor recycling from endosomes"},"answer":"D","explanation":"In this form of familial hypercholesterolemia the receptor binds LDL but can't enter clathrin-coated pits, so there is no receptor-mediated endocytosis. A: Receptors are present and bind. B: Binding is normal. C: Lipase deficiency acts after internalization. E: Recycling happens after internalization, which never occurs here.","source_slide":"L05 Transport Across the Cell Membrane, slides 39–41"},{"id":"FND-PHYS-L05-07","block":"Foundations","lecture":"L05 Transport Across the Cell Membrane","discipline":"Physiology","style":"Step1","stem":"A child with cystic fibrosis has thick airway mucus. Which step of airway NaCl secretion is defective?","options":{"A":"Basolateral NKCC1 uptake of Cl⁻","B":"Basolateral Na⁺/K⁺-ATPase","C":"Apical ENaC Na⁺ entry","D":"Paracellular Na⁺ movement","E":"Apical Cl⁻ exit through CFTR"},"answer":"E","explanation":"Cl⁻ loaded by NKCC1 exits apically via CFTR; the lumen-negative voltage then pulls Na⁺ paracellularly, and water follows. Without CFTR, secretion fails and mucus thickens. A, B: These basolateral steps are intact. C: ENaC mediates Na⁺ absorption, not secretion. D: Paracellular Na⁺ follows Cl⁻ passively; it isn't the primary defect.","source_slide":"L05 Transport Across the Cell Membrane, slides 56, 59"},{"id":"FND-PHYS-L05-08","block":"Foundations","lecture":"L05 Transport Across the Cell Membrane","discipline":"Physiology","style":"LAU","stem":"Histamine rapidly increases gastric acid secretion. By which type of regulation does it act on the parietal cell?","options":{"A":"Increased transcription of H⁺/K⁺-ATPase subunits","B":"Recruitment of H⁺/K⁺-ATPase to the apical membrane","C":"cAMP-dependent phosphorylation of CFTR","D":"Upregulation of tight-junction claudins","E":"Inhibition of the pump by omeprazole"},"answer":"B","explanation":"Histamine translocates the H⁺/K⁺ pump to the apical membrane (recruitment of existing transporters). A: Increased synthesis is the aldosterone example (Na⁺/K⁺ pump subunits). C: Post-transcriptional modification is the CFTR example. D: Claudin modulation is the aldosterone/claudin-8 example. E: Omeprazole blocks the pump, lowering acid.","source_slide":"L05 Transport Across the Cell Membrane, slides 24, 59"},{"id":"FND-PHYS-L05-09","block":"Foundations","lecture":"L05 Transport Across the Cell Membrane","discipline":"Physiology","style":"LAU","stem":"Ouabain is applied to intestinal epithelium, and glucose absorption falls. Why?","options":{"A":"SGLT loses the Na⁺ gradient that drives glucose entry","B":"Ouabain directly blocks basolateral GLUT2","C":"SGLT is a P-type ATPase that ouabain inhibits","D":"Ouabain competes with glucose for SGLT","E":"Tight junctions open and glucose leaks back"},"answer":"A","explanation":"Ouabain inhibits the Na⁺/K⁺-ATPase; the Na⁺ gradient that powers secondary active SGLT transport collapses. B: GLUT2 isn't the ouabain target. C: SGLT is a cotransporter (secondary active), not an ATPase. D: Ouabain binds the Na⁺/K⁺ pump, not SGLT. E: Ouabain isn't described as acting on tight junctions.","source_slide":"L05 Transport Across the Cell Membrane, slides 24–25, 28, 49"},{"id":"FND-PHYS-L06-01","block":"Foundations","lecture":"L06 Physiology of Pain","discipline":"Physiology","style":"LAU","stem":"Gentle abdominal pressure is painless in a healthy person but very painful over an inflamed appendix. Which mechanism explains this tenderness?","options":{"A":"Referred pain via convergent spinal neurons","B":"Lowered nociceptor threshold from inflammatory mediators","C":"Activation of endogenous opioid circuits","D":"Neuropathic pain from direct nerve injury","E":"Exaggeration by the emotional component of pain"},"answer":"B","explanation":"Sensitization: bradykinin, prostaglandins, leukotrienes and substance P lower the activation threshold of pain pathways; this is the basis of clinical tenderness. A: Referred pain is felt away from the source. C: Opioid circuits diminish pain. D: The nerve itself isn't the source. E: The emotional component varies perception but doesn't explain localized tenderness over inflamed tissue.","source_slide":"L06 Physiology of Pain, slide 2"},{"id":"FND-PHYS-L06-02","block":"Foundations","lecture":"L06 Physiology of Pain","discipline":"Physiology","style":"LAU","stem":"Impulses from a stimulated nociceptor spread into neighboring terminal branches and release a peptide that causes vasodilation, neurogenic edema, and mast-cell histamine release. Which peptide?","options":{"A":"Bradykinin","B":"Prostaglandin E₂","C":"Serotonin","D":"Substance P","E":"β-endorphin"},"answer":"D","explanation":"Substance P mediates secondary activation: vasodilation, neurogenic edema, histamine from mast cells and serotonin from platelets. A: Bradykinin is produced in damaged tissue, not released from nerve terminals. B: Prostaglandins sensitize terminals but aren't peptides. C: Serotonin is released from platelets in response to substance P. E: β-endorphin is an endogenous opioid that reduces pain.","source_slide":"L06 Physiology of Pain, slide 2"},{"id":"FND-PHYS-L06-03","block":"Foundations","lecture":"L06 Physiology of Pain","discipline":"Physiology","style":"Step1","stem":"A 70-year-old woman has severe burning pain along a thoracic dermatome 2 months after a vesicular rash resolved. Light clothing brushing the skin is excruciating. What is this phenomenon?","options":{"A":"Referred pain","B":"Hyperalgesia from inflammation","C":"Allodynia from neuropathic pain","D":"Placebo-induced pain","E":"Visceral pain"},"answer":"C","explanation":"After herpes zoster the nerve itself is the source (neuropathic), and very light moving stimuli become painful (allodynia). A: Pain is in the involved dermatome, not referred. B: The inflammation has resolved. D: Not a placebo effect. E: This is somatic and dermatomal, not visceral.","source_slide":"L06 Physiology of Pain, slide 4"},{"id":"FND-PHYS-L06-04","block":"Foundations","lecture":"L06 Physiology of Pain","discipline":"Physiology","style":"LAU","stem":"A patient reports less pain after an inert pill he was told is a strong analgesic. Which system most likely mediates this?","options":{"A":"Spinothalamic tract sensitization","B":"Substance P release","C":"Prostaglandin synthesis","D":"Peripheral bradykinin release","E":"Endogenous opioid modulation circuits"},"answer":"E","explanation":"Suggestion and reassurance act through pain-modulation circuits; the pain-diminishing ones use endogenous opioids (the basis of the placebo effect). A: Sensitization increases pain. B: Substance P amplifies pain. C: Prostaglandins sensitize nociceptors. D: Bradykinin causes pain.","source_slide":"L06 Physiology of Pain, slide 4"},{"id":"FND-PHYS-L06-05","block":"Foundations","lecture":"L06 Physiology of Pain","discipline":"Physiology","style":"LAU","stem":"A patient with irritation of the diaphragm complains of shoulder pain. What explains this?","options":{"A":"Fibers from both sites converge on a common spinal cell body","B":"Inflammatory mediators sensitize shoulder nociceptors","C":"The phrenic nerve itself is the source of the pain","D":"The organ activates the same CNS cells as its overlying skin","E":"Pain-modulation circuits exaggerate the stimulus"},"answer":"A","explanation":"Referred pain: pain fibers from different locations converge on the same spinal cell, so the brain misattributes the source. B: There is no shoulder pathology to sensitize. C: Neuropathic pain arises from a damaged nerve, not irritation of an organ. D: That is the normal mechanism that localizes deep pain correctly to the overlying skin, not to a distant site. E: Modulation changes intensity, not location.","source_slide":"L06 Physiology of Pain, slide 3"},{"id":"FND-PHYS-L07-01","block":"Foundations","lecture":"L07 Temperature Regulation","discipline":"Physiology","style":"LAU","stem":"A bodybuilder training in a 34 °C gym reaches 39 °C, which falls when he rests. Later, with COVID-19, he is again 39 °C. How do the two episodes compare?","options":{"A":"Both: raised set point","B":"Exercise: raised set point; infection: unchanged set point","C":"Exercise: unchanged set point; infection: raised set point","D":"Both: unchanged set point with failed heat loss","E":"Exercise: lowered set point; infection: raised set point"},"answer":"C","explanation":"Exercise in heat is hyperthermia: heat gain exceeds loss with the set point unchanged. Infection is fever: pyrogens → PGE₂ → raised set point. A, B: Exercise doesn't change the set point. D: Fever does raise the set point. E: The set point isn't lowered in exercise.","source_slide":"L07 Temperature Regulation, slides 2, 18, 35–36"},{"id":"FND-PHYS-L07-02","block":"Foundations","lecture":"L07 Temperature Regulation","discipline":"Physiology","style":"LAU","stem":"A resting person in a room at 22 °C loses most body heat by which mechanism?","options":{"A":"Conduction","B":"Evaporation","C":"Convection","D":"Respiratory loss","E":"Radiation"},"answer":"E","explanation":"Radiation accounts for about 60% of heat loss at rest. A, C: Conduction and convection are smaller at rest. B: Evaporation (sweating) becomes important in heat and exercise, not at rest in a cool room. D: Respiratory loss is minor.","source_slide":"L07 Temperature Regulation, slides 11–12"},{"id":"FND-PHYS-L07-03","block":"Foundations","lecture":"L07 Temperature Regulation","discipline":"Physiology","style":"LAU","stem":"A tumor destroys the anterior hypothalamus (preoptic area). Which response is most impaired?","options":{"A":"Shivering in a cold room","B":"Sweating in a hot room","C":"Skin vasoconstriction in the cold","D":"Thyroid-driven cold adaptation","E":"Brown fat thermogenesis in the cold"},"answer":"B","explanation":"Warm-sensitive neurons of the anterior hypothalamus/POA drive heat dissipation: sweating and skin vasodilation. A, C: Shivering and vasoconstriction come from cold-sensitive neurons in the posterior hypothalamus. D, E: These are heat-production and conservation responses, not anterior-hypothalamus heat loss.","source_slide":"L07 Temperature Regulation, slides 14, 27"},{"id":"FND-PHYS-L07-04","block":"Foundations","lecture":"L07 Temperature Regulation","discipline":"Physiology","style":"LAU","stem":"At the onset of fever, a patient shivers under blankets although his temperature is 37.5 °C. Why?","options":{"A":"Set point below body temperature","B":"Failed heat dissipation","C":"Premature onset of sweating","D":"Set point above body temperature","E":"Fall in thyroid hormone"},"answer":"D","explanation":"Pyrogens → PGE₂ raise the set point above body temperature, so the body responds as if cold (chills, shivering). A: Set point below body temperature drives heat loss (as when fever breaks). B: Failed heat dissipation is hyperthermia, with an unchanged set point. C: Sweating is a heat-loss response, not the cause of chills. E: Thyroid hormone isn't the trigger.","source_slide":"L07 Temperature Regulation, slides 18–19, 36"},{"id":"FND-PHYS-L07-05","block":"Foundations","lecture":"L07 Temperature Regulation","discipline":"Physiology","style":"Step1","stem":"During general anesthesia with sevoflurane and succinylcholine, a 20-year-old develops rigidity, hypercapnia, and a temperature of 41 °C. Which best describes his thermoregulatory state?","options":{"A":"Fever: pyrogens raise the set point","B":"Hyperthermia: set point unchanged","C":"Hypothermia: heat loss exceeds production","D":"Hyperthermia: set point lowered","E":"Normal circadian variation"},"answer":"B","explanation":"Malignant hyperthermia is a cause of hyperthermia listed in the lecture: uncontrolled muscle heat production with no change in set point. A: No pyrogens or PGE₂ are involved, so antipyretics don't help. C: Temperature is high. D: In hyperthermia the set point is unchanged. E: Circadian swing is only ~0.6 °C.","source_slide":"L07 Temperature Regulation, slides 18, 34–35"},{"id":"FND-PHYS-L07-06","block":"Foundations","lecture":"L07 Temperature Regulation","discipline":"Physiology","style":"LAU","stem":"A newborn exposed to cold maintains temperature without shivering. Which mechanism is mainly responsible?","options":{"A":"Brown fat non-shivering thermogenesis","B":"Thyroid hormone–driven cold adaptation","C":"Cutaneous vasodilation","D":"Progesterone release","E":"Catecholamine-induced sweating"},"answer":"A","explanation":"Non-shivering thermogenesis in brown fat is most important in infants exposed to cold. B: Thyroid hormone mediates long-term cold adaptation, not the newborn's immediate response. C: Vasodilation loses heat. D: Progesterone raises basal temperature in the luteal phase. E: Sweating promotes heat loss.","source_slide":"L07 Temperature Regulation, slides 9, 29, 31"},{"id":"FND-PHYS-L07-07","block":"Foundations","lecture":"L07 Temperature Regulation","discipline":"Physiology","style":"LAU","stem":"Sweating during heat stress is reduced by a drug that blocks the transmitter at the sweat gland. Which fibers normally drive this sweating?","options":{"A":"Sympathetic adrenergic fibers","B":"Parasympathetic cholinergic fibers","C":"Sympathetic cholinergic fibers","D":"Somatic motor fibers","E":"Sympathetic dopaminergic fibers"},"answer":"C","explanation":"The anterior hypothalamus/POA sends impulses through the spinal cord and sympathetic cholinergic fibers to the sweat glands. A: Circulating epinephrine/norepinephrine can stimulate sweat glands (important in exercise), but the nerve fibers are cholinergic. B: Sweat glands receive sympathetic, not parasympathetic, innervation. D: Somatic fibers supply skeletal muscle. E: Not a sweat-gland pathway.","source_slide":"L07 Temperature Regulation, slides 21, 27, 29"},{"id":"FND-PHYS-L07-08","block":"Foundations","lecture":"L07 Temperature Regulation","discipline":"Physiology","style":"Step1","stem":"An 80-year-old man is found outdoors on a winter morning with a core temperature of 28 °C. What is the most likely cause of death if he is not rewarmed?","options":{"A":"Cardiac fibrillation","B":"Heat stroke with multiorgan failure","C":"Acute liver failure","D":"Renal shutdown","E":"Hyperventilation"},"answer":"A","explanation":"Severe hypothermia (27–29 °C) causes cardiac fibrillation; arrhythmias are the common cause of death, and the elderly are a risk group. B: Heat stroke occurs at 40–44 °C. C, D, E: Not the lecture's cause of death in hypothermia.","source_slide":"L07 Temperature Regulation, slides 34, 37–38"},{"id":"FND-PHYS-L09-01","block":"Foundations","lecture":"L09 Transmembrane Fluid Movement","discipline":"Physiology","style":"LAU","stem":"A 60-kg man (body fluid osmolality 290 mOsm/kg; 60-40-20 rule) has 360 mmol of NaCl added to his ECF. NaCl stays in the ECF. What is his new body fluid osmolality?","options":{"A":"290 mOsm/kg","B":"300 mOsm/kg","C":"310 mOsm/kg","D":"320 mOsm/kg","E":"350 mOsm/kg"},"answer":"C","explanation":"TBW 36 L; total osmoles 36 × 290 = 10,440. NaCl adds 720 mOsm (2 osmoles per mole) → 11,160/36 = 310 mOsm/kg. Water shifts ICF → ECF until both are equal (ICF ≈ 22.5 L, ECF ≈ 13.5 L). A: NaCl is an effective osmole and raises osmolality. B: Counts NaCl as 1 osmole. D: Counts 1 osmole and ignores the water shift (ECF 12 L only). E: Ignores the water shift from the ICF.","source_slide":"L09 Transmembrane Fluid Movement, slides 4, 14–17"},{"id":"FND-PHYS-L09-02","block":"Foundations","lecture":"L09 Transmembrane Fluid Movement","discipline":"Physiology","style":"LAU","stem":"A 70-kg man (osmolality 290 mOsm/kg; 60-40-20 rule) rapidly drinks 3 L of water. After full absorption but before any excretion, what is his plasma osmolality?","options":{"A":"290 mOsm/kg","B":"271 mOsm/kg","C":"239 mOsm/kg","D":"312 mOsm/kg",
