ssion. Eukaryote 80S. Fungi: chitin","<b>Gram+</b>: thick peptidoglycan + teichoic acid. <b>Gram−</b>: thin PG + outer membrane with LPS (<b>lipid A = endotoxin</b>; periplasm holds β-lactamases). Gram-negatives stain pink. TB: mycolic acid, acid-fast (Ziehl–Neelsen)","Antigens: O (wall), K (capsule), H (flagella). Capsule: Quellung; <i>B. anthracis</i> polypeptide; strep hyaluronic acid. Sex pili: conjugation; F factor; R plasmids","Spores (<i>Clostridium, Bacillus</i>): Ca-dipicolinate, autoclave 121 °C 20 min. Mycoplasma: no wall (sterols), β-lactam resistant"]},{"h":"Virulence","items":["Staph: <b>coagulase</b>, protein A. Strep: <b>M protein</b>. Gonococcus: <b>IgA protease</b>. TB/Legionella: block phagosome–lysosome fusion; Listeria escapes to cytoplasm","Exotoxin: protein, heat-labile; <b>toxoid</b> (formalin) = tetanus/diphtheria vaccines. Endotoxin: heat-stable, fever/shock"]},{"h":"Growth & genetics","items":["All pathogens: heterotroph, mesophile (37 °C). Anaerobes lack catalase + SOD. E. coli doubles ~20 min; TB &gt; 24 h. Lag = incubation period; stationary = growth equals death. UV → thymine dimers","<b>Transformation</b> (naked DNA), <b>transduction</b> (phage), <b>conjugation</b> (contact). Prophage = lysogeny (toxin genes). Cloning: restriction enzymes + ligase"]},{"h":"Infection","items":["Normal flora: skin coag-neg staph; vagina <i>Lactobacillus</i>; colon <i>Bacteroides</i>/E. coli; make vitamin K. Viridans strep → endocarditis; E. coli → UTI. Carriers (incubatory, convalescent) spread more than cases","Parasites: definitive host = sexual maturity. Cysts (resistant) vs trophozoites. Flukes hermaphrodite except <b>Schistosoma</b>. Helminths → eosinophilia, IgE. Cestodes: proglottids"]},{"h":"Viruses","items":["One nucleic acid type; capsid (capsomers); envelope from host membrane (ether-sensitive). Parvo = ssDNA; reo = dsRNA; HDV needs HBV. Prions: protein, heat-resistant","Steps: adsorption → uncoating → synthesis → assembly → release (lysis if naked, budding if enveloped). DNA viruses: nucleus; RNA: cytoplasm. Retrovirus → proviral DNA. <b>Reassortment</b> = flu antigenic shift. Interferon = viral interference. Syncytia. <b>Negri</b> (rabies), <b>Cowdry</b> (herpes)"]},{"h":"Antibacterials","items":["<b>Cell wall</b>: β-lactams (PBP/transpeptidase), vancomycin (D-Ala-D-Ala), bacitracin. Membrane: polymyxin. <b>30S</b>: tetracyclines, aminoglycosides. <b>50S</b>: macrolides, clindamycin, linezolid, chloramphenicol. Quinolones → DNA gyrase. Rifampin → RNA polymerase. Sulfonamides → DHPS; trimethoprim → DHFR","Penicillinase-resistant: nafcillin, oxacillin, dicloxacillin. Amoxicillin &gt; ampicillin orally. Cephalosporins: cefazolin (1), cefaclor (2), ceftriaxone (3), cefepime (4), ceftaroline (5: MRSA, no Pseudomonas). Inhibitors: clavulanate, sulbactam, tazobactam","Resistance: inactivation, altered target, efflux, ↓ permeability, bypass. Kirby-Bauer disc; E-test = MIC. Dental prophylaxis: amoxicillin; meningitis contacts: rifampin"]},{"h":"Antivirals","items":["HIV: <b>enfuvirtide</b> (gp41), <b>maraviroc</b> (CCR5), NRTIs (chain terminators; tenofovir is a nucleotide), NNRTIs (nevirapine), <b>raltegravir</b> (integrase). HAART = 2 NRTIs + another class. Lamivudine also treats HBV","Herpes: HSV latent in sensory neurons. <b>Acyclovir</b> (viral thymidine kinase); resistance = TK mutation → <b>foscarnet</b> (no activation). <b>Ganciclovir</b> (UL97, CMV). Cidofovir (cellular kinases)","Influenza: amantadine/rimantadine (M2, influenza A only); oseltamivir/zanamivir (neuraminidase, release). Interferons α/β ↓ viral mRNA, ↑ MHC. RNA viruses mutate fast (no proofreading)"]}]},{"discipline":"Genetics","covers":"L01–L07 (cytogenetics, population genetics, complex disease not posted)","sections":[{"h":"DNA & genome","items":["Miescher (DNA), Avery (genes = DNA), Chargaff (A = T, G = C), Franklin (Photo 51). Purines A, G; pyrimidines C, T. A–T 2 H-bonds, G–C 3. Phosphodiester: 5′ P to 3′ C","Nuclear ~3.3 × 10⁹ bp, ~20,000 genes, 1–2% coding. <b>mtDNA</b>: 16,569 bp, 37 genes (13 proteins, 22 tRNA, 2 rRNA), higher mutation rate","Nucleosome = 8 histones; heterochromatin inactive; histone <b>acetylation</b> activates. Alternative splicing explains &gt; 160,000 proteins. rRNA ~80% of RNA; snRNA (splicing); miRNA/siRNA (RISC). 32 tRNAs read 61 codons (wobble at 3rd base)","Centromere: 171-bp alpha-satellite. Telomere (TTAGGG)n; telomerase high in cancer, low in aging. STR 2–5 bp, VNTR 10–100 bp. SINE/LINE = retrotransposons"]},{"h":"Central dogma","items":["Replication semiconservative: <b>helicase</b>, topoisomerase, <b>primase</b> (RNA primer), lagging strand = Okazaki fragments, RNase H, DNA pol I, <b>ligase</b>. Polymerase needs free 3′ end","RNA pol reads 3′→5′, builds 5′→3′. mRNA = coding strand with U. 5′ <b>7-methylguanosine cap</b>, poly(A) (signal <b>AAUAAA</b>). Introns <b>GU…AG</b>, branch-point A (lariat); snRNPs U1, U2, U4, U5, U6. Start AUG (Kozak); stops UAA, UAG, UGA. A, P, E sites; release factors"]},{"h":"Variants","items":["g. / c. / p. <b>Missense</b> (new AA), <b>nonsense</b> (stop), synonymous. Indel not multiple of 3 = <b>frameshift</b>. Polymorphism ≥ 1%. Humans 99.9% identical. ACMG: pathogenic → VUS → benign. <b>Dominant negative</b>: mutant protein blocks the normal one","Structural variants affect more bp than SNPs. Inversion: pericentric (includes centromere) vs paracentric. <b>NAHR</b> between segmental duplications: deletion/duplication (direct) or inversion (opposite). <b>CMT1A</b> = PMP22 duplication; deletion = HNPP","Resolution: karyotype &gt; 5 Mb; array &gt; 1 kb; NGS 1 bp. Array can&#39;t see <b>balanced</b> rearrangements. NHEJ repairs in G0/G1. Exome: ~85% of disease mutations"]},{"h":"Mendelian","items":["AD: 50% risk, <b>male-to-male transmission</b> excludes X-linked. Achondroplasia: FGFR3, advanced paternal age. Penetrance (all-or-none) vs variable expressivity; pleiotropy (Marfan). Germline mosaicism (OI II recurrence). OI = dominant-negative collagen","AR carriers: 25% affected, 50% carriers. Compound heterozygote. X-linked: father → all daughters, no sons. <b>Lyonization</b>: random, Barr body; skewed inactivation → female DMD. Locus heterogeneity. Counseling non-directive"]},{"h":"Unusual inheritance","items":["<b>Mitochondrial</b>: maternal; bottleneck; diabetes + deafness red flag. LHON (males, m.11778G&gt;A); Kearns-Sayre (large deletion; heart block, deafness); Pearson (sideroblastic anemia); <b>MELAS</b> m.3243A&gt;G; <b>MERRF</b> m.8344A&gt;G; AZT toxicity","<b>Imprinting</b> (methylation set in gametogenesis): paternal 15q11–13 deletion = <b>Prader-Willi</b> (hyperphagia, obesity, hypotonia); maternal = <b>Angelman</b> (laughter, seizures, UBE3A). PWS also maternal UPD; trisomy rescue most common UPD. Beckwith-Wiedemann 11p15. Complete mole = paternal 46,XX; teratoma = maternal","<b>Anticipation</b> = repeat expansion. Maternal expansion: fragile X (CGG in FMR1; premutation 59–200, full &gt; 200; macroorchidism; premature ovarian failure/FXTAS), myotonic dystrophy (CTG, DMPK). Paternal: <b>Huntington</b>"]}]},{"discipline":"Histology","covers":"L01–L03 (also covers L04), L08 (labs and glands not posted)","sections":[{"h":"Methods","items":["Fixative: <b>10% neutral buffered formalin</b> (≥ 5× volume) stops autolysis. Process: alcohol → xylene → paraffin; sections 3–4 µm. <b>H&amp;E</b>: hematoxylin nuclei blue, eosin cytoplasm pink. IHC = brown; IF = fluorochrome; ISH = DNA/RNA. 100× needs oil"]},{"h":"Junctions & epithelium","items":["Apex → base: <b>tight junction</b> (claudins, occludin) → <b>zonula adherens</b> (cadherin–actin) → <b>desmosome</b> (cadherin–keratin; desmoplakin) → <b>hemidesmosome</b> (integrin, laminin, type IV collagen; plectin). Gap junction = 6 connexins (&lt; 1500 Da)","<b>Pemphigus vulgaris</b>: IgG vs desmogleins 1 and 3 → acantholysis. Brain endothelium: zonula occludens (BBB)","Basement membrane: PAS+; type <b>IV</b> collagen, laminin; lamina fibroreticularis = type III. Carcinoma in situ stays above it. Brush border: small intestine, proximal tubule. Stereocilia: epididymis. Cilia <b>9 + 2</b>; immotile cilia = sinusitis, infertility, situs inversus (~50%)"]},{"h":"Connective tissue","items":["Dense regular: tendon/ligament; irregular: dermis. Collagen: <b>I</b> bone/tendon/skin · <b>II</b> hyaline cartilage · <b>III</b> reticulin (silver stain) · <b>IV</b> basal lamina · <b>VII</b> anchoring fibrils. Elastic = elastin + <b>fibrillin</b>; arteries: made by smooth muscle","White fat: leptin. Brown fat: multilocular, many mitochondria. Fibroblast: RER, procollagen. <b>Mast cell</b>: metachromatic granules, type I hypersensitivity. Macrophage ← monocyte (epithelioid/giant cells in granuloma). <b>Plasma cell</b>: clock-face chromatin. Eosinophils: parasites/allergy. Basophils circulate. Fibronectin (cell–matrix), laminin (to type IV)"]},{"h":"Vessels","items":["Intima / media / adventitia. <b>Elastic arteries</b> (aorta): fenestrated elastic membranes. <b>Muscular arteries</b>: internal + external elastic laminae. Arterioles: 2–3 smooth-muscle layers (BP). Precapillary sphincters","Capillaries: continuous (pericytes); <b>fenestrated</b> (endocrine, gut, glomerulus); <b>sinusoidal</b> (liver, spleen, marrow, discontinuous basal lamina). Veins hold ~70% of blood; thickest layer adventitia; valves from intima (varicose veins). Lymph → thoracic/right lymphatic duct"]}]},{"discipline":"Clinical Skills","covers":"L01–L02","sections":[{"h":"Interview","items":["History gives <b>60–80%</b> of the diagnosis. Doctors interrupt after ~<b>18 s</b> (Beckman). Eye contact is a key non-verbal skill. Calgary–Cambridge opening: preparation, rapport, reasons for consultation; screen (&quot;anything else?&quot;) to set the agenda","Start <b>open-ended</b>, then closed to test hypotheses. Avoid <b>leading</b> questions (&quot;You don&#39;t smoke, do you?&quot;)","Order: chief complaint (patient&#39;s own words) → HPI → PMH → medications → allergies → family → social → review of systems","Pain: <b>SOCRATES</b> (Site, Onset, Character, Radiation, Associations, Timing, Exacerbating/relieving, Severity). Illness experience: <b>FIFE</b> (Function, Ideas, Feelings, Expectations)","Empathy: &quot;I can see this is upsetting you&quot; = reflection; &quot;Anyone would find this difficult&quot; = legitimation"]}]},{"discipline":"Medical Ethics","covers":"L01–L02","sections":[{"h":"Principles","items":["Beauchamp &amp; Childress: <b>beneficence, non-maleficence, autonomy, justice</b>. <b>Belmont</b> (1979): persons → consent; beneficence → risk/benefit; justice → fair subject selection. <b>Nuremberg Code</b> (1947): voluntary consent essential","Deontology = duty/rules; consequentialism = outcomes; virtue = character. <b>Double effect</b>: hysterectomy for uterine cancer ends pregnancy. Paternalism = beneficence overriding autonomy","Valid consent: <b>competent, informed, voluntary</b>"]},{"h":"Physician–patient","items":["Models: paternalistic (doctor decides) vs informative (patient chooses). Parsons&#39; sick role: exemption, expectation of care, effort to get well, cooperate with staff","Adherence is <b>not</b> related to gender, SES, intelligence or education. <b>Countertransference</b> = physician&#39;s unconscious reaction. Closed questions in emergencies/talkative patients. Child: ask in the third person. Non-verbal ≥ 65% of social meaning"]}]},{"discipline":"Population Health","covers":"L01–L03, L05 (L04 not posted)","sections":[{"h":"Epidemiology","items":["Distribution + determinants of health states. Descriptive (time, place, person) vs analytical (determinants). <b>John Snow</b>: Broad Street pump. Endemic / epidemic / pandemic"]},{"h":"Measures","items":["<b>Prevalence</b> = existing cases / population (a proportion). <b>Incidence risk</b> = new cases / population at risk. <b>Incidence rate</b> = new cases / person-time. Prevalence ≈ incidence × duration; a drug prolonging survival ↑ prevalence","Case-fatality = deaths / diagnosed cases (severity). Proportionate mortality = deaths from cause / total deaths (not risk). <b>Maternal mortality ratio</b>: per live births. Perinatal: stillbirths (≥ 28 wk) + deaths &lt; 7 d. Infant = neonatal (&lt; 28 d) + post-neonatal","<b>Indirect</b> standardization → SMR. <b>DALY</b> = YLL + YLD. <b>QALY</b> = years × utility (0 death, 1 full health). <b>ICER</b> = Δcost / ΔQALY"]},{"h":"Biostatistics","items":["Ordinal (ordered category) vs nominal; discrete (count) vs continuous (measure). Random sampling = equal chance. Parameter (population) vs statistic (sample). Dependent = outcome (y). Inferential vs descriptive"]}]},{"discipline":"Social Medicine","covers":"L01–L04","sections":[{"h":"Social medicine & global health","items":["<b>Virchow</b>: father of social medicine; 1848 Silesia typhus = poverty; physician = natural advocate of the poor. <b>Inequity</b> (tied to disadvantage) vs disparity (any difference)","Global health: equity worldwide, transnational. <b>WHO 1948</b>. Smallpox eradicable: no animal reservoir/vector, distinctive rash, lifelong immunity","<b>Social determinants</b>: conditions where people are born, grow, live, work, age; shaped by money, power, resources. Social <b>gradient</b> in child mortality; stigma and exclusion worsen health"]},{"h":"Human rights","items":["UDHR <b>Art. 25</b>; ICESCR <b>Art. 12</b> (highest attainable health). WHO Constitution <b>1946</b> defines health (physical, mental, social well-being)","State duties: <b>respect, protect, fulfil</b>. Ratification binds; signature obliges not to undermine. <b>Progressive realization</b> within resources. Harm reduction (needle programs, supervised injection, opioid agonist therapy) needs no abstinence"]}]}];
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'lau-qbank-v2', KEEP = 5;
let P = {};                                   // P[id] = [[correct 0|1, letter, time], ...] (last KEEP attempts)
try { const old = JSON.parse(localStorage.getItem(KEY) || '{}'); if (old && typeof old === 'object') P = old; } catch (e) {}
const lastT = a => a && a.length ? a[a.length - 1][2] : 0;
function merge(remote){ let changed = false; for (const id in remote) { if (lastT(remote[id]) > lastT(P[id])) { P[id] = remote[id]; changed = true; } } return changed; }
const last = id => { const a = P[id]; return a && a.length ? a[a.length - 1] : null; };
const state = id => { const l = last(id); return l ? (l[0] ? 'ok' : 'miss') : 'new'; };

// persistence: browser storage always, account storage (db) when this page is opened as a published artifact
let dbDoc = null, saving = false, dirty = false, timer = null;
const setSync = (txt) => { $('#sync').textContent = txt; };
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {}
  if (!dbDoc) return; dirty = true; clearTimeout(timer); timer = setTimeout(flush, 1500);
}
async function flush(){
  if (!dbDoc || saving || !dirty) return; saving = true; dirty = false;
  try { await dbDoc.set({p: P, v: 2}); setSync('Progress is saved to your account and syncs between devices.'); }
  catch (e) { setSync('Saved in this browser only (account sync failed).'); }
  saving = false; if (dirty) { clearTimeout(timer); timer = setTimeout(flush, 500); }
}
async function connect(){
  setSync('Progress is saved in this browser only.');
  try {
    const c = window.claude; if (!c || !c.use) return;
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]); if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    dbDoc = db.doc('data/users/' + uid + '/profile');
    let first = true;
    dbDoc.onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null; const remote = d && d.p ? d.p : {};
      const changed = merge(remote);
      if (changed) { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} if ($('#qview').hidden && $('#sheets').hidden) home(); }
      if (first) { first = false; dirty = true; flush(); }   // push anything this device had that the account lacked
      setSync('Progress is saved to your account and syncs between devices.');
    }, () => { dbDoc = null; setSync('Saved in this browser only.'); });
  } catch (e) { dbDoc = null; }
}

const num = l => { const m = l.match(/^L(\d+)/); return m ? +m[1] : 99; };
const byDisc = {}; Q.forEach(q => { ((byDisc[q.discipline] ??= {})[q.lecture] ??= []).push(q); });
const ORDER = ['Pharmacology','Biochemistry','Physiology','Pathology','Microbiology','Genetics','Histology','Population Health','Social Medicine','Medical Ethics','Clinical Skills'];
const discs = ORDER.filter(d => byDisc[d]).concat(Object.keys(byDisc).filter(d => !ORDER.includes(d)));
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
function counts(list){ let ok = 0, miss = 0; list.forEach(q => { const s = state(q.id); if (s === 'ok') ok++; else if (s === 'miss') miss++; }); return {ok, miss, nw: list.length - ok - miss, n: list.length}; }

function home(){
  const c = counts(Q);
  $('#tot').textContent = `${c.ok + c.miss} of ${c.n} answered`;
  $('#totsub').textContent = (c.ok + c.miss) ? `${pct(c.ok, c.ok + c.miss)}% correct on the latest attempt · ${c.miss} to revisit` : 'Finish a lecture, then open its questions below.';
  $('#qnew').textContent = `Unanswered (${c.nw})`; $('#qnew').disabled = !c.nw; $('#qmiss').textContent = `Missed (${c.miss})`; $('#qmiss').disabled = !c.miss;
  const open = new Set([...document.querySelectorAll('details.disc[open]')].map(d => d.dataset.d));
  $('#tree').innerHTML = discs.map(d => {
    const lecs = Object.keys(byDisc[d]).sort((a, b) => num(a) - num(b)), all = lecs.flatMap(l => byDisc[d][l]), dc = counts(all);
    return `<details class="disc" data-d="${esc(d)}" ${open.has(d) ? 'open' : ''}><summary><span class="grow">${esc(d)}</span><span class="pill">${dc.ok + dc.miss}/${dc.n}</span></summary>` +
      lecs.map(l => { const lc = counts(byDisc[d][l]), done = lc.ok + lc.miss, cls = !done ? '' : (lc.miss ? 'r' : 'g');
        return `<div class="lec"><div class="t"><b>${esc(l)}</b><div class="bar"><i class="${cls}" style="width:${pct(done, lc.n)}%"></i></div></div>
          <div class="stat">${done ? `${lc.ok}/${lc.n} right` : `${lc.n} questions`}</div>
          <button class="btn sm ${done ? 'ghost' : ''}" data-run="${esc(d)}|${esc(l)}">${done ? (lc.miss ? 'Redo' : 'Again') : 'Start'}</button></div>`; }).join('') + '</details>';
  }).join('');
  document.querySelectorAll('[data-run]').forEach(b => b.onclick = () => { const [d, l] = b.dataset.run.split('|'); start(byDisc[d][l], `${d} · ${l}`); });
}

let run = [], i = 0, title = '', sess = [];
function start(list, t){ if (!list.length) return; run = list.slice(); i = 0; title = t; sess = []; $('#qhome').hidden = true; $('#qview').hidden = false; window.scrollTo(0, 0); show(); }
function show(){
  const q = run[i], keys = Object.keys(q.options);
  $('#qview').innerHTML = `<div class="qhead"><div class="mute">${esc(title)} · ${i + 1}/${run.length}</div><button class="btn ghost sm" id="quit">Exit</button></div>
   <div class="prog"><i style="width:${100 * i / run.length}%"></i></div>
   <div class="card"><span class="tag">${esc(q.lecture)}</span><span class="tag">${esc(q.style)}</span>
   <p class="stem">${esc(q.stem)}</p>${keys.map(k => `<button class="opt" data-k="${k}"><b>${k}</b><span>${esc(q.options[k])}</span></button>`).join('')}<div id="exp"></div></div>
   <div class="row"><button class="btn" id="next" disabled>${i + 1 < run.length ? 'Next' : 'See results'}</button><span class="mute noprint">Keys: A–E to answer, Enter for next</span></div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(b.dataset.k));
  $('#next').onclick = next; $('#quit').onclick = finish;
}
function pick(k){
  const q = run[i]; if (sess[i] !== undefined) return; sess[i] = k; const ok = k === q.answer;
  const a = P[q.id] ??= []; a.push([ok ? 1 : 0, k, Date.now()]); if (a.length > KEEP) a.splice(0, a.length - KEEP); persist();
  document.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b.dataset.k === q.answer) b.classList.add('right'); else if (b.dataset.k === k) b.classList.add('wrong'); });
  $('#exp').innerHTML = `<div class="exp ${ok ? 'ok' : 'no'}"><div class="v">${ok ? 'Correct' : 'Incorrect. Answer: ' + q.answer}</div><p>${esc(q.explanation)}</p><div class="mute src">${esc(q.source_slide)}</div></div>`;
  $('#next').disabled = false; $('#next').focus();
}
function next(){ if (sess[i] === undefined) return; i++; i < run.length ? show() : finish(); }
function finish(){
  const done = run.map((q, j) => [q, sess[j]]).filter(x => x[1] !== undefined), ok = done.filter(([q, a]) => a === q.answer), miss = done.filter(([q, a]) => a !== q.answer);
  $('#qview').innerHTML = done.length ? `<div class="card"><div class="mute">${esc(title)}</div><div class="score">${ok.length}/${done.length} <span class="mute" style="font:500 18px var(--sans)">${pct(ok.length, done.length)}%</span></div>
   ${miss.length ? `<h4 style="margin:16px 0 4px">To revisit</h4>` + miss.map(([q]) => `<div class="miss"><b>${esc(q.lecture)}</b><br>${esc(q.stem)}<div class="mute">Answer ${q.answer}: ${esc(q.options[q.answer])}</div></div>`).join('') : '<p>No misses. Move on.</p>'}</div>
   <div class="row">${miss.length ? '<button class="btn" id="again">Retry missed</button>' : ''}<button class="btn ghost" id="back">Back to list</button></div>` :
   `<div class="card">No questions answered.</div><button class="btn ghost" id="back">Back to list</button>`;
  if ($('#again')) $('#again').onclick = () => start(miss.map(x => x[0]), title + ' (retry)');
  $('#back').onclick = () => { $('#qview').hidden = true; $('#qhome').hidden = false; home(); window.scrollTo(0, 0); };
}
document.addEventListener('keydown', e => {
  if ($('#qview').hidden || e.metaKey || e.ctrlKey || e.altKey || !run[i] || e.target.tagName === 'TEXTAREA') return;
  const k = e.key.toUpperCase(), q = run[i];
  if (sess[i] === undefined && q.options[k]) pick(k); else if (sess[i] === undefined && /^[1-5]$/.test(e.key)) pick('ABCDE'[+e.key - 1]);
  else if (sess[i] !== undefined && (e.key === 'Enter' || e.key === 'ArrowRight' || e.key === ' ') && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); next(); }
});
$('#qnew').onclick = () => start(Q.filter(q => state(q.id) === 'new').sort(() => Math.random() - .5).slice(0, 20), 'Unanswered mix');
$('#qmiss').onclick = () => start(Q.filter(q => state(q.id) === 'miss').sort(() => Math.random() - .5), 'Missed questions');
let armed = false;
$('#rst').onclick = () => { if (!armed) { armed = true; $('#rst').textContent = 'Tap again to erase all answers'; setTimeout(() => { armed = false; $('#rst').textContent = 'Reset progress'; }, 4000); return; }
  armed = false; $('#rst').textContent = 'Reset progress'; P = {}; persist(); home(); };
$('#bk').onclick = () => { const b = $('#bkbox'); b.hidden = !b.hidden; if (!b.hidden) { $('#bktext').value = JSON.stringify(P); $('#bktext').select(); } };
$('#bkrestore').onclick = () => { try { const d = JSON.parse($('#bktext').value); if (d && typeof d === 'object') { P = d; persist(); home(); $('#bkbox').hidden = true; } } catch (x) { $('#bktext').value = 'That text is not a backup. Paste a backup and try again.'; } };

// sheets
function sheet(d){
  const s = SHEETS.find(x => x.discipline === d); document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.d === d));
  $('#sheet').innerHTML = `<h2>${esc(s.discipline)}</h2><div class="cov">${esc(s.covers)}</div>` + s.sections.map(x => `<h3>${esc(x.h)}</h3><ul>${x.items.map(t => `<li>${t}</li>`).join('')}</ul>`).join('');
  try { localStorage.setItem('lau-sheet', d); } catch (e) {}
}
$('#chips').innerHTML = SHEETS.map(s => `<button class="chip" data-d="${esc(s.discipline)}">${esc(s.discipline)}</button>`).join('');
document.querySelectorAll('.chip').forEach(c => c.onclick = () => sheet(c.dataset.d));
if (window.claude) { $('#print').hidden = true; $('#printnote').textContent = 'One page per discipline, built for the day before the exam.'; } else $('#print').onclick = () => window.print();
function tab(t){
  $('#tq').classList.toggle('on', t === 'q'); $('#ts').classList.toggle('on', t === 's');
  $('#sheets').hidden = t !== 's';
  if (t === 's') { $('#qhome').hidden = true; $('#qview').hidden = true; }
  else { $('#qview').hidden = true; $('#qhome').hidden = false; home(); }
  window.scrollTo(0, 0);
}
$('#tq').onclick = () => tab('q'); $('#ts').onclick = () => tab('s');
let first = SHEETS[0].discipline; try { first = localStorage.getItem('lau-sheet') || first; } catch (e) {} if (!SHEETS.find(s => s.discipline === first)) first = SHEETS[0].discipline;
sheet(first); home(); connect();
</script>

</body></html>
