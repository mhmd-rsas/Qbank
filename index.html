ide":"L05-06 Tissue Repair, notes p2; tutorial s18"},{"id":"FND-PATH-L0506-06","block":"Foundations","lecture":"L05-06 Tissue Repair","discipline":"Pathology","style":"Step1","stem":"A 25-year-old woman has a raised, firm scar on her earlobe one year after piercing. Which finding would identify it as a keloid rather than a hypertrophic scar?","options":{"A":"It extends beyond the original wound","B":"It is raised above the skin surface","C":"It formed in a wound under tension","D":"It contains abundant collagen","E":"Granulation tissue rises above the surface"},"answer":"A","explanation":"A keloid extends beyond the original wound boundaries and tends to persist or recur; a hypertrophic scar stays within the wound and may regress. B: Both are raised. C: Tension isn't what defines a keloid. D: Both contain excess collagen. E: That is exuberant granulation tissue, which blocks re-epithelialization.","source_slide":"L05-06 Tissue Repair, notes p8; tutorial s27"},{"id":"FND-PATH-L0506-07","block":"Foundations","lecture":"L05-06 Tissue Repair","discipline":"Pathology","style":"Step1","stem":"A 70-year-old man with poor diet has gum bleeding, perifollicular hemorrhages, and a surgical wound that won't heal. Which step of collagen synthesis is impaired?","options":{"A":"Glycosylation of hydroxylysine","B":"Cleavage of procollagen peptides","C":"Cross-linking by lysyl oxidase","D":"Hydroxylation of proline and lysine","E":"Triple-helix formation from glycine repeats"},"answer":"D","explanation":"Scurvy: vitamin C is needed for hydroxylation of proline and lysine residues, so collagen is weak (bleeding gums, poor wound healing). A: Glycosylation doesn't depend on vitamin C. B: Cleavage of procollagen peptides isn't vitamin C–dependent. C: Lysyl oxidase cross-linking needs copper, not vitamin C (outside slides). E: Glycine repeats are set by the amino-acid sequence, not by vitamin C.","source_slide":"L05-06 Tissue Repair, notes p5–6"},{"id":"FND-PATH-L0506-08","block":"Foundations","lecture":"L05-06 Tissue Repair","discipline":"Pathology","style":"LAU","stem":"A large open leg wound left after debridement heals by second intention. Compared with a sutured surgical incision, which feature is much more prominent?","options":{"A":"A thinner final epidermis","B":"Regeneration of hair follicles","C":"Wound contraction by myofibroblasts","D":"Faster re-epithelialization","E":"Less granulation tissue"},"answer":"C","explanation":"Second intention: larger defect, more inflammation and granulation tissue, a larger scar, and much greater contraction by myofibroblasts (α-smooth muscle actin). A: A thin epidermis isn't a defining feature. B: Appendages aren't restored in a scar. D: Re-epithelialization covers a larger area and takes longer. E: More granulation tissue is needed.","source_slide":"L05-06 Tissue Repair, notes p8; tutorial s7"},{"id":"FND-PATH-L0506-09","block":"Foundations","lecture":"L05-06 Tissue Repair","discipline":"Pathology","style":"LAU","stem":"A patient with chronic hepatitis C develops cirrhosis with fibrous septa and regenerative nodules. Which cells are a major source of the collagen in the septa?","options":{"A":"Regenerating hepatocytes","B":"Macrophages","C":"Endothelial cells","D":"Lymphocytes","E":"Activated hepatic stellate cells"},"answer":"E","explanation":"In chronic liver disease, activated hepatic stellate cells are a major source of collagen. A: Hepatocytes form the regenerative nodules, not the septa. B: Macrophages release profibrotic mediators such as TGF-β but don't mainly deposit collagen. C: Endothelial cells form new vessels. D: Lymphocytes release mediators but don't deposit collagen.","source_slide":"L05-06 Tissue Repair, notes p6; tutorial s22"},{"id":"FND-PATH-L07-01","block":"Foundations","lecture":"L07 Edema and Congestion","discipline":"Pathology","style":"LAU","stem":"A 6-year-old has periorbital edema and generalized swelling. Urinalysis shows 4+ protein. What is the main mechanism of the edema?","options":{"A":"Increased hydrostatic pressure","B":"Lymphatic obstruction","C":"Decreased plasma oncotic pressure","D":"Increased vascular permeability","E":"Arteriolar dilation"},"answer":"C","explanation":"Nephrotic syndrome: urinary protein loss lowers plasma oncotic pressure; renal edema is generalized and shows first in loose tissue such as the eyelids. A: Increased hydrostatic pressure follows impaired venous return (heart failure, venous obstruction). B: Lymphatic obstruction is inflammatory, neoplastic, post-surgical, or post-irradiation. D: Increased permeability is inflammatory. E: Arteriolar dilation (e.g., heat) raises hydrostatic pressure; not the cause here.","source_slide":"L07 Edema and Congestion, slides 5, 11, 17"},{"id":"FND-PATH-L07-02","block":"Foundations","lecture":"L07 Edema and Congestion","discipline":"Pathology","style":"LAU","stem":"A pleural fluid sample has high protein content and many inflammatory cells. Which mechanism most likely produced it?","options":{"A":"Decreased oncotic pressure","B":"Increased hydrostatic pressure from heart failure","C":"Sodium retention","D":"Hypoalbuminemia from cirrhosis","E":"Increased capillary permeability"},"answer":"E","explanation":"Protein-rich inflammatory fluid is an exudate from increased permeability. A: Low oncotic pressure gives a transudate. B: Heart failure gives a transudate. C: Sodium retention gives a transudate. D: Cirrhosis gives a transudate.","source_slide":"L07 Edema and Congestion, slides 14–15"},{"id":"FND-PATH-L07-03","block":"Foundations","lecture":"L07 Edema and Congestion","discipline":"Pathology","style":"LAU","stem":"A patient with long-standing right heart failure has a liver with a mottled red and tan cut surface. Microscopy shows centrilobular necrosis and hemorrhage with preserved portal tracts. What is this?","options":{"A":"Chronic passive congestion","B":"Hepatic steatosis","C":"Cirrhosis from hepatitis","D":"Coagulative infarct","E":"Hemochromatosis"},"answer":"A","explanation":"\"Nutmeg liver\": venous congestion damages the zone farthest from the blood supply (centrilobular). B: Steatosis is fat accumulation. C: Hepatitis cirrhosis has nodules and fibrous septa. D: Liver infarcts are rare (dual supply). E: Hemochromatosis is iron deposition.","source_slide":"L07 Edema and Congestion, slide 23"},{"id":"FND-PATH-L07-04","block":"Foundations","lecture":"L07 Edema and Congestion","discipline":"Pathology","style":"LAU","stem":"An organ is engorged with blood and has a blue-red (cyanotic) color. Which mechanism and type of blood fit best?","options":{"A":"Arteriolar dilation; oxygenated blood","B":"Impaired venous outflow; deoxygenated blood","C":"Impaired venous outflow; oxygenated blood","D":"Arteriolar dilation; deoxygenated blood","E":"Lymphatic blockage; protein-rich fluid"},"answer":"B","explanation":"Congestion is passive: impaired venous outflow fills the organ with deoxygenated blood, giving a blue-red color. A: Active hyperemia (exercise, inflammation) makes tissue red with oxygenated blood. C: Stagnant venous blood is deoxygenated. D: Arteriolar dilation brings in oxygenated blood. E: Lymphatic blockage causes edema, not blood engorgement.","source_slide":"L07 Edema and Congestion, slides 21, 28"},{"id":"FND-PATH-L07-05","block":"Foundations","lecture":"L07 Edema and Congestion","discipline":"Pathology","style":"Step1","stem":"A 68-year-old with chronic left heart failure has sputum containing macrophages with golden-brown cytoplasmic granules that stain with Prussian blue. What are these cells?","options":{"A":"Lipid-laden foam cells","B":"Carbon-laden (anthracotic) macrophages","C":"Langhans giant cells","D":"Hemosiderin-laden macrophages","E":"Reed–Sternberg cells"},"answer":"D","explanation":"Chronic pulmonary congestion ruptures capillaries; alveolar macrophages phagocytose RBCs and store iron as hemosiderin. A: Foam cells contain lipid. B: Anthracotic macrophages contain black carbon (Prussian blue negative). C: Langhans cells are granuloma giant cells. E: Reed–Sternberg cells are Hodgkin lymphoma.","source_slide":"L07 Edema and Congestion, slide 25"},{"id":"FND-PATH-L07-06","block":"Foundations","lecture":"L07 Edema and Congestion","discipline":"Pathology","style":"LAU","stem":"Six months after mastectomy with axillary lymph node dissection and radiation, a woman develops persistent swelling of the arm on the same side. What is the mechanism?","options":{"A":"Increased hydrostatic pressure","B":"Decreased plasma oncotic pressure","C":"Sodium retention","D":"Increased capillary permeability","E":"Blockage of lymphatics"},"answer":"E","explanation":"Post-surgical and post-irradiation lymphatic blockage causes lymphedema. A: Hydrostatic causes are impaired venous return (heart failure, venous obstruction) or arteriolar dilation. B: Low oncotic pressure follows hypoproteinemia (nephrotic syndrome, cirrhosis, malnutrition). C: Sodium retention is renal and causes generalized edema. D: Increased permeability is inflammatory.","source_slide":"L07 Edema and Congestion, slides 4, 8, 12"},{"id":"FND-PATH-L07-07","block":"Foundations","lecture":"L07 Edema and Congestion","discipline":"Pathology","style":"Step1","stem":"A 70-year-old with congestive heart failure has worsening leg edema. Besides raised venous pressure, which additional mechanism, triggered by reduced renal perfusion, worsens the edema?","options":{"A":"Lymphatic blockage from venous congestion","B":"Low oncotic pressure from urinary albumin loss","C":"Sodium retention via renin–angiotensin–aldosterone","D":"Increased capillary permeability from inflammation","E":"Arteriolar dilation from neurohormonal signals"},"answer":"C","explanation":"Heart failure lowers renal perfusion, activating renin–angiotensin–aldosterone and increasing tubular sodium (and water) reabsorption. A: Lymphatic blockage is inflammatory, neoplastic, post-surgical, or post-irradiation. B: Urinary protein loss is nephrotic syndrome. D: Increased permeability is inflammatory. E: Arteriolar dilation is not the renal mechanism.","source_slide":"L07 Edema and Congestion, slides 10, 13"},{"id":"FND-PATH-L08-01","block":"Foundations","lecture":"L08 Hemorrhage and Infarction","discipline":"Pathology","style":"LAU","stem":"A 12-year-old boy has sudden scrotal pain. At surgery the testis is twisted, dark red, and swollen. Why is the infarct hemorrhagic?","options":{"A":"Arterial occlusion in an end-arterial organ","B":"Septic embolus to the testicular artery","C":"Liquefactive necrosis of the testis","D":"Venous obstruction with ongoing arterial inflow","E":"Thrombosis of the testicular artery"},"answer":"D","explanation":"Torsion first compresses thin-walled veins; arterial inflow continues → blood pools → red infarct. A: End-arterial arterial occlusion gives white infarcts. B: No sign of infection; an arterial embolus would give a white infarct. C: Liquefactive necrosis is typical of brain/abscess, not a cause of hemorrhage. E: Arterial thrombosis in a solid organ gives a white infarct.","source_slide":"L08 Hemorrhage and Infarction, notes p5–6"},{"id":"FND-PATH-L08-02","block":"Foundations","lecture":"L08 Hemorrhage and Infarction","discipline":"Pathology","style":"LAU","stem":"Which organ most typically develops a pale (white), wedge-shaped infarct after arterial embolism?","options":{"A":"Kidney","B":"Lung","C":"Small intestine","D":"Ovary","E":"Brain"},"answer":"A","explanation":"Solid organs with end-arterial supply (kidney, spleen, heart) form white infarcts. B: Lung has dual supply → red infarcts. C: Small intestine has dual supply → red. D: Ovary infarcts are venous (torsion) → red. E: Brain infarcts become liquefactive.","source_slide":"L08 Hemorrhage and Infarction, notes p6–8"},{"id":"FND-PATH-L08-03","block":"Foundations","lecture":"L08 Hemorrhage and Infarction","discipline":"Pathology","style":"LAU","stem":"A patient with severe thrombocytopenia has many 1–2 mm red spots on the skin of the legs. What are these lesions?","options":{"A":"Purpura","B":"Ecchymoses","C":"Hematomas","D":"Telangiectasias","E":"Petechiae"},"answer":"E","explanation":"Pinpoint 1–2 mm hemorrhages are petechiae. A: Purpura are 3–10 mm. B: Ecchymoses are > 1 cm bruises. C: Hematomas are localized collections within tissue. D: Telangiectasias are dilated vessels, not hemorrhages.","source_slide":"L08 Hemorrhage and Infarction, notes p2–3"},{"id":"FND-PATH-L08-04","block":"Foundations","lecture":"L08 Hemorrhage and Infarction","discipline":"Pathology","style":"LAU","stem":"A 55-year-old has black, tarry stools for 3 days. What is the most likely bleeding site?","options":{"A":"Sigmoid colon","B":"Duodenum","C":"Rectum","D":"Anal canal","E":"Descending colon"},"answer":"B","explanation":"Melena = partially digested blood, usually from an upper GI source such as a duodenal ulcer. A: Sigmoid → hematochezia. C: Rectum → hematochezia. D: Anal canal → bright red blood. E: Left colon bleeding → hematochezia.","source_slide":"L08 Hemorrhage and Infarction, notes p4"},{"id":"FND-PATH-L08-05","block":"Foundations","lecture":"L08 Hemorrhage and Infarction","discipline":"Pathology","style":"Step1","stem":"A 60-year-old with atrial fibrillation dies suddenly 6 hours after a large embolic occlusion of a coronary artery. At autopsy, microscopy of the territory shows no definite necrosis. What best explains this?","options":{"A":"The occlusion was not hemodynamically significant","B":"Dual blood supply protected the myocardium","C":"Necrosis isn't yet visible microscopically","D":"Myocytes regenerated after the occlusion","E":"Liquefactive necrosis had dissolved the cells"},"answer":"C","explanation":"Histologic evidence of necrosis lags; death within ~12–18 h may show only congestion or pallor. A: A large occlusion is significant. B: The heart has end-arterial coronary supply. D: Myocytes don't regenerate. E: Myocardium undergoes coagulative necrosis.","source_slide":"L08 Hemorrhage and Infarction, notes p8"},{"id":"FND-PATH-L08-06","block":"Foundations","lecture":"L08 Hemorrhage and Infarction","discipline":"Pathology","style":"LAU","stem":"Two patients have complete occlusion of the same coronary branch. In patient 1 it developed slowly over years; in patient 2 it occurred suddenly from an embolus. Only patient 2 has a large infarct. What best explains the difference?","options":{"A":"Patient 1 has a dual coronary blood supply","B":"Collaterals had time to enlarge in patient 1","C":"Patient 2's myocytes are more hypoxia-sensitive","D":"Venous outflow was obstructed in patient 2","E":"Patient 1's myocytes regenerated"},"answer":"B","explanation":"Slow narrowing allows time for collateral vessels to enlarge; sudden occlusion leaves little time to compensate. A: The heart is an end-arterial organ in both. C: Both have the same tissue type. D: Embolism is arterial, not venous. E: Myocytes don't regenerate enough to prevent infarction.","source_slide":"L08 Hemorrhage and Infarction, notes p13"},{"id":"FND-PATH-L08-07","block":"Foundations","lecture":"L08 Hemorrhage and Infarction","discipline":"Pathology","style":"LAU","stem":"A bruise on the thigh changes from red-blue to green over several days. Which pigment produces the green color?","options":{"A":"Bilirubin","B":"Hemosiderin","C":"Hemoglobin","D":"Biliverdin","E":"Lipofuscin"},"answer":"D","explanation":"Ecchymosis colors follow hemoglobin breakdown: red-blue/purple, then green (biliverdin), then yellow-brown (bilirubin and hemosiderin). A: Bilirubin gives yellow-brown later. B: Hemosiderin contributes to the late yellow-brown. C: Hemoglobin gives the initial red-blue. E: Lipofuscin is a wear-and-tear pigment, unrelated.","source_slide":"L08 Hemorrhage and Infarction, notes p3"},{"id":"FND-PHARM-L01-01","block":"Foundations","lecture":"L01 Intro to Pharmacology","discipline":"Pharmacology","style":"LAU","stem":"A researcher measures how quickly an oral drug reaches its peak plasma concentration and how long the kidneys take to clear it. Which field is being studied?","options":{"A":"Pharmacodynamics","B":"Pharmacogenomics","C":"Pharmacoepidemiology","D":"Pharmacokinetics","E":"Pharmaceutics"},"answer":"D","explanation":"Absorption and excretion are what the body does to the drug: pharmacokinetics (ADME). A: Pharmacodynamics is what the drug does to the body. B: Pharmacogenomics is how genes change response or dose. C: Pharmacoepidemiology is drug behavior across populations. E: Pharmaceutics is drug formulation and delivery.","source_slide":"L01 Intro to Pharmacology, slides 5–6"},{"id":"FND-PHARM-L01-02","block":"Foundations","lecture":"L01 Intro to Pharmacology","discipline":"Pharmacology","style":"LAU","stem":"Which statement best describes how pharmacokinetics and pharmacodynamics relate to each other?","options":{"A":"Pharmacokinetics sets the drug concentration at the site of action; pharmacodynamics translates that concentration into an effect","B":"Pharmacodynamics sets the drug concentration at the site of action; pharmacokinetics translates it into an effect","C":"Both describe what the body does to the drug","D":"Pharmacokinetics describes receptor binding; pharmacodynamics describes drug excretion","E":"Both describe what the drug does to the body"},"answer":"A","explanation":"PK (body → drug) determines the concentration available at the site of action; PD (drug → body) turns that concentration into effect. B: Reverses the two. C: Only PK is what the body does to the drug; PD is the reverse. D: Receptor binding is PD and excretion is PK. E: Only PD is what the drug does to the body; PK is the reverse.","source_slide":"L01 Intro to Pharmacology, slide 5"},{"id":"FND-PHARM-L01-03","block":"Foundations","lecture":"L01 Intro to Pharmacology","discipline":"Pharmacology","style":"LAU","stem":"A patient needs a much lower dose of a drug than most patients because of an inherited variant in the gene for the enzyme that inactivates it. Which discipline best explains this?","options":{"A":"Pharmacoepidemiology","B":"Pharmaceutics","C":"Toxicology","D":"Pharmacoeconomics","E":"Pharmacogenomics"},"answer":"E","explanation":"Pharmacogenomics explains why a patient's DNA changes their dose. A: Pharmacoepidemiology looks at drug behavior across whole populations, not one patient's genotype. B: Pharmaceutics is formulation and delivery. C: Toxicology is detecting and treating poisoning. D: Pharmacoeconomics asks whether a drug is worth its cost.","source_slide":"L01 Intro to Pharmacology, slide 6"},{"id":"FND-PHARM-L01-04","block":"Foundations","lecture":"L01 Intro to Pharmacology","discipline":"Pharmacology","style":"LAU","stem":"A health ministry compares the price and health outcomes of two antihypertensives to decide which one to reimburse. Which discipline does this analysis belong to?","options":{"A":"Pharmacoepidemiology","B":"Pharmacy","C":"Pharmacoeconomics","D":"Pharmaceutics","E":"Pharmacodynamics"},"answer":"C","explanation":"Pharmacoeconomics asks whether a drug is worth what it costs. A: Pharmacoepidemiology describes how drugs behave across populations, not cost. B: Pharmacy is preparing, verifying and dispensing drugs. D: Pharmaceutics is formulation and delivery. E: Pharmacodynamics is the drug's effect on the body.","source_slide":"L01 Intro to Pharmacology, slide 6"},{"id":"FND-PHARM-L01-05","block":"Foundations","lecture":"L01 Intro to Pharmacology","discipline":"Pharmacology","style":"LAU","stem":"Which historical event most directly led to mandatory teratogenicity testing before drug approval?","options":{"A":"Withering's study of foxglove for dropsy","B":"The thalidomide disaster","C":"The compilation of the Ebers Papyrus","D":"The isolation of aspirin's active compound from willow bark","E":"Medicinal cultivation of the opium poppy in Sumer"},"answer":"B","explanation":"Thalidomide, given for morning sickness without fetal testing, caused severe limb malformations; mandatory trial phases, teratogenicity testing and informed consent laws followed. A: Withering established systematic dose testing, not teratogenicity rules. C: The Ebers Papyrus is an ancient list of remedies. D: Willow bark is the origin of aspirin, unrelated to fetal safety rules. E: Opium use in Sumer is ancient history with no regulatory consequence.","source_slide":"L01 Intro to Pharmacology, slide 10"},{"id":"FND-PHARM-L01-06","block":"Foundations","lecture":"L01 Intro to Pharmacology","discipline":"Pharmacology","style":"LAU","stem":"William Withering's lasting contribution to pharmacology was best described as:","options":{"A":"The first chemical synthesis of a drug","B":"Creating the first national drug-approval agency","C":"Describing the first drug receptor","D":"Systematic dose testing in patients with recorded outcomes","E":"Introducing informed consent for clinical trials"},"answer":"D","explanation":"Withering spent nearly a decade testing foxglove doses on patients, recording benefit and harm: observe, dose, record, adjust. A: He identified a plant ingredient; he didn't synthesize a drug. B: Drug agencies came later. C: Receptor theory is unrelated to his work. E: Informed consent laws followed thalidomide in the 1960s.","source_slide":"L01 Intro to Pharmacology, slide 9"},{"id":"FND-PHARM-L01-07","block":"Foundations","lecture":"L01 Intro to Pharmacology","discipline":"Pharmacology","style":"Step1","stem":"A newborn has severely shortened limbs with the hands attached close to the shoulders. Early in pregnancy, the mother took a sedative prescribed abroad for nausea. The same drug is now used to treat multiple myeloma. Which drug is it?","options":{"A":"Isotretinoin","B":"Valproate","C":"Thalidomide","D":"Warfarin","E":"Lithium"},"answer":"C","explanation":"Thalidomide, marketed as a sedative for morning sickness, caused severe limb malformations (phocomelia); its current use in multiple myeloma is on the drug-development lecture (L14) slides. The other teratogens below are outside the slides (standard Step 1 facts). A: Isotretinoin causes craniofacial, CNS and cardiac defects. B: Valproate causes neural tube defects. D: Warfarin causes nasal hypoplasia and stippled epiphyses. E: Lithium causes Ebstein anomaly.","source_slide":"L01 Intro to Pharmacology, slide 10"},{"id":"FND-PHARM-L02-01","block":"Foundations","lecture":"L02 Safe Prescriber","discipline":"Pharmacology","style":"LAU","stem":"Drug X produces 50% of its effect at 1 mg and plateaus at 60% of the maximal tissue response. Drug Y produces 50% of its effect at 10 mg and plateaus at 100%. Which statement is correct?","options":{"A":"X is more potent and more efficacious","B":"X is more potent; Y is more efficacious","C":"Y is more potent; X is more efficacious","D":"Y is more potent and more efficacious","E":"The two drugs have equal efficacy"},"answer":"B","explanation":"Potency = the dose needed for an effect (X needs less, so it's more potent); efficacy = the maximal effect regardless of dose (Y reaches the higher plateau). A: X's plateau is lower, so it's less efficacious. C: Reverses both properties. D: Y needs a 10× higher dose, so it's less potent. E: The plateaus differ (60% vs 100%).","source_slide":"L02 Safe Prescriber, slides 12–13"},{"id":"FND-PHARM-L02-02","block":"Foundations","lecture":"L02 Safe Prescriber","discipline":"Pharmacology","style":"LAU","stem":"Propranolol, a beta-blocker, blunts the heart's response to a beta-agonist but triggers no receptor response on its own. In terms of the two receptor properties, propranolol has:","options":{"A":"Affinity and full intrinsic activity","B":"Affinity and partial intrinsic activity","C":"Intrinsic activity but no affinity","D":"Neither affinity nor intrinsic activity","E":"Affinity but no intrinsic activity"},"answer":"E","explanation":"An antagonist has affinity (it binds, so it can block the agonist) but no intrinsic activity (binding triggers nothing). A: Affinity plus full intrinsic activity is a full agonist (e.g., beta-agonists). B: Partial intrinsic activity is a partial agonist, which would itself produce a submaximal response. C: A drug can't trigger a response without binding first. D: Without affinity it couldn't occupy the receptor and block the agonist.","source_slide":"L02 Safe Prescriber, slide 10"},{"id":"FND-PHARM-L02-03","block":"Foundations","lecture":"L02 Safe Prescriber","discipline":"Pharmacology","style":"LAU","stem":"A new antihypertensive lowers blood pressure markedly in a tightly controlled randomized trial. In routine clinics, its effect is much smaller because patients skip doses and have multiple comorbidities. Which pair of terms describes the trial result and the clinic result?","options":{"A":"Efficacy; effectiveness","B":"Potency; efficacy","C":"Effectiveness; efficacy","D":"Efficacy; cost-effectiveness","E":"Affinity; intrinsic activity"},"answer":"A","explanation":"Efficacy = whether a drug can work under ideal trial conditions; effectiveness = whether it does work in the real world. B: Potency is the dose needed for an effect, not trial vs real-world performance. C: Reverses the two. D: Cost-effectiveness is value for money (e.g., QALYs). E: Affinity and intrinsic activity are receptor properties.","source_slide":"L02 Safe Prescriber, slide 8"},{"id":"FND-PHARM-L02-04","block":"Foundations","lecture":"L02 Safe Prescriber","discipline":"Pharmacology","style":"LAU","stem":"In the 7-step therapeutic plan, a physician has just chosen the optimal plan for a 70-year-old woman with pneumonia. Which step comes next?","options":{"A":"Problem identification","B":"Desired outcome","C":"Outcome evaluation","D":"Therapeutic alternatives","E":"Therapeutic tools"},"answer":"C","explanation":"The order is problem identification → desired outcome → therapeutic tools → therapeutic alternatives → optimal plan → outcome evaluation → patient education. A: Step 1. B: Step 2. D: Step 4, before the plan is chosen. E: Step 3.","source_slide":"L02 Safe Prescriber, slide 6"},{"id":"FND-PHARM-L02-05","block":"Foundations","lecture":"L02 Safe Prescriber","discipline":"Pharmacology","style":"LAU","stem":"A partial agonist is given at a concentration high enough to occupy all of its receptors. Which response is expected?","options":{"A":"Zero response, because it blocks the receptor","B":"The full maximal response (100% Emax)","C":"A response above the full agonist's Emax","D":"A submaximal response, below the full agonist's Emax","E":"A full response, but only at a higher dose than the full agonist"},"answer":"D","explanation":"Partial agonists can't achieve full Emax even at saturating concentrations. A: Zero response at full occupancy describes an antagonist. B: 100% Emax is a full agonist. C: No agonist exceeds the system's maximal response. E: Needing a higher dose for the same maximum describes lower potency, not partial agonism.","source_slide":"L02 Safe Prescriber, slide 11"},{"id":"FND-PHARM-L02-06","block":"Foundations","lecture":"L02 Safe Prescriber","discipline":"Pharmacology","style":"LAU","stem":"Drug P is a partial agonist and drug F a full agonist at the same receptor. Both produce half of their own maximal effect at 1 mg. Which statement is correct?","options":{"A":"P and F are equally potent, but P is less efficacious","B":"P is less potent and less efficacious than F","C":"P and F are equally efficacious, but P is less potent","D":"P is more potent than F because it reaches its plateau sooner","E":"P has no intrinsic activity, so it is an antagonist"},"answer":"A","explanation":"Potency is about the dose needed (same here); efficacy is the maximal effect, and a partial agonist can't reach full Emax even at saturating concentrations, yet it may appear equally potent. B: Equal doses for half-maximal effect mean equal potency. C: Reverses the two properties. D: Potency is judged by the dose for a given effect, not by when a lower plateau is reached. E: A partial agonist has some intrinsic activity; an antagonist has none.","source_slide":"L02 Safe Prescriber, slides 11–12"},{"id":"FND-PHARM-L02-07","block":"Foundations","lecture":"L02 Safe Prescriber","discipline":"Pharmacology","style":"Step1","stem":"A 60-year-old man's blood pressure falls from 160/100 to 135/85 mmHg on metoprolol, a beta-blocker. A classmate says metoprolol has \"0% efficacy\" at the β-receptor. What best reconciles the two?","options":{"A":"Metoprolol is a partial agonist with about 55% relative Emax","B":"Metoprolol has no affinity for β-receptors; its effect isn't receptor-mediated","C":"Zero molecular efficacy, yet clinically effective by blocking the receptor","D":"It is efficacious only in trials; clinic results reflect effectiveness","E":"It is highly potent, and potency replaces the need for efficacy"},"answer":"C","explanation":"An antagonist has 0% relative Emax at the molecular level but still \"works\" clinically; clinical and molecular definitions of efficacy differ. A: A partial agonist would itself stimulate the receptor; beta-blockers are antagonists. B: Antagonists have affinity; that's how they block. D: Efficacy vs effectiveness is about trial vs real-world conditions, not molecular vs clinical efficacy. E: Potency is the dose needed for an effect and doesn't explain zero intrinsic activity.","source_slide":"L02 Safe Prescriber, slides 10–11"},{"id":"FND-PHARM-L03-01","block":"Foundations","lecture":"L03 PK I Absorption","discipline":"Pharmacology","style":"LAU","stem":"A weak acid drug with a pKa of 4.4 is in gastric juice at pH 1.4. What is the approximate ratio of unionized to ionized drug?","options":{"A":"1 : 1000","B":"100 : 1","C":"1000 : 1","D":"3 : 1","E":"1 : 1"},"answer":"C","explanation":"pKa − pH = 4.4 − 1.4 = 3 = log(HA/A⁻), so HA : A⁻ = 10³ : 1. When pH < pKa, a weak acid is mostly unionized. A: Inverts the ratio; that would apply to a weak base, or to an acid at pH 7.4. B: A difference of 3 log units is 1000, not 100. D: Subtracting the values without taking the antilog. E: 1 : 1 only when pH = pKa.","source_slide":"L03 PK I Absorption, slides 10–15"},{"id":"FND-PHARM-L03-02","block":"Foundations","lecture":"L03 PK I Absorption","discipline":"Pharmacology","style":"LAU","stem":"A patient arrives after an overdose of phenobarbital, a weak acid that is renally excreted. Which intervention will most increase its urinary elimination?","options":{"A":"Ammonium chloride to acidify the urine","B":"Oral metoclopramide","C":"Fluid restriction","D":"Oral calcium carbonate","E":"IV sodium bicarbonate to alkalinize the urine"},"answer":"E","explanation":"Alkaline urine ionizes a weak acid, so it can't be reabsorbed across the tubule (ion trapping) and is excreted. A: Acidifying the urine keeps weak acids unionized → more reabsorption, less elimination. B: Metoclopramide speeds gastric emptying; it doesn't affect renal elimination. C: Fluid restriction lowers urine flow. D: Calcium carbonate acts in the gut and doesn't meaningfully trap the drug in urine.","source_slide":"L03 PK I Absorption, slides 18, 31"},{"id":"FND-PHARM-L03-03","block":"Foundations","lecture":"L03 PK I Absorption","discipline":"Pharmacology","style":"LAU","stem":"An oral drug has a bioavailability (F) of 20% and a hepatic extraction ratio (ER) of 0.75. What fraction of the dose is absorbed from the gut (f)?","options":{"A":"15%","B":"80%","C":"25%","D":"5%","E":"27%"},"answer":"B","explanation":"F = f × (1 − ER) → 0.20 = f × 0.25 → f = 0.80. A: 0.20 × 0.75 multiplies F by ER, the wrong operation. C: 25% is (1 − ER), not f. D: 0.20 × 0.25 multiplies by (1 − ER) instead of dividing. E: Divides F by ER instead of by (1 − ER).","source_slide":"L03 PK I Absorption, slides 46–47"},{"id":"FND-PHARM-L03-04","block":"Foundations","lecture":"L03 PK I Absorption","discipline":"Pharmacology","style":"LAU","stem":"Which feature distinguishes active transport from facilitated diffusion?","options":{"A":"It can move drug against its concentration gradient using energy","B":"It requires a carrier protein","C":"It shows saturation kinetics","D":"It is used by glucose and amino acids","E":"It occurs at the blood–brain barrier"},"answer":"A","explanation":"Active transport uses energy (ATP) and doesn't need a concentration gradient; facilitated diffusion moves only down the gradient with no energy. B: Both are carrier-mediated. C: Both are saturable. D: Glucose and amino acids are the lecture's examples of facilitated diffusion. E: Carrier-mediated transport of both kinds occurs at the BBB.","source_slide":"L03 PK I Absorption, slides 34–36"},{"id":"FND-PHARM-L03-05","block":"Foundations","lecture":"L03 PK I Absorption","discipline":"Pharmacology","style":"LAU","stem":"A patient has an acute angina attack. Oral nitroglycerin has a bioavailability of only ~10% because of first-pass metabolism. Which route gives the fastest effective relief?","options":{"A":"Oral sustained-release tablet","B":"Transdermal patch","C":"Sublingual tablet","D":"Enteric-coated oral tablet","E":"Oral tablet taken with food"},"answer":"C","explanation":"Sublingual absorption drains into the systemic circulation, bypassing the liver, and nitroglycerin acts within 2–3 minutes. B: Transdermal also avoids first pass, but absorption is very slow; patches are for prevention, not acute attacks. A, D, E: All oral forms pass through the portal circulation, so ~90% is destroyed before reaching the systemic circulation; SR and enteric coating also delay onset.","source_slide":"L03 PK I Absorption, slides 43, 49, 71"},{"id":"FND-PHARM-L03-06","block":"Foundations","lecture":"L03 PK I Absorption","discipline":"Pharmacology","style":"LAU","stem":"An 82-year-old starts an oral drug that normally undergoes extensive first-pass metabolism. Compared with a young adult, how is the oral bioavailability likely to change?","options":{"A":"Decreased, because gastric emptying is faster","B":"Increased, because first-pass metabolism is reduced","C":"Decreased, because gastric acid is increased","D":"Unchanged, because first-pass metabolism doesn't change with age","E":"Decreased, because slower GI motility shortens absorption time"},"answer":"B","explanation":"In the elderly ↓ first-pass metabolism → ↑ bioavailability. A: GI motility is decreased in the elderly, not faster. C: Gastric acid is decreased in the elderly, not increased. D: First-pass metabolism declines with age. E: Slower motility lengthens absorption time.","source_slide":"L03 PK I Absorption, slide 69"},{"id":"FND-PHARM-L03-07","block":"Foundations","lecture":"L03 PK I Absorption","discipline":"Pharmacology","style":"LAU","stem":"A 72-year-old woman takes levothyroxine with breakfast together with her calcium supplement. After 3 months she is still hypothyroid. What is the best advice?","options":{"A":"Double the levothyroxine dose and keep the same timing","B":"Take it with the largest meal of the day instead","C":"Crush the tablet and take it with a glass of milk","D":"Take it fasting, 30 min before breakfast, apart from calcium","E":"Replace the calcium supplement with an antacid at breakfast"},"answer":"D","explanation":"Food and calcium reduce levothyroxine absorption; timing and separation fix the problem. A medication failure is often an absorption or interaction issue, not the drug. A: Raising the dose ignores the interaction. B: More food further reduces absorption. C: Milk adds calcium. E: Antacids also bind and reduce absorption.","source_slide":"L03 PK I Absorption, slides 5, 68"},{"id":"FND-PHARM-L03-08","block":"Foundations","lecture":"L03 PK I Absorption","discipline":"Pharmacology","style":"Step1","stem":"A 16-year-old with acne has no improvement after 2 months of oral doxycycline. She takes each dose with a glass of milk and an antacid for stomach upset. What best explains the treatment failure?","options":{"A":"Chelation of the drug by divalent cations, reducing absorption","B":"Induction of CYP3A4 by calcium","C":"Increased P-glycoprotein expression in enterocytes","D":"Increased plasma protein binding of the drug","E":"Bacterial resistance due to efflux pumps"},"answer":"A","explanation":"Tetracyclines (and fluoroquinolones) bind Ca²⁺, Mg²⁺, Al³⁺ and Fe²⁺ in the gut, forming poorly absorbed chelates. B: Calcium doesn't induce CYP3A4. C: No P-gp induction occurs here. D: Milk doesn't change plasma protein binding. E: Resistance is possible but doesn't explain the clear interaction with milk and antacids.","source_slide":"L03 PK I Absorption, slides 65, 68"},{"id":"FND-PHARM-L03-09","block":"Foundations","lecture":"L03 PK I Absorption","discipline":"Pharmacology","style":"Step1","stem":"A 58-year-old man with cirrhosis and large portosystemic collaterals develops marked toxicity from his usual oral dose of a drug with a high hepatic extraction ratio. The IV dose has never caused problems. What best explains this?","options":{"A":"Reduced gut absorption from bowel-wall edema","B":"Increased renal clearance","C":"Induction of hepatic enzymes","D":"Decreased gastric emptying","E":"Increased oral bioavailability because portal blood bypasses the liver"},"answer":"E","explanation":"Shunting lets absorbed drug skip first-pass extraction, so oral F rises sharply while the IV dose (no first pass) is unaffected. A: Reduced absorption would lower levels. B: Increased renal clearance would lower levels. C: Enzyme induction would lower levels. D: Slower emptying delays absorption but doesn't raise total exposure this much.","source_slide":"L03 PK I Absorption, slides 43–47"},{"id":"FND-PHARM-L03-10","block":"Foundations","lecture":"L03 PK I Absorption","discipline":"Pharmacology","style":"LAU","stem":"A patient needs a faster onset from an oral analgesic tablet. Which co-administered factor would most speed its delivery to the duodenum for absorption?","options":{"A":"Metoclopramide","B":"An anticholinergic drug","C":"Morphine","D":"A hot drink","E":"Intensive exercise"},"answer":"A","explanation":"Metoclopramide accelerates gastric emptying, delivering the drug sooner to the upper small intestine, the main absorption site. B: Anticholinergics slow gastric emptying. C: Morphine slows gastric emptying. D: Hot drinks slow emptying; cold drinks speed it. E: Intensive exercise slows emptying; moderate exercise speeds it.","source_slide":"L03 PK I Absorption, slides 61, 63"},{"id":"FND-PHARM-L04-01","block":"Foundations","lecture":"L04 PK II Distribution","discipline":"Pharmacology","style":"LAU","stem":"A 60-kg patient receives 600 mg of a drug as an IV bolus. The extrapolated plasma concentration at time zero is 20 mg/L. Where is this drug most likely distributed?","options":{"A":"Plasma only","B":"Extracellular fluid only","C":"Total body water","D":"Concentrated in tissues far beyond body water","E":"Bound almost entirely to plasma albumin"},"answer":"C","explanation":"Vd = 600 mg / 20 mg/L = 30 L = 0.5 L/kg, close to total body water (~0.55 L/kg). A: Plasma is ~0.05 L/kg. B: ECF is ~0.2 L/kg. D: Tissue concentration gives Vd > ~1 L/kg. E: Extensive albumin binding keeps Vd near plasma volume.","source_slide":"L04 PK II Distribution, slides 24, 33, 38"},{"id":"FND-PHARM-L04-02","block":"Foundations","lecture":"L04 PK II Distribution","discipline":"Pharmacology","style":"LAU","stem":"A patient stable on phenytoin (a weak acid, highly bound to albumin) develops severe hepatic disease with low serum albumin. The total phenytoin level is unchanged. What is the main risk?","options":{"A":"Subtherapeutic effect from increased binding","B":"Toxicity from an increased free fraction","C":"Reduced absorption from the gut","D":"Reduced brain penetration","E":"No change, because total levels are normal"},"answer":"B","explanation":"Low albumin → fewer binding sites → more free (active) drug even at the same total level. A: Binding falls, not rises. C: Protein binding doesn't govern GI absorption. D: More free drug means more is available to cross into tissues. E: The total level hides the rise in free drug.","source_slide":"L04 PK II Distribution, slides 9, 12"},{"id":"FND-PHARM-L04-03","block":"Foundations","lecture":"L04 PK II Distribution","discipline":"Pharmacology","style":"LAU","stem":"A patient on propranolol, a weak base, is admitted with an acute severe illness. How is the free (unbound) fraction of propranolol most likely to change?","options":{"A":"Increase, because albumin synthesis falls","B":"Increase, because α1-acid glycoprotein synthesis falls","C":"Decrease, because albumin synthesis rises","D":"Decrease, because α1-acid glycoprotein synthesis rises","E":"No change, because weak bases don't bind plasma proteins"},"answer":"D","explanation":"Weak bases bind mainly the positively charged α1-acid glycoprotein, whose synthesis increases during an acute insult → more binding, lower free fraction. A: Albumin falls in acute illness but binds mainly weak acids (phenytoin, salicylates). B: α1-acid glycoprotein rises, not falls. C: Albumin falls, and it isn't propranolol's main carrier. E: Weak bases bind α1-acid glycoprotein (e.g., quinidine, propranolol).","source_slide":"L04 PK II Distribution, slide 12"},{"id":"FND-PHARM-L04-04","block":"Foundations","lecture":"L04 PK II Distribution","discipline":"Pharmacology","style":"LAU","stem":"Domperidone, a dopamine antagonist that doesn't cross the blood–brain barrier, still relieves nausea through a central site. What best explains this?","options":{"A":"It is highly lipid-soluble and diffuses through the tight junctions","B":"The chemoreceptor trigger zone lies where the barrier is leaky","C":"P-glycoprotein pumps it into the brain","D":"Brain endothelial MAO and COMT convert it to an active metabolite","E":"Nausea makes the barrier leaky everywhere"},"answer":"B","explanation":"The BBB is leaky at the chemoreceptor trigger zone, so domperidone (and apomorphine) can act there without entering the rest of the brain. A: If it diffused freely it would cross the BBB everywhere. C: P-gp is an efflux pump that keeps drugs out of the brain. D: Endothelial MAO and COMT neutralize drugs; they are part of the barrier. E: Infection, not nausea, is the pathological factor that makes the barrier leakier.","source_slide":"L04 PK II Distribution, slides 17–18"},{"id":"FND-PHARM-L04-05","block":"Foundations","lecture":"L04 PK II Distribution","discipline":"Pharmacology","style":"LAU","stem":"A pregnant woman takes a weakly basic drug. At equilibrium, the fetal plasma concentration of the drug is higher than the maternal concentration. What best explains this?","options":{"A":"Fetal plasma is more alkaline, trapping the ionized base","B":"P-glycoprotein actively pumps the drug into the fetus","C":"The placenta is completely impermeable to acids","D":"Fetal plasma is slightly more acidic, trapping the ionized base","E":"Fetal albumin binds bases more strongly"},"answer":"D","explanation":"In the slightly more acidic fetal plasma, a base becomes more ionized and can't diffuse back (ion trapping). A: Alkaline plasma would keep a base unionized. B: P-gp exports drugs and limits fetal exposure. C: The placenta isn't an absolute barrier. E: Albumin binds mainly acids.","source_slide":"L04 PK II Distribution, slide 21"},{"id":"FND-PHARM-L04-06","block":"Foundations","lecture":"L04 PK II Distribution","discipline":"Pharmacology","style":"LAU","stem":"After an overdose of imipramine (Vd > 10 L/kg), hemodialysis removes very little drug. What best explains this?","options":{"A":"Imipramine is confined to plasma, bound to albumin","B":"Imipramine distributes only in total body water","C":"Most of the drug is concentrated in tissues, so little is in plasma","D":"A large Vd means the drug is eliminated too quickly to need dialysis","E":"Imipramine is a large protein that can't cross dialysis membranes"},"answer":"C","explanation":"A Vd far above total body water (> 1 L/kg) means the drug is concentrated in tissues; only a small fraction is in plasma, where dialysis acts. A: Plasma-confined drugs (heparin, insulin) have Vd ~0.05–0.1 L/kg. B: Total body water corresponds to ~0.55 L/kg (e.g., ethanol). D: Vd describes distribution, not speed of elimination. E: Imipramine is a small lipophilic drug, not a protein.","source_slide":"L04 PK II Distribution, slides 33, 35, 38"},{"id":"FND-PHARM-L04-07","block":"Foundations","lecture":"L04 PK II Distribution","discipline":"Pharmacology","style":"Step1","stem":"A 67-year-old man with decompensated heart failure and marked peripheral edema receives a standard weight-based IV dose of gentamicin, a water-soluble antibiotic. His peak plasma level is lower than expected. Why?","options":{"A":"Decreased Vd from protein binding","B":"Increased hepatic first-pass metabolism","C":"Increased P-glycoprotein efflux in the gut","D":"Faster renal clearance from heart failure","E":"Increased Vd from expanded extracellular water"},"answer":"E","explanation":"Edema expands extracellular water, so a water-soluble drug spreads into a larger apparent Vd → lower peak concentration. A: Gentamicin has low protein binding, and less binding wouldn't lower the peak. B: There is no first pass after IV dosing. C: Gut P-gp is irrelevant to an IV drug. D: Heart failure tends to reduce renal clearance.","source_slide":"L04 PK II Distribution, slide 40"},{"id":"FND-PHARM-L04-08","block":"Foundations","lecture":"L04 PK II Distribution","discipline":"Pharmacology","style":"Step1","stem":"A pilot with allergic rhinitis is switched from diphenhydramine to loratadine and no longer feels drowsy. Which property of loratadine best explains this?","options":{"A":"It doesn't cross the blood–brain barrier well","B":"It is a competitive H2 antagonist","C":"It has much lower plasma protein binding","D":"It is excreted unchanged by the kidney","E":"It has a very small volume of distribution"},"answer":"A","explanation":"Second-generation H1 antihistamines are less lipophilic and are P-gp substrates, so little reaches the CNS; first-generation agents are lipophilic and cross the BBB. B: Loratadine is an H1 antagonist. C: Lower binding would increase free drug and wouldn't explain less sedation. D: The route of excretion doesn't determine CNS entry. E: A small Vd isn't the reason it spares the brain.","source_slide":"L04 PK II Distribution, slides 17–19"},{"id":"FND-PHARM-L04-09","block":"Foundations","lecture":"L04 PK II Distribution","discipline":"Pharmacology","style":"LAU","stem":"In Parkinson disease, the brain needs more dopamine, yet patients are given levodopa (L-DOPA) rather than dopamine. Why?","options":{"A":"Dopamine is too lipid-soluble and stays in body fat","B":"L-DOPA is small enough to diffuse through the BBB tight junctions","C":"L-DOPA enters the brain via LAT1, then becomes dopamine","D":"The BBB is leaky in Parkinson disease, but only for L-DOPA","E":"Dopamine crosses the BBB but is pumped back out by P-glycoprotein"},"answer":"C","explanation":"Dopamine can't cross the BBB; L-DOPA is carried across by the LAT1 transporter and then converted to dopamine inside the brain. A: Dopamine is blocked by the BBB, not trapped in fat. B: L-DOPA needs a transporter; it isn't simple diffusion. D: Infection, not Parkinson disease, is the lecture's example of a leakier barrier. E: Dopamine is simply blocked; the lecture lists it among substances that don't cross.","source_slide":"L04 PK II Distribution, slides 19–20"},{"id":"FND-PHARM-L05-01","block":"Foundations","lecture":"L05 PK III Metabolism","discipline":"Pharmacology","style":"LAU","stem":"A lipid-soluble drug undergoes a phase I reaction followed by glucuronidation. Compared with the parent drug, the final glucuronide conjugate is most likely:","options":{"A":"More lipid-soluble and reabsorbed in the renal tubule","B":"Polar, pharmacologically inactive, and excreted in bile or urine","C":"Chemically reactive and potentially toxic or carcinogenic","D":"More pharmacologically active than the parent drug","E":"Stored in body fat until it is metabolized further"},"answer":"B","explanation":"Phase II conjugates are almost always inactive, highly water-soluble, and excreted in bile (> 300 Da) or urine (< 300 Da). A: Both phases decrease lipid solubility, which limits tubular reabsorption. C: Chemically reactive, possibly toxic products are typical of phase I. D: Active metabolites arise mainly from phase I (e.g., codeine → morphine); phase II products are usually inactive. E: Polar conjugates don't accumulate in fat.","source_slide":"L05 PK III Metabolism, slides 14, 23, 26"},{"id":"FND-PHARM-L05-02","block":"Foundations","lecture":"L05 PK III Metabolism","discipline":"Pharmacology","style":"LAU","stem":"Which reaction is a phase II metabolic reaction?","options":{"A":"Acetylation","B":"Oxidation","C":"Hydrolysis","D":"Reduction","E":"Deamination"},"answer":"A","explanation":"Acetylation is a conjugation (synthetic) reaction, as are glucuronidation, sulfation, methylation, and glutathione/glycine conjugation. B: Oxidation is phase I (functionalization). C: Hydrolysis is phase I. D: Reduction is phase I. E: Deamination is phase I.","source_slide":"L05 PK III Metabolism, slides 10, 13, 24"},{"id":"FND-PHARM-L05-03","block":"Foundations","lecture":"L05 PK III Metabolism","discipline":"Pharmacology","style":"LAU","stem":"A patient stable on warfarin is started on rifampin for tuberculosis. Two weeks later the INR has fallen below target. What is the mechanism?","options":{"A":"Inhibition of warfarin metabolism","B":"Displacement of warfarin from albumin","C":"Reduced intestinal absorption of warfarin","D":"Increased vitamin K synthesis by gut flora","E":"Induction of hepatic enzymes that metabolize warfarin"},"answer":"E","explanation":"Rifampin is a classic inducer: more microsomal enzyme → faster warfarin clearance → lower levels and INR over time. A: Inhibition would raise the INR. B: Displacement would transiently raise free warfarin and the INR. C: Rifampin doesn't meaningfully block warfarin absorption. D: Not the mechanism of this interaction.","source_slide":"L05 PK III Metabolism, slides 27–29"},{"id":"FND-PHARM-L05-04","block":"Foundations","lecture":"L05 PK III Metabolism","discipline":"Pharmacology","style":"LAU","stem":"Grapefruit juice markedly raises blood levels of oral felodipine but not of IV felodipine. What explains the difference?","options":{"A":"Inhibition of hepatic CYP2D6","B":"Induction of renal P-glycoprotein","C":"Displacement from plasma proteins","D":"Inhibition of intestinal CYP3A4","E":"Inhibition of glucuronidation in plasma"},"answer":"D","explanation":"Grapefruit blocks CYP3A4 in the gut wall, so only orally given drug escapes presystemic metabolism. A: The wrong isoform and site. B: Induction of renal P-gp would lower levels, not raise them. C: Protein displacement wouldn't depend on the route. E: Glucuronidation doesn't happen in plasma and isn't the mechanism.","source_slide":"L05 PK III Metabolism, slide 33"},{"id":"FND-PHARM-L05-05","block":"Foundations","lecture":"L05 PK III Metabolism","discipline":"Pharmacology","style":"LAU","stem":"A patient taking lovastatin develops muscle pain a week after starting erythromycin. Which mechanism best explains this?","options":{"A":"Erythromycin induced CYP3A4","B":"Erythromycin inhibited CYP2C9","C":"Erythromycin inhibited CYP2D6","D":"Erythromycin inhibited CYP3A4","E":"Erythromycin inhibited CYP2C19"},"answer":"D","explanation":"Statins are CYP3A4 substrates (\"3A4 SICS\"); erythromycin inhibits their metabolism → ↑ statin levels → muscle toxicity. A: Induction would lower statin levels. B: CYP2C9 handles warfarin, NSAIDs and sulfonylureas. C: CYP2D6 handles codeine, antidepressants, tamoxifen and β-blockers. E: CYP2C19 handles PPIs and phenytoin (and clopidogrel, outside the slides).","source_slide":"L05 PK III Metabolism, slides 19, 31"},{"id":"FND-PHARM-L05-06","block":"Foundations","lecture":"L05 PK III Metabolism","discipline":"Pharmacology","style":"LAU","stem":"An 80-year-old taking diazepam nightly becomes increasingly drowsy over several weeks at the same dose. Which combination of age-related changes best explains this?","options":{"A":"↓ hepatic microsomal activity and ↑ Vd of lipid-soluble drugs","B":"↑ hepatic microsomal activity and ↓ Vd","C":"↑ renal excretion of diazepam","D":"↓ oral absorption of diazepam","E":"↑ phase II conjugation capacity"},"answer":"A","explanation":"Aging reduces microsomal (phase I) activity and increases Vd of lipophilic drugs (more fat), so diazepam accumulates with repeated doses. B: Both changes go the other way. C: Diazepam is lipophilic and not cleared unchanged by the kidney; renal function also declines with age. D: Lower absorption would reduce drowsiness. E: More conjugation would speed clearance.","source_slide":"L05 PK III Metabolism, slide 36"},{"id":"FND-PHARM-L05-07","block":"Foundations","lecture":"L05 PK III Metabolism","discipline":"Pharmacology","style":"Step1","stem":"A 58-year-old man has a coronary stent placed and is discharged on clopidogrel. His primary physician adds omeprazole for dyspepsia. Months later he has stent thrombosis. Which mechanism most likely contributed?","options":{"A":"Omeprazole induced CYP3A4, accelerating clopidogrel clearance","B":"Omeprazole displaced clopidogrel from albumin","C":"Omeprazole raised gastric pH, preventing clopidogrel absorption","D":"Omeprazole inhibited CYP2C19, reducing activation of clopidogrel","E":"Omeprazole blocked the P2Y12 receptor"},"answer":"D","explanation":"Clopidogrel is a prodrug activated by CYP2C19; omeprazole inhibits CYP2C19 → less active metabolite → weaker platelet inhibition. A: Omeprazole isn't a meaningful CYP3A4 inducer here. B: Displacement wouldn't reduce antiplatelet effect long-term. C: The interaction is metabolic, not absorption-based. E: The P2Y12 receptor is clopidogrel's target, not omeprazole's.","source_slide":"L05 PK III Metabolism, slides 17, 30"},{"id":"FND-PHARM-L05-08","block":"Foundations","lecture":"L05 PK III Metabolism","discipline":"Pharmacology","style":"Step1","stem":"A 45-year-old man with chronic heavy alcohol use takes regular therapeutic doses of acetaminophen for a week and develops liver injury. What best explains his susceptibility?","options":{"A":"Alcohol inhibits acetaminophen metabolism, so the parent drug accumulates","B":"Alcohol displaces acetaminophen from albumin","C":"Alcohol increases glucuronidation, making inactive conjugates","D":"Alcohol decreases the Vd of acetaminophen","E":"Alcohol induces microsomal enzymes, increasing toxic NAPQI formation"},"answer":"E","explanation":"Chronic alcohol induces microsomal enzymes; acetaminophen is toxified to NAPQI, so induction increases toxicity (the lecture's alcohol → acetaminophen → liver toxicity example). A: Inhibition by chronic alcohol isn't the mechanism, and the parent drug isn't the hepatotoxin. B: Protein displacement doesn't create a toxic metabolite. C: More inactive conjugates would be protective. D: A Vd change doesn't explain hepatotoxicity.","source_slide":"L05 PK III Metabolism, slides 5, 28–29"},{"id":"FND-PHARM-L05-09","block":"Foundations","lecture":"L05 PK III Metabolism","discipline":"Pharmacology","style":"Step1","stem":"A 50-year-old woman taking fluoxetine, a CYP2D6 inhibitor, gets almost no pain relief from codeine after a dental extraction. What best explains this?","options":{"A":"Fluoxetine induces codeine metabolism to inactive products","B":"Fluoxetine displaces codeine from plasma proteins","C":"Reduced conversion of codeine to morphine, its active metabolite","D":"Codeine accumulates as the parent drug and blocks opioid receptors","E":"Fluoxetine inhibits phase II glucuronidation of codeine"},"answer":"C","explanation":"Codeine is converted by CYP2D6 to morphine, which provides the analgesia; inhibiting CYP2D6 reduces this activation. A: Fluoxetine is an inhibitor, not an inducer. B: Displacement would increase free drug, not reduce its effect. D: Codeine isn't a receptor blocker; higher parent levels don't explain lost analgesia. E: Glucuronidation inactivates drugs; inhibiting it wouldn't reduce activation.","source_slide":"L05 PK III Metabolism, slides 5, 19, 30"},{"id":"FND-PHARM-L05-10","block":"Foundations","lecture":"L05 PK III Metabolism","discipline":"Pharmacology","style":"LAU","stem":"Morphine, which is excreted mainly as a glucuronide, is not used as an analgesic during labor. What is the reason?","options":{"A":"Neonatal enzymes are immature, so morphine is cleared slowly","B":"Neonates have higher CYP3A4 activity, producing toxic metabolites","C":"Morphine is a prodrug activated only in the fetal liver","D":"The placenta metabolizes morphine to an active toxin","E":"Neonatal albumin binds morphine irreversibly"},"answer":"A","explanation":"Several enzymes have low activity in neonates (especially premature ones) and need at least 8 weeks to reach adult levels, so morphine that crosses to the baby isn't cleared. B: Neonatal enzyme activity is lower, not higher. C: Morphine is already active; codeine is the prodrug example. D: The issue is neonatal clearance, not placental toxification. E: Binding isn't the reason given; reduced metabolism is.","source_slide":"L05 PK III Metabolism, slide 35"},{"id":"FND-PHARM-L06-01","block":"Foundations","lecture":"L06 PK IV Elimination","discipline":"Pharmacology","style":"LAU","stem":"A drug's urine concentration is 20 mg/mL, urine flow is 1 mL/min, and plasma concentration is 0.2 mg/mL. What is its renal clearance?","options":{"A":"4 mL/min","B":"0.01 mL/min","C":"20 mL/min","D":"100 mL/min","E":"125 mL/min"},"answer":"D","explanation":"Cx = (Ux × V) / Px = (20 × 1) / 0.2 = 100 mL/min. A: Multiplies Ux × V × Px. B: Inverts the ratio (Px / Ux). C: Ux × V is the excretion rate (mg/min), not a clearance. E: Assumes clearance equals GFR without calculating.","source_slide":"L06 PK IV Elimination, slide 33"},{"id":"FND-PHARM-L06-02","block":"Foundations","lecture":"L06 PK IV Elimination","discipline":"Pharmacology","style":"LAU","stem":"A substance is freely filtered at the glomerulus but completely reabsorbed by the tubules, with no secretion. What is its renal clearance?","options":{"A":"0 mL/min","B":"Equal to GFR (~125 mL/min)","C":"Equal to renal plasma flow","D":"Greater than renal plasma flow","E":"Equal to urine flow"},"answer":"A","explanation":"If everything filtered is reabsorbed, no plasma is cleared of it; glucose is the classic example. B: Clearance = GFR when a substance is filtered with no reabsorption or secretion (e.g., inulin). C: Clearance ≈ RPF needs filtration plus near-complete secretion. D: Renal clearance can't exceed RPF. E: Urine flow isn't a clearance value here.","source_slide":"L06 PK IV Elimination, slide 33"},{"id":"FND-PHARM-L06-03","block":"Foundations","lecture":"L06 PK IV Elimination","discipline":"Pharmacology","style":"LAU","stem":"A patient overdoses on digitoxin, a drug that undergoes extensive enterohepatic recirculation. Which intervention best increases its elimination?","options":{"A":"Alkalinizing the urine with bicarbonate","B":"Giving a β-glucuronidase supplement","C":"Acidifying the urine","D":"Giving a drug that blocks organic cation transporters","E":"Repeated oral activated charcoal or cholestyramine"},"answer":"E","explanation":"Binding agents in the gut trap drug released into bile, interrupting recirculation → ↑ fecal excretion. A: Urine alkalinization targets renally excreted weak acids. B: β-glucuronidase would free more drug for reabsorption and worsen recirculation. C: Acidification doesn't affect biliary recycling. D: Blocking OCTs would, if anything, reduce renal secretion.","source_slide":"L06 PK IV Elimination, slides 10–13"},{"id":"FND-PHARM-L06-04","block":"Foundations","lecture":"L06 PK IV Elimination","discipline":"Pharmacology","style":"LAU","stem":"A drug is 95% bound to plasma albumin. Which renal process can still remove it efficiently and lower its plasma concentration toward zero?","options":{"A":"Glomerular filtration","B":"Active tubular secretion","C":"Passive tubular reabsorption","D":"Filtration through pores in the collecting duct","E":"Diffusion across the glomerular basement membrane"},"answer":"B","explanation":"Carrier-mediated tubular secretion works against the gradient, is the most effective renal elimination mechanism, and can strip drug from plasma. A: Only free drug is filtered, so binding limits filtration (e.g., warfarin). C: Reabsorption returns drug to the blood. D: The collecting duct doesn't filter through pores. E: Albumin-bound drug can't cross the GBM.","source_slide":"L06 PK IV Elimination, slides 17, 27"},{"id":"FND-PHARM-L06-05","block":"Foundations","lecture":"L06 PK IV Elimination","discipline":"Pharmacology","style":"LAU","stem":"Drugs secreted by the same renal tubular carrier can compete with each other. Which pair is most likely to compete for tubular secretion?","options":{"A":"Penicillin and morphine","B":"Methotrexate and amiloride","C":"Penicillin and methotrexate","D":"Morphine and uric acid","E":"Triamterene and aminohippuric acid"},"answer":"C","explanation":"Both are organic anion transporter substrates (PUMA: Penicillin, Uric acid, Methotrexate, Aminohippuric acid). A: Morphine uses organic cation transporters (MATH). B: Amiloride is an OCT substrate. D: Morphine is OCT; uric acid is OAT. E: Triamterene is OCT; aminohippuric acid is OAT.","source_slide":"L06 PK IV Elimination, slides 27–28"},{"id":"FND-PHARM-L06-06","block":"Foundations","lecture":"L06 PK IV Elimination","discipline":"Pharmacology","style":"LAU","stem":"A drug has a total body clearance of 600 mL/min and a renal clearance of 150 mL/min. What is its nonrenal clearance?","options":{"A":"450 mL/min","B":"150 mL/min","C":"600 mL/min","D":"750 mL/min","E":"4 mL/min"},"answer":"A","explanation":"ClT = ClR + ClNR → ClNR = 600 − 150 = 450 mL/min. B: Repeats the renal clearance. C: That's total clearance. D: Adds instead of subtracting. E: Divides the two values.","source_slide":"L06 PK IV Elimination, slide 36"},{"id":"FND-PHARM-L06-07","block":"Foundations","lecture":"L06 PK IV Elimination","discipline":"Pharmacology","style":"Step1","stem":"A 62-year-old woman on weekly low-dose methotrexate for rheumatoid arthritis is started on probenecid for gout. Two weeks later she has mouth ulcers and pancytopenia. What is the most likely mechanism?","options":{"A":"Probenecid induced hepatic metabolism of methotrexate","B":"Probenecid increased glomerular filtration of methotrexate","C":"Probenecid displaced methotrexate from P-glycoprotein in the gut","D":"Probenecid inhibited renal tubular secretion of methotrexate via OATs","E":"Probenecid alkalinized the urine"},"answer":"D","explanation":"Probenecid competes for basolateral organic anion transporters, reducing secretion of OAT substrates (methotrexate, penicillin) → accumulation and toxicity. A: Induction would lower levels. B: More filtration would lower levels. C: Not the mechanism. E: Probenecid doesn't meaningfully alkalinize urine; alkalinization would actually aid methotrexate excretion.","source_slide":"L06 PK IV Elimination, slides 27–28"},{"id":"FND-PHARM-L06-08","block":"Foundations","lecture":"L06 PK IV Elimination","discipline":"Pharmacology","style":"Step1","stem":"Para-aminohippuric acid (PAH) is both filtered and almost completely secreted in a single pass through the kidney. Its clearance is therefore used to estimate which quantity?","options":{"A":"Glomerular filtration rate","B":"Effective renal plasma flow","C":"Filtration fraction","D":"Tubular reabsorption of water","E":"Cardiac output"},"answer":"B","explanation":"Almost all PAH reaching the kidney is removed, so its clearance ≈ renal plasma flow, the theoretical maximum clearance. A: GFR is estimated by inulin or creatinine, which are filtered but not secreted. C: Filtration fraction = GFR/RPF and needs both values. D: Water reabsorption isn't measured by PAH. E: Cardiac output isn't derived from PAH clearance.","source_slide":"L06 PK IV Elimination, slides 28, 34"},{"id":"FND-PHARM-L06-09","block":"Foundations","lecture":"L06 PK IV Elimination","discipline":"Pharmacology","style":"LAU","stem":"A drug has a hepatic extraction ratio of 0.8. Hepatic blood flow is 1.5 L/min. What is its hepatic clearance?","options":{"A":"0.3 L/min","B":"1.2 L/min","C":"1.5 L/min","D":"1.9 L/min","E":"0.53 L/min"},"answer":"B","explanation":"Liver clearance = flow × ER = 1.5 × 0.8 = 1.2 L/min. A: Uses (1 − ER) instead of ER. C: Assumes complete extraction (ER = 1). D: Calculates 1.5 / 0.8, dividing instead of multiplying. E: Calculates 0.8 / 1.5, dividing ER by flow.","source_slide":"L06 PK IV Elimination, slide 38"},{"id":"FND-PHARM-L08-01","block":"Foundations","lecture":"L08 Quantitative PK","discipline":"Pharmacology","style":"LAU","stem":"A drug is eliminated by zero-order kinetics with k0 = 10 mg/L per hour, starting at 100 mg/L. How long does it take to fall from 100 to 50 mg/L, and then from 50 to 25 mg/L?","options":{"A":"5 h, then 5 h","B":"6.9 h, then 6.9 h","C":"5 h, then 2.5 h","D":"10 h, then 5 h","E":"5 h, then 10 h"},"answer":"C","explanation":"Zero-order: a constant amount (10 mg/L) is removed each hour, so t½ = 0.5C0/k0: 50/10 = 5 h, then 25/10 = 2.5 h. The half-life shortens as concentration falls. A: A constant half-life is a first-order feature. B: Treats the drug as first-order with a constant half-life; zero-order t½ isn't constant. D: Uses C0/k0 (time to reach zero), not 0.5C0/k0. E: Reverses the trend; zero-order t½ gets shorter, not longer.","source_slide":"L08 Quantitative PK, slides 16, 20–21"},{"id":"FND-PHARM-L08-02","block":"Foundations","lecture":"L08 Quantitative PK","discipline":"Pharmacology","style":"LAU","stem":"A drug follows first-order kinetics with a Vd of 40 L and a clearance of 4 L/h. What is its half-life?","options":{"A":"0.07 h","B":"10 h","C":"14.4 h","D":"27.7 h","E":"6.9 h"},"answer":"E","explanation":"t½ = 0.693 × Vd / CL = 0.693 × 40 / 4 ≈ 6.9 h. A: Inverts the ratio (CL/Vd × 0.693). B: Omits 0.693 (Vd/CL only). C: Divides by 0.693 instead of multiplying. D: Multiplies 0.693 by Vd but forgets to divide by CL.","source_slide":"L08 Quantitative PK, slide 28"},{"id":"FND-PHARM-L08-03","block":"Foundations","lecture":"L08 Quantitative PK","discipline":"Pharmacology","style":"LAU","stem":"A drug with first-order elimination and a half-life of 8 hours is started as a constant IV infusion without a loading dose. About how long until it reaches 95% of its steady-state concentration?","options":{"A":"35 hours","B":"8 hours","C":"16 hours","D":"24 hours","E":"53 hours"},"answer":"A","explanation":"95% of Css takes ~4.32 half-lives → 4.32 × 8 ≈ 35 h. B: One half-life gives 50%. C: Two half-lives give 75%. D: Three half-lives give 87.5%. E: ~6.6 half-lives (53 h) is needed for 99%.","source_slide":"L08 Quantitative PK, slides 35–37"},{"id":"FND-PHARM-L08-04","block":"Foundations","lecture":"L08 Quantitative PK","discipline":"Pharmacology","style":"LAU","stem":"A drug given by IV infusion has a Vd of 50 L and a clearance of 5 L/h. A plasma concentration of 10 mg/L is needed quickly. What loading dose should be given?","options":{"A":"5 mg","B":"50 mg","C":"250 mg","D":"500 mg","E":"5000 mg"},"answer":"D","explanation":"Loading dose = Vd × Ctarget = 50 L × 10 mg/L = 500 mg; clearance sets the maintenance rate, not the loading dose. A: Divides Vd by Ctarget. B: CL × Ctarget is the maintenance infusion rate (50 mg/h). C: Multiplies Vd by CL. E: Overestimates by 10×.","source_slide":"L08 Quantitative PK, slides 43–44"},{"id":"FND-PHARM-L08-05","block":"Foundations","lecture":"L08 Quantitative PK","discipline":"Pharmacology","style":"LAU","stem":"An oral drug (F = 0.5) has a clearance of 2 L/h. The target average steady-state concentration is 15 mg/L, given every 12 hours. What maintenance dose is needed?","options":{"A":"180 mg","B":"720 mg","C":"360 mg","D":"60 mg","E":"1440 mg"},"answer":"B","explanation":"Dose = Css × CL × τ / F = 15 × 2 × 12 / 0.5 = 720 mg. A: Ignores F and halves the result. C: Ignores F (the IV dose). D: Omits the dosing interval. E: Corrects for F twice.","source_slide":"L08 Quantitative PK, slides 44–45"},{"id":"FND-PHARM-L08-06","block":"Foundations","lecture":"L08 Quantitative PK","discipline":"Pharmacology","style":"LAU","stem":"A drug following first-order kinetics is given repeatedly at a dosing interval equal to its half-life. What is the accumulation factor (R)?","options":{"A":"1","B":"1.5","C":"3","D":"5","E":"2"},"answer":"E","explanation":"Half of each dose is lost per interval → R = 1 / fraction lost = 1 / 0.5 = 2. A: R ≈ 1 only when the interval is ≥ 5 half-lives. B: R = 1.5 needs a longer interval (~1.6 half-lives). C: R = 3 needs an interval shorter than one half-life. D: Not consistent with dosing every half-life.","source_slide":"L08 Quantitative PK, slides 52, 57"},{"id":"FND-PHARM-L08-07","block":"Foundations","lecture":"L08 Quantitative PK","discipline":"Pharmacology","style":"Step1","stem":"A 34-year-old woman with epilepsy has a phenytoin level of 12 mg/L. Her dose is increased by about 15%. Two weeks later she has nystagmus and ataxia, and her level is 28 mg/L. What best explains the disproportionate rise?","options":{"A":"Induction of CYP2C9 by phenytoin","B":"Saturation of the metabolizing enzymes (zero-order kinetics)","C":"Decreased volume of distribution","D":"Increased oral bioavailability","E":"Enterohepatic recirculation"},"answer":"B","explanation":"At therapeutic levels phenytoin metabolism nears saturation, so elimination becomes constant-amount (zero-order); small dose increases cause large, unpredictable level jumps. A: Auto-induction would lower levels. C: Vd doesn't change with a small dose increase. D: Bioavailability is already high and doesn't explain non-proportional kinetics. E: Not the mechanism for phenytoin's behavior.","source_slide":"L08 Quantitative PK, slides 22–24"},{"id":"FND-PHARM-L08-08","block":"Foundations","lecture":"L08 Quantitative PK","discipline":"Pharmacology","style":"Step1","stem":"A 70-year-old man with chronic kidney disease (GFR 25 mL/min) needs a renally cleared drug. Compared with a patient with normal kidneys, how should the loading and maintenance doses be adjusted?","options":{"A":"Loading dose decreased; maintenance dose unchanged","B":"Both decreased","C":"Both increased","D":"Loading dose unchanged; maintenance dose decreased","E":"Loading dose increased; maintenance dose decreased"},"answer":"D","explanation":"Loading dose depends on Vd (unchanged), while maintenance dose depends on clearance (reduced in renal failure). A: Reverses the dependencies. B: Lowering the loading dose would delay reaching target levels. C: Higher maintenance doses would cause accumulation and toxicity. E: There is no reason to raise the loading dose.","source_slide":"L08 Quantitative PK, slides 43–45"},{"id":"FND-PHARM-L08-09","block":"Foundations","lecture":"L08 Quantitative PK","discipline":"Pharmacology","style":"Step1","stem":"A 68-year-old man with severe renal impairment receives repeated doses of meperidine for pain. On day 3 he develops tremor and a seizure, although his meperidine level is in the usual range. What best explains this?","options":{"A":"Accumulation of an active, toxic metabolite","B":"Saturation of meperidine metabolism (zero-order kinetics)","C":"Reduced volume of distribution of meperidine","D":"Tolerance to meperidine's analgesic effect","E":"Displacement of meperidine from plasma proteins"},"answer":"A","explanation":"In renal impairment the metabolite normeperidine accumulates; its toxicity is not predicted by parent-drug levels. B: Saturation would raise the parent-drug level. C: A smaller Vd would also raise the parent-drug level. D: Tolerance reduces the effect; it doesn't cause seizures. E: Displacement gives only a transient rise in free drug and wouldn't depend on renal function.","source_slide":"L08 Quantitative PK, slide 55"},{"id":"FND-PHARM-L08-10","block":"Foundations","lecture":"L08 Quantitative PK","discipline":"Pharmacology","style":"LAU","stem":"After an IV bolus, a drug's log plasma concentration–time plot shows a steep initial fall followed by a slower straight-line decline. What does the steep initial phase mainly represent?","options":{"A":"Zero-order elimination at high concentrations","B":"Absorption from the injection site","C":"Distribution of drug from plasma into tissues","D":"First-pass hepatic metabolism","E":"Enterohepatic recirculation"},"answer":"C","explanation":"This is the two-compartment model: a biexponential decline made of two first-order processes, distribution (early, steep) then elimination (later, linear). A: Both phases are first-order in this model; zero-order elimination would not give a biexponential curve. B: An IV bolus has no absorption phase. D: First-pass metabolism applies to oral drugs. E: Enterohepatic recirculation causes secondary peaks, not an initial steep fall.","source_slide":"L08 Quantitative PK, slides 9–11"},{"id":"FND-PHARM-L09-01","block":"Foundations","lecture":"L09 PK Problem Solving","discipline":"Pharmacology","style":"LAU","stem":"A 100-mg oral dose of a drug gives an AUC of 20 mg·h/L. A 25-mg IV dose of the same drug gives an AUC of 10 mg·h/L. What is the absolute oral bioavailability?","options":{"A":"25%","B":"50%","C":"40%","D":"100%","E":"200%"},"answer":"B","explanation":"F = (AUC_PO/Dose_PO)/(AUC_IV/Dose_IV) = (20/100)/(10/25) = 0.2/0.4 = 0.5. A: Compares doses only (25/100). C: Uses AUC_IV/Dose_IV (10/25) alone as F. D: 100% would mean complete absorption; dose-normalized AUCs (0.2 vs 0.4 per mg) show only half is absorbed. E: Ignores the different doses (20/10).","source_slide":"L09 PK Problem Solving, slide 11"},{"id":"FND-PHARM-L09-02","block":"Foundations","lecture":"L09 PK Problem Solving","discipline":"Pharmacology","style":"LAU","stem":"A generic and a brand-name product of the same drug are each given at 500 mg. Their AUCs are 90 and 100 mg·h/L, with similar Cmax. What is the generic's relative bioavailability, and are the products bioequivalent by the 20% rule?","options":{"A":"90%; not bioequivalent","B":"111%; not bioequivalent","C":"10%; not bioequivalent","D":"Can't be determined without an IV dose","E":"90%; bioequivalent"},"answer":"E","explanation":"Relative F = (90/500)/(100/500) = 0.90; a 10% difference is within 20%, so they are considered bioequivalent. A: The 10% difference is within the limit. B: Inverts the ratio and misjudges equivalence. C: Confuses the difference with the ratio. D: Relative bioavailability doesn't need an IV reference; absolute does.","source_slide":"L09 PK Problem Solving, slides 10–11"},{"id":"FND-PHARM-L09-03","block":"Foundations","lecture":"L09 PK Problem Solving","discipline":"Pharmacology","style":"LAU","stem":"A 500-mg IV dose of an antibiotic is given. Its Vd is 30 L and k is 0.2 h⁻¹. Over 48 h, 300 mg are recovered unchanged in urine. What is its renal clearance?","options":{"A":"6 L/h","B":"2.4 L/h","C":"0.12 L/h","D":"3.6 L/h","E":"1.8 L/h"},"answer":"D","explanation":"ClT = k × Vd = 0.2 × 30 = 6 L/h; fe = 300/500 = 0.6; ClR = 6 × 0.6 = 3.6 L/h. A: That's total clearance. B: That's nonrenal clearance (6 − 3.6). C: That's kR (0.2 × 0.6), not a clearance. E: Halves the correct value.","source_slide":"L09 PK Problem Solving, slide 6"},{"id":"FND-PHARM-L09-04","block":"Foundations","lecture":"L09 PK Problem Solving","discipline":"Pharmacology","style":"LAU","stem":"A patient on a continuous IV infusion has a target Css of 20 mg/L and a clearance of 2 L/h. After acute kidney injury, clearance falls to 1 L/h. What infusion rate now maintains the same Css?","options":{"A":"20 mg/h","B":"10 mg/h","C":"40 mg/h","D":"80 mg/h","E":"2 mg/h"},"answer":"A","explanation":"Infusion rate = Css × CL: 40 mg/h before, 20 × 1 = 20 mg/h now. B: Halves the rate twice. C: The old rate, which would double Css. D: Wrongly increases the rate. E: Divides CL by Css.","source_slide":"L09 PK Problem Solving, slide 8"},{"id":"FND-PHARM-L09-05","block":"Foundations","lecture":"L09 PK Problem Solving","discipline":"Pharmacology","style":"LAU","stem":"A patient's daily dose of a drug is split from one large dose into four smaller doses, keeping the same total daily amount. What is the main pharmacokinetic effect?","options":{"A":"Higher average steady-state concentration","B":"Shorter time to steady state","C":"Smaller fluctuation between peak and trough concentrations","D":"Longer elimination half-life","E":"Higher bioavailability"},"answer":"C","explanation":"More frequent, smaller doses narrow the Cmax–Cmin swing; the average Css depends only on total dose rate, F, and CL. A: The average is unchanged. B: Time to Css depends on half-life, not dosing frequency. D: Half-life is a drug property. E: F doesn't change with dose splitting.","source_slide":"L09 PK Problem Solving, slide 4 (solution 2b)"},{"id":"FND-PHARM-L09-06","block":"Foundations","lecture":"L09 PK Problem Solving","discipline":"Pharmacology","style":"Step1","stem":"A 76-year-old woman with atrial fibrillation starts oral digoxin (half-life ≈ 36 h in her) at a fixed daily maintenance dose without a loading dose. When will her digoxin level approach steady state?","options":{"A":"About 36 hours","B":"About 3 days","C":"About 3 weeks","D":"About 6–7 days","E":"Never, because digoxin follows zero-order kinetics"},"answer":"D","explanation":"Steady state takes ~4–5 half-lives: 4–5 × 36 h ≈ 6–7.5 days. A: One half-life gives only 50% of Css. B: ~2 half-lives gives ~75%. C: Far longer than 5 half-lives. E: Digoxin follows first-order kinetics at therapeutic doses.","source_slide":"L08 Quantitative PK, slide 37; L09 PK Problem Solving, solution 2c"},{"id":"FND-PHARM-L09-07","block":"Foundations","lecture":"L09 PK Problem Solving","discipline":"Pharmacology","style":"LAU","stem":"A 400-mg oral dose of a drug (F = 0.5) is given. Total clearance is 10 L/h. Over 48 h, 100 mg of unchanged drug is recovered in the urine. What is the renal clearance?","options":{"A":"2.5 L/h","B":"10 L/h","C":"5 L/h","D":"7.5 L/h","E":"20 L/h"},"answer":"C","explanation":"Only the absorbed dose (0.5 × 400 = 200 mg) reaches the circulation, so the fraction excreted unchanged = 100/200 = 0.5 and ClR = 0.5 × 10 = 5 L/h. A: Uses 100/400, ignoring F. B: That's total clearance. D: Nonrenal clearance from the uncorrected fraction (10 − 2.5). E: Divides total clearance by F.","source_slide":"L09 PK Problem Solving, solution 6 (problem slide 9)"},{"id":"FND-PHARM-L09-08","block":"Foundations","lecture":"L09 PK Problem Solving","discipline":"Pharmacology","style":"LAU","stem":"A 70-kg patient takes a drug with a Vd of 100 mL/kg and a half-life of 3.5 h (first-order). Taking 0.693 ≈ 0.7, what is its total body clearance?","options":{"A":"0.14 L/h","B":"2.0 L/h","C":"35 L/h","D":"0.02 L/h","E":"1.4 L/h"},"answer":"E","explanation":"Vd = 0.1 L/kg × 70 kg = 7 L; k = 0.7/3.5 = 0.2 h⁻¹; CL = k × Vd = 0.2 × 7 = 1.4 L/h. A: A 10× error in the mL→L conversion. B: Omits 0.693 (7/3.5). C: Divides Vd by k instead of multiplying. D: Forgets to multiply by body weight (0.1 × 0.2).","source_slide":"L09 PK Problem Solving, solution 5"},{"id":"FND-PHARM-L10-01","block":"Foundations","lecture":"L10 Clinical Toxicology","discipline":"Pharmacology","style":"LAU","stem":"A 28-year-old woman is brought in after an intentional ingestion. She has slurred speech, dilated pupils, temperature 40 °C, BP 150/90, HR 120, and RR 36. Which class of agent best explains these findings?","options":{"A":"Opioid","B":"Benzodiazepine","C":"Organophosphate","D":"CNS stimulant / sympathomimetic","E":"β-blocker"},"answer":"D","explanation":"Mydriasis, hyperthermia, tachycardia, and hypertension point to a stimulant (FAST: free-base cocaine, anticholinergics, sympathomimetics, theophylline). A: Opioids cause miosis, bradypnea, and hypothermia. B: Benzodiazepines cause sedation without hyperthermia or tachycardia. C: Organophosph
