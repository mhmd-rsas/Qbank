 continue.","source_slide":"L02 Relationship Between Physician and Patient, slides 31–32"},{"id":"FND-ETH-L02-07","block":"Foundations","lecture":"L02 Relationship Between Physician and Patient","discipline":"Medical Ethics","style":"LAU","stem":"A competent 60-year-old's biopsy shows cancer. His adult children ask the physician to tell them first and let them relay the news. What does the lecture say?","options":{"A":"Tell the children, who know him best","B":"Tell him only the diagnosis, not the prognosis","C":"Reassure him that the result is probably nothing serious","D":"Refer him to a psychiatrist to deliver the news","E":"Tell him directly and completely about diagnosis and prognosis"},"answer":"E","explanation":"Adult patients are generally told the complete truth about diagnosis and prognosis, directly and not relayed through relatives. A: Information is not relayed through relatives. B: The truth should be complete. C: Falsely reassuring statements are inappropriate. D: The treating physician is responsible; referral is for medical problems outside his range.","source_slide":"L02 Relationship Between Physician and Patient, slide 30"},{"id":"FND-ETH-L04-01","block":"Foundations","lecture":"L04 Informed Consent","discipline":"Medical Ethics","style":"LAU","stem":"A surgeon decides how much to disclose by asking what a typical surgeon would tell patients about this operation. Which disclosure standard is this, and what is its main weakness?","options":{"A":"Reasonable patient standard; hardest to apply because it must be tailored to each patient","B":"Subjective standard; it focuses on the physician rather than the patient","C":"Reasonable patient standard; it focuses on the physician rather than the patient","D":"Reasonable physician standard; it focuses on the physician rather than the patient","E":"Reasonable physician standard; hardest to apply because it must be tailored to each patient"},"answer":"D","explanation":"The reasonable physician standard asks what a typical physician would say; it is considered inconsistent with the goals of informed consent because it centers on the physician, not on what the patient needs to know. A, E: Tailoring to each patient is the subjective standard, the most challenging to practice. B: The subjective standard centers on this particular patient. C: The reasonable patient standard asks what the average patient needs to know.","source_slide":"L04 Informed Consent, slide 13"},{"id":"FND-ETH-L04-02","block":"Foundations","lecture":"L04 Informed Consent","discipline":"Medical Ethics","style":"Step1","stem":"An unconscious 45-year-old man in shock is brought to the emergency department with an intestinal perforation. No relatives or surrogate can be reached, and the surgeon judges that delay will be fatal. What is the appropriate basis for operating?","options":{"A":"Presumed (implied) consent for an emergency intervention that prevents death","B":"A general consent form signed at admission covers the surgery","C":"The patient's presence in the hospital implies consent to treatment","D":"A court order must be obtained before any surgery","E":"Surgery must wait until the patient regains consciousness"},"answer":"A","explanation":"Presumed/implied consent applies only in emergencies when the patient is unconscious or incompetent, no surrogate is available, and the intervention prevents death or disability; a surgeon who acts with due care in good faith is not held responsible for an unfavourable outcome. B: Surgery and anesthesia require their own specific signed consent. C: Presence in the ward, ICU or clinic is not implied consent to all treatment. D, E: Delay would harm the patient; neither is required in a life-threatening emergency.","source_slide":"L04 Informed Consent, slides 6, 17–20"},{"id":"FND-ETH-L04-03","block":"Foundations","lecture":"L04 Informed Consent","discipline":"Medical Ethics","style":"Step1","stem":"A 64-year-old woman with multiple sclerosis agrees in the morning to a feeding tube. That evening she is disoriented and refuses it. The next morning she is lucid again and agrees, but cannot recall the evening. What should the team do?","options":{"A":"Honor the evening refusal, since it is her most recent decision","B":"Ask the court to appoint a guardian before proceeding","C":"Place the tube, honoring the consistent decision made while lucid","D":"Let her family decide, since her capacity varies","E":"Postpone the procedure until she never shows confusion"},"answer":"C","explanation":"Decision-making capacity can vary with disease and medications; capacity is assessed during lucid periods, and a decision made consistently and persistently over time is honored. A: The refusal was made while disoriented. B: A court-appointed guardian is a rare last resort when no surrogate exists. D: She has capacity when lucid, so she decides. E: Unnecessary delay; her lucid decision is consistent.","source_slide":"L04 Informed Consent, slides 22–24"},{"id":"FND-ETH-L04-04","block":"Foundations","lecture":"L04 Informed Consent","discipline":"Medical Ethics","style":"LAU","stem":"Which practice meets the lecture's requirements for documenting informed consent before surgery?","options":{"A":"A standard hospital form, signed by the patient, used for every procedure","B":"A form signed routinely by the patient after a staff member points to the signature line","C":"Verbal agreement recorded by the surgeon in the operative note","D":"A form signed by the patient only, kept in the surgeon's office","E":"A form in duplicate, signed by patient, doctor and an independent witness"},"answer":"E","explanation":"Consent should be dated, prepared in duplicate (a copy goes to the patient), signed by the patient or guardian, the doctor and an independent witness, and kept in the medical record. A: Consent is person- and procedure-specific; there is no standard form. B: Consent cannot be a signature on a dotted line obtained routinely by staff. C: Surgery and anesthesia usually require a signed form. D: The doctor and a witness must also sign, and it belongs in the patient's medical record.","source_slide":"L04 Informed Consent, slides 6, 9, 11, 14, 25"},{"id":"FND-ETH-L04-05","block":"Foundations","lecture":"L04 Informed Consent","discipline":"Medical Ethics","style":"LAU","stem":"A 9-year-old girl is brought to the emergency department by her school teacher after a serious injury. Her parents and guardians cannot be reached. According to the lecture, from whom is consent obtained?","options":{"A":"The child herself","B":"The teacher who brought the child","C":"A judge, through a court order","D":"The hospital director","E":"No one until the parents are reached"},"answer":"B","explanation":"For children in an emergency when parents or guardians are unavailable, consent is taken from the person who brought the child, such as a school teacher. A: Children lack decision-making capacity to give consent, though their assent is sought when possible. C: Courts are for unresolved disputes or when no surrogate can be found. D: Not a listed decision-maker. E: Waiting would harm the child in an emergency.","source_slide":"L04 Informed Consent, slides 17, 21"},{"id":"FND-ETH-L04-06","block":"Foundations","lecture":"L04 Informed Consent","discipline":"Medical Ethics","style":"LAU","stem":"Which Lebanese law governs patients' rights and informed consent?","options":{"A":"Decree-Law No. 109 of 1983","B":"Law No. 625 of 2004","C":"Law No. 574 of 2004","D":"Decree No. 1442 of 1984","E":"Decision No. 63 of 2001"},"answer":"C","explanation":"Law No. 574 of 2004 is the Lebanese law on Patients' Rights and Informed Consent. A: Human tissue and organ transplantation. B: Genetic tests. D: Implements the 1983 organ transplantation decree-law. E: Established the Lebanese National Consultative Committee on Ethics.","source_slide":"L04 Informed Consent, slide 16; L05 Laws in Bioethics, slides 9–10"},{"id":"FND-ETH-L05-01","block":"Foundations","lecture":"L05 Laws in Bioethics (Lebanese Law)","discipline":"Medical Ethics","style":"LAU","stem":"A 70-year-old man with early dementia refuses surgery. His son wants him declared incompetent. Who makes that determination?","options":{"A":"The treating physician, through a capacity assessment","B":"A psychiatrist, since dementia is a mental disorder","C":"A judge, possibly after consulting physicians","D":"The hospital ethics committee","E":"The son, as next of kin"},"answer":"C","explanation":"Competence is a legal term, and only the judge determines it; physicians are often consulted about the patient's decision-making capacity. If found incompetent, the court appoints a legal guardian. A, B: Physicians assess capacity, a clinical term, not legal competence. D: Not the body that rules on competence. E: Relatives cannot declare competence; all adults are presumed competent.","source_slide":"L05 Laws in Bioethics (Lebanese Law), slides 3, 5"},{"id":"FND-ETH-L05-02","block":"Foundations","lecture":"L05 Laws in Bioethics (Lebanese Law)","discipline":"Medical Ethics","style":"LAU","stem":"A 16-year-old married woman who cares for her 1-year-old son comes alone to the clinic and requests treatment for herself. Her parents live in another city. Who can consent to her treatment?","options":{"A":"Her parents, since she is younger than 18","B":"Her husband, as her legal representative","C":"A court-appointed guardian","D":"No one; treatment must wait until she turns 18","E":"She can consent herself as an emancipated minor"},"answer":"E","explanation":"Minors (<18) are not legally competent, but an emancipated minor (self-supporting or in the military, or married or caring for her own children) is considered an adult and consents to her own care. A: Parental consent is not needed once emancipated. B: Marriage makes her emancipated; it does not transfer decisions to her husband. C: Guardians are appointed for persons found incompetent. D: She can consent now.","source_slide":"L05 Laws in Bioethics (Lebanese Law), slides 3–4"},{"id":"FND-ETH-L05-03","block":"Foundations","lecture":"L05 Laws in Bioethics (Lebanese Law)","discipline":"Medical Ethics","style":"LAU","stem":"While examining a 25-year-old woman, a Lebanese physician finds evidence that she was raped. According to Article 7 (professional secrecy) of the Lebanese code, what must the physician do?","options":{"A":"Report to the appropriate authorities whatever the victim wishes","B":"Report to the Public Prosecutor if the victim gives written consent","C":"Notify the Ministry of Public Health","D":"Keep it secret unless summoned by the court as an expert","E":"Report only if the physician believes it will prevent further crimes"},"answer":"B","explanation":"Article 7, clause 13: cases of rape and offenses against honor are reported to the Public Prosecutor provided the victim gives written consent. A: Reporting without consent applies to minors or incapacitated persons (clause 14). C: Notification to the Ministry is for reportable venereal diseases (clause 9). D: The expert exemption (clause 7) is a different situation. E: That wording concerns crimes the physician discovers, not this clause.","source_slide":"L05 Laws in Bioethics (Lebanese Law), slides 16–18"},{"id":"FND-ETH-L05-04","block":"Foundations","lecture":"L05 Laws in Bioethics (Lebanese Law)","discipline":"Medical Ethics","style":"LAU","stem":"During a routine visit, an adult patient confesses to his Lebanese physician that he committed a burglary last year. According to Article 7 of the Lebanese code, what should the physician do?","options":{"A":"Not report the crime","B":"Report it to the public prosecution","C":"Report it to the judicial police","D":"Report it only if the patient gives written consent","E":"Warn the victim directly, as in the Tarasoff decision"},"answer":"A","explanation":"Article 7, clause 5: a physician shall not report a crime that a patient confessed to; only a crime the physician discovers during examination must be reported to the public prosecution. B: Applies to crimes discovered on examination, not confessed ones. C: Even when summoned by the judicial police, the physician may keep some secrets (clause 4). D: Written consent is the condition for reporting rape (clause 13). E: Tarasoff concerns a credible threat to another person, not a past crime.","source_slide":"L05 Laws in Bioethics (Lebanese Law), slides 15–16"},{"id":"FND-ETH-L05-05","block":"Foundations","lecture":"L05 Laws in Bioethics (Lebanese Law)","discipline":"Medical Ethics","style":"Step1","stem":"In a Lebanese hospital, a competent 40-year-old man whose beliefs forbid blood transfusion refuses blood. He then develops hemorrhage that puts his life in permanent danger. According to the Lebanese code, what should the physician do?","options":{"A":"Transfuse immediately without any authorization","B":"Respect the refusal in all circumstances","C":"Obtain consent for transfusion from his family","D":"Obtain judicial authorization, then act by professional conscience","E":"Advise him of his responsibility and report to the health authorities"},"answer":"D","explanation":"Clause 9: the physician respects the refusal, except when there is permanent danger; then, after obtaining authorization from the appropriate judicial authorities, the physician acts according to professional conscience, bearing full responsibility. A: Judicial authorization is required first. B: The law makes an exception for permanent danger. C: Family consent is not the mechanism in the law. E: That is the rule for refusal of required vaccinations (clause 8).","source_slide":"L05 Laws in Bioethics (Lebanese Law), slide 23"},{"id":"FND-ETH-L05-06","block":"Foundations","lecture":"L05 Laws in Bioethics (Lebanese Law)","discipline":"Medical Ethics","style":"Step1","stem":"One month after naming her neighbor in a durable power of attorney for health care, a 75-year-old woman has a stroke and is unlikely to regain consciousness. Her son, who lives with her, insists on continued life support; the neighbor asks that it be withdrawn. Whose decision should the physician follow?","options":{"A":"The son's, as next of kin","B":"The neighbor's, as her designated representative","C":"The physician's own judgment of her best interest","D":"A court-appointed guardian's","E":"Neither; keep her on life support until they agree"},"answer":"B","explanation":"A durable power of attorney is an advance directive in which a competent person designates someone as her legal representative for health care decisions when she can no longer make them, so the neighbor decides. A: Family members act as surrogates (substituted judgment) only when there is no advance directive, and their personal wishes are irrelevant. C: Best-interest decisions apply when no surrogate is available. D: A valid designated representative already exists. E: The designated representative's decision stands.","source_slide":"L05 Laws in Bioethics (Lebanese Law), slides 30–32"},{"id":"FND-MICRO-L01-01","block":"Foundations","lecture":"L01 Introduction to Microbiology","discipline":"Microbiology","style":"LAU","stem":"Koch's postulates cannot be fulfilled for Mycobacterium leprae. Which postulate fails?","options":{"A":"The organism is present in every case of the disease","B":"The organism is isolated in pure culture in vitro","C":"The organism reproduces the disease in laboratory animals","D":"The organism is re-isolated from the infected animal","E":"The host produces specific antibodies to the organism"},"answer":"B","explanation":"M. leprae cannot be cultivated on artificial media, so pure culture (postulate 2) fails. A: It is present in every case. C: Failure in lab animals is the N. gonorrhoeae exception (human-only disease). D: Re-isolation is not the stated problem for M. leprae. E: Antibody production is not one of Koch's four postulates.","source_slide":"L01 Introduction to Microbiology, slide 10"},{"id":"FND-MICRO-L01-02","block":"Foundations","lecture":"L01 Introduction to Microbiology","discipline":"Microbiology","style":"LAU","stem":"Bacterial mesosomes are functionally analogous to which eukaryotic structure?","options":{"A":"Golgi apparatus","B":"Lysosomes","C":"Endoplasmic reticulum","D":"Mitochondria","E":"Ribosomes"},"answer":"D","explanation":"Mesosomes are invaginations of the bacterial cell membrane carrying respiratory enzymes, so they replace mitochondria (which bacteria lack). A: Bacteria lack a Golgi. B: Lysosomes are digestive organelles, not respiratory. C: Bacteria lack ER. E: Bacteria have their own (70S) ribosomes; these synthesize protein, not energy.","source_slide":"L01 Introduction to Microbiology, slides 18, 22, 29"},{"id":"FND-MICRO-L01-03","block":"Foundations","lecture":"L01 Introduction to Microbiology","discipline":"Microbiology","style":"LAU","stem":"Protein-synthesis inhibitors can be selectively toxic to bacteria because bacterial ribosomes are:","options":{"A":"70S, made of 30S and 50S subunits","B":"80S, made of 40S and 60S subunits","C":"70S, made of 40S and 30S subunits","D":"80S, made of 30S and 50S subunits","E":"70S, made of 40S and 60S subunits"},"answer":"A","explanation":"Bacteria have 70S ribosomes (30S + 50S); human cells have 80S (40S + 60S), so drugs can target one without the other. B: That is the eukaryotic (human) ribosome. C: 40S is a eukaryotic subunit. D: 30S and 50S form the 70S, not 80S, ribosome. E: 40S and 60S are the eukaryotic subunits.","source_slide":"L01 Introduction to Microbiology, slide 20"},{"id":"FND-MICRO-L01-04","block":"Foundations","lecture":"L01 Introduction to Microbiology","discipline":"Microbiology","style":"LAU","stem":"Which feature distinguishes helminths from protozoa?","options":{"A":"A true membrane-bound nucleus","B":"Ability to cause disease in humans","C":"Multicellular body with differentiated tissues and organ systems","D":"A cell wall containing chitin","E":"70S ribosomes"},"answer":"C","explanation":"Helminths are macroscopic multicellular worms with differentiated tissues and organ systems; protozoa are microscopic single-celled eukaryotes. A: Both are eukaryotes with a true nucleus. B: Both are human pathogens. D: Chitin walls are a fungal feature. E: Both, as eukaryotes, have 80S ribosomes.","source_slide":"L01 Introduction to Microbiology, slide 25"},{"id":"FND-MICRO-L01-05","block":"Foundations","lecture":"L01 Introduction to Microbiology","discipline":"Microbiology","style":"LAU","stem":"Fungal and bacterial cell walls differ in their main structural component. Which pairing is correct?","options":{"A":"Fungi: peptidoglycan; bacteria: chitin","B":"Fungi: cellulose; bacteria: peptidoglycan","C":"Fungi: chitin; bacteria: cellulose","D":"Fungi: no cell wall; bacteria: peptidoglycan","E":"Fungi: chitin; bacteria: peptidoglycan"},"answer":"E","explanation":"Fungal walls contain chitin; bacterial walls contain peptidoglycan (unique to bacteria). A: Reversed. B: Cellulose is the plant cell-wall component. C: Bacteria do not use cellulose. D: Fungi do have a cell wall; animal cells are the ones without.","source_slide":"L01 Introduction to Microbiology, slides 16, 22"},{"id":"FND-MICRO-L01-06","block":"Foundations","lecture":"L01 Introduction to Microbiology","discipline":"Microbiology","style":"LAU","stem":"Which feature correctly distinguishes viruses from bacteria?","options":{"A":"Viruses carry their own 70S ribosomes","B":"Viruses multiply by binary fission","C":"Viruses contain only one type of nucleic acid, DNA or RNA","D":"Viruses grow on artificial media such as agar","E":"Viruses have a peptidoglycan cell wall"},"answer":"C","explanation":"Viruses contain only DNA or RNA inside a protein capsid and are obligate intracellular. A: Viruses have no ribosomes; they use the host's. B: Bacteria divide by binary fission; viruses replicate inside cells. D: Viruses need living cells. E: Viruses have a capsid, not a cell wall.","source_slide":"L01 Introduction to Microbiology, slides 27, 29"},{"id":"FND-MICRO-L02-01","block":"Foundations","lecture":"L02 Antibacterial Agents","discipline":"Microbiology","style":"LAU","stem":"Which antibiotic binds the same ribosomal subunit as tetracycline?","options":{"A":"Azithromycin","B":"Clindamycin","C":"Linezolid","D":"Chloramphenicol","E":"Gentamicin"},"answer":"E","explanation":"Tetracyclines and aminoglycosides (gentamicin, tobramycin, amikacin) bind the 30S subunit. A: Macrolides act on 50S. B: Clindamycin acts on 50S. C: Linezolid acts on 50S. D: Chloramphenicol acts on 50S.","source_slide":"L02 Antibacterial Agents, slide 11; handout p5"},{"id":"FND-MICRO-L02-02","block":"Foundations","lecture":"L02 Antibacterial Agents","discipline":"Microbiology","style":"LAU","stem":"Co-trimoxazole combines a sulfonamide with trimethoprim. Which enzyme does the trimethoprim component inhibit?","options":{"A":"Dihydrofolate synthetase","B":"Dihydrofolate reductase","C":"DNA gyrase","D":"RNA polymerase","E":"Transpeptidase (PBP)"},"answer":"B","explanation":"Trimethoprim blocks dihydrofolate reductase (dihydrofolic → tetrahydrofolic acid); with sulfonamides it blocks two sequential folate steps. A: Sulfonamides (PABA analogs) inhibit this earlier step (slide name; standard name dihydropteroate synthase). C: Quinolones inhibit DNA gyrase. D: Rifampicin inhibits RNA polymerase. E: β-lactams inhibit transpeptidase.","source_slide":"L02 Antibacterial Agents, slides 11, 26; handout p5"},{"id":"FND-MICRO-L02-03","block":"Foundations","lecture":"L02 Antibacterial Agents","discipline":"Microbiology","style":"LAU","stem":"Why is nafcillin effective against penicillinase-producing S. aureus while penicillin G is not?","options":{"A":"It binds D-Ala-D-Ala termini instead of PBPs","B":"It contains a 6-membered dihydrothiazine ring","C":"Its bulky R side chain blocks β-lactamase access to the β-lactam ring","D":"It is always given with clavulanic acid","E":"It binds the altered PBP encoded by mecA"},"answer":"C","explanation":"Steric hindrance from the bulky R group protects the β-lactam ring, so nafcillin is used for S. aureus (except MRSA). A: That is vancomycin. B: That ring is the cephalosporin structure. D: Clavulanate is paired with amoxicillin (Augmentin), not needed for nafcillin. E: mecA-altered PBP is exactly why MRSA resists nafcillin.","source_slide":"L02 Antibacterial Agents, slides 17–19"},{"id":"FND-MICRO-L02-04","block":"Foundations","lecture":"L02 Antibacterial Agents","discipline":"Microbiology","style":"LAU","stem":"Which cephalosporin covers MRSA?","options":{"A":"Cefazolin","B":"Ceftaroline","C":"Cefaclor","D":"Ceftriaxone","E":"Cefepime"},"answer":"B","explanation":"Ceftaroline (5th generation) covers MRSA but not Pseudomonas. A: Cefazolin is 1st generation. C: Cefaclor is 2nd. D: Ceftriaxone is 3rd. E: Cefepime is 4th; it doesn't cover MRSA.","source_slide":"L02 Antibacterial Agents, slides 21–22"},{"id":"FND-MICRO-L02-05","block":"Foundations","lecture":"L02 Antibacterial Agents","discipline":"Microbiology","style":"LAU","stem":"During an epidemic of cerebrospinal meningitis, healthy close contacts are given oral rifampicin. This use is best described as:","options":{"A":"Chemoprophylaxis","B":"Combination therapy to prevent resistance","C":"Treatment of a superinfection","D":"Synergistic therapy","E":"Empirical treatment of meningitis"},"answer":"A","explanation":"Chemoprophylaxis = antimicrobials to prevent infection in people not yet infected (also: amoxicillin before dental extraction in heart disease, preoperative use). B: Combinations to prevent resistance are used in TB. C: Superinfection is overgrowth of resistant flora (oral Candida, C. difficile). D: Synergy means two drugs together (e.g. penicillin + aminoglycoside). E: The contacts are not ill.","source_slide":"L02 Antibacterial Agents, slide 41; handout p8"},{"id":"FND-MICRO-L02-06","block":"Foundations","lecture":"L02 Antibacterial Agents","discipline":"Microbiology","style":"Step1","stem":"A 25-year-old with atypical pneumonia fails amoxicillin. Cold agglutinins are positive. Why did amoxicillin fail?","options":{"A":"The organism lacks a cell wall","B":"The organism carries a β-lactamase R plasmid","C":"The organism has altered 30S ribosomes","D":"The organism is metabolically dormant","E":"The organism has an mecA-altered PBP"},"answer":"A","explanation":"Mycoplasma pneumoniae naturally lacks a cell wall, so β-lactams have no target (non-genetic resistance by loss of target structure). B: β-lactamase is genetic resistance in wall-bearing bacteria. C: 30S changes affect aminoglycosides/tetracyclines. D: Dormancy is the M. tuberculosis example of non-genetic resistance. E: mecA is the MRSA mechanism.","source_slide":"L02 Antibacterial Agents, slide 32"},{"id":"FND-MICRO-L02-07","block":"Foundations","lecture":"L02 Antibacterial Agents","discipline":"Microbiology","style":"LAU","stem":"In an E-test (epsilometer) on an inoculated agar plate, how is the minimum inhibitory concentration (MIC) read?","options":{"A":"The diameter of the inhibition zone around a disc, in mm","B":"Comparison of zone size with CLSI tables as S/I/R","C":"The highest concentration printed on the strip","D":"The point where the elliptical inhibition zone meets the strip","E":"The concentration at the tip of the strip after 24 h"},"answer":"D","explanation":"The strip carries an antibiotic gradient; after 24 h at 37 °C a tear-drop zone forms and the zone edge's intersection with the strip is the MIC. A: That is Kirby-Bauer disc diffusion. B: That is how disc diffusion is interpreted. C: The highest concentration is not the MIC. E: The tip has no special meaning; the intersection point does.","source_slide":"L02 Antibacterial Agents, slides 37–38; handout p9"},{"id":"FND-MICRO-L02-08","block":"Foundations","lecture":"L02 Antibacterial Agents","discipline":"Microbiology","style":"LAU","stem":"Ciprofloxacin kills bacteria by inhibiting which enzyme?","options":{"A":"RNA polymerase","B":"Dihydrofolate reductase","C":"DNA gyrase (topoisomerase II)","D":"Transpeptidase (PBP)","E":"Glycosyltransferase"},"answer":"C","explanation":"Quinolones (nalidixic acid, ciprofloxacin, levofloxacin) inhibit DNA gyrase and block DNA synthesis. A: Rifampicin inhibits RNA polymerase. B: Trimethoprim inhibits dihydrofolate reductase. D: β-lactams inhibit transpeptidase. E: Vancomycin physically obstructs glycosyltransferase.","source_slide":"L02 Antibacterial Agents, slide 11; handout p5"},{"id":"FND-MICRO-L02-09","block":"Foundations","lecture":"L02 Antibacterial Agents","discipline":"Microbiology","style":"Step1","stem":"A Staphylococcus aureus isolate is resistant to methicillin and all other β-lactams, though β-lactamase inhibitors do not restore activity. What is the resistance mechanism?","options":{"A":"β-lactamase cleaving the β-lactam ring","B":"Efflux pumps expelling the drug","C":"Loss of the cell wall target","D":"Decreased permeability of the outer membrane","E":"Altered penicillin-binding protein from a mecA mutation"},"answer":"E","explanation":"MRSA resists by modifying the target: mecA alters the PBP so β-lactams no longer bind (vancomycin or ceftaroline are used). A: A β-lactamase inhibitor would restore activity. B: Efflux pumps are the quinolone example. C: Loss of target is Mycoplasma. D: S. aureus is Gram-positive and has no outer membrane.","source_slide":"L02 Antibacterial Agents, slides 31–32; handout p6"},{"id":"FND-MICRO-L03-01","block":"Foundations","lecture":"L03 Parasites and Viruses","discipline":"Microbiology","style":"LAU","stem":"A virus is inactivated by ether. What can you conclude?","options":{"A":"It is a DNA virus","B":"It has helical symmetry","C":"It is a prion","D":"It has a lipid envelope","E":"It replicates in the nucleus"},"answer":"D","explanation":"Ether dissolves the lipid envelope; naked viruses resist it. A: Envelope, not nucleic acid type, determines sensitivity. B: Symmetry is unrelated. C: Prions aren't viruses and resist many agents. E: Replication site is unrelated.","source_slide":"L03 Parasites and Viruses, slide 16"},{"id":"FND-MICRO-L03-02","block":"Foundations","lecture":"L03 Parasites and Viruses","discipline":"Microbiology","style":"LAU","stem":"Which virus contains single-stranded DNA?","options":{"A":"Herpesvirus","B":"Adenovirus","C":"Reovirus","D":"Poxvirus","E":"Parvovirus"},"answer":"E","explanation":"Parvoviruses are the ssDNA exception. A, B, D: These are dsDNA. C: Reovirus is the dsRNA exception.","source_slide":"L03 Parasites and Viruses, slide 12"},{"id":"FND-MICRO-L03-03","block":"Foundations","lecture":"L03 Parasites and Viruses","discipline":"Microbiology","style":"LAU","stem":"Hepatitis D virus can only replicate in cells co-infected with hepatitis B virus. HDV is therefore best described as a:","options":{"A":"Defective virus","B":"Prion","C":"Viroid","D":"Pseudovirion","E":"Bacteriophage"},"answer":"A","explanation":"Defective viruses need a helper virus (HBV supplies HBsAg). B: Prions lack nucleic acid. C: Viroids are naked RNA in plants. D: Pseudovirions carry host DNA. E: Bacteriophages infect bacteria.","source_slide":"L03 Parasites and Viruses, slide 17"},{"id":"FND-MICRO-L03-04","block":"Foundations","lecture":"L03 Parasites and Viruses","discipline":"Microbiology","style":"LAU","stem":"How are naked (non-enveloped) viruses typically released from infected cells?","options":{"A":"Budding through the plasma membrane","B":"Exocytosis via the Golgi","C":"Cell lysis","D":"Budding through the nuclear membrane","E":"Conjugation"},"answer":"C","explanation":"Naked viruses exit by lysis. A, D: Budding is how enveloped viruses exit and acquire their envelope. B: Not the typical route. E: Conjugation is bacterial gene transfer.","source_slide":"L03 Parasites and Viruses, slide 31"},{"id":"FND-MICRO-L03-05","block":"Foundations","lecture":"L03 Parasites and Viruses","discipline":"Microbiology","style":"Step1","stem":"A pandemic influenza strain emerges with hemagglutinin from an avian virus and other genes from a human virus. Which mechanism produced it?","options":{"A":"Point mutation (antigenic drift)","B":"Reassortment of genome segments (antigenic shift)","C":"Recombination between DNA genomes","D":"Interference","E":"Complementation"},"answer":"B","explanation":"Influenza has a segmented RNA genome; co-infection allows segment swapping → shift. A: Drift gives minor seasonal changes. C: Recombination occurs mostly in DNA viruses. D: Interference blocks a second virus. E: Complementation supplies proteins without exchanging genes.","source_slide":"L03 Parasites and Viruses, slide 34"},{"id":"FND-MICRO-L03-06","block":"Foundations","lecture":"L03 Parasites and Viruses","discipline":"Microbiology","style":"Step1","stem":"A man dies of encephalitis weeks after a bat bite. Which inclusion bodies are expected in his brain neurons?","options":{"A":"Intranuclear Cowdry bodies","B":"Both intranuclear and intracytoplasmic inclusions","C":"Multinucleated giant cells (syncytia)","D":"Plaques of dead cells","E":"Intracytoplasmic Negri bodies"},"answer":"E","explanation":"Rabies produces intracytoplasmic Negri bodies. A: Cowdry bodies are intranuclear (herpes). B: Combined inclusions are the measles pattern. C: Syncytia are a cell-fusion cytopathic effect, not inclusions. D: Plaques are foci of dead cells in tissue culture.","source_slide":"L03 Parasites and Viruses, slide 45"},{"id":"FND-MICRO-L03-07","block":"Foundations","lecture":"L03 Parasites and Viruses","discipline":"Microbiology","style":"LAU","stem":"In retrovirus replication, which enzyme transcribes viral mRNA and progeny genomes from the integrated proviral DNA?","options":{"A":"Host cell RNA polymerase","B":"Reverse transcriptase","C":"Viral RNA-dependent RNA polymerase","D":"Integrase","E":"Viral DNA polymerase"},"answer":"A","explanation":"After reverse transcription and integration, the provirus is transcribed by the host cell RNA polymerase. B: Reverse transcriptase makes DNA from the RNA genome, the earlier step. C: Retroviruses do not copy RNA from RNA. D: Integrase inserts the DNA but does not transcribe it. E: Retroviruses do not carry a DNA polymerase for transcription.","source_slide":"L03 Parasites and Viruses, slide 29"},{"id":"FND-MICRO-L03-08","block":"Foundations","lecture":"L03 Parasites and Viruses","discipline":"Microbiology","style":"LAU","stem":"A virus is inoculated onto the chorioallantoic membrane of a 10-day embryonated egg. Which finding shows viral growth?","options":{"A":"Plaques in a cell monolayer","B":"Syncytium formation","C":"Negri bodies","D":"Pocks: white opaque areas on the membrane","E":"Mucoid colonies"},"answer":"D","explanation":"Pocks are white opaque lesions on the transparent CAM from virus-infected cells. A: Plaques are seen in tissue culture. B: Syncytia are a cytopathic effect in cell culture. C: Negri bodies are rabies inclusions in neurons. E: Mucoid colonies are capsulated bacteria on agar.","source_slide":"L03 Parasites and Viruses, slides 39–40"},{"id":"FND-MICRO-L03-09","block":"Foundations","lecture":"L03 Parasites and Viruses","discipline":"Microbiology","style":"LAU","stem":"Herpesviruses and paramyxoviruses usually enter host cells by which mechanism?","options":{"A":"Direct penetration through the membrane","B":"Fusion of the envelope with the cell membrane via F protein","C":"Endocytosis (viropexis)","D":"Budding through the nuclear membrane","E":"Cell lysis"},"answer":"B","explanation":"These enveloped viruses carry F protein and fuse with the cell membrane, releasing the nucleocapsid into the cytoplasm. A: Direct penetration is the bacteriophage example. C: Endocytosis engulfs virions in vesicles; it is not the example given for these viruses. D: Budding is a release step. E: Lysis is how naked viruses are released.","source_slide":"L03 Parasites and Viruses, slides 22–24"},{"id":"FND-MICRO-L04-01","block":"Foundations","lecture":"L04 Basic Concepts of Infection","discipline":"Microbiology","style":"LAU","stem":"Why does an obligate anaerobe die when exposed to air?","options":{"A":"It lacks catalase and superoxide dismutase to remove toxic O₂ products","B":"It cannot make ATP without O₂","C":"O₂ blocks its cell wall synthesis","D":"It requires O₂ as its final hydrogen acceptor","E":"It only grows at low O₂ tension"},"answer":"A","explanation":"Superoxide and H₂O₂ accumulate without SOD and catalase. B: Anaerobes make ATP without O₂ (organic or inorganic acceptors). C: O₂ does not block wall synthesis. D: Using O₂ as the hydrogen acceptor defines obligate aerobes. E: Growth at low O₂ tension defines microaerophiles.","source_slide":"L04 Basic Concepts of Infection, slide 14"},{"id":"FND-MICRO-L04-02","block":"Foundations","lecture":"L04 Basic Concepts of Infection","discipline":"Microbiology","style":"LAU","stem":"In a broth culture, the viable count stays constant while the total count keeps rising. In vivo, this growth phase corresponds to:","options":{"A":"The incubation period","B":"Invasion","C":"Signs and symptoms such as fever","D":"Recovery and convalescence","E":"The carrier state"},"answer":"C","explanation":"This is the stationary phase (multiplication = death from nutrient exhaustion and toxic products), which corresponds to signs and symptoms. A: Incubation = lag phase. B: Invasion = log phase. D: Recovery = decline phase. E: The carrier state is not a growth-curve phase.","source_slide":"L04 Basic Concepts of Infection, slides 22–25"},{"id":"FND-MICRO-L04-03","block":"Foundations","lecture":"L04 Basic Concepts of Infection","discipline":"Microbiology","style":"LAU","stem":"Griffith injected mice with live non-capsulated pneumococci plus heat-killed capsulated pneumococci; the mice died. Which gene-transfer process explains this?","options":{"A":"Transduction","B":"Conjugation","C":"Transformation","D":"Transposition","E":"Lysogenic conversion"},"answer":"C","explanation":"Competent live bacteria took up naked capsule genes from dead cells. A: No phage was involved. B: Conjugation needs live donor contact. D: Transposition moves genes within a cell. E: Lysogenic conversion needs a phage.","source_slide":"L04 Basic Concepts of Infection, slide 28"},{"id":"FND-MICRO-L04-04","block":"Foundations","lecture":"L04 Basic Concepts of Infection","discipline":"Microbiology","style":"LAU","stem":"Which gene-transfer mechanism requires cell-to-cell contact but not naked DNA or phage?","options":{"A":"Transformation","B":"Transduction","C":"Artificial transformation (CaCl₂ and heat shock)","D":"Reassortment","E":"Conjugation"},"answer":"E","explanation":"Conjugation uses a sex pilus between donor and recipient, with no naked DNA or phage. A: Uses naked DNA and a competent cell. B: Uses a phage. C: A lab form of transformation using naked DNA. D: Occurs in segmented RNA viruses.","source_slide":"L04 Basic Concepts of Infection, slide 33"},{"id":"FND-MICRO-L04-05","block":"Foundations","lecture":"L04 Basic Concepts of Infection","discipline":"Microbiology","style":"LAU","stem":"A food handler has shed Salmonella Typhi in her stool for 6 years without symptoms. Which type of carrier is she?","options":{"A":"Incubatory carrier","B":"Convalescent carrier","C":"Chronic carrier","D":"Opportunistic commensal","E":"Saprophyte"},"answer":"C","explanation":"Chronic carriers discharge the organism for a long time; carriers are dangerous because they are asymptomatic, undetected and mobile. A: Incubatory carriers shed during the incubation period. B: Convalescent carriers shed only during recovery after illness. D: Commensals are normal flora. E: Saprophytes live free in nature.","source_slide":"L04 Basic Concepts of Infection, slide 10"},{"id":"FND-MICRO-L04-06","block":"Foundations","lecture":"L04 Basic Concepts of Infection","discipline":"Microbiology","style":"LAU","stem":"Oral viridans streptococci cause endocarditis after entering the bloodstream. What type of infection is this?","options":{"A":"Opportunistic infection from altered habitat","B":"Opportunistic infection from immune suppression","C":"Zoonosis","D":"Infection by an always-pathogenic organism","E":"Carrier state"},"answer":"A","explanation":"A commensal becomes pathogenic when it reaches a new site (mouth → heart). B: The trigger here is a new site, not low immunity. C: Zoonoses come from animals. D: Viridans streptococci are commensals, not obligate pathogens. E: A carrier has no disease.","source_slide":"L04 Basic Concepts of Infection, slides 6–7"},{"id":"FND-MICRO-L04-07","block":"Foundations","lecture":"L04 Basic Concepts of Infection","discipline":"Microbiology","style":"Step1","stem":"A traveler has diarrhea; stool shows motile pear-shaped trophozoites with flagella and resistant cysts. Which protozoan class is this?","options":{"A":"Ameba","B":"Sporozoa","C":"Ciliate","D":"Flagellate","E":"Cestode"},"answer":"D","explanation":"Giardia lamblia is a flagellate. A: Amebae move with pseudopodia. B: Sporozoa (Plasmodium) are spore-forming. C: Ciliates (Balantidium) have cilia. E: Cestodes are tapeworms (helminths).","source_slide":"L04 Basic Concepts of Infection, slides 45–46"},{"id":"FND-MICRO-L04-08","block":"Foundations","lecture":"L04 Basic Concepts of Infection","discipline":"Microbiology","style":"LAU","stem":"In DNA cloning, the insert and plasmid are cut with the same restriction endonuclease. Which enzyme then seals the insert into the plasmid?","options":{"A":"Reverse transcriptase","B":"Restriction endonuclease","C":"DNA gyrase","D":"DNA ligase","E":"Transpeptidase"},"answer":"D","explanation":"DNA ligase seals the gaps between the sticky ends, forming the recombinant plasmid, which is then transformed into E. coli. A: Reverse transcriptase copies RNA to DNA. B: Restriction endonucleases cut, they do not seal. C: DNA gyrase is the quinolone target. E: Transpeptidase cross-links peptidoglycan.","source_slide":"L04 Basic Concepts of Infection, slides 35–37"},{"id":"FND-MICRO-L04-09","block":"Foundations","lecture":"L04 Basic Concepts of Infection","discipline":"Microbiology","style":"LAU","stem":"A helminth is leaf-shaped and flattened with oral and ventral suckers, and has separate sexes. Which is it?","options":{"A":"Fasciola","B":"Taenia solium","C":"Ascaris lumbricoides","D":"Echinococcus granulosus","E":"Schistosoma"},"answer":"E","explanation":"Leaf-shaped with suckers = trematode (fluke); flukes are hermaphrodites except Schistosoma. A: Fasciola is a hermaphroditic fluke. B, D: These are cestodes (segmented tapeworms with a scolex). C: Ascaris is a nematode, round in cross-section.","source_slide":"L04 Basic Concepts of Infection, slides 48–49"},{"id":"FND-MICRO-L05-01","block":"Foundations","lecture":"L05 Antivirals","discipline":"Microbiology","style":"LAU","stem":"Which antiretroviral targets a host-cell protein rather than a viral one?","options":{"A":"Enfuvirtide","B":"Zidovudine","C":"Maraviroc","D":"Raltegravir","E":"Nevirapine"},"answer":"C","explanation":"Maraviroc blocks host CCR5. A: Enfuvirtide binds viral gp41. B: Zidovudine targets reverse transcriptase. D: Raltegravir targets integrase. E: Nevirapine binds reverse transcriptase.","source_slide":"L05 Antivirals, slides 7–8"},{"id":"FND-MICRO-L05-02","block":"Foundations","lecture":"L05 Antivirals","discipline":"Microbiology","style":"LAU","stem":"Why is amantadine ineffective against influenza B?","options":{"A":"Influenza B lacks neuraminidase","B":"Influenza B lacks hemagglutinin","C":"Influenza B has an unsegmented genome","D":"Influenza B is non-enveloped","E":"Influenza B has NB protein instead of M2"},"answer":"E","explanation":"Amantadine blocks the M2 ion channel needed for uncoating; influenza B has NB instead. A: Influenza B has neuraminidase (oseltamivir works). B: It has hemagglutinin. C: Its RNA has 8 segments. D: It is enveloped.","source_slide":"L05 Antivirals, slide 9"},{"id":"FND-MICRO-L05-03","block":"Foundations","lecture":"L05 Antivirals","discipline":"Microbiology","style":"Step1","stem":"A 14-year-old with recurrent herpes labialis no longer responds to acyclovir. Which enzyme change most likely explains this?","options":{"A":"Mutated or absent viral thymidine kinase","B":"Mutated cellular thymidine kinase","C":"Overexpressed UL97 kinase","D":"Mutated neuraminidase","E":"Mutated integrase"},"answer":"A","explanation":"Acyclovir needs viral TK for its first phosphorylation; TK mutations cause resistance (foscarnet is then used). B: Cellular TK doesn't activate acyclovir. C: UL97 activates ganciclovir in CMV. D, E: These aren't herpes targets.","source_slide":"L05 Antivirals, slides 16–18, 29"},{"id":"FND-MICRO-L05-04","block":"Foundations","lecture":"L05 Antivirals","discipline":"Microbiology","style":"LAU","stem":"Which anti-herpes drug requires no phosphorylation to act?","options":{"A":"Acyclovir","B":"Ganciclovir","C":"Cidofovir","D":"Foscarnet","E":"Valacyclovir"},"answer":"D","explanation":"Foscarnet directly inhibits viral polymerases. A, E: Need viral TK. B: Needs UL97. C: Needs cellular kinases.","source_slide":"L05 Antivirals, slide 18"},{"id":"FND-MICRO-L05-05","block":"Foundations","lecture":"L05 Antivirals","discipline":"Microbiology","style":"LAU","stem":"How does oseltamivir limit influenza infection?","options":{"A":"Blocks hemagglutinin-mediated attachment","B":"Inhibits neuraminidase, blocking virion release","C":"Blocks M2-mediated uncoating","D":"Inhibits the viral RNA polymerase","E":"Blocks fusion of the envelope with the cell"},"answer":"B","explanation":"Neuraminidase inhibitors (oseltamivir oral, zanamivir inhaled) trap new virions on the cell. A: HA attachment is not its target. C: That is amantadine. D: Not its target. E: Fusion inhibition is enfuvirtide (HIV gp41).","source_slide":"L05 Antivirals, slide 20"},{"id":"FND-MICRO-L05-06","block":"Foundations","lecture":"L05 Antivirals","discipline":"Microbiology","style":"LAU","stem":"Zidovudine and nevirapine both inhibit HIV reverse transcriptase. How does zidovudine differ?","options":{"A":"It must be phosphorylated in the cell and terminates the proviral DNA chain","B":"It binds the enzyme directly and alters its active site","C":"It blocks integrase from inserting proviral DNA","D":"It binds gp41 and prevents membrane fusion","E":"It binds CCR5 on the host cell"},"answer":"A","explanation":"Zidovudine is an NRTI: a nucleoside analog phosphorylated to a fake nucleotide that stops chain elongation. B: That is nevirapine (NNRTI). C: Integrase inhibitors (raltegravir). D: Enfuvirtide. E: Maraviroc.","source_slide":"L05 Antivirals, slides 10, 12"},{"id":"FND-MICRO-L05-07","block":"Foundations","lecture":"L05 Antivirals","discipline":"Microbiology","style":"LAU","stem":"How do type I interferons released by a virus-infected cell protect neighboring cells?","options":{"A":"They neutralize free virions in the blood","B":"They activate macrophages as their main action","C":"They induce proteins that degrade viral mRNA and block viral protein synthesis","D":"They block the CCR5 co-receptor","E":"They inhibit neuraminidase"},"answer":"C","explanation":"Type I IFN (α, β) binds neighboring cells and induces an antiviral state (viral mRNA degradation, blocked viral protein synthesis) and raises MHC expression. A: Antibodies neutralize virions. B: Macrophage activation is mainly type II (IFN-γ). D: That is maraviroc. E: That is oseltamivir/zanamivir.","source_slide":"L05 Antivirals, slides 22–25"},{"id":"FND-MICRO-L05-08","block":"Foundations","lecture":"L05 Antivirals","discipline":"Microbiology","style":"LAU","stem":"Why do influenza A and hepatitis C virus develop antiviral resistance faster than herpesviruses?","options":{"A":"They have larger genomes","B":"They replicate more slowly","C":"They use host DNA polymerase for replication","D":"They become latent in sensory neurons","E":"Their RNA polymerases lack proofreading"},"answer":"E","explanation":"RNA polymerases lack proofreading, giving high error rates and many resistance mutations. A: RNA viruses have small genomes (<30 kb). B: Faster, not slower, replication increases mutations. C: DNA viruses use host machinery with proofreading, so they mutate less. D: Latency is a herpesvirus feature and does not drive resistance.","source_slide":"L05 Antivirals, slide 28"},{"id":"FND-MICRO-L06-01","block":"Foundations","lecture":"L06 Bacteria","discipline":"Microbiology","style":"LAU","stem":"After Gram staining, an organism appears pink. Which cell-wall feature explains this?","options":{"A":"Thick peptidoglycan with teichoic acid","B":"Waxy wall rich in mycolic acid","C":"No cell wall, with sterols in the membrane","D":"Thin peptidoglycan with an outer membrane","E":"A polysaccharide capsule"},"answer":"D","explanation":"Gram-negative walls are decolorized by alcohol and take up safranin (pink). A: Gram-positive walls retain the violet. B: Mycolic acid walls (M. tuberculosis) are not Gram-stained; Ziehl-Neelsen is used. C: Wall-less Mycoplasma stain poorly. E: Capsules appear as an unstained halo.","source_slide":"L06 Bacteria, slides 15–16, 21"},{"id":"FND-MICRO-L06-02","block":"Foundations","lecture":"L06 Bacteria","discipline":"Microbiology","style":"LAU","stem":"Which component is responsible for fever and shock in Gram-negative sepsis?","options":{"A":"Teichoic acid","B":"Peptidoglycan","C":"Lipid A of LPS","D":"O polysaccharide","E":"Porins"},"answer":"C","explanation":"Lipid A is endotoxin, released on lysis. A: Teichoic acid is Gram-positive (adhesion). B: Peptidoglycan isn't the endotoxin. D: The O polysaccharide is the antigenic part. E: Porins are channels.","source_slide":"L06 Bacteria, slide 15"},{"id":"FND-MICRO-L06-03","block":"Foundations","lecture":"L06 Bacteria","discipline":"Microbiology","style":"LAU","stem":"Surgical instruments are contaminated with Clostridium spores. Which method reliably destroys the spores?","options":{"A":"Boiling for 30 minutes","B":"Autoclaving with steam at 121 °C for 20 minutes","C":"Soaking in a chemical disinfectant","D":"Exposure to sunlight","E":"Treatment with lysozyme"},"answer":"B","explanation":"Spores (dehydrated, calcium dipicolinate, metabolically inert, many layers) resist boiling and chemicals but are killed by autoclaving. A: Spores resist boiling. C: Spores resist chemical sterilization. D: UV kills vegetative bacteria, not reliably spores. E: Lysozyme damages vegetative cell walls (forms L-forms), not spores.","source_slide":"L06 Bacteria, slides 44, 46–47"},{"id":"FND-MICRO-L06-04","block":"Foundations","lecture":"L06 Bacteria","discipline":"Microbiology","style":"LAU","stem":"A UTI fails to respond to antibiotics because resistance genes spread from one E. coli strain to another. Which element most likely transferred them?","options":{"A":"Non-conjugative plasmid","B":"Transposon","C":"Ordinary pili","D":"Flagellum","E":"Conjugative plasmid"},"answer":"E","explanation":"Conjugative plasmids (large, F factor/tra gene, common in Gram-negative bacilli) form sex pili and transfer R genes between cells. A: Non-conjugative plasmids cannot transfer under normal conditions. B: Transposons move genes within a cell. C: Ordinary pili mediate adherence; sex pili mediate conjugation. D: Flagella give motility.","source_slide":"L06 Bacteria, slides 52, 58, 69"},{"id":"FND-MICRO-L06-05","block":"Foundations","lecture":"L06 Bacteria","discipline":"Microbiology","style":"LAU","stem":"Which property distinguishes exotoxins from endotoxins?","options":{"A":"Exotoxins are lipid A","B":"Exotoxins can be converted into toxoids for vaccination","C":"Exotoxins are heat-stable","D":"Exotoxins are released only on cell lysis","E":"Exotoxins are weakly immunogenic"},"answer":"B","explanation":"Formalin-treated exotoxins become antigenic, non-toxic toxoids (tetanus, diphtheria). A: Lipid A is endotoxin. C: Exotoxins are heat-labile. D: Exotoxins are secreted by living cells. E: They are strongly immunogenic.","source_slide":"L06 Bacteria, slides 65–66"},{"id":"FND-MICRO-L06-06","block":"Foundations","lecture":"L06 Bacteria","discipline":"Microbiology","style":"LAU","stem":"Penicillin-treated Gram-negative bacteria lose their walls but regrow them when the drug is removed. These forms are:","options":{"A":"Mycoplasma","B":"Protoplasts","C":"Spheroplasts","D":"Spores","E":"Acid-fast bacilli"},"answer":"C","explanation":"Wall-deficient L-forms from Gram-negatives are spheroplasts and can revert. A: Mycoplasma genetically lacks a wall and doesn't revert. B: Protoplasts come from Gram-positives. D: Spores are resting forms. E: Acid-fast bacilli have waxy walls.","source_slide":"L06 Bacteria, slide 20"},{"id":"FND-MICRO-L06-07","block":"Foundations","lecture":"L06 Bacteria","discipline":"Microbiology","style":"Step1","stem":"A 30-year-old man has fever, cough, and diarrhea after a hotel stay; the organism grows inside alveolar macrophages by blocking phagosome–lysosome fusion. Which organism shares this survival mechanism?","options":{"A":"Mycobacterium tuberculosis","B":"Listeria monocytogenes","C":"Staphylococcus aureus","D":"Streptococcus pyogenes","E":"Neisseria gonorrhoeae"},"answer":"A","explanation":"Legionella and mycobacteria inhibit phagolysosome fusion. B: Listeria escapes the phagosome into the cytoplasm. C: S. aureus uses protein A and coagulase. D: S. pyogenes uses M protein. E: Neisseria uses pili and IgA protease.","source_slide":"L06 Bacteria, slide 64"},{"id":"FND-MICRO-L06-08","block":"Foundations","lecture":"L06 Bacteria","discipline":"Microbiology","style":"Step1","stem":"A 2-year-old has repeated pneumococcal infections. Serotype-specific capsule swelling is seen when the isolate is mixed with antiserum. Which property makes the capsule a key virulence factor?","options":{"A":"It contains lipid A (endotoxin)","B":"It degrades secretory IgA at mucosa","C":"It converts fibrinogen to fibrin","D":"It inhibits phagocytosis","E":"It mediates adherence via pilin"},"answer":"D","explanation":"Capsules are antiphagocytic; serotype-specific swelling (Quellung) is the basis of serotyping and vaccines. A: Lipid A is in the Gram-negative outer membrane. B: IgA protease is a Neisseria enzyme. C: Coagulase is a S. aureus enzyme. E: Pili are made of pilin, not capsule.","source_slide":"L06 Bacteria, slides 34, 38, 40"},{"id":"FND-MICRO-L06-09","block":"Foundations","lecture":"L06 Bacteria","discipline":"Microbiology","style":"LAU","stem":"Staphylococci colonize an IV catheter within a loosely bound polysaccharide layer that protects them from antibiotics and immune cells. This layer is the:","options":{"A":"Slime layer (glycocalyx) forming a biofilm","B":"Capsule","C":"Outer membrane","D":"Peptidoglycan cortex","E":"Teichoic acid layer"},"answer":"A","explanation":"Slime (glycocalyx) is loosely attached and secreted, binding bacteria to each other and to catheters or valves as a biofilm. B: A capsule is firmly attached and well-defined. C: Staphylococci are Gram-positive with no outer membrane. D: A peptidoglycan cortex is part of a spore. E: Teichoic acid aids adhesion but is part of the cell wall.","source_slide":"L06 Bacteria, slides 35–36, 61"},{"id":"FND-MICRO-L06-10","block":"Foundations","lecture":"L06 Bacteria","discipline":"Microbiology","style":"Step1","stem":"A man with a crush injury develops rapidly spreading gas gangrene from Clostridium perfringens. Which enzyme degrades a fatty component of human tissue cell membranes?","options":{"A":"Collagenase","B":"Hyaluronidase","C":"Coagulase","D":"Streptokinase","E":"Lecithinase"},"answer":"E","explanation":"C. perfringens lecithinase degrades lecithin, a fatty component of human tissues. A: Collagenase (also C. perfringens) degrades collagen. B: Hyaluronidase degrades hyaluronic acid. C: Coagulase (S. aureus) converts fibrinogen to fibrin. D: Streptokinase (S. pyogenes) lyses fibrin clots.","source_slide":"L06 Bacteria, slide 63"},{"id":"FND-MICRO-L07-01","block":"Foundations","lecture":"L07 Fungal Infections and Antifungals","discipline":"Microbiology","style":"LAU","stem":"An antifungal kills Candida by inhibiting synthesis of β-(1,3)-glucan, a component of the fungal cell wall. Which drug is it?","options":{"A":"Amphotericin B","B":"Caspofungin","C":"Voriconazole","D":"Flucytosine","E":"Terbinafine"},"answer":"B","explanation":"Echinocandins (caspofungin, micafungin, anidulafungin) inhibit glucan synthase; they are fungicidal against Candida but only disrupt the growing wall of Aspergillus. A: Polyene; binds membrane ergosterol and forms pores. C: Azole; blocks ergosterol synthesis. D: Converted to 5-FU; disrupts RNA and DNA synthesis. E: Allylamine; inhibits squalene epoxidase.","source_slide":"L07 Fungal Structure and Identification, slides 22–25, 33–35"},{"id":"FND-MICRO-L07-02","block":"Foundations","lecture":"L07 Fungal Infections and Antifungals","discipline":"Microbiology","style":"LAU","stem":"Which enzyme do azole antifungals such as fluconazole inhibit?","options":{"A":"Squalene epoxidase","B":"β-(1,3)-glucan synthase","C":"Thymidylate synthase","D":"Chitin synthase","E":"Lanosterol 14α-demethylase"},"answer":"E","explanation":"Azoles inhibit the fungal cytochrome P-450 enzyme 14α-demethylase (lanosterol → ergosterol), damaging the cell membrane; CYP-450 inhibition also explains their drug–drug interactions. A: Target of allylamines (terbinafine). B: Target of echinocandins. C: Blocked by flucytosine's metabolite 5-FdUMP. D: No antifungal class in the lecture targets it.","source_slide":"L07 Fungal Structure and Identification, slides 22–25, 30"},{"id":"FND-MICRO-L07-03","block":"Foundations","lecture":"L07 Fungal Infections and Antifungals","discipline":"Microbiology","style":"Step1","stem":"A 52-year-old man with diabetic ketoacidosis develops facial pain, fever and a black necrotic lesion on the nasal mucosa. Biopsy shows broad, irregular, nonseptate hyphae branching at right angles. Blood cultures are negative. Besides correcting the ketoacidosis, what is the most appropriate management?","options":{"A":"Oral fluconazole","B":"Caspofungin alone","C":"Itraconazole","D":"Surgical debridement plus lipid amphotericin B","E":"Amphotericin B plus flucytosine, then fluconazole"},"answer":"D","explanation":"Broad, nonseptate, right-angle hyphae in a diabetic with ketoacidosis indicate mucormycosis (Zygomycetes); treatment combines aggressive surgical debridement with lipid amphotericin B (or posaconazole). Blood cultures are of no benefit. A: Fluconazole is mainly for Candida. B: Echinocandins are not active against Zygomycetes. C: Itraconazole is the usual drug for endemic mycoses. E: Induction regimen for cryptococcal meningitis.","source_slide":"L07 Fungal Structure and Identification, slides 5, 11, 36, 102, 104"},{"id":"FND-MICRO-L07-04","block":"Foundations","lecture":"L07 Fungal Infections and Antifungals","discipline":"Microbiology","style":"Step1","stem":"A 34-year-old man with HIV (CD4 count 60/µL) has two weeks of headache and fever. Lumbar puncture shows a high opening pressure, and India ink staining of the CSF shows encapsulated yeasts. Which is the most appropriate initial treatment?","options":{"A":"Caspofungin","B":"Oral fluconazole alone","C":"Amphotericin B plus flucytosine for 14 days","D":"Voriconazole","E":"Surgical debridement plus posaconazole"},"answer":"C","explanation":"Cryptococcal meningitis is treated with amphotericin B plus flucytosine for 14 days, then oral fluconazole for 8–10 weeks; CSF is removed to keep pressure below 20 cm H2O. A: Echinocandins are not active against Cryptococcus. B: Fluconazole is the consolidation step, not induction. D: Extended-spectrum triazole aimed at Aspergillus and other moulds. E: Management of mucormycosis.","source_slide":"L07 Fungal Structure and Identification, slides 5, 36, 105, 108, 110"},{"id":"FND-MICRO-L07-05","block":"Foundations","lecture":"L07 Fungal Infections and Antifungals","discipline":"Microbiology","style":"LAU","stem":"Which CSF test is the most sensitive for diagnosing cryptococcal meningitis?","options":{"A":"Latex agglutination for cryptococcal antigen","B":"India ink stain","C":"Galactomannan ELISA","D":"PNA-FISH probe for 26S rRNA","E":"Germ tube test"},"answer":"A","explanation":"Cryptococcal antigen by latex agglutination in CSF has a sensitivity of >90%. B: India ink shows encapsulated yeasts but is only 50–75% sensitive. C: Galactomannan is a cell-wall antigen used for Aspergillus. D: Distinguishes C. albicans from non-albicans Candida. E: A rapid test to speciate Candida.","source_slide":"L07 Fungal Structure and Identification, slides 61–62, 108"},{"id":"FND-MICRO-L07-06","block":"Foundations","lecture":"L07 Fungal Infections and Antifungals","discipline":"Microbiology","style":"LAU","stem":"Which patient with proven invasive candidiasis should receive an echinocandin rather than fluconazole as initial therapy?","options":{"A":"A patient with mild illness and no previous azole exposure","B":"A neutropenic patient who is severely ill","C":"A patient with suspected CNS involvement","D":"A patient with asymptomatic candiduria and a urinary catheter","E":"A young non-diabetic patient at low risk for C. glabrata"},"answer":"B","explanation":"Neutropenia, severe illness, or suspected cardiac valve/myocardial involvement call for an echinocandin or an amphotericin formulation first. A, E: These are the criteria for first-line fluconazole. C: Give amphotericin B; echinocandins penetrate the CNS poorly. D: Modify risk factors; it rarely requires treatment.","source_slide":"L07 Fungal Structure and Identification, slides 57, 65–66"},{"id":"FND-MICRO-L07-07","block":"Foundations","lecture":"L07 Fungal Infections and Antifungals","discipline":"Microbiology","style":"Step1","stem":"A farmer from the Mississippi valley has chronic cough and skin lesions. Tissue biopsy shows large (8–15 µm) yeasts with a single daughter cell attached by a broad base. Culture at room temperature grows a mould. Which organism is most likely?","options":{"A":"Histoplasma capsulatum","B":"Cryptococcus neoformans","C":"Coccidioides immitis","D":"Paracoccidioides brasiliensis","E":"Blastomyces dermatitidis"},"answer":"E","explanation":"Blastomyces is a dimorphic endemic fungus of the Ohio/Mississippi valleys: mould in the environment, large yeast with broad-based budding in tissue. A: Same region, but small (2–3 µm) intracellular budding yeasts. B: Not dimorphic; capsule with a narrow pore between mother and daughter. C: US Southwest; non-budding spherules with endospores. D: Latin America; multiple buds on one mother cell.","source_slide":"L07 Fungal Structure and Identification, slides 4, 11, 14, 112, 114"},{"id":"FND-MICRO-L07-08","block":"Foundations","lecture":"L07 Fungal Infections and Antifungals","discipline":"Microbiology","style":"LAU","stem":"During treatment of invasive fungal infection, a patient develops a rising creatinine with low serum potassium and magnesium. Which drug is the most likely cause?","options":{"A":"Caspofungin","B":"Flucytosine","C":"Voriconazole","D":"Amphotericin B deoxycholate","E":"Fluconazole"},"answer":"D","explanation":"Polyene toxicity is nephrotoxicity, hypokalemia and hypomagnesemia; lipid (especially liposomal) formulations are less nephrotoxic. A: Echinocandins have a good safety profile. B: Causes bone marrow suppression. C: Causes blurry vision; azoles also cause liver toxicity and drug interactions. E: Azole toxicity is mainly hepatic and drug interactions, not renal wasting.","source_slide":"L07 Fungal Structure and Identification, slides 27, 29–30, 33, 38"},{"id":"FND-PATH-L0203-01","block":"Foundations","lecture":"L02-03 Cell Injury","discipline":"Pathology","style":"LAU","stem":"A tracheal biopsy from a 43-year-old smoker shows stratified squamous epithelium where pseudostratified ciliated columnar epithelium is expected. Which statement best describes this change?","options":{"A":"Dysplasia; the change is irreversible","B":"Metaplasia; mucociliary clearance is lost","C":"Hyperplasia; mucociliary clearance is lost","D":"Metaplasia; the change is irreversible","E":"Atrophy; the epithelium has shrunk"},"answer":"B","explanation":"Metaplasia is a reversible replacement of one differentiated cell type by another that better tolerates chronic stress; squamous epithelium resists smoke but sacrifices mucociliary function. A: Dysplasia is disordered growth with atypia, not replacement by another normal cell type. C: Hyperplasia increases cell number without changing cell type. D: Metaplasia is reversible if the stimulus is removed. E: Atrophy is shrinkage, not a change of cell type.","source_slide":"L02-03 Cell Injury, notes p2; tutorial s19, s22"},{"id":"FND-PATH-L0203-02","block":"Foundations","lecture":"L02-03 Cell Injury","discipline":"Pathology","style":"LAU","stem":"After an acetaminophen overdose, which finding indicates that hepatocytes have crossed into irreversible injury?","options":{"A":"Cellular swelling with dilated ER","B":"Fatty change","C":"Membrane blebs with loss of microvilli","D":"Leakage of AST and ALT into blood","E":"Clumping of nuclear chromatin"},"answer":"D","explanation":"Loss of plasma membrane integrity lets intracellular enzymes leak into the blood: a hallmark of irreversible injury (along with pyknosis, karyorrhexis, karyolysis). A: Swelling and ER dilation reflect ion-pump failure and are reversible. B: Fatty change is reversible. C: Blebs form while the membrane is still intact (reversible). E: Chromatin clumping is reversible; pyknosis, karyorrhexis and karyolysis are irreversible.","source_slide":"L02-03 Cell Injury, notes p4; tutorial s26–30"},{"id":"FND-PATH-L0203-03","block":"Foundations","lecture":"L02-03 Cell Injury","discipline":"Pathology","style":"LAU","stem":"A 75-year-old man dies 3 weeks after a large stroke. The infarcted area of brain is soft and cystic. Which pattern of necrosis is this?","options":{"A":"Coagulative","B":"Caseous","C":"Liquefactive","D":"Fibrinoid","E":"Fat"},"answer":"C","explanation":"Ischemic injury in the CNS produces liquefactive necrosis: tissue is digested into a soft mass that later becomes a cyst. A: Coagulative necrosis is typical of ischemia in other solid organs. B: Caseous necrosis is seen in TB granulomas. D: Fibrinoid necrosis affects vessel walls. E: Fat necrosis occurs in pancreatitis and breast.","source_slide":"L02-03 Cell Injury, notes p5; tutorial s43"},{"id":"FND-PATH-L0203-04","block":"Foundations","lecture":"L02-03 Cell Injury","discipline":"Pathology","style":"LAU","stem":"Which feature favors apoptosis over necrosis?","options":{"A":"Apoptotic bodies cleared with little inflammation","B":"Cell swelling with membrane rupture","C":"Pyknosis, karyorrhexis, then karyolysis","D":"Death of large groups of adjacent cells","E":"Leakage of cell contents into the blood"},"answer":"A","explanation":"Apoptosis: shrinkage, intact membrane, apoptotic bodies rapidly phagocytosed with minimal inflammation, usually single cells or small clusters. B: Swelling and rupture are necrosis. C: This nuclear sequence (ending in karyolysis) is listed for necrosis; apoptosis shows chromatin condensation and fragmentation. D: Necrosis often affects groups of adjacent cells. E: Leakage of contents is necrosis.","source_slide":"L02-03 Cell Injury, notes p6–7; tutorial s46"},{"id":"FND-PATH-L0203-05","block":"Foundations","lecture":"L02-03 Cell Injury","discipline":"Pathology","style":"LAU","stem":"Coronary flow is restored by angioplasty 4 hours after occlusion, but serum troponin rises further and some still-viable myocytes die. Which mechanism best explains this?","options":{"A":"Apoptosis from growth-factor withdrawal","B":"Fatty change from impaired lipid metabolism","C":"Pyroptosis triggered by bacterial infection","D":"Dystrophic calcification of myocytes","E":"Reperfusion injury from ROS and calcium overload"},"answer":"E","explanation":"Restoring flow to still-viable ischemic tissue can worsen injury: more ROS, calcium overload, inflammation, and complement activation. A: Growth-factor withdrawal isn't the trigger here. B: Fatty change is a reversible accumulation, not a cause of cell death. C: There is no infection; pyroptosis is an inflammasome response to microbes. D: Calcification follows necrosis; it doesn't cause it.","source_slide":"L02-03 Cell Injury, notes p4; tutorial s40"},{"id":"FND-PATH-L0203-06","block":"Foundations","lecture":"L02-03 Cell Injury","discipline":"Pathology","style":"Step1","stem":"A lymph node biopsy shows back-to-back follicles. Immunostaining shows strong BCL-2 in the follicle centers, and a t(14;18) translocation is found. What is the effect of BCL-2 overexpression?","options":{"A":"Activates caspase-8 at death receptors","B":"Promotes cytochrome c release from mitochondria","C":"Blocks mitochondrial outer-membrane permeabilization","D":"Activates p53 after DNA damage","E":"Activates MLKL to trigger necroptosis"},"answer":"C","explanation":"BCL-2 opposes BAX/BAK, preventing cytochrome c release and intrinsic apoptosis, so B cells survive and accumulate (follicular lymphoma). A: Caspase-8 belongs to the extrinsic (death-receptor) pathway. B: BCL-2 prevents cytochrome c release. D: BCL-2 doesn't activate p53. E: MLKL is activated by RIPK1/RIPK3 in necroptosis.","source_slide":"L02-03 Cell Injury, notes p6; tutorial s45"},{"id":"FND-PATH-L0203-07","block":"Foundations","lecture":"L02-03 Cell Injury","discipline":"Pathology","style":"Step1","stem":"A 45-year-old man with alcohol use disorder has acute epigastric pain radiating to the back and elevated lipase. At surgery, chalky white deposits are seen in the peripancreatic fat. What process produced them?","options":{"A":"Dystrophic calcification of caseous material","B":"Metastatic calcification from hypercalcemia","C":"Coagulative necrosis of acinar cells","D":"Fibrinoid necrosis of peripancreatic vessels","E":"Saponification of fatty acids with calcium"},"answer":"E","explanation":"Enzymatic fat necrosis: pancreatic lipases release fatty acids that bind calcium (saponification), giving chalky white deposits. A: Caseous necrosis is TB. B: Metastatic calcification needs hypercalcemia and occurs in normal tissue. C: Acinar necrosis doesn't produce chalky deposits in fat. D: Fibrinoid necrosis affects vessel walls.","source_slide":"L02-03 Cell Injury, notes p5; tutorial s48–49"},{"id":"FND-PATH-L0203-08","block":"Foundations","lecture":"L02-03 Cell Injury","discipline":"Pathology","style":"LAU","stem":"In a macrophage infected with bacteria, inflammasome activation triggers caspase-1, which cleaves gasdermin D. Pores form, the cell swells and ruptures, and IL-1β is released. Which form of cell death is this?","options":{"A":"Necroptosis","B":"Pyroptosis","C":"Ferroptosis","D":"Apoptosis","E":"Autophagy"},"answer":"B","explanation":"Pyroptosis: inflammasome → caspase-1 → gasdermin D pores, swelling and rupture; caspase-1 also activates IL-1β and IL-18. A: Necroptosis uses RIPK1/RIPK3 → MLKL. C: Ferroptosis is iron-dependent lipid peroxidation when glutathione-GPX4 defenses fail. D: Apoptosis keeps the membrane intact with little inflammation. E: Autophagy is mainly a survival response.","source_slide":"L02-03 Cell Injury, notes p7; tutorial s33–34"},{"id":"FND-PATH-L0203-09","block":"Foundations","lecture":"L02-03 Cell Injury","discipline":"Pathology","style":"LAU","stem":"A 65-year-old with long-standing aortic stenosis has a thick-walled left ventricle. Which change explains the myocardial enlargement?","options":{"A":"More myocytes from cell division","B":"Replacement of myocytes by a more resistant cell type","C":"Disordered myocyte growth with nuclear atypia","D":"Larger myocytes from more structural proteins and organelles","E":"Triglyceride accumulation within myocytes"},"answer":"D","explanation":"Cardiac myocytes have limited capacity to divide, so pressure overload causes hypertrophy: increased synthesis of structural proteins and organelles. A: Hyperplasia requires cells that can divide. B: That is metaplasia. C: That is dysplasia. E: That is fatty change, a form of reversible injury.","source_slide":"L02-03 Cell Injury, notes p1; tutorial s5–6"},{"id":"FND-PATH-L04-01","block":"Foundations","lecture":"L04 Cell Death and Intracellular Accumulations","discipline":"Pathology","style":"LAU","stem":"A 70-year-old has a calcified, stenotic aortic valve. Serum calcium and phosphate are normal. Which process explains the calcification?","options":{"A":"Dystrophic calcification","B":"Metastatic calcification","C":"Hemosiderosis","D":"Lipofuscin deposition","E":"Steatosis"},"answer":"A","explanation":"Calcium deposits in damaged tissue with normal serum calcium: dystrophic. B: Metastatic calcification requires hypercalcemia and affects normal tissue. C: Hemosiderin is iron. D: Lipofuscin is wear-and-tear pigment. E: Steatosis is fat.","source_slide":"L04 Cell Death and Intracellular Accumulations, slides 30–32"},{"id":"FND-PATH-L04-02","block":"Foundations","lecture":"L04 Cell Death and Intracellular Accumulations","discipline":"Pathology","style":"LAU","stem":"A liver biopsy shows coarse golden-brown granules in hepatocytes that stain blue with Perls stain. Which pigment is it?","options":{"A":"Lipofuscin","B":"Bilirubin","C":"Melanin","D":"Hemosiderin","E":"Carbon"},"answer":"D","explanation":"Iron-containing hemosiderin is Prussian/Perls blue positive (e.g., hemochromatosis). A: Lipofuscin is Perls negative. B: Bilirubin is yellow-green and Perls negative. C: Melanin is Perls negative. E: Carbon is black (anthracosis).","source_slide":"L04 Cell Death and Intracellular Accumulations, slide 28"},{"id":"FND-PATH-L04-03","block":"Foundations","lecture":"L04 Cell Death and Intracellular Accumulations","discipline":"Pathology","style":"LAU","stem":"A kidney section shows a wedge-shaped pale area where tubular and glomerular outlines are preserved but nuclei are absent, with inflammatory cells at the edge. What is the diagnosis?","options":{"A":"Renal abscess with liquefactive necrosis","B":"Caseous granuloma","C":"Infarct with coagulative necrosis","D":"Fat necrosis","E":"Fibrinoid necrosis of glomeruli"},"answer":"C","explanation":"Preserved architecture without nuclei = coagulative necrosis from ischemia. A: An abscess destroys architecture. B: Caseous necrosis has granulomas. D: Fat necrosis affects adipose tissue. E: Fibrinoid necrosis is in vessel walls.","source_slide":"L04 Cell Death and Intracellular Accumulations, slides 4–5, 11"},{"id":"FND-PATH-L04-04","block":"Foundations","lecture":"L04 Cell Death and Intracellular Accumulations","discipline":"Pathology","style":"LAU","stem":"A lung lymph node from a city dweller has macrophages packed with black pigment. The patient has no respiratory symptoms. What is this?","options":{"A":"Hemosiderin-laden macrophages","B":"Melanosis","C":"Lipofuscinosis","D":"Caseous necrosis","E":"Anthracosis"},"answer":"E","explanation":"Inhaled carbon (exogenous pigment) in macrophages is anthracosis, usually harmless. A: Hemosiderin is golden-brown. B: Melanin is endogenous, mainly in skin. C: Lipofuscin is yellow-brown and intracellular. D: Caseous necrosis is a granulomatous necrosis.","source_slide":"L04 Cell Death and Intracellular Accumulations, slides 24–25"},{"id":"FND-PATH-L04-05","block":"Foundations","lecture":"L04 Cell Death and Intracellular Accumulations","discipline":"Pathology","style":"Step1","stem":"A 60-year-old man with multiple myeloma has a serum calcium of 14 mg/dL. Calcium deposits are found in previously normal kidneys, lungs, and gastric mucosa. Which process is this?","options":{"A":"Dystrophic calcification","B":"Metastatic calcification","C":"Psammoma body formation","D":"Saponification as in fat necrosis","E":"Hemosiderin deposition"},"answer":"B","explanation":"Hypercalcemia causes calcium deposition in normal tissues: metastatic calcification. A: Dystrophic calcification occurs in injured or dead tissue with normal calcium metabolism. C: Psammoma bodies are a form of dystrophic calcification in some tumors (outside slides). D: Saponification is calcium binding fatty acids in necrotic fat, not driven by hypercalcemia. E: Hemosiderin is an iron pigment, not calcium.","source_slide":"L04 Cell Death and Intracellular Accumulations, slide 30"},{"id":"FND-PATH-L04-06","block":"Foundations","lecture":"L04 Cell Death and Intracellular Accumulations","discipline":"Pathology","style":"LAU","stem":"A 68-year-old with diabetes and peripheral arterial disease has a black, dry, shriveled toe. Over several days it becomes swollen, moist, and foul-smelling. What best explains the change?","options":{"A":"Ischemia progressed to caseous necrosis","B":"Trauma caused fat necrosis of the toe","C":"Superimposed infection caused liquefaction","D":"Vasculitis caused fibrinoid necrosis","E":"Dry gangrene underwent dystrophic calcification"},"answer":"C","explanation":"Dry gangrene is coagulative necrosis of an ischemic limb; superimposed bacterial infection adds liquefactive action of bacteria and leukocytes = wet gangrene. A: Caseous necrosis is seen in TB granulomas. B: Fat necrosis occurs in pancreatitis and breast. D: Fibrinoid necrosis is a vessel-wall pattern. E: Calcification wouldn't make the toe moist and foul-smelling.","source_slide":"L04 Cell Death and Intracellular Accumulations, slides 21–22"},{"id":"FND-PATH-L04-07","block":"Foundations","lecture":"L04 Cell Death and Intracellular Accumulations","discipline":"Pathology","style":"LAU","stem":"At autopsy, the heart of an 88-year-old is small and brown. Myocytes contain fine brownish-yellow granules that are negative on Perls stain. What is the pigment?","options":{"A":"Hemosiderin","B":"Melanin","C":"Bilirubin","D":"Carbon","E":"Lipofuscin"},"answer":"E","explanation":"Lipofuscin is the brownish-yellow wear-and-tear pigment of aging and atrophy (heart, liver, brain). A: Hemosiderin is Perls/Prussian blue positive. B: Melanin is made by epidermal melanocytes. C: Bilirubin gives a diffuse yellow color (jaundice). D: Carbon is black (anthracosis).","source_slide":"L04 Cell Death and Intracellular Accumulations, slides 28, 35"},{"id":"FND-PATH-L0506-01","block":"Foundations","lecture":"L05-06 Tissue Repair","discipline":"Pathology","style":"LAU","stem":"A patient survives a large myocardial infarction. Six weeks later, what will most likely occupy the infarcted area?","options":{"A":"Regenerated cardiac myocytes","B":"Gliosis","C":"Hyperplastic myocytes","D":"Collagenous scar","E":"Granuloma"},"answer":"D","explanation":"Cardiac myocytes are essentially permanent cells; major loss heals by collagen scar. A: Regeneration is insufficient. B: Gliosis is the CNS response. C: Myocytes don't undergo hyperplasia. E: A granuloma is a macrophage aggregate.","source_slide":"L05-06 Tissue Repair, notes p2"},{"id":"FND-PATH-L0506-02","block":"Foundations","lecture":"L05-06 Tissue Repair","discipline":"Pathology","style":"LAU","stem":"Which growth factor is the major mediator of fibrosis, increasing collagen synthesis while reducing ECM degradation?","options":{"A":"VEGF","B":"PDGF","C":"HGF","D":"FGF-2","E":"TGF-β"},"answer":"E","explanation":"TGF-β is the major mediator of fibrosis: it activates fibroblasts and increases collagen/ECM synthesis while reducing ECM degradation. A: VEGF drives angiogenesis. B: PDGF drives fibroblast migration and proliferation but isn't the main fibrogenic mediator. C: HGF drives hepatocyte proliferation. D: FGF-2 drives fibroblast proliferation and angiogenesis.","source_slide":"L05-06 Tissue Repair, notes p3, p5"},{"id":"FND-PATH-L0506-03","block":"Foundations","lecture":"L05-06 Tissue Repair","discipline":"Pathology","style":"LAU","stem":"A clean surgical incision is sutured. About 3 days later, which finding is expected?","options":{"A":"Macrophages and early granulation tissue","B":"Neutrophils with no epithelial bridging","C":"A mature, hypocellular collagen scar","D":"Wound strength at ~80% of normal","E":"Regenerated hair follicles in the scar"},"answer":"A","explanation":"By ~day 3 macrophages replace neutrophils and granulation tissue begins to fill the incision. B: Neutrophils dominate in the first 24 h, and epithelium bridges by 24–48 h. C: A mature scar takes ~1 month. D: ~80% strength takes ~3 months. E: Appendages aren't restored in a scar.","source_slide":"L05-06 Tissue Repair, notes p7"},{"id":"FND-PATH-L0506-04","block":"Foundations","lecture":"L05-06 Tissue Repair","discipline":"Pathology","style":"LAU","stem":"A patient on long-term high-dose prednisone has an abdominal wound that separates on postoperative day 7. Which mechanism most contributed?","options":{"A":"Excess TGF-β-driven fibrosis","B":"Keloid formation at the incision","C":"Suppressed inflammation and collagen synthesis","D":"TIMP excess blocking matrix turnover","E":"Excessive myofibroblast wound contraction"},"answer":"C","explanation":"Glucocorticoids impair healing by suppressing inflammation and collagen synthesis → weak wound → dehiscence. A: Excess TGF-β causes fibrosis. B: A keloid is excess scar. D: More TIMP activity would favor matrix accumulation. E: Contraction isn't the cause of dehiscence.","source_slide":"L05-06 Tissue Repair, notes p6, p8"},{"id":"FND-PATH-L0506-05","block":"Foundations","lecture":"L05-06 Tissue Repair","discipline":"Pathology","style":"LAU","stem":"Which tissue is composed of stable (quiescent) cells that can re-enter the cell cycle after injury?","options":{"A":"Epidermis","B":"Renal tubular epithelium","C":"Urothelium","D":"Mature skeletal muscle fibers","E":"Intestinal epithelium"},"answer":"B","explanation":"Renal tubular cells are stable: normally in G0, they divide after injury (repair also needs preserved tubular basement membranes). A, C, E: Labile, continuously renewing tissues. D: Mature skeletal muscle fibers don't divide; limited regeneration comes from satellite cells.","source_sl
