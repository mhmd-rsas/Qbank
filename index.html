"E":"262 mOsm/kg"},"answer":"B","explanation":"Total osmoles 42 × 290 = 12,180; new TBW 45 L → 271 mOsm/kg in all compartments (ICF 30 L, ECF 15 L; water splits 2/3 : 1/3). A: Water dilutes all compartments. C: Keeps all 3 L in the ECF (4060/17). D: Subtracts the water instead of adding it. E: Puts all 3 L into the ICF (8120/31).","source_slide":"L09 Transmembrane Fluid Movement, slides 20–22"},{"id":"FND-PHYS-L09-03","block":"Foundations","lecture":"L09 Transmembrane Fluid Movement","discipline":"Physiology","style":"LAU","stem":"Red cells are placed in 300 mM urea. What happens?","options":{"A":"They swell, because urea enters and water follows","B":"They shrink, because urea draws water out","C":"No change, because the solution is isosmotic","D":"No change, because urea is an impermeant solute","E":"They shrink, then return to normal volume"},"answer":"A","explanation":"300 mM urea is isosmotic but hypotonic: urea is permeant, equilibrates across the membrane, and exerts no effective osmotic force, so water enters and cells swell (may burst). B: Urea isn't an effective osmole. C: Isosmotic doesn't mean isotonic. D: Urea is permeant. E: There is no initial shrinkage in the lecture's model.","source_slide":"L09 Transmembrane Fluid Movement, slides 7, 9"},{"id":"FND-PHYS-L09-04","block":"Foundations","lecture":"L09 Transmembrane Fluid Movement","discipline":"Physiology","style":"LAU","stem":"Which IV fluid is approximately isosmotic in the bag, yet expands both ECF and ICF after infusion?","options":{"A":"0.9% NaCl","B":"0.45% NaCl","C":"5% dextrose in water","D":"Mannitol","E":"Lactated Ringer's"},"answer":"C","explanation":"D5W (~252 mOsm/L) is near-isosmotic, but glucose is metabolized, leaving free water that distributes into ECF and ICF. A: Isotonic saline stays in the ECF. B: 0.45% NaCl also expands both, but it is hyposmotic in the bag (~154 mOsm/L). D: Mannitol is hyperosmotic and shrinks the ICF. E: Lactated Ringer's is clinically isotonic and stays in the ECF.","source_slide":"L09 Transmembrane Fluid Movement, slides 23, 26"},{"id":"FND-PHYS-L09-05","block":"Foundations","lecture":"L09 Transmembrane Fluid Movement","discipline":"Physiology","style":"Step1","stem":"A 30-year-old man with a severe head injury has rising intracranial pressure. IV mannitol is given. Which change explains its immediate effect?","options":{"A":"It enters neurons and raises their osmolality","B":"It lowers plasma osmolality, so water leaves the brain","C":"It raises plasma oncotic pressure like albumin","D":"It crosses the blood–brain barrier and pulls water into the CSF","E":"It raises plasma osmolality, drawing water out of brain tissue"},"answer":"E","explanation":"Mannitol is poorly permeable, an effective extracellular osmole: it raises plasma osmolality and draws water from brain cells and interstitium (if the BBB is intact), then causes osmotic diuresis. A: It stays extracellular. B: It raises, not lowers, plasma osmolality. C: It is a sugar alcohol, not a protein. D: It works only if the BBB keeps it out.","source_slide":"L09 Transmembrane Fluid Movement, slide 24"},{"id":"FND-PHYS-L09-06","block":"Foundations","lecture":"L09 Transmembrane Fluid Movement","discipline":"Physiology","style":"LAU","stem":"Which statement about tonicity is correct?","options":{"A":"150 mM NaCl and 300 mM urea are both isotonic","B":"Tonicity includes all solutes, permeant or not","C":"Infused glucose has a sustained osmotic effect in healthy people","D":"Tonicity depends only on impermeant solutes","E":"Isosmotic solutions never change cell volume"},"answer":"D","explanation":"Only impermeant (effective) solutes set tonicity. A: The urea solution is hypotonic. B: That describes osmolarity. C: Rapidly metabolized solutes like dextrose have no sustained osmotic effect. E: Isosmotic urea swells cells.","source_slide":"L09 Transmembrane Fluid Movement, slides 7, 26"},{"id":"FND-PHYS-L09-07","block":"Foundations","lecture":"L09 Transmembrane Fluid Movement","discipline":"Physiology","style":"LAU","stem":"A 70-kg man (osmolality 290 mOsm/kg) receives 2 L of isotonic saline. What are his final ECF and ICF volumes?","options":{"A":"ECF 16 L; ICF 28 L","B":"ECF 14.7 L; ICF 29.3 L","C":"ECF 15.3 L; ICF 26.7 L","D":"ECF 16 L; ICF 26 L","E":"ECF 14 L; ICF 30 L"},"answer":"A","explanation":"Isotonic saline doesn't change effective ECF osmolality, so no water shifts: all 2 L stay in the ECF (14 → 16 L) and the ICF stays 28 L. B: Splits the saline 1/3 : 2/3 as if it were water. C: Results of adding NaCl alone (water shifts out of cells). D: Water doesn't leave the ICF. E: Puts all the fluid in the cells.","source_slide":"L09 Transmembrane Fluid Movement, slides 18–19"},{"id":"FND-PHYS-L09-08","block":"Foundations","lecture":"L09 Transmembrane Fluid Movement","discipline":"Physiology","style":"LAU","stem":"A patient with nephrotic syndrome is losing protein in the urine and develops generalized edema. Which mechanism is primary?","options":{"A":"Increased capillary hydrostatic pressure","B":"Decreased plasma oncotic pressure","C":"Increased capillary permeability","D":"Obstructed lymphatic drainage","E":"Increased plasma osmolality"},"answer":"B","explanation":"Loss of plasma protein leaves less oncotic pressure to pull fluid back into capillaries (hypoalbuminemia; kidney or liver disease). A: Raised hydrostatic pressure is heart failure or venous obstruction. C: Increased permeability is inflammation or burns. D: Lymphatic obstruction is node removal or filariasis. E: Plasma osmolality (crystalloid) doesn't drive edema across capillaries; proteins do.","source_slide":"L09 Transmembrane Fluid Movement, slide 25"},{"id":"FND-PHYS-L10-01","block":"Foundations","lecture":"L10 Transcapillary Transport","discipline":"Physiology","style":"LAU","stem":"Use the lecture's values: interstitial pressure −3 mmHg, interstitial oncotic 8 mmHg, venous-end capillary pressure 10 mmHg. A patient with liver failure has plasma oncotic pressure 18 mmHg. What is the net pressure at the venous end?","options":{"A":"7 mmHg reabsorption","B":"5 mmHg reabsorption","C":"3 mmHg reabsorption","D":"3 mmHg filtration","E":"23 mmHg filtration"},"answer":"D","explanation":"Outward 10 + 3 + 8 = 21; inward 18; net 3 mmHg outward, so the venous end now filters. A: The normal venous value (plasma oncotic 28). B: Omits interstitial oncotic pressure. C: Treats the −3 mmHg interstitial pressure as an inward force. E: Uses the arterial-end capillary pressure (30 mmHg).","source_slide":"L10 Transcapillary Transport, slides 23–28, 60"},{"id":"FND-PHYS-L10-02","block":"Foundations","lecture":"L10 Transcapillary Transport","discipline":"Physiology","style":"LAU","stem":"Which structural feature makes hepatic sinusoids the most permeable type of capillary?","options":{"A":"Fenestrae only","B":"Fenestrae plus large intercellular gaps","C":"Interendothelial clefts 10–15 nm wide","D":"Narrow tight junctions without clefts","E":"A thick luminal glycocalyx"},"answer":"B","explanation":"Discontinuous (sinusoidal) capillaries, e.g. liver, have fenestrae plus large gaps. A: Fenestrated capillaries (small intestine, exocrine glands). C: Continuous capillaries (skeletal muscle). D: Blood–brain barrier capillaries. E: The glycocalyx is a barrier, not a source of permeability.","source_slide":"L10 Transcapillary Transport, slides 7, 9"},{"id":"FND-PHYS-L10-03","block":"Foundations","lecture":"L10 Transcapillary Transport","discipline":"Physiology","style":"LAU","stem":"A solute has a reflection coefficient of 0 across a capillary wall. What does this mean?","options":{"A":"It is fully reflected and exerts its full osmotic force","B":"It crosses as easily as water and exerts no osmotic force","C":"It crosses faster than water does","D":"It crosses only by active transport","E":"It is held back by the glycocalyx"},"answer":"B","explanation":"σ = 0: the solute leaks through as rapidly as water, so its gradient produces no fluid flow. A: That is σ = 1 (no leakage). C: That is a negative σ (rare). D: σ says nothing about active transport. E: Being held back means σ near 1.","source_slide":"L10 Transcapillary Transport, slide 14"},{"id":"FND-PHYS-L10-04","block":"Foundations","lecture":"L10 Transcapillary Transport","discipline":"Physiology","style":"LAU","stem":"According to the revised (Landis–Pappenheimer) model, what happens when capillary pressure is held steadily below plasma oncotic pressure?","options":{"A":"Sustained absorption, as classic Starling predicts","B":"Increased filtration at the venous end","C":"No sustained absorption; absorption is only transient","D":"Lymph flow stops","E":"Plasma oncotic pressure rises sharply"},"answer":"C","explanation":"Real measurements show absorption only transiently, after abrupt drops in capillary pressure, not at steady state, because fluid exchange occurs with the subglycocalyx space. A: The classic prediction that real data contradict. B: Low pressure doesn't raise filtration. D: Lymph flow continues. E: Not predicted by the model.","source_slide":"L10 Transcapillary Transport, slides 42–45"},{"id":"FND-PHYS-L10-05","block":"Foundations","lecture":"L10 Transcapillary Transport","discipline":"Physiology","style":"Step1","stem":"A 65-year-old man with right heart failure has bilateral pitting ankle edema. Serum albumin is normal. Which Starling force change is mainly responsible?","options":{"A":"Increased capillary hydrostatic pressure","B":"Decreased plasma oncotic pressure","C":"Increased capillary permeability","D":"Lymphatic obstruction","E":"Decreased interstitial oncotic pressure"},"answer":"A","explanation":"In cardiac failure, raised pressure at the venous end of the capillary favors filtration over absorption. B: Albumin is normal. C: There's no inflammation or toxin. D: Lymphatics are intact. E: Lower interstitial oncotic pressure would oppose edema.","source_slide":"L10 Transcapillary Transport, slides 59–61"},{"id":"FND-PHYS-L10-06","block":"Foundations","lecture":"L10 Transcapillary Transport","discipline":"Physiology","style":"LAU","stem":"Shortly after losing 1.5 L of blood, a trauma patient's hematocrit begins to fall before any IV fluids are given. Why?","options":{"A":"Increased capillary filtration of plasma","B":"Increased capillary permeability","C":"Bone marrow suppression","D":"Lymphatic obstruction","E":"Absorption of interstitial fluid into plasma"},"answer":"E","explanation":"A sudden drop in capillary pressure (shock) favors absorption of interstitial fluid into capillaries, diluting the red cells. A: Filtration falls. B: Increased permeability would move fluid out of plasma. C: Marrow changes take days. D: Lymphatic obstruction causes edema, not plasma dilution.","source_slide":"L10 Transcapillary Transport, slides 59–60"},{"id":"FND-PHYS-L10-07","block":"Foundations","lecture":"L10 Transcapillary Transport","discipline":"Physiology","style":"Step1","stem":"After axillary lymph node dissection for breast cancer, a 52-year-old woman develops persistent arm edema. Which Starling change contributes most?","options":{"A":"Increased interstitial oncotic pressure","B":"Decreased plasma oncotic pressure","C":"Increased capillary hydrostatic pressure","D":"Decreased capillary permeability","E":"More negative interstitial fluid pressure"},"answer":"A","explanation":"Normally more fluid is filtered than absorbed, and lymphatics return the excess fluid and protein. With lymphatic blockage, protein accumulates in the interstitium, raising interstitial oncotic pressure. B: Plasma proteins are normal. C: Raised capillary pressure is heart failure. D: Reduced permeability would limit edema. E: The edematous interstitium becomes less negative, not more.","source_slide":"L10 Transcapillary Transport, slides 29, 49, 61"},{"id":"FND-PHYS-L11-01","block":"Foundations","lecture":"L11 Intracellular Compartments and Protein Sorting","discipline":"Physiology","style":"LAU","stem":"What makes transport through nuclear pore complexes directional?","options":{"A":"ATP hydrolysis by nucleoporins","B":"Ran-GTP in the nucleus and Ran-GDP in the cytosol","C":"Ran-GDP in the nucleus and Ran-GTP in the cytosol","D":"SRP binding the NLS in the cytosol","E":"An H⁺ gradient across the nuclear envelope"},"answer":"B","explanation":"Ran-GEF is bound to chromatin in the nucleus (makes Ran-GTP) and Ran-GAP is cytosolic (makes Ran-GDP); this gradient drives both import and export. A: Nucleoporins aren't ATP-driven pumps. C: Reversed: GEF is nuclear, GAP is cytosolic. D: SRP targets proteins to the ER; NLSs bind nuclear import receptors. E: An H⁺ gradient drives mitochondrial, not nuclear, import.","source_slide":"L11 Intracellular Compartments and Protein Sorting, slides 18, 20–21"},{"id":"FND-PHYS-L11-02","block":"Foundations","lecture":"L11 Intracellular Compartments and Protein Sorting","discipline":"Physiology","style":"LAU","stem":"A drug collapses the H⁺ gradient across the inner mitochondrial membrane. Which step of protein import is directly blocked?","options":{"A":"Signal-sequence translocation through TIM into the matrix","B":"ATP-dependent release of cytosolic hsp70","C":"Signal-sequence recognition by TOM receptors","D":"Translation on free cytosolic ribosomes","E":"N-linked glycosylation in the ER"},"answer":"A","explanation":"Translocation of the signal sequence across the inner membrane into the matrix requires the electrochemical H⁺ gradient. B: Release of cytosolic hsp70 depends on ATP hydrolysis, not the H⁺ gradient. C: TOM recognition at the outer membrane comes first and doesn't need the gradient. D: Translation is unaffected. E: Glycosylation is an ER event.","source_slide":"L11 Intracellular Compartments and Protein Sorting, slides 26–27"},{"id":"FND-PHYS-L11-03","block":"Foundations","lecture":"L11 Intracellular Compartments and Protein Sorting","discipline":"Physiology","style":"LAU","stem":"A soluble ER chaperone escapes to the Golgi. How is it returned to the ER?","options":{"A":"Its KKXX signal binds COPI coats directly","B":"The KDEL receptor packages it into COPII vesicles","C":"The M6P receptor packages it into clathrin vesicles","D":"The KDEL receptor packages it into COPI vesicles","E":"Its NLS binds a nuclear import receptor"},"answer":"D","explanation":"Soluble ER residents carry a C-terminal KDEL; the KDEL receptor (high affinity in the Golgi, low in the ER) packages them into retrograde COPI vesicles. A: KKXX binding COPI directly is the route for ER membrane proteins. B: COPII carries cargo forward from ER to Golgi. C: M6P sorts lysosomal hydrolases. E: NLSs target the nucleus.","source_slide":"L11 Intracellular Compartments and Protein Sorting, slides 51–52"},{"id":"FND-PHYS-L11-04","block":"Foundations","lecture":"L11 Intracellular Compartments and Protein Sorting","discipline":"Physiology","style":"LAU","stem":"A mutation blocks assembly of COPII coats. What is the most direct consequence?","options":{"A":"Newly made secretory proteins accumulate in the ER","B":"Escaped ER residents accumulate in the Golgi","C":"Lysosomal hydrolases are secreted into the blood","D":"Nuclear proteins remain in the cytosol","E":"LDL stays bound at the cell surface"},"answer":"A","explanation":"Proteins leave the ER in COPII-coated vesicles, so blocking COPII traps cargo in the ER. B: That would follow a COPI/retrieval defect. C: That is I-cell disease (missing M6P tag). D: That is an NLS/import defect. E: That is a clathrin-coated pit defect.","source_slide":"L11 Intracellular Compartments and Protein Sorting, slides 44, 50–51"},{"id":"FND-PHYS-L11-05","block":"Foundations","lecture":"L11 Intracellular Compartments and Protein Sorting","discipline":"Physiology","style":"Step1","stem":"A 1-year-old has coarse facies and skeletal abnormalities. Fibroblasts show large lysosomal inclusions, and plasma lysosomal enzyme activities are markedly elevated. Which feature of these enzymes is normally recognized for tagging?","options":{"A":"A C-terminal KDEL sequence","B":"An N-terminal hydrophobic signal peptide","C":"A C-terminal three-amino-acid signal","D":"An internal lysine-rich sequence","E":"A three-dimensional signal patch"},"answer":"E","explanation":"I-cell disease: GlcNAc phosphotransferase recognizes a signal patch on lysosomal hydrolases and starts M6P tagging; without it, hydrolases are secreted into the blood. A: KDEL retains soluble ER proteins. B: The N-terminal signal sends them into the ER but doesn't sort them to lysosomes. C: A C-terminal 3-amino-acid signal targets peroxisomes. D: Lysine-rich internal signals are NLSs.","source_slide":"L11 Intracellular Compartments and Protein Sorting, slides 12, 57–59"},{"id":"FND-PHYS-L11-06","block":"Foundations","lecture":"L11 Intracellular Compartments and Protein Sorting","discipline":"Physiology","style":"Step1","stem":"A 40-year-old man eats home-canned vegetables and develops descending flaccid paralysis. The toxin cleaves proteins needed for vesicle fusion at the NMJ. Which protein family is targeted?","options":{"A":"Clathrin","B":"SNAREs","C":"Rab GTPases","D":"COPII","E":"Adaptins"},"answer":"B","explanation":"Botulinum toxin cleaves SNAREs, which catalyze vesicle fusion with the target membrane, so ACh isn't released. A: Clathrin coats endocytic and TGN vesicles. C: Targeting GTPases help guide vesicles but aren't the toxin target. D: COPII acts at the ER. E: Adaptins link clathrin to cargo receptors.","source_slide":"L11 Intracellular Compartments and Protein Sorting, slides 47–48"},{"id":"FND-PHYS-L11-07","block":"Foundations","lecture":"L11 Intracellular Compartments and Protein Sorting","discipline":"Physiology","style":"LAU","stem":"A precursor protein moves from the cytosol into the mitochondrial matrix. Which transport mode is this, and what must the protein do?","options":{"A":"Gated transport; stay folded","B":"Vesicular transport; stay folded","C":"Transmembrane transport; unfold","D":"Gated transport; unfold","E":"Transmembrane transport; stay folded"},"answer":"C","explanation":"Transmembrane transport: translocators move proteins into a topologically distinct space (ER lumen, mitochondria), and the protein usually must unfold to snake through. A, D: Gated transport is nucleus–cytosol traffic through pores. B: Vesicular transport moves cargo between topologically equivalent compartments (e.g. ER → Golgi). E: Mitochondrial precursors are imported unfolded.","source_slide":"L11 Intracellular Compartments and Protein Sorting, slides 6–8, 25"},{"id":"FND-PHYS-L11-08","block":"Foundations","lecture":"L11 Intracellular Compartments and Protein Sorting","discipline":"Physiology","style":"LAU","stem":"A protein's only sorting signal is an N-terminal sequence containing 5–10 hydrophobic amino acids. Where does it most likely end up?","options":{"A":"Retained in the ER lumen","B":"Mitochondrial matrix","C":"Peroxisome","D":"Nucleus","E":"Secreted from the cell"},"answer":"E","explanation":"An N-terminal hydrophobic signal targets the protein to the ER via SRP; without further signals it passes to the Golgi and on to the cell surface by default. A: ER retention needs a C-terminal KDEL. B: Mitochondrial signals alternate positive and hydrophobic residues. C: Peroxisomal signals are C-terminal 3-amino-acid sequences. D: NLSs are internal clusters of positive residues.","source_slide":"L11 Intracellular Compartments and Protein Sorting, slides 12, 33, 63"},{"id":"FND-POP-L01-01","block":"Foundations","lecture":"L01 Introduction to Epidemiology and Sources of Data","discipline":"Population Health","style":"LAU","stem":"Which question is typical of epidemiology rather than clinical medicine?","options":{"A":"What is the leading cause of death in this population?","B":"What treatment suits this patient?","C":"What dose should this child receive?","D":"Does this patient need surgery?","E":"What is this patient's diagnosis?"},"answer":"A","explanation":"Epidemiology studies populations; clinical medicine focuses on individuals. B, C, D, E: These are individual clinical questions.","source_slide":"L01 Introduction to Epidemiology and Sources of Data, slide 8"},{"id":"FND-POP-L01-02","block":"Foundations","lecture":"L01 Introduction to Epidemiology and Sources of Data","discipline":"Population Health","style":"LAU","stem":"Investigating 27 students with vomiting and diarrhea, you first chart cases by time of onset, the event attended, and age and sex. Which type of epidemiology is this?","options":{"A":"Analytical epidemiology","B":"Clinical epidemiology","C":"Surveillance","D":"Intervention evaluation","E":"Descriptive epidemiology"},"answer":"E","explanation":"Describing frequency and pattern by time, place, and person (when, where, who) is descriptive epidemiology. A: Analytical epidemiology asks why: it tests determinants. B: Clinical epidemiology links epidemiology to patient care. C: Surveillance is ongoing, systematic collection of health data, not the description of one outbreak. D: Evaluation assesses interventions after they are implemented.","source_slide":"L01 Introduction to Epidemiology and Sources of Data, slides 3, 11–12"},{"id":"FND-POP-L01-03","block":"Foundations","lecture":"L01 Introduction to Epidemiology and Sources of Data","discipline":"Population Health","style":"LAU","stem":"Influenza cases in a city rise well above the usual seasonal level for that time and place. This is best termed:","options":{"A":"Endemic","B":"Sporadic","C":"Pandemic","D":"Epidemic","E":"Epidemiologic transition"},"answer":"D","explanation":"An epidemic (outbreak) is an increase in cases above what is normally expected for that place and time. A: Endemic is the constant baseline presence. B: Sporadic means scattered, irregular cases. C: A pandemic crosses international boundaries. E: Epidemiologic transition is a long-term shift from infectious to chronic disease patterns.","source_slide":"L01 Introduction to Epidemiology and Sources of Data, slide 28"},{"id":"FND-POP-L01-04","block":"Foundations","lecture":"L01 Introduction to Epidemiology and Sources of Data","discipline":"Population Health","style":"LAU","stem":"Which contribution belongs to John Snow?","options":{"A":"Quantified patterns of birth and death in London's population","B":"Linked cholera deaths to contaminated water by comparing water sources","C":"Inoculated a boy with cowpox to protect against smallpox","D":"Identified cardiovascular risk factors in a prospective cohort","E":"Analyzed British mortality by marital status and occupation"},"answer":"B","explanation":"Snow (1854) compared cholera deaths by water company and linked cases to the Broad Street pump: father of field epidemiology. A: John Graunt (17th century). C: Edward Jenner (1796). D: Framingham Heart Study (1948). E: William Farr (19th century).","source_slide":"L01 Introduction to Epidemiology and Sources of Data, slides 18, 21–22, 24"},{"id":"FND-POP-L01-05","block":"Foundations","lecture":"L01 Introduction to Epidemiology and Sources of Data","discipline":"Population Health","style":"LAU","stem":"Lebanon maintains a database that collects information on every person diagnosed with cancer. This source of health data is a:","options":{"A":"Census","B":"Surveillance system","C":"Registry","D":"Death certificate system","E":"Hospital discharge summary"},"answer":"C","explanation":"A registry is a database of cases diagnosed with a particular disease (e.g., Lebanon's cancer registry). A: A census enumerates the whole population with demographic data (Lebanon's last: 1932). B: Surveillance is ongoing collection, analysis and dissemination of data on health events to detect outbreaks and monitor burden. D: Death certificates record causes of death (ICD-11). E: Discharge summaries record hospitalizations.","source_slide":"L01 Introduction to Epidemiology and Sources of Data, slides 29–31"},{"id":"FND-POP-L01-06","block":"Foundations","lecture":"L01 Introduction to Epidemiology and Sources of Data","discipline":"Population Health","style":"LAU","stem":"In the same outbreak, investigators compare how often students who ate the chicken salad became ill with how often those who didn't eat it became ill. This step is:","options":{"A":"Descriptive epidemiology","B":"Surveillance","C":"Clinical medicine","D":"Epidemiologic transition","E":"Analytical epidemiology"},"answer":"E","explanation":"Comparing groups to identify a determinant (why it happened) is analytical epidemiology. A: Descriptive epidemiology describes time, place and person without testing causes. B: Surveillance is ongoing routine data collection. C: Clinical medicine diagnoses and treats individuals. D: Epidemiologic transition is a long-term change in disease patterns.","source_slide":"L01 Introduction to Epidemiology and Sources of Data, slides 11–12, 15"},{"id":"FND-POP-L02-01","block":"Foundations","lecture":"L02 Measures of Disease Frequency","discipline":"Population Health","style":"LAU","stem":"In a city of 100,000 adults, 5,000 had diabetes on January 1 and 500 new cases occurred during the year. What is the incidence risk?","options":{"A":"5%","B":"5.5%","C":"0.5%","D":"0.53%","E":"10%"},"answer":"D","explanation":"Incidence risk = 500 / (100,000 − 5,000) ≈ 0.53%. A: Point prevalence. B: Period prevalence. C: Uses the whole population as the denominator. E: Ratio of new to existing cases.","source_slide":"L02 Measures of Disease Frequency, slides 8, 14, 16"},{"id":"FND-POP-L02-02","block":"Foundations","lecture":"L02 Measures of Disease Frequency","discipline":"Population Health","style":"LAU","stem":"500 adults were enrolled; 5 had TB at baseline. Over 2 years, the 495 at-risk participants contributed 900 person-years, and 45 new cases occurred. What is the incidence rate?","options":{"A":"9.1%","B":"5 per 100 person-years","C":"10%","D":"1%","E":"2.5 per 100 person-years"},"answer":"B","explanation":"Incidence rate = new cases / person-time at risk = 45 / 900 PY = 0.05 = 5 per 100 person-years. A: 45/495 is the 2-year incidence risk. C: (5 + 45)/500 is the period prevalence. D: 5/500 is the baseline point prevalence. E: Divides again by 2 years; person-years already include time.","source_slide":"L02 Measures of Disease Frequency, slides 16, 24"},{"id":"FND-POP-L02-03","block":"Foundations","lecture":"L02 Measures of Disease Frequency","discipline":"Population Health","style":"LAU","stem":"Why does diabetes have a much higher prevalence than the common cold despite a lower incidence?","options":{"A":"Diabetes lasts far longer, so cases accumulate","B":"Diabetes cases are more often diagnosed","C":"The common cold has a higher case-fatality","D":"Diabetes incidence is measured per person-time","E":"Colds give lasting immunity after infection"},"answer":"A","explanation":"Prevalence ≈ incidence × duration; diabetes lasts for life, while a cold lasts days. B: Detection differences can't explain a gap this size; duration is the driver. C: Colds rarely kill, and fatality isn't what separates them here. D: The unit used for incidence doesn't change prevalence. E: Colds recur; lasting immunity would lower incidence, not explain prevalence.","source_slide":"L02 Measures of Disease Frequency, slides 26–27"},{"id":"FND-POP-L02-04","block":"Foundations","lecture":"L02 Measures of Disease Frequency","discipline":"Population Health","style":"LAU","stem":"Prevalence of a disease has been stable for years. A prevention program lowers its incidence. What happens to prevalence?","options":{"A":"Increases","B":"No change","C":"Cannot be predicted","D":"First increases, then falls","E":"Decreases"},"answer":"E","explanation":"Fewer new cases enter the pool, so prevalence falls (duration unchanged). A, B, D: Not expected. C: The direction is predictable.","source_slide":"L02 Measures of Disease Frequency, slide 31"},{"id":"FND-POP-L02-05","block":"Foundations","lecture":"L02 Measures of Disease Frequency","discipline":"Population Health","style":"LAU","stem":"Which change would increase prevalence without changing incidence?","options":{"A":"A curative treatment","B":"Higher mortality from the disease","C":"Improved survival without cure","D":"Vaccination","E":"Reduced exposure to risk factors"},"answer":"C","explanation":"Longer duration raises prevalence. A, B: Shorten duration and lower prevalence. D, E: Lower incidence.","source_slide":"L02 Measures of Disease Frequency, slide 29"},{"id":"FND-POP-L02-06","block":"Foundations","lecture":"L02 Measures of Disease Frequency","discipline":"Population Health","style":"LAU","stem":"Which measure best estimates the number of dialysis units a region needs?","options":{"A":"Incidence rate of ESRD","B":"Case-fatality of ESRD","C":"Proportionate mortality from ESRD","D":"Prevalence of ESRD","E":"Person-time at risk"},"answer":"D","explanation":"Prevalence measures disease burden for planning services. A: Incidence reflects new cases only. B, C: Mortality measures. E: A denominator, not a measure.","source_slide":"L02 Measures of Disease Frequency, slides 10, 13"},{"id":"FND-POP-L02-07","block":"Foundations","lecture":"L02 Measures of Disease Frequency","discipline":"Population Health","style":"LAU","stem":"A hospital reports '12 new central-line infections per 1,000 patient-days'. What kind of measure is this?","options":{"A":"Incidence risk","B":"Point prevalence","C":"Period prevalence","D":"Ratio of cases to non-cases","E":"Incidence rate"},"answer":"E","explanation":"New cases per unit of person-time at risk is an incidence rate (incidence density), a true rate. A: Incidence risk is new cases / people at risk at the start, a proportion without time units. B: Point prevalence counts existing cases at one moment. C: Period prevalence counts existing cases over a period. D: A ratio compares two separate quantities, not events over person-time.","source_slide":"L02 Measures of Disease Frequency, slides 6–7, 16"},{"id":"FND-POP-L02-08","block":"Foundations","lecture":"L02 Measures of Disease Frequency","discipline":"Population Health","style":"LAU","stem":"Ten disease-free workers are followed. Six stay healthy for the full 2 years, 2 develop asthma at exactly 1 year, and 2 are lost to follow-up at 1 year. What is the incidence rate of asthma?","options":{"A":"12.5 per 100 person-years","B":"10 per 100 person-years","C":"20%","D":"14.3 per 100 person-years","E":"16.7 per 100 person-years"},"answer":"A","explanation":"Person-time = 6 × 2 + 2 × 1 + 2 × 1 = 16 PY; rate = 2 / 16 = 12.5 per 100 PY. B: 2/20 assumes everyone was at risk for 2 years. C: 2/10 is a risk, not a rate. D: 2/14 leaves out the lost workers' time at risk. E: 2/12 counts only the workers who completed follow-up.","source_slide":"L02 Measures of Disease Frequency, slides 17–18"},{"id":"FND-POP-L03-01","block":"Foundations","lecture":"L03 Measures and Indicators of Health Status","discipline":"Population Health","style":"LAU","stem":"In a town of 200,000, 40 people are diagnosed with disease X during a year, and 10 of them die of it. What is the case-fatality rate?","options":{"A":"5 per 100,000","B":"20 per 100,000","C":"75%","D":"25%","E":"Cannot be calculated without person-time"},"answer":"D","explanation":"CFR = deaths from the disease / diagnosed cases = 10 / 40 = 25%. A: 10/200,000 is the mortality rate. B: 40/200,000 is the proportion of the town with the disease. C: 30/40 is the proportion who survived. E: CFR is a proportion of diagnosed cases; no person-time is needed.","source_slide":"L03 Measures and Indicators of Health Status, slides 8–9"},{"id":"FND-POP-L03-02","block":"Foundations","lecture":"L03 Measures and Indicators of Health Status","discipline":"Population Health","style":"LAU","stem":"Early in an outbreak only severe hospitalized cases are tested. Testing then expands to the community and finds many mild cases; the number of deaths is unchanged. What happens to the case-fatality rate (CFR) and the mortality rate?","options":{"A":"CFR decreases; mortality rate unchanged","B":"CFR unchanged; mortality rate decreases","C":"Both decrease","D":"CFR increases; mortality rate unchanged","E":"Both unchanged"},"answer":"A","explanation":"CFR = deaths / confirmed cases: the denominator grows while deaths stay constant, so CFR falls. Mortality rate = deaths / whole population: neither part changes. B: CFR changes because its denominator changes; the mortality rate doesn't. C: The mortality rate's denominator is the whole population, not confirmed cases. D: More confirmed cases lowers CFR. E: CFR's denominator has changed.","source_slide":"L03 Measures and Indicators of Health Status, slides 10, 34"},{"id":"FND-POP-L03-03","block":"Foundations","lecture":"L03 Measures and Indicators of Health Status","discipline":"Population Health","style":"LAU","stem":"City 1 has a crude mortality rate of 296 per 100,000 and City 2 of 469 per 100,000. City 2's population is much older. What is the best conclusion?","options":{"A":"City 2's population is less healthy","B":"Age-standardize the rates before comparing","C":"City 1's mortality is truly 40% lower","D":"Compare case-fatality rates instead","E":"Compare proportionate mortality instead"},"answer":"B","explanation":"Crude rates are influenced by age structure; standardization removes this so populations can be compared fairly. A: The higher crude rate may simply reflect an older population. C: Only true after adjustment for age. D: CFR measures disease severity, not population mortality. E: Proportionate mortality is the fraction of deaths by cause and isn't a measure of risk.","source_slide":"L03 Measures and Indicators of Health Status, slides 16–18, 35"},{"id":"FND-POP-L03-04","block":"Foundations","lecture":"L03 Measures and Indicators of Health Status","discipline":"Population Health","style":"LAU","stem":"A ministry wants to rank conditions by the total healthy life they cost the population, including low back pain, which rarely kills. Which measure fits best?","options":{"A":"QALYs","B":"Life expectancy","C":"DALYs","D":"Proportionate mortality","E":"Cause-specific mortality rate"},"answer":"C","explanation":"DALYs = YLL + YLD, combining premature death and disability; low back pain's burden is almost all YLD. A: QALYs measure health gained by an intervention. B: Life expectancy summarizes a whole population, not the burden of one condition. D: Counts deaths only. E: Counts deaths only.","source_slide":"L03 Measures and Indicators of Health Status, slides 28–30"},{"id":"FND-POP-L03-05","block":"Foundations","lecture":"L03 Measures and Indicators of Health Status","discipline":"Population Health","style":"LAU","stem":"Without treatment, a patient will live 4 years at a utility weight of 0.5. With a new treatment, the patient will live 6 years at a utility weight of 0.75. How many QALYs does the treatment gain?","options":{"A":"2","B":"4.5","C":"0.25","D":"1","E":"2.5"},"answer":"E","explanation":"QALY = years × utility: without = 4 × 0.5 = 2; with = 6 × 0.75 = 4.5; gain = 2.5 QALYs. A: QALYs without treatment (also the extra life-years alone). B: QALYs with treatment. C: The change in utility weight alone. D: Applies the utility gain to the original 4 years only and ignores the 2 extra years.","source_slide":"L03 Measures and Indicators of Health Status, slides 31–32"},{"id":"FND-POP-L03-06","block":"Foundations","lecture":"L03 Measures and Indicators of Health Status","discipline":"Population Health","style":"LAU","stem":"Which measure of mortality uses total births (live births plus stillbirths) as its denominator?","options":{"A":"Neonatal mortality rate","B":"Perinatal mortality rate","C":"Infant mortality rate","D":"Post-neonatal mortality rate","E":"Under-5 mortality rate"},"answer":"B","explanation":"Perinatal and stillbirth rates use total births because the numerator includes stillbirths. A, C, D, E: These use live births.","source_slide":"L03 Measures and Indicators of Health Status, slide 14"},{"id":"FND-POP-L03-07","block":"Foundations","lecture":"L03 Measures and Indicators of Health Status","discipline":"Population Health","style":"LAU","stem":"A region records 2,000 live births and 20 stillbirths in one year. Twelve infants die before 28 days and 8 die between 28 days and 1 year. What is the infant mortality rate?","options":{"A":"6 per 1,000 live births","B":"4 per 1,000 live births","C":"10 per 1,000 live births","D":"9.9 per 1,000 total births","E":"19.8 per 1,000 total births"},"answer":"C","explanation":"Infant mortality = deaths < 1 year / live births × 1,000 = (12 + 8) / 2,000 × 1,000 = 10 (= neonatal + post-neonatal). A: 12/2,000 is the neonatal rate. B: 8/2,000 is the post-neonatal rate. D: Uses total births; the infant rate uses live births. E: Adds stillbirths and uses total births.","source_slide":"L03 Measures and Indicators of Health Status, slides 13–14"},{"id":"FND-POP-L03-08","block":"Foundations","lecture":"L03 Measures and Indicators of Health Status","discipline":"Population Health","style":"LAU","stem":"A small village wants to compare its mortality with the national population, but its age-specific death rates are unstable because each age group has very few deaths. Which approach is most appropriate?","options":{"A":"Direct standardization to a standard population","B":"Comparing crude mortality rates","C":"Comparing case-fatality rates","D":"Indirect standardization, giving an SMR","E":"Comparing proportionate mortality"},"answer":"D","explanation":"Indirect standardization applies standard (national) rates to the study population; it is used when population-specific rates are unavailable or unstable and gives a standardized mortality ratio. A: Direct standardization needs reliable age-specific rates in each population. B: Crude rates ignore age structure. C: CFR measures disease severity. E: Proportionate mortality isn't a measure of risk.","source_slide":"L03 Measures and Indicators of Health Status, slides 16, 18"},{"id":"FND-POP-L05-01","block":"Foundations","lecture":"L05 Introduction to Biostatistics","discipline":"Population Health","style":"LAU","stem":"Muscle strength graded from 1 (no movement) to 5 (normal) is which type of variable?","options":{"A":"Nominal","B":"Continuous","C":"Ordinal","D":"Discrete count","E":"Binary"},"answer":"C","explanation":"Ordered categories without equal measured intervals → ordinal. A: Nominal has no order. B, D: Grades aren't measured or counted quantities. E: Binary has two categories.","source_slide":"L05 Introduction to Biostatistics, slide 15"},{"id":"FND-POP-L05-02","block":"Foundations","lecture":"L05 Introduction to Biostatistics","discipline":"Population Health","style":"LAU","stem":"Number of migraine attacks per month is which type of variable?","options":{"A":"Nominal","B":"Ordinal","C":"Continuous","D":"Dichotomous","E":"Discrete"},"answer":"E","explanation":"It results from counting whole numbers. A, B: Not categorical. C: Not measured on a continuous scale. D: Not two categories.","source_slide":"L05 Introduction to Biostatistics, slide 15"},{"id":"FND-POP-L05-03","block":"Foundations","lecture":"L05 Introduction to Biostatistics","discipline":"Population Health","style":"LAU","stem":"A study examines whether daily screen time predicts sleep-quality scores in adolescents, accounting for age. Which is the dependent variable?","options":{"A":"Sleep-quality score","B":"Daily screen time","C":"Age","D":"Number of adolescents","E":"Sex"},"answer":"A","explanation":"The dependent (outcome, y) variable is the one expected to change: sleep quality. B: Screen time is the independent (predictor, x) variable. C: Age is a control variable affecting the association. D: Sample size isn't a study variable. E: Sex isn't part of the stated question.","source_slide":"L05 Introduction to Biostatistics, slides 16–18"},{"id":"FND-POP-L05-04","block":"Foundations","lecture":"L05 Introduction to Biostatistics","discipline":"Population Health","style":"LAU","stem":"Researchers use the mean BMI in a random sample of 500 students to estimate the mean BMI of all university students. This is an example of:","options":{"A":"Descriptive statistics only","B":"A census","C":"A line list","D":"Statistical inference","E":"A contingency table"},"answer":"D","explanation":"Generalizing from sample to population is inference. A: Describing the sample alone would be descriptive. B: A census includes everyone. C, E: These are ways of organizing data.","source_slide":"L05 Introduction to Biostatistics, slides 8, 19"},{"id":"FND-POP-L05-05","block":"Foundations","lecture":"L05 Introduction to Biostatistics","discipline":"Population Health","style":"LAU","stem":"Why is random sampling essential?","options":{"A":"It increases the sample size","B":"It makes the sample representative","C":"It ensures equal group sizes","D":"It guarantees statistical significance","E":"It removes measurement error"},"answer":"B","explanation":"If every individual has an equal chance of selection, the sample represents the population, so results can be generalized by inference. A: Sample size is set separately. C: Random sampling doesn't equalize groups. D: Significance isn't guaranteed. E: Measurement error depends on the tools, not on sampling.","source_slide":"L05 Introduction to Biostatistics, slides 6–8"},{"id":"FND-POP-L05-06","block":"Foundations","lecture":"L05 Introduction to Biostatistics","discipline":"Population Health","style":"LAU","stem":"In a survey, 117 participants are smokers: 66 men and 51 women. Overall there are 250 men, 239 women, and 489 participants. What percentage of smokers are men?","options":{"A":"66/117","B":"66/250","C":"66/489","D":"117/489","E":"51/117"},"answer":"A","explanation":"Among smokers is a column percentage: male smokers / all smokers = 66/117 (≈ 56%). B: 66/250 is the row percentage: the proportion of men who smoke. C: 66/489 is the proportion of all participants who are male smokers. D: 117/489 is the proportion of all participants who smoke. E: 51/117 is the proportion of smokers who are women.","source_slide":"L05 Introduction to Biostatistics, slides 26–28"},{"id":"FND-POP-L05-07","block":"Foundations","lecture":"L05 Introduction to Biostatistics","discipline":"Population Health","style":"LAU","stem":"Age recorded in categories (0–4, 5–9, 10–14 years, …) is which type of variable?","options":{"A":"Continuous","B":"Discrete","C":"Nominal","D":"Dichotomous","E":"Ordinal"},"answer":"E","explanation":"Grouping age into ordered categories makes it ordinal (qualitative, ranked). A: Age in months is continuous, but categories are not. B: Discrete variables come from counting. C: Nominal categories have no order. D: Dichotomous means only two categories.","source_slide":"L05 Introduction to Biostatistics, slides 11, 14"},{"id":"FND-SOC-L01-01","block":"Foundations","lecture":"L01 Introduction to Social Medicine","discipline":"Social Medicine","style":"LAU","stem":"Which statement is one of Virchow's principles for reforming medicine?","options":{"A":"Health is primarily the responsibility of the individual patient","B":"Social conditions affect health but lie outside scientific study","C":"Disease prevention belongs to the state, not to physicians","D":"Measures to promote health and combat disease must be social as well as medical","E":"Epidemics are best controlled by medical measures such as quarantine"},"answer":"D","explanation":"Virchow's three principles: the people's health is a matter of direct social concern; social and economic conditions affect health and must be scientifically investigated; and measures must be social as well as medical. A: He made health a social concern. B: He insisted these relations be studied scientifically. C: He saw the physician as the natural advocate for the poor. E: He called for social, not only medical, measures.","source_slide":"L01 Introduction to Social Medicine, slides 6, 9"},{"id":"FND-SOC-L01-02","block":"Foundations","lecture":"L01 Introduction to Social Medicine","discipline":"Social Medicine","style":"LAU","stem":"What did Virchow conclude caused the 1848 typhus epidemic in Upper Silesia?","options":{"A":"Poverty and underdevelopment","B":"A new virulent strain","C":"Poor hygiene by physicians","D":"Contaminated imported grain","E":"Genetic susceptibility of miners"},"answer":"A","explanation":"He traced it to poverty and underdevelopment, recommending education, freedom, and welfare. B, C, D, E: Not his conclusions.","source_slide":"L01 Introduction to Social Medicine, slides 7–8"},{"id":"FND-SOC-L01-03","block":"Foundations","lecture":"L01 Introduction to Social Medicine","discipline":"Social Medicine","style":"LAU","stem":"Higher HIV rates among low-income women who exchange sex for food are best described as:","options":{"A":"A biological difference","B":"A health disparity without a social cause","C":"A genetic predisposition","D":"An occupational exposure only","E":"A health inequity"},"answer":"E","explanation":"A disparity is any difference in health outcomes; an inequity is the type closely linked with social or economic disadvantage, here poverty driving transactional sex. A, C: The cause is social, not biological. B: The difference has a clear socioeconomic cause. D: Too narrow; the driver is limited economic opportunity.","source_slide":"L01 Introduction to Social Medicine, slides 18, 23"},{"id":"FND-SOC-L01-04","block":"Foundations","lecture":"L01 Introduction to Social Medicine","discipline":"Social Medicine","style":"LAU","stem":"Which public-health achievement is credited to Virchow?","options":{"A":"Free milk program for schoolchildren","B":"Legislation creating the Chilean National Health Service","C":"Berlin city sewage systems and mandatory meat inspection","D":"Founding the Latin American Social Medicine Association","E":"Training physicians in 'revolutionary medicine' in Cuba"},"answer":"C","explanation":"Virchow's accomplishments: city sewage systems, mandatory meat inspection, ventilation and heating of public buildings, school health services, and better working conditions for nurses. A, B: Allende. D: Reformers from Juan Cesar Garcia's seminar group (1984). E: Che Guevara.","source_slide":"L01 Introduction to Social Medicine, slides 10, 12–15"},{"id":"FND-SOC-L01-05","block":"Foundations","lecture":"L01 Introduction to Social Medicine","discipline":"Social Medicine","style":"LAU","stem":"Unemployment among people living with HIV/AIDS ranges from 45% to 65%. Which relationship between SES and HIV does this illustrate?","options":{"A":"SES affects HIV infection","B":"HIV status affects SES","C":"SES affects HIV treatment","D":"Rural residence affects access to HIV care","E":"Sexual violence drives HIV prevalence"},"answer":"B","explanation":"HIV status can lower SES by constraining the ability to work and earn income. A: Limited economic opportunity leading to risky sex. C: Low SES delaying treatment and lowering adherence. D: Distance, few HIV-expert providers, stigma. E: A cause of infection, not an effect on SES.","source_slide":"L01 Introduction to Social Medicine, slides 22–23"},{"id":"FND-SOC-L02-01","block":"Foundations","lecture":"L02 Introduction to Global Health","discipline":"Social Medicine","style":"LAU","stem":"Which feature made smallpox a good candidate for eradication?","options":{"A":"Survivors gained lifelong immunity","B":"An animal reservoir allowed targeted culling","C":"Transmission required a mosquito vector","D":"Most infections were asymptomatic","E":"Patients were most contagious before symptoms appeared"},"answer":"A","explanation":"Smallpox features: direct person-to-person spread with no vector or reservoir, a distinctive rash that made diagnosis easy, lifelong immunity in survivors, and severe symptoms that kept infectious patients in bed. B, C: There was no reservoir or vector. D: The distinctive rash made cases obvious. E: Once infectious, patients were bedridden and infected few others.","source_slide":"L02 Introduction to Global Health, slide 22"},{"id":"FND-SOC-L02-02","block":"Foundations","lecture":"L02 Introduction to Global Health","discipline":"Social Medicine","style":"LAU","stem":"USAID funding a vaccination program in one partner country is an example of which kind of global-health player?","options":{"A":"Multilateral development bank","B":"UN agency","C":"Transnational social movement","D":"Faith-based NGO","E":"Bilateral organization"},"answer":"E","explanation":"Bilateral organizations involve one donor and one recipient. A: Banks are owned by many member states. B: UN agencies are multilateral. C: Movements are networks of activists. D: USAID is governmental.","source_slide":"L02 Introduction to Global Health, slide 15"},{"id":"FND-SOC-L02-03","block":"Foundations","lecture":"L02 Introduction to Global Health","discipline":"Social Medicine","style":"LAU","stem":"Which global-health challenge does the lecture link specifically to large private foundations such as the Gates Foundation?","options":{"A":"Fragmentation and lack of coordination","B":"Insufficient and unpredictable WHO funding","C":"Accountability, transparency and priority-setting","D":"Competing priorities and health threats","E":"Unequal health-system capacity between countries"},"answer":"C","explanation":"The growing influence of philanthropic organizations in setting priorities raises questions about accountability, transparency and priority-setting. A: Linked to multiple institutions, donors and actors. B: Linked to WHO's limited, unevenly distributed funding. D: Infectious disease, NCDs, emergencies and climate change at once. E: Linked to differences in national resources.","source_slide":"L02 Introduction to Global Health, slide 20"},{"id":"FND-SOC-L02-04","block":"Foundations","lecture":"L02 Introduction to Global Health","discipline":"Social Medicine","style":"LAU","stem":"Which risk factor is linked to the top ten causes of death worldwide?","options":{"A":"Low condom use","B":"Poor sanitation","C":"Under-nutrition","D":"Tobacco use","E":"Road design"},"answer":"D","explanation":"Tobacco is related to all top ten causes of mortality. A: Linked mainly to HIV and STIs. B: Linked to diarrheal disease. C: Linked to infection susceptibility. E: Not listed.","source_slide":"L02 Introduction to Global Health, slide 10"},{"id":"FND-SOC-L02-05","block":"Foundations","lecture":"L02 Introduction to Global Health","discipline":"Social Medicine","style":"LAU","stem":"Which global-health player is owned and governed by member states and provides long-term loans and grants to low- and middle-income countries?","options":{"A":"World Health Organization","B":"Bilateral agency such as USAID","C":"Multilateral development bank such as the World Bank","D":"Regional organization such as PAHO","E":"Transnational social movement"},"answer":"C","explanation":"Multilateral development banks (World Bank, African, Asian and Inter-American Development Banks) are owned by member states and mobilize development financing through loans, grants and technical assistance. A: WHO gives technical assistance, standards and coordination. B: One donor country, one recipient. D: Fosters public-health collaboration among member states. E: Loose activist networks that shape the agenda.","source_slide":"L02 Introduction to Global Health, slides 12–15, 18"},{"id":"FND-SOC-L02-06","block":"Foundations","lecture":"L02 Introduction to Global Health","discipline":"Social Medicine","style":"LAU","stem":"Although a smallpox vaccine existed since 1796, what made eradication a practical goal in the 1950s?","options":{"A":"Invention of the bifurcated needle","B":"The vaccine could be mass-produced and stored without refrigeration","C":"Creation of the WHO Smallpox Eradication Unit","D":"Mandatory case reporting by all WHO member states","E":"Discovery that smallpox had no animal reservoir"},"answer":"B","explanation":"Eradication became practical once the vaccine could be mass-produced and stored without refrigeration. A: The bifurcated needle (1960s) was a later breakthrough that cut costs. C, D: Parts of the later WHO campaign, not what made the goal practical. E: A disease feature that made smallpox a good candidate, not the 1950s development.","source_slide":"L02 Introduction to Global Health, slides 21–22, 25"},{"id":"FND-SOC-L03-01","block":"Foundations","lecture":"L03 The Social Determinants of Health","discipline":"Social Medicine","style":"LAU","stem":"Under-5 mortality falls steadily from the poorest to the richest household quintile within a country. What does this illustrate?","options":{"A":"A threshold effect","B":"Genetic differences","C":"The social gradient in health","D":"Random variation","E":"Health system failure only"},"answer":"C","explanation":"Health improves step by step with socioeconomic position. A: A threshold would affect only the poorest. B: Not genetic. D: The pattern is systematic. E: Too narrow.","source_slide":"L03 The Social Determinants of Health, slide 11"},{"id":"FND-SOC-L03-02","block":"Foundations","lecture":"L03 The Social Determinants of Health","discipline":"Social Medicine","style":"LAU","stem":"The WHO defines social determinants of health as the conditions in which people are born, grow, live, work and age. What does the WHO say shapes these conditions?","options":{"A":"Individual lifestyle and health behaviours","B":"Age, sex and constitutional factors","C":"Availability and quality of health care services","D":"Social and community support networks","E":"Distribution of money, power and resources"},"answer":"E","explanation":"The WHO definition states these conditions are shaped by the distribution of money, power and resources at global and local levels. A, B, D: Layers of the Dahlgren–Whitehead model, not what the WHO definition names as the shaping force. C: Health care services are one determinant among many.","source_slide":"L03 The Social Determinants of Health, slides 4–5"},{"id":"FND-SOC-L03-03","block":"Foundations","lecture":"L03 The Social Determinants of Health","discipline":"Social Medicine","style":"LAU","stem":"Road traffic deaths fell in highly motorized countries between 1987 and 1995 mainly because of:","options":{"A":"Policies such as compulsory seat belts and drunk-driving penalties","B":"Better trauma surgery","C":"Fewer cars","D":"Lower speed of vehicles due to congestion","E":"Genetic changes"},"answer":"A","explanation":"The lecture cites seat-belt laws and penalties for driving under the influence. B, C, D, E: Not the cited cause.","source_slide":"L03 The Social Determinants of Health, slide 20"},{"id":"FND-SOC-L03-04","block":"Foundations","lecture":"L03 The Social Determinants of Health","discipline":"Social Medicine","style":"LAU","stem":"According to the lecture, which sectors should health policy addressing the social determinants of health involve?","options":{"A":"The health ministry alone, since health is its mandate","B":"Health and finance ministries, which fund care","C":"All sectors, since policy in each one shapes health","D":"The private sector, through insurance coverage","E":"Municipalities, through building local clinics"},"answer":"C","explanation":"Policy relevance of SDH: health concerns should involve all sectors (transport, economy, employment, education, agriculture, environment, security), not just health policy. A, B, D, E: Too narrow; each leaves out sectors that shape health.","source_slide":"L03 The Social Determinants of Health, slide 6"},{"id":"FND-SOC-L03-05","block":"Foundations","lecture":"L03 The Social Determinants of Health","discipline":"Social Medicine","style":"LAU","stem":"Two unemployed men receive identical income support and housing. The one who feels ashamed of being jobless and is shunned by his neighbours has worse health. What does this illustrate?","options":{"A":"Material deprivation","B":"The social meaning of poverty","C":"The social gradient in health","D":"Unequal access to health care","E":"Genetic predisposition"},"answer":"B","explanation":"Beyond material conditions, the social meaning of being poor, unemployed or excluded, including stigma, affects health. A: Their material circumstances are identical. C: The gradient compares socioeconomic levels; both men are at the same level. D: Access is not mentioned as different. E: Nothing suggests a genetic cause.","source_slide":"L03 The Social Determinants of Health, slides 11, 14"},{"id":"FND-SOC-L04-01","block":"Foundations","lecture":"L04 Health and Human Rights","discipline":"Social Medicine","style":"LAU","stem":"A government passes a law to stop private companies from polluting a town's water supply. Which state obligation does this fulfill?","options":{"A":"Protect","B":"Respect","C":"Fulfil","D":"Progressive realization","E":"Accession"},"answer":"A","explanation":"Protect = preventing third parties from interfering with the right. B: Respect = the state itself not interfering. C: Fulfil = adopting measures to realize the right (e.g., building water systems). D, E: Not obligation levels.","source_slide":"L04 Health and Human Rights, slide 15"},{"id":"FND-SOC-L04-02","block":"Foundations","lecture":"L04 Health and Human Rights","discipline":"Social Medicine","style":"LAU","stem":"Which international treaty article contains the most detailed provision on the right to health?","options":{"A":"UDHR Article 25","B":"CRPD Article 25","C":"CRC Article 24","D":"ICESCR Article 12","E":"CEDAW Article 12"},"answer":"D","explanation":"ICESCR includes the most detailed provision: Article 12.1, the right to the highest attainable standard of physical and mental health. A: UDHR 25.1 is the right to a standard of living adequate for health (food, clothing, housing, medical care). B, C, E: Right-to-health provisions limited to specific populations (persons with disabilities, children, women).","source_slide":"L04 Health and Human Rights, slides 9–11"},{"id":"FND-SOC-L04-03","block":"Foundations","lecture":"L04 Health and Human Rights","discipline":"Social Medicine","style":"LAU","stem":"A state signed a human-rights treaty but hasn't ratified it. What is its legal position?","options":{"A":"Fully bound by every provision, as if ratified","B":"Not bound, but must not undermine the treaty's purpose","C":"Not bound, and free to act against its aims","D":"Bound only to the treaty's minimum core obligations","E":"A full party, as with accession"},"answer":"B","explanation":"Signature is a preliminary endorsement: no binding legal obligation, but the State must refrain from acts that undermine the treaty's object and purpose. A, D: Only ratification or accession creates binding obligations. C: Signature still carries the duty not to undermine the treaty. E: Accession makes a State a full party (same effect as ratification); signature alone does not.","source_slide":"L04 Health and Human Rights, slides 26–27"},{"id":"FND-SOC-L04-04","block":"Foundations","lecture":"L04 Health and Human Rights","discipline":"Social Medicine","style":"LAU","stem":"According to the lecture, what distinguishes harm reduction for people who use drugs?","options":{"A":"It requires abstinence before services are offered","B":"It relies on criminal penalties to deter use","C":"It serves only people already in drug treatment","D":"It puts legal outcomes ahead of health outcomes","E":"It does not necessarily require abstinence"},"answer":"E","explanation":"Harm reduction is evidence-based policy and practice that minimizes the health, social and legal harms of drug use and protects rights, without necessarily requiring abstinence, meeting people 'where they are'. A, C: It doesn't require abstinence or prior treatment. B: Criminalization drives unsafe injecting. D: It focuses on improving health outcomes.","source_slide":"L04 Health and Human Rights, slides 21–23"},{"id":"FND-SOC-L04-05","block":"Foundations","lecture":"L04 Health and Human Rights","discipline":"Social Medicine","style":"LAU","stem":"A country cannot build a national primary-care network immediately because of limited resources, but it expands coverage every year toward measurable targets. Which ICESCR concept allows this?","options":{"A":"Minimum core obligation","B":"Priority obligation","C":"Progressive realization","D":"Accession","E":"Obligation to respect"},"answer":"C","explanation":"Progressive realization recognizes resource constraints and that the right to health can't be achieved immediately, but requires States to move as expeditiously and effectively as possible, tracked with indicators and benchmarks. A: The minimum core is what all States are obligated to implement, not a time allowance. B: Specific essential services (e.g., immunization, maternal care), not a timeline. D: A way of joining a treaty. E: Refraining from interfering with the right.","source_slide":"L04 Health and Human Rights, slides 16–19"},{"id":"FND-SOC-L04-06","block":"Foundations","lecture":"L04 Health and Human Rights","discipline":"Social Medicine","style":"LAU","stem":"Which item is part of the minimum core obligations of the right to health, rather than the ICESCR priority obligations?","options":{"A":"Immunization against major infectious diseases","B":"Provision of essential drugs as defined by the WHO","C":"Reproductive, maternal and child health care","D":"Training of health personnel","E":"Education on the main health problems"},"answer":"B","explanation":"Minimum core: non-discriminatory access, minimum safe food, basic shelter, sanitation and water, essential drugs (WHO), equitable distribution, and a national public health strategy. A, C, D, E: Priority obligations listed by the ICESCR in addition to the core.","source_slide":"L04 Health and Human Rights, slides 16–17"},{"id":"FND-SOC-L04-07","block":"Foundations","lecture":"L04 Health and Human Rights","discipline":"Social Medicine","style":"LAU","stem":"A State that took no part in negotiating or signing a treaty later becomes a party after the treaty has entered into force. What is this called, and what is its effect?","options":{"A":"Signature; not legally binding","B":"Ratification; legally binding","C":"Accession; same legal effect as ratification","D":"Accession; weaker than ratification","E":"Reservation; binding only for chosen articles"},"answer":"C","explanation":"Accession is accepting the opportunity to join a treaty already negotiated and signed by others, usually after it enters into force; it has the same legal effect as ratification. A: Signature is only a preliminary endorsement. B: Ratification follows the State's own prior signature. D: Accession is not weaker. E: Reservations are not covered in the lecture.","source_slide":"L04 Health and Human Rights, slides 26–28"}], SHEETS = [{"discipline":"Pharmacology","covers":"L01–L06, L08–L13","sections":[{"h":"Basics","items":["PK = body → drug (ADME). PD = drug → body. Pharmacogenomics: DNA changes dose. <b>Thalidomide</b> → limb defects → trials, teratogenicity testing, consent","<b>Affinity</b> = binding; <b>intrinsic activity</b> = triggers response. Agonist: both. Antagonist: affinity only. Partial agonist: lower Emax (buprenorphine can precipitate withdrawal)","<b>Potency</b> = dose axis (curve left). <b>Efficacy</b> = plateau height. Efficacy (ideal trials) ≠ effectiveness (real world)","<b>TI = TD50 / ED50</b>. KD low = high affinity. Spare receptors: EC50 &lt; KD"]},{"h":"Absorption / distribution","items":["Weak acid: pH &lt; pKa → unionized (crosses). Ionized = trapped. <b>Alkalinize urine</b> for aspirin (ion trapping). pKa = 50% ionized","Bioavailability F = f × (1 − ER). <b>First pass</b>: morphine, propranolol, nitroglycerin (→ sublingual). Absorption steps exist for every route except IV. P-gp = efflux pump","Tetracycline/quinolones + Ca²⁺/antacids → chelation. Levothyroxine: empty stomach","<b>Vd</b> = amount / Cp. &gt;1 L/kg = tissue-bound. Albumin binds acids; α1-acid glycoprotein binds bases. Only free drug acts. &gt;90% bound = interaction risk. 70 kg: TBW 42, ICF 28, ECF 14, plasma 3 L","BBB: lipid-soluble only, P-gp pumps out (L-DOPA via LAT1). Fetal plasma acidic → traps bases"]},{"h":"Metabolism / elimination","items":["Phase I = functionalize (oxidation, reduction, hydrolysis; may be toxic). Phase II = conjugate (<b>glucuronidation</b>). Prodrugs: enalapril, codeine (CYP2D6 → morphine). NAPQI from acetaminophen","<b>CYP3A4</b> ~50% · 2D6 · <b>2C9</b> (warfarin, NSAIDs) · <b>2C19</b> (PPIs, clopidogrel). <b>Induction</b> (rifampin, smoking, alcohol): slow, ↓ levels (OCP failure). <b>Inhibition</b> (cimetidine, omeprazole, grapefruit-gut): fast, ↑ levels (warfarin bleeding)","Kidney: filtration (&lt; 20,000 Da, free drug), reabsorption, <b>active secretion</b> (OAT: penicillin, methotrexate; OCT: morphine). GFR 125 mL/min. CL = Ux·V/Px. Hepatic CL = flow × ER","Enterohepatic recirculation: bacterial β-glucuronidase; charcoal/cholestyramine interrupt it"]},{"h":"Quantitative","items":["<b>First-order</b>: constant fraction; t½ = 0.693/k; k = CL/Vd; Css at 3–5 t½. <b>Zero-order</b> (saturation): ethanol, phenytoin, high-dose salicylate → unpredictable","Infusion rate = Css × CL. <b>Loading dose = Vd × target Cp</b>. Css (oral) = F·dose / (τ·CL). AUC = F·Dose/CL. Half-life dosing → R = 2","Bioequivalence: AUC, Cmax within ±20%. Renal failure: CL halves → halve infusion rate. Narrow TI: digoxin, lithium, aminoglycosides, warfarin"]},{"h":"Toxicology","items":["Treat the patient first (ABC). Gastric emptying works only within 1–2 h","Antidotes: acetaminophen → <b>N-acetylcysteine</b>; opioids → <b>naloxone</b>; benzodiazepines → <b>flumazenil</b>; anticholinergics → <b>physostigmine</b>; iron → <b>deferoxamine</b>; organophosphates (SLUDGE, miosis) → <b>atropine</b>; methanol/ethylene glycol → ethanol per lecture (fomepizole is the standard, outside source)","Stimulants: dilated pupils, hyperthermia, tachycardia (FAST). Depressants: miosis, hypothermia. Hypotension CRASH; bradycardia PACED"]},{"h":"ADRs & interactions","items":["ADR = noxious at normal dose; ADE includes errors. <b>Type A</b> (augmented): predictable, dose-related. <b>Type B</b> (bizarre): unpredictable, e.g., anaphylaxis, malignant hyperthermia. C = continuous, D = delayed, E = end-of-use","Same receptor same tissue: anticoagulant bleeding. Different receptors: propranolol bronchospasm → β1-selective. Vancomycin red man = rapid infusion","PK interactions change concentration; PD change effect. Thiazides/NSAIDs ↑ lithium. Potentiation: clavulanate + amoxicillin"]},{"h":"Pharmacodynamics","items":["Antagonism: chemical (protamine–heparin), PK (rifampin–warfarin), <b>competitive</b> (right shift, same Emax), <b>non-competitive/irreversible</b> (↓ Emax; phenoxybenzamine), physiological (insulin vs glucocorticoid)","Tachyphylaxis = rapid; tolerance = slow. <b>β-blocker withdrawal</b>: upregulated receptors → rebound. Desensitization: GRK + β-arrestin (seconds); down-regulation (days)","Targets: receptors, enzymes, transporters, ion channels. Speed: ion channel ms · GPCR s · kinase-linked/nuclear hours (steroids don&#39;t fix acute asthma). nAChR = ion channel; mAChR = GPCR. β = Gs, α2 = Gi. Cholera toxin: Gs stuck on","Insulin/EGF = RTK (erlotinib = EGFR). Cytokine/EPO = JAK (tofacitinib). Quantal curve = ED50 across a population"]}]},{"discipline":"Biochemistry","covers":"L01–L11, L12 (Fatty acids), L13 (Amino acids). Skipped by design: gray side-notes, blue enzymes, β-oxidation steps, fat mobilization.","sections":[{"h":"Cell & protein","items":["<b>CFTR ΔF508</b>: misfolded → stuck in ER (ERAD). <b>α1-antitrypsin Z</b>: polymerizes in liver (cirrhosis) + no elastase brake in lung (emphysema)","<b>mtDNA</b>: maternal, <b>heteroplasmy</b>; hits nerve/muscle/kidney; MERRF. Nuclear-encoded mito genes = Mendelian","<b>I-cell</b>: no mannose-6-P (GlcNAc-phosphotransferase) → lysosomal enzymes secreted. Signals: <b>SKL</b> peroxisome · <b>KDEL</b> ER retention · N-term hydrophobic = secretory","<b>Peroxisome</b>: VLCFA oxidation. <b>Zellweger</b> = biogenesis defect; <b>X-ALD</b> (ABCD1) = VLCFA build-up","<b>Kinesin</b> → (+) end, <b>dynein</b> → (−). Vincristine/vinblastine block, <b>paclitaxel</b> stabilizes, <b>colchicine</b> (gout). Kartagener = dynein. WAS = X-linked actin (eczema, infections, small platelets). Progeria = LMNA. EBS = keratin 5/14. <i>C. perfringens</i> α-toxin = PLC","<b>PrPSc</b>: β-sheet, protease-resistant, templates PrPC. Ubiquitin → proteasome"]},{"h":"Enzymes","items":["Km ↓ = affinity ↑. <b>Competitive</b>: Km↑ Vmax=. <b>Non-competitive</b>: Km= Vmax↓. <b>Uncompetitive</b>: both ↓. LB: y = 1/Vmax, x = −1/Km","<b>Glucokinase</b> (liver, high Km, after meals) vs hexokinase (low Km). Low-Km ALDH missing → flushing. Aspirin acetylates COX serine; nerve gas → AChE"]},{"h":"Signaling","items":["G protein: GDP off / GTP on. <b>Cholera</b> locks Gαs on (↑cAMP); <b>pertussis</b> blocks Gi. <b>Ras</b> off via GAP: mutant Ras or <b>NF1</b> loss → always on","Gq → PLC → IP3 + DAG → PKC. RTK → Grb2 → SOS → Ras → MAPK; PI3K → PIP3 → Akt. Insulin receptor → <b>IRS</b>. T1DM: no insulin; T2DM: resistance","JAK-STAT (<b>X-SCID</b> = IL2RG). NO → guanylyl cyclase; <b>sildenafil</b> blocks PDE5. Myasthenia: Ab cross-link AChR; edrophonium helps"]},{"h":"Glucose","items":["Regulated steps: <b>hexokinase/GK, PFK-1 (rate-limiting), pyruvate kinase</b>. PFK-1: ATP/citrate −, AMP +, <b>F2,6BP</b> strongest +. GLUT4 = insulin; <b>GLUT1 deficiency</b> = seizures","Net: 2 pyruvate + 2 ATP + 2 NADH. RBC always lactate (regenerates NAD⁺). 2,3-BPG shunt in RBC","<b>PDH</b> needs TPP, lipoate, CoA, FAD, NAD⁺ → thiamine deficiency (CNS, Wernicke). PDH kinase = off. PDH deficiency = X-linked lactic acidosis","<b>Gluconeogenesis</b> bypasses: pyruvate carboxylase (biotin), PEPCK, <b>F1,6-BPase</b> (F2,6BP/AMP −), <b>G6Pase</b> (liver, kidney). PC deficiency: ↑lactate, alanine; ketosis. Alcohol ↑NADH → fasting hypoglycemia. Glucagon turns off hepatic PK"]},{"h":"Glycogen","items":["Synthase (UDP-glucose, α1→4), branching (α1→6); phosphorylase (PLP) + debranching (frees glucose). Glucagon/epi → cAMP → PKA → phosphorylase <b>on</b>, synthase <b>off</b>; insulin reverses","Muscle lacks G6Pase. <b>Von Gierke</b> (G6Pase): fasting hypoglycemia. <b>Pompe</b> (lysosomal α-glucosidase). <b>Andersen</b> (branching): cirrhosis. <b>McArdle</b> (muscle phosphorylase): cramps, myoglobinuria, flat lactate, 2nd wind"]},{"h":"Energy","items":["ETC: <b>complex II</b> pumps no H⁺. <b>Cyanide/CO</b> block IV. <b>Uncouplers</b> (DNP, UCP1 in brown fat) = heat, no ATP. NADH → 2.5 ATP (malate-aspartate) or 1.5 (glycerol-3P)","TCA: SDH (complex II) in inner membrane; irreversible: citrate synthase, <b>IDH, α-KG DH</b>. 1 turn = 3 NADH, 1 FADH₂, 1 GTP. <b>Fluoroacetate</b> → aconitase. α-keto DH family: PDH, α-KGDH, BCKDH"]},{"h":"Fatty acids","items":["<b>ACC</b>: rate-limiting, biotin; citrate +, LCFA-CoA −, <b>AMPK</b> − (metformin), insulin +. Citrate shuttle carries acetyl out. FAS → <b>palmitate</b>, NADPH (HMP, malic enzyme). SREBP-1: high-carb → MASLD","<b>Essential</b>: linoleate, α-linolenate. Deficiency → dermatitis + <b>Mead acid</b>. Adipose needs glucose/insulin (no glycerol kinase)","<b>Carnitine shuttle</b>: CPT-I (malonyl-CoA inhibits) → CPT-II. CPT-I def: liver, hypoketotic hypoglycemia. <b>CPT-II def</b>: muscle, rhabdo with prolonged exercise/fasting, ↑C16/C18. FA &lt; 12 C bypass carnitine","<b>MCAD</b>: infant fasting, hypoketotic hypoglycemia (can mimic SIDS). Odd-chain → propionyl-CoA → methylmalonyl-CoA (<b>B12</b> mutase) → succinyl-CoA. <b>Refsum</b> = phytanic acid","<b>Ketones</b>: HMG-CoA synthase (liver, rate-limiting). Liver lacks <b>thiophorase</b>. DKA: fruity acetone breath"]},{"h":"Amino acids","items":["<b>Cystinuria</b>: COAL transporter (stones = cystine). <b>Hartnup</b>: neutral AA → pellagra-like. Transaminate → <b>glutamate</b>; GDH frees NH₃. NH₃ travels as glutamine or alanine","<b>Urea cycle</b>: <b>CPS I</b> (needs N-acetylglutamate; arginine activates NAGS) → <b>OTC</b> → ASS (aspartate) → lyase (fumarate) → <b>arginase</b> (liver only). OTC = X-linked, most common: ↑orotic acid, low citrulline/BUN. CPS I/NAGS: orotic ↓. Tx: protein restriction, phenylbutyrate","Ammonia: astrocyte glutamine swelling, α-KG drain. Leu + Lys = only ketogenic AAs","<b>PKU</b>: phenylalanine hydroxylase (BH4); musty odor, ID, fair skin; Tyr essential; screen after 24–48 h feeds; maternal PKU teratogenic","<b>MSUD</b>: BCKDH (Leu, Ile, Val). <b>Homocystinuria</b>: cystathionine β-synthase (↑Hcy/Met, ↓Cys; lens ectopia, thrombosis; B6). <b>Alkaptonuria</b>: homogentisic oxidase (dark urine, arthritis). <b>Albinism</b>: tyrosinase"]}]},{"discipline":"Physiology","covers":"L01–L07, L09–L11 (L08 aging not posted)","sections":[{"h":"Fluids","items":["TBW 60% of weight: <b>ICF 40%, ECF 20%</b> (60-40-20); ECF ¾ interstitial, ¼ plasma. ECF volume tracks total body Na⁺","NaCl = 2 osmoles. Normal osmolality 290–300. <b>Tonicity</b> = impermeant solutes (urea isosmotic but hypotonic). Add NaCl → ECF ↑, ICF ↓. Isotonic saline stays in ECF. Pure water → ⅔ ICF, ⅓ ECF. Mannitol ↓ ICP via ↑ plasma osmolality","<b>Starling</b>: Pc ~30 → 10 mmHg; plasma oncotic ~28 (albumin ~22); net filtration ~13 arterial, reabsorption ~7 venous; excess → lymph","Edema: HF = ↑ venous hydrostatic; nephrotic/liver = ↓ oncotic; lymph blockage = ↑ interstitial oncotic. Hemorrhage → absorption. Capillaries: continuous (muscle), fenestrated (gut), sinusoidal (liver)"]},{"h":"Homeostasis","items":["Negative feedback = opposes. Gain = correction / error (BP 100 → 150 settling at 110: gain −4). Positive: oxytocin in labor; hemorrhage vicious cycle","H⁺ defense: buffers (instant) → lungs (minutes) → kidneys (slowest, strongest). Tight junctions seal; gap junctions (connexin) couple cardiac myocytes"]},{"h":"Membrane & excitability","items":["<b>Nernst</b> (37 °C) 61.5/z · log(out/in); E_K ≈ −90, E_Na ≈ +61. Driving force = Vm − E_ion. <b>Hyperkalemia</b> → depolarizes; sustained → Na⁺ channels inactivate. GHK: Vm nearest the most permeable ion","Na⁺/K⁺-ATPase: <b>3 Na⁺ out / 2 K⁺ in</b>. Fick = uncharged flux; Ohm I = g × driving force. Gibbs–Donnan: impermeant anions → swelling","AP: all-or-none (Na⁺ positive feedback); absolute refractory = inactivated Na⁺ channels; initiated at <b>axon initial segment</b>. TTX blocks Na⁺; TEA blocks K⁺. Myelin ↑ resistance, ↓ capacitance","<b>Transport</b>: carriers saturate/compete; channels faster. NKCC2 in thick ascending limb. P-type (Na/K) vs V-type (lysosome) ATPases. Ouabain/digitalis block Na/K-ATPase; omeprazole blocks H/K-ATPase. Gut: SGLT (apical) + GLUT2 (basolateral). ENaC in collecting duct. Cl⁻ secretion: NKCC1 + CFTR","Endocytosis: clathrin, dynamin (familial hypercholesterolemia: LDL receptor can&#39;t enter pits)"]},{"h":"Calcium","items":["99% in bone; plasma 9–11 mg/dL. PTH ↑ (bone, kidney reabsorption, calcitriol). Calcitonin ↓ (inhibits osteoclasts). Hypocalcemia → hyperexcitable nerves; hypercalcemia → short QT, constipation","Cytosol 10⁻⁷ vs ECF 10⁻³ M. Out via PMCA, <b>SERCA</b>, NCX (3 Na⁺ : 1 Ca²⁺). Cardiac: L-type → RyR2 (CICR). Skeletal: Ca²⁺ → troponin"]},{"h":"ANS & pain & temperature","items":["Parasympathetic: CN III, VII, IX, X + S2–S4, long pre, short post. Sympathetic: T1–L2, divergence 1:≥20 (widespread). Sweat glands and adrenal medulla: cholinergic (nicotinic at medulla)","<b>M1,3,5 = Gq; M2,4 = Gi</b>; α1 Gq, α2 Gi, β Gs. Phenylephrine α1, clonidine α2, dobutamine β1, terbutaline β2","Pain + temperature: <b>spinothalamic</b>. Sensitization = tenderness; substance P → neurogenic edema; referred pain (diaphragm → shoulder); allodynia = neuropathic","Temp: lowest early morning; rectal ≈ +0.5 °C vs oral; luteal +0.5 (progesterone); radiation ~60% of heat loss. <b>Fever</b> = PGE₂ raises set point (chills at onset). Heat stroke = set point unchanged. Brown fat in infants"]},{"h":"Protein sorting","items":["SRP pauses translation → ER. N-glycosylation at Asn-X-Ser/Thr. COPII ER→Golgi, <b>COPI</b> retrograde (KKXX, KDEL). Ran-GTP (GEF nuclear, GAP cytosolic). TOM/TIM for mitochondria. Lysosomal enzymes: M6P in cis-Golgi → I-cell disease if absent"]}]},{"discipline":"Pathology","covers":"L02–L08 (L01 not posted)","sections":[{"h":"Cell adaptation","items":["<b>Hypertrophy</b> (↑ size), <b>hyperplasia</b> (↑ number; hormone-dependent, reverses), atrophy (ubiquitin-proteasome + autophagy), <b>metaplasia</b> (smoker → squamous; Barrett → columnar from reflux). Hypoplasia ≠ atrophy"]},{"h":"Cell injury","items":["ATP loss → Na⁺/K⁺ pump fails → swelling, ↑glycolysis ↓pH. ↑ cytosolic Ca²⁺ activates phospholipases, proteases, endonucleases. Ischemia worse than hypoxia. Reperfusion → ROS, Ca²⁺ overload","Reversible: swelling, fatty change. Irreversible: mitochondrial dysfunction + membrane damage. Nucleus: <b>pyknosis → karyorrhexis → karyolysis</b>","Antioxidants: SOD, catalase, glutathione peroxidase"]},{"h":"Necrosis types","items":["<b>Coagulative</b> (solid-organ infarct; not brain) · <b>liquefactive</b> (abscess, brain) · <b>caseous</b> (TB, Ziehl–Neelsen) · <b>fat</b> (pancreatitis, saponification) · <b>fibrinoid</b> (vasculitis, malignant HTN) · gangrene (dry = coagulative; wet = infected)"]},{"h":"Death pathways","items":["Necrosis: swelling, rupture, inflammation. <b>Apoptosis</b>: shrinkage, intact membrane. Intrinsic: BAX/BAK → cytochrome c → APAF-1 → <b>caspase 9</b>. Extrinsic: Fas/TNF → <b>caspase 8</b>. Executioners: 3, 7. Follicular lymphoma = BCL-2 overexpression","Pyroptosis (caspase-1, gasdermin D), necroptosis (RIPK1/3, MLKL), ferroptosis (iron, GPX4)"]},{"h":"Accumulations","items":["Steatosis (alcohol, diabetes, obesity). <b>Hemosiderin</b> (Prussian blue). Lipofuscin = wear-and-tear. Anthracosis = carbon. Dystrophic calcification: normal Ca²⁺, dead tissue. Metastatic: hypercalcemia. Bilirubin = jaundice"]},{"h":"Repair","items":["Regeneration needs intact ECM scaffold. <b>Labile</b> (skin, GI, marrow), <b>stable</b> (hepatocytes, tubular cells, fibroblasts), <b>permanent</b> (neurons, cardiac myocytes → scar). Liver regrows by hepatocyte proliferation","PDGF (fibroblasts), EGF (epithelium), <b>TGF-β</b> (fibrosis), <b>VEGF</b> (angiogenesis). Granulation tissue = vessels + fibroblasts + macrophages. Type <b>III</b> collagen → type <b>I</b>. Vitamin C: hydroxylation of proline/lysine. MMPs (zinc) limited by TIMPs. Stellate cells in cirrhosis","Phases: hemostasis → inflammation → proliferation → remodeling. First intention: neutrophils 24 h, macrophages day 3. Tensile strength 10% at 1 wk, 70–80% at 3 mo. Second intention: bigger scar, myofibroblast contraction. <b>Keloid</b> extends beyond the wound; hypertrophic scar doesn&#39;t. Steroids impair healing"]},{"h":"Edema, congestion, hemorrhage, infarct","items":["Edema mechanisms: ↑ hydrostatic (HF), ↓ oncotic (nephrotic, cirrhosis), lymph obstruction, Na⁺ retention (RAAS), ↑ permeability. Exudate = protein-rich; transudate = poor. Renal edema first in eyelids. Anasarca","Chronic liver congestion = <b>nutmeg</b> (centrilobular). Lung = heart failure cells (hemosiderin)","Petechiae 1–2 mm, purpura 3–10 mm, ecchymosis &gt; 1 cm. Melena upper GI; hematochezia lower GI. Bruise: purple → green (biliverdin) → yellow","Infarct: wedge-shaped. <b>White</b> (heart, spleen, kidney; arterial) vs <b>red</b> (venous, lung, bowel, testis/ovary torsion, reperfusion). Determinants: collateral supply, speed of occlusion, tissue hypoxia sensitivity, blood O₂. Septic infarct → abscess"]}]},{"discipline":"Microbiology","covers":"L01–L06 (parasites L07, fungi L08–09, lab L10 not posted)","sections":[{"h":"Basics","items":["Leeuwenhoek = first to see microbes; <b>Koch</b> = agar, TB/cholera/anthrax. Postulates: every case, pure culture, reproduces disease, re-isolated. Fail for <i>M. leprae</i> and <i>N. gonorrhoeae</i>","Prokaryote: circular chromosome, no nucleus, <b>70S</b> ribosome (30S + 50S), peptidoglycan wall, binary fi
