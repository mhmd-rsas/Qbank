<style>
/* Layout: one narrow column; discipline accordion on home, one question at a time in practice, a single-page sheet per discipline. */
:root{--bg:#f4f5f2;--card:#fff;--ink:#1c2225;--mute:#667078;--line:#e1e4e2;--acc:#1f6f8b;--accbg:#e4f0f4;--ok:#1b7a4b;--okbg:#e4f3eb;--bad:#b3261e;--badbg:#fbeae9;
 --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181a;--card:#1d2225;--ink:#e6e9ea;--mute:#98a2a9;--line:#2c3236;--acc:#7cc0da;--accbg:#1a2b33;--ok:#6fcf97;--okbg:#14301f;--bad:#f28b82;--badbg:#3a1d1b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181a;--card:#1d2225;--ink:#e6e9ea;--mute:#98a2a9;--line:#2c3236;--acc:#7cc0da;--accbg:#1a2b33;--ok:#6fcf97;--okbg:#14301f;--bad:#f28b82;--badbg:#3a1d1b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
main{max-width:860px;margin:0 auto;padding-block:16px 72px;padding-inline:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:8px 14px}
h1{font:700 22px/1.2 var(--serif);margin:0;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:10px}
.tabs button{border:0;background:transparent;color:var(--mute);padding:7px 14px;border-radius:8px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-block:12px}
button{font:inherit;cursor:pointer}button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{background:var(--acc);color:var(--bg);border:1px solid var(--acc);border-radius:9px;padding:8px 16px;font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--acc)}.btn.sm{padding:5px 12px;font-size:13px}.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.quick{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.quick .btn{flex:1;min-width:150px}
details.disc{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-block:10px;overflow:hidden}
details.disc>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px;font:600 17px var(--serif)}
details.disc>summary::-webkit-details-marker{display:none}
details.disc>summary::before{content:"›";color:var(--mute);transition:transform .15s;font:20px/1 var(--sans)}
details.disc[open]>summary::before{transform:rotate(90deg)}
.pill{font:600 12px var(--sans);color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:1px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lec{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.lec .t{flex:1;min-width:0}.lec .t b{font-weight:600}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px;max-width:220px}
.bar i{display:block;height:100%;background:var(--acc)}.bar i.g{background:var(--ok)}.bar i.r{background:var(--bad)}
.stat{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mute);white-space:nowrap}
.qhead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin:0 6px 6px 0}
.stem{font-size:17px;margin:6px 0 14px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;margin-block:8px;padding:11px 14px;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--accbg)}
.opt b{color:var(--mute);min-width:1.1em}.opt span{min-width:0}.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt:disabled{cursor:default}
.exp{border-left:3px solid var(--acc);padding:2px 0 2px 14px;margin-top:14px}.exp.ok{border-color:var(--ok)}.exp.no{border-color:var(--bad)}
.exp .v{font-weight:700}.exp .src{margin-top:6px}
.prog{height:4px;background:var(--line);border-radius:2px;margin-block:10px 14px}.prog i{display:block;height:100%;background:var(--acc);border-radius:2px}
.score{font:700 36px/1.1 var(--serif);letter-spacing:-.02em}
.miss{padding:8px 0;border-top:1px solid var(--line);font-size:15px}
footer{margin-top:28px;color:var(--mute);font-size:13px}footer button{background:none;border:0;color:var(--acc);padding:0;margin-right:14px;font-size:13px;text-decoration:underline}
footer textarea{width:100%;min-height:90px;margin-top:8px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-block:6px 14px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 13px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.sheet h2{font:700 21px var(--serif);margin:0 0 2px}.sheet .cov{color:var(--mute);font-size:13px;margin-bottom:10px}
.sheet h3{font:700 12px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin:16px 0 4px;border-bottom:1px solid var(--line);padding-bottom:3px}
.sheet ul{margin:0;padding-left:18px}.sheet li{margin-block:3px;font-size:15px;line-height:1.45}.sheet li::marker{color:var(--mute)}
[hidden]{display:none!important}
@media print{
 body{background:#fff;color:#000;font-size:10px}main{max-width:none;padding:0}header,.chips,.noprint,footer,#qview{display:none!important}
 .sheet{border:0;padding:0;column-count:2;column-gap:18px}.sheet h2,.sheet .cov{column-span:all}.sheet li{font-size:9px;line-height:1.28;margin:1.5px 0;break-inside:avoid}
 .sheet h3{font-size:8.5px;margin:7px 0 2px;color:#000;break-after:avoid}@page{margin:9mm}
}
</style>

<script>
const Q = [{"id":"FND-BIO-L01-01","block":"Foundations","lecture":"L01 Intro to Biochemistry and Cell Structure","discipline":"Biochemistry","style":"LAU","stem":"A child with CFTR ΔF508 has no chloride channel at the apical membrane of airway cells, although the mutant protein can still conduct chloride. What happens to the mutant protein?","options":{"A":"It lacks mannose-6-phosphate and is secreted","B":"It is retained in the ER and degraded (ERAD)","C":"It is never translated on ER-bound ribosomes","D":"It is imported into peroxisomes by an SKL signal","E":"It is retrieved from the Golgi by a KDEL signal"},"answer":"B","explanation":"ΔF508 CFTR is misfolded but functional; ER quality control retains it and degrades it (ERAD), so it never reaches the apical membrane. A: Missing M6P with secretion of the enzymes is I-cell disease. C: CFTR is a membrane protein, made on ER-bound ribosomes. D: SKL targets cytosolic proteins to peroxisomes. E: KDEL retrieval applies to ER-resident proteins, not CFTR.","source_slide":"L01 Intro to Biochemistry and Cell Structure, slide 23"},{"id":"FND-BIO-L01-02","block":"Foundations","lecture":"L01 Intro to Biochemistry and Cell Structure","discipline":"Biochemistry","style":"LAU","stem":"A 7-year-old boy, developmentally normal until age 6, has progressive loss of vision, hearing and motor skills, with adrenal insufficiency. Plasma very-long-chain fatty acids are elevated. What is the primary defect?","options":{"A":"Peroxisomal biogenesis","B":"Lysosomal enzyme targeting","C":"An mtDNA-encoded respiratory chain protein","D":"Carnitine palmitoyltransferase I","E":"ABCD1 peroxisomal membrane transporter"},"answer":"E","explanation":"X-linked adrenoleukodystrophy: ABCD1 mutation impairs peroxisomal oxidation of VLCFAs, which accumulate in the nervous system and adrenals; onset at 5–10 years. A: Biogenesis defects (Zellweger) present in infancy and are fatal in the first year. B: Mistargeting of lysosomal enzymes is I-cell disease. C: mtDNA disorders are maternally inherited and don't raise VLCFAs. D: CPT-I carries long-chain, not very-long-chain, fatty acids and causes hypoketotic hypoglycemia.","source_slide":"L01 Intro to Biochemistry and Cell Structure, slides 32–34"},{"id":"FND-BIO-L01-03","block":"Foundations","lecture":"L01 Intro to Biochemistry and Cell Structure","discipline":"Biochemistry","style":"LAU","stem":"A mitochondrial myopathy affects a mother and all her children with very different severity. Which statement best explains this pattern?","options":{"A":"Maternal inheritance with heteroplasmy","B":"Autosomal dominant inheritance with incomplete penetrance","C":"X-linked inheritance with lyonization","D":"Mutation in a nuclear gene encoding a mitochondrial protein","E":"Genomic imprinting"},"answer":"A","explanation":"mtDNA comes from the oocyte; differing proportions of mutant mtDNA (heteroplasmy) cause variable severity. B: Would allow paternal transmission. C: Lyonization applies to X-linked genes. D: Nuclear-encoded defects follow Mendelian inheritance. E: Imprinting involves parent-specific gene silencing, not mtDNA.","source_slide":"L01 Intro to Biochemistry and Cell Structure, slide 27"},{"id":"FND-BIO-L01-04","block":"Foundations","lecture":"L01 Intro to Biochemistry and Cell Structure","discipline":"Biochemistry","style":"Step1","stem":"A 2-month-old has hypotonia, seizures, dysmorphic features and an enlarged liver. Plasma very-long-chain fatty acids and phytanic acid are elevated, and plasmalogens are low. What is the underlying defect?","options":{"A":"ABCD1 peroxisomal transporter","B":"Phytanoyl-CoA α-hydroxylase","C":"Lysosomal acid α-glucosidase","D":"N-acetylglucosamine phosphotransferase","E":"Peroxisomal biogenesis"},"answer":"E","explanation":"Zellweger syndrome: without functional peroxisomes, VLCFA and phytanic acid oxidation, plasmalogen and bile acid synthesis all fail; fatal in the first year. A: X-ALD affects VLCFA transport only and starts at 5–10 years. B: Refsum disease raises phytanic acid alone, with onset in childhood or adolescence. C: Acid α-glucosidase deficiency is Pompe disease (lysosomal glycogen). D: This is I-cell disease (lysosomal enzyme mistargeting).","source_slide":"L01 Intro to Biochemistry and Cell Structure, slides 32, 35"},{"id":"FND-BIO-L02-01","block":"Foundations","lecture":"L02 Cell Structure","discipline":"Biochemistry","style":"LAU","stem":"A patient receiving paclitaxel develops neutropenia. How does paclitaxel arrest dividing cells?","options":{"A":"Blocks tubulin polymerization","B":"Stabilizes microtubules","C":"Inhibits actin polymerization","D":"Inhibits dynein ATPase","E":"Cross-links intermediate filaments"},"answer":"B","explanation":"Taxanes stabilize microtubules, freezing the mitotic spindle. A: Blocking polymerization is vincristine/vinblastine (and colchicine). C: Actin isn't the target. D: Dynein isn't directly inhibited. E: Intermediate filaments aren't targeted.","source_slide":"L02 Cell Structure, slide 19"},{"id":"FND-BIO-L02-02","block":"Foundations","lecture":"L02 Cell Structure","discipline":"Biochemistry","style":"LAU","stem":"A protein is made with an N-terminal hydrophobic signal sequence and a KDEL sequence near its C-terminus. Where will it finally reside?","options":{"A":"Lysosome","B":"Peroxisome","C":"Extracellular fluid","D":"ER lumen","E":"Nucleus"},"answer":"D","explanation":"The signal sequence brings it into the ER on ER-bound ribosomes; KDEL keeps it in the ER or returns it from the Golgi. A: Lysosomal proteins need mannose-6-phosphate. B: Peroxisomal proteins carry SKL and are made on free ribosomes. C: Secreted proteins also start with a signal sequence, but KDEL retains this one. E: Nuclear proteins use basic NLS sequences and are made on free ribosomes.","source_slide":"L02 Cell Structure, slides 30–32"},{"id":"FND-BIO-L02-03","block":"Foundations","lecture":"L02 Cell Structure","discipline":"Biochemistry","style":"Step1","stem":"A 14-month-old boy has coarse facial features, restricted joint movement, and developmental delay. Plasma levels of multiple lysosomal hydrolases are markedly elevated. Which enzyme is deficient?","options":{"A":"Hexosaminidase A","B":"Glucocerebrosidase","C":"N-acetylglucosamine-1-phosphotransferase","D":"α-L-iduronidase","E":"Acid α-glucosidase"},"answer":"C","explanation":"I-cell disease: no mannose-6-phosphate tagging in the Golgi, so lysosomal enzymes are secreted into plasma. A: Tay-Sachs. B: Gaucher. D: Hurler. E: Pompe. None of these raise plasma levels of multiple hydrolases.","source_slide":"L02 Cell Structure, slides 33–35"},{"id":"FND-BIO-L02-04","block":"Foundations","lecture":"L02 Cell Structure","discipline":"Biochemistry","style":"Step1","stem":"A 3-year-old boy has eczema, recurrent otitis media, and bloody diarrhea. Platelets are low and small. His maternal uncle had similar problems. Which cellular process is defective?","options":{"A":"Microtubule polymerization","B":"Dynein arm function","C":"Keratin filament assembly","D":"Actin cytoskeleton organization","E":"Lysosomal enzyme targeting"},"answer":"D","explanation":"Wiskott–Aldrich syndrome (X-linked, WAS protein) disrupts actin organization in blood cells: eczema, infections, thrombocytopenia with small platelets. A: Microtubule defects don't give this triad. B: Dynein defects cause Kartagener syndrome. C: Keratin defects cause epidermolysis bullosa simplex. E: Mistargeting causes I-cell disease.","source_slide":"L02 Cell Structure, slide 22"},{"id":"FND-BIO-L02-05","block":"Foundations","lecture":"L02 Cell Structure","discipline":"Biochemistry","style":"LAU","stem":"A lab uses fluorescent annexin V to identify apoptotic cells in culture. What does annexin V binding detect?","options":{"A":"Phosphatidylcholine moved to the inner leaflet","B":"Cholesterol depleted from lipid rafts","C":"Phosphatidylserine exposed on the outer leaflet","D":"Sphingomyelin hydrolyzed by phospholipase C","E":"Phosphatidylinositol cleaved for signaling"},"answer":"C","explanation":"PS is normally kept in the inner leaflet by ATP-dependent flippases; its exposure on the outer leaflet is the \"eat-me\" signal of apoptotic cells, detected with annexin V. A: PC is normally in the outer leaflet; its position isn't the marker. B: Raft cholesterol isn't what annexin V binds. D: Phospholipase C (e.g., C. perfringens alpha toxin) lyses membranes; it isn't an apoptosis marker. E: PI signaling happens on the inner leaflet.","source_slide":"L02 Cell Structure, slide 10"},{"id":"FND-BIO-L02-06","block":"Foundations","lecture":"L02 Cell Structure","discipline":"Biochemistry","style":"LAU","stem":"How does cholesterol affect the fluidity of the plasma membrane?","options":{"A":"Less fluid at body temperature; prevents freezing at low temperature","B":"More fluid at body temperature; tighter packing at low temperature","C":"More fluid at all temperatures","D":"Less fluid at all temperatures","E":"No effect on fluidity; it only forms lipid rafts"},"answer":"A","explanation":"Cholesterol is a fluidity buffer: at body temperature it restricts tail movement (less fluid, less permeable), and at low temperature it prevents tight packing. B: That reverses both effects. C: Cis-unsaturated tails and ethanol increase fluidity; cholesterol doesn't. D: At low temperature it keeps the membrane from freezing. E: Rafts are one role, but cholesterol also buffers fluidity.","source_slide":"L02 Cell Structure, slide 11"},{"id":"FND-BIO-L04-01","block":"Foundations","lecture":"L04 Protein Structure","discipline":"Biochemistry","style":"LAU","stem":"Which amino acid is most likely to act as a proton donor/acceptor in an enzyme active site at physiological pH?","options":{"A":"Histidine","B":"Lysine","C":"Arginine","D":"Leucine","E":"Glycine"},"answer":"A","explanation":"Histidine's imidazole pKa (~6) lets it switch between protonated and unprotonated states at pH 7.4. B: Lysine (pKa ~10.5) stays protonated. C: Arginine (pKa ~12.5) is always positive. D: Leucine is nonpolar. E: Glycine has no ionizable side chain.","source_slide":"L04 Protein Structure, slide 17"},{"id":"FND-BIO-L04-02","block":"Foundations","lecture":"L04 Protein Structure","discipline":"Biochemistry","style":"LAU","stem":"Proline and glycine both destabilize an α helix, but for different reasons. Why does glycine do so?","options":{"A":"Its rigid ring introduces a kink","B":"Its bulky side chain clashes with neighbors","C":"Its charge opposes the helix dipole","D":"It forms disulfide cross-links","E":"Its high conformational flexibility"},"answer":"E","explanation":"Glycine's side chain is only a hydrogen, so it is unusually flexible and coiling it into a helix is unfavorable. A: The rigid ring and kink describe proline, the helix breaker. B: Glycine has the smallest side chain. C: Glycine's side chain is uncharged. D: Cysteine forms disulfides.","source_slide":"L04 Protein Structure, slides 32, 50"},{"id":"FND-BIO-L04-03","block":"Foundations","lecture":"L04 Protein Structure","discipline":"Biochemistry","style":"LAU","stem":"A lab estimates protein concentration in a sample by measuring absorbance at 280 nm. Which residues mainly produce this signal?","options":{"A":"Phenylalanine and leucine","B":"Cysteine and methionine","C":"Histidine and arginine","D":"Tryptophan and tyrosine","E":"Proline and glycine"},"answer":"D","explanation":"Trp and Tyr absorb strongly at 280 nm. A: Phe absorbs weakly (~257 nm) and leucine not at all. B: Sulfur residues aren't the basis. C: Basic residues don't absorb at 280 nm. E: Neither absorbs at 280 nm.","source_slide":"L04 Protein Structure, slide 14"},{"id":"FND-BIO-L04-04","block":"Foundations","lecture":"L04 Protein Structure","discipline":"Biochemistry","style":"LAU","stem":"Which feature distinguishes the disease-causing prion protein (PrPSc) from normal PrPC?","options":{"A":"Different sequence; α-helix rich","B":"Same sequence; α-helix rich, protease-sensitive","C":"Same sequence; β-sheet rich, protease-resistant","D":"Different sequence; β-sheet rich, soluble","E":"Same sequence; no secondary structure"},"answer":"C","explanation":"PrPSc has the same sequence as PrPC but a β-sheet-rich, insoluble, protease-resistant conformation that templates conversion of PrPC. A, D: The sequence is identical. B: This describes normal PrPC. E: PrPSc is refolded, not unstructured.","source_slide":"L04 Protein Structure, slide 45"},{"id":"FND-BIO-L04-05","block":"Foundations","lecture":"L04 Protein Structure","discipline":"Biochemistry","style":"LAU","stem":"Which chaperone binds exposed hydrophobic patches on a nascent polypeptide, keeping it unfolded until synthesis is complete?","options":{"A":"Hsp70","B":"Proteasome","C":"Ubiquitin","D":"Signal recognition particle","E":"Chaperonin (Hsp60)"},"answer":"A","explanation":"Hsp70 (with Hsp40) holds nascent chains unfolded and prevents aggregation until synthesis is complete. B: The proteasome degrades proteins. C: Ubiquitin tags misfolded proteins for degradation. D: SRP targets ribosomes to the ER. E: Chaperonins form a barrel-shaped protected chamber in which the protein folds.","source_slide":"L04 Protein Structure, slide 43"},{"id":"FND-BIO-L04-06","block":"Foundations","lecture":"L04 Protein Structure","discipline":"Biochemistry","style":"Step1","stem":"A 66-year-old woman has rapidly progressive dementia and myoclonus over 5 months; MRI shows cortical diffusion restriction. At autopsy, the brain shows spongiform change. What is the pathogenic mechanism?","options":{"A":"Hyperphosphorylated tau forming neurofibrillary tangles","B":"Trinucleotide repeat expansion in a nuclear gene","C":"α-Synuclein aggregates in Lewy bodies","D":"Misfolded protein that converts normal protein to its β-sheet form","E":"Viral infection of oligodendrocytes"},"answer":"D","explanation":"Creutzfeldt–Jakob disease: PrPSc templates PrPC conversion to a β-sheet, protease-resistant form. A: Tau tangles are Alzheimer disease. B: Repeat expansion is Huntington disease. C: Lewy bodies are Parkinson disease. E: JC virus in oligodendrocytes causes PML.","source_slide":"L04 Protein Structure, slides 5, 45"},{"id":"FND-BIO-L04-07","block":"Foundations","lecture":"L04 Protein Structure","discipline":"Biochemistry","style":"LAU","stem":"A patient with Z-variant α1-antitrypsin develops cirrhosis. Which mechanism best explains the liver damage?","options":{"A":"Loss of function: low plasma levels leave the liver unprotected","B":"Prion-like templating of normal α1-antitrypsin","C":"Toxic gain of function: polymers accumulate in hepatocytes","D":"Mistargeting for lack of mannose-6-phosphate","E":"ER retention and ERAD of a protein that stays soluble"},"answer":"C","explanation":"Z-variant α1-antitrypsin misfolds and polymerizes in hepatocytes: a toxic gain of function that damages the liver, while its absence from plasma causes emphysema. A: Low plasma levels explain the lung disease, not the liver disease. B: Templated conversion is specific to prions. D: Missing M6P is I-cell disease. E: Retention and degradation without aggregation is ΔF508 CFTR (loss of function).","source_slide":"L04 Protein Structure, slide 44"},{"id":"FND-BIO-L04-08","block":"Foundations","lecture":"L04 Protein Structure","discipline":"Biochemistry","style":"LAU","stem":"A patient's missense variant gives a high-confidence AlphaFold model with no visible change in the overall fold. What is the best conclusion?","options":{"A":"It is benign, because the fold is preserved","B":"It cannot be called benign on this basis","C":"It is pathogenic, because AlphaFold models are static","D":"It must lie in an intrinsically disordered region","E":"The model is invalid for a single protein"},"answer":"B","explanation":"AlphaFold can't reliably predict how a point mutation affects stability or function; a variant can abolish catalysis, binding or trafficking without changing the fold, so conservation and functional data are still needed. A: A preserved fold doesn't mean preserved function. C: Being static is a limitation, not evidence of pathogenicity. D: Disordered regions are where AlphaFold is weak, so a high-confidence model argues against this. E: Single proteins are what AlphaFold predicts best.","source_slide":"L04 Protein Structure, slides 48–51"},{"id":"FND-BIO-L05-01","block":"Foundations","lecture":"L05 Enzyme Kinetics","discipline":"Biochemistry","style":"LAU","stem":"In the presence of an inhibitor, an enzyme's Lineweaver–Burk plot shows the same y-intercept but an x-intercept closer to zero. What type of inhibitor is it?","options":{"A":"Pure non-competitive","B":"Competitive","C":"Uncompetitive","D":"Irreversible","E":"Allosteric activator"},"answer":"B","explanation":"Same y-intercept = unchanged Vmax; x-intercept (−1/Km) closer to zero = increased Km → competitive. A: Non-competitive raises the y-intercept (↓Vmax) with the same x-intercept. C: Uncompetitive gives parallel lines (both change). D: Irreversible inhibition lowers Vmax. E: An activator wouldn't raise Km.","source_slide":"L05 Enzyme Kinetics, slides 30, 35"},{"id":"FND-BIO-L05-02","block":"Foundations","lecture":"L05 Enzyme Kinetics","discipline":"Biochemistry","style":"LAU","stem":"Blood glucose is ~5 mM between meals. Hexokinase has a Km for glucose of ~0.05 mM and glucokinase ~6 mM. Which statement is correct?","options":{"A":"Glucokinase works near Vmax between meals","B":"Both work at about half Vmax","C":"Hexokinase has lower affinity for glucose","D":"Glucokinase is mainly found in erythrocytes","E":"Hexokinase works near Vmax between meals"},"answer":"E","explanation":"With [S] ≫ Km (5 vs 0.05 mM), hexokinase is saturated. A: Glucokinase, at [S] below its Km, runs well below Vmax and speeds up as glucose rises after meals. B: Only glucokinase is near half Vmax. C: Hexokinase has the lower Km, so higher affinity. D: Glucokinase is hepatic; RBCs use hexokinase.","source_slide":"L05 Enzyme Kinetics, slides 26–27"},{"id":"FND-BIO-L05-03","block":"Foundations","lecture":"L05 Enzyme Kinetics","discipline":"Biochemistry","style":"LAU","stem":"Which statement about enzymes as catalysts is correct?","options":{"A":"They make ΔG more negative","B":"They shift equilibrium toward products","C":"They lower the activation energy without changing equilibrium","D":"They are consumed in the reaction","E":"Their active sites are most complementary to the substrate's ground state"},"answer":"C","explanation":"Enzymes lower activation energy; equilibrium and ΔG are unchanged and the enzyme is regenerated. A: ΔG is unaffected. B: Equilibrium is unaffected. D: Enzymes aren't consumed. E: Active sites best fit the transition state.","source_slide":"L05 Enzyme Kinetics, slides 18, 23"},{"id":"FND-BIO-L05-04","block":"Foundations","lecture":"L05 Enzyme Kinetics","discipline":"Biochemistry","style":"LAU","stem":"An inhibitor binds only to the enzyme–substrate complex. How do apparent Km and Vmax change?","options":{"A":"Km ↓, Vmax ↓","B":"Km ↑, Vmax unchanged","C":"Km unchanged, Vmax ↓","D":"Km ↑, Vmax ↑","E":"Both unchanged"},"answer":"A","explanation":"Uncompetitive inhibition lowers both Vmax and apparent Km (binding ES pulls the equilibrium toward ES). B: That's competitive. C: That's pure non-competitive. D: Inhibitors don't raise Vmax. E: Binding ES necessarily changes kinetics.","source_slide":"L05 Enzyme Kinetics, slides 40–41"},{"id":"FND-BIO-L05-05","block":"Foundations","lecture":"L05 Enzyme Kinetics","discipline":"Biochemistry","style":"LAU","stem":"A regulatory enzyme gives a sigmoidal velocity vs [S] curve and is inhibited by the final product of its pathway. Which terms best describe it?","options":{"A":"Michaelis–Menten enzyme; competitive inhibition","B":"Allosteric enzyme; feedback inhibition","C":"Zymogen; proteolytic activation","D":"Isozyme; covalent modification","E":"Monomeric enzyme; uncompetitive inhibition"},"answer":"B","explanation":"Sigmoidal kinetics = allosteric (usually multisubunit) enzyme; end-product inhibition = feedback inhibition. A: Michaelis–Menten enzymes give hyperbolic curves. C: Zymogens are inactive precursors. D: Isozymes are different proteins catalyzing the same reaction. E: Allosteric enzymes are usually multimeric.","source_slide":"L05 Enzyme Kinetics, slides 42–45"},{"id":"FND-BIO-L05-06","block":"Foundations","lecture":"L05 Enzyme Kinetics","discipline":"Biochemistry","style":"Step1","stem":"A 28-year-old man of East Asian descent develops facial flushing, tachycardia, and nausea after half a glass of wine. Which enzyme variant best explains this?","options":{"A":"Low-activity alcohol dehydrogenase","B":"Overactive CYP2E1","C":"Deficient catalase","D":"Deficient high-affinity aldehyde dehydrogenase","E":"Low-affinity glucokinase"},"answer":"D","explanation":"Lacking the low-Km (high-affinity) ALDH2 lets acetaldehyde accumulate, causing flushing. A: Low ADH activity would reduce acetaldehyde formation. B: CYP2E1 induction doesn't explain acute flushing. C: Catalase is a minor ethanol pathway. E: Glucokinase is unrelated.","source_slide":"L05 Enzyme Kinetics, slide 28"},{"id":"FND-BIO-L05-07","block":"Foundations","lecture":"L05 Enzyme Kinetics","discipline":"Biochemistry","style":"Step1","stem":"A farmer arrives 12 hours after organophosphate pesticide exposure with salivation, bradycardia and muscle fasciculations. Atropine reduces the secretions, but pralidoxime has no effect. Why?","options":{"A":"Organophosphates are reversible inhibitors that have washed out","B":"Pralidoxime works only by blocking muscarinic receptors","C":"Organophosphates block acetylcholine synthesis, not breakdown","D":"Atropine has already reactivated the enzyme","E":"The phosphorylated AChE has aged and is permanently inhibited"},"answer":"E","explanation":"Organophosphates phosphorylate the catalytic serine of AChE (irreversible inhibition). Pralidoxime removes the phosphate only before the adduct \"ages\"; after that, recovery waits on new enzyme over weeks, while atropine still blocks muscarinic effects. A: They are irreversible, covalent inhibitors. B: Blocking muscarinic receptors is atropine's action. C: They block ACh breakdown, so ACh accumulates. D: Atropine is a receptor blocker and doesn't act on AChE.","source_slide":"L05 Enzyme Kinetics, slide 33"},{"id":"FND-BIO-L05-08","block":"Foundations","lecture":"L05 Enzyme Kinetics","discipline":"Biochemistry","style":"LAU","stem":"FAD stays tightly bound to its enzyme throughout catalysis, whereas NAD⁺ binds, is reduced and dissociates. How are these coenzymes classified?","options":{"A":"FAD: co-substrate; NAD⁺: prosthetic group","B":"Both are metal-ion cofactors","C":"FAD: apoenzyme; NAD⁺: holoenzyme","D":"FAD: prosthetic group; NAD⁺: co-substrate","E":"Both are allosteric effectors"},"answer":"D","explanation":"Coenzymes that associate permanently are prosthetic groups (FAD); those that associate transiently are co-substrates (NAD⁺). A: Reversed. B: Both are organic, vitamin-derived coenzymes, not metal ions. C: The apoenzyme is the protein part; the holoenzyme is protein plus cofactor. E: Allosteric effectors bind a separate site to regulate activity; these take part in the reaction.","source_slide":"L05 Enzyme Kinetics, slides 11–13"},{"id":"FND-BIO-L06-01","block":"Foundations","lecture":"L06 Cell Signaling","discipline":"Biochemistry","style":"LAU","stem":"Cortisol binds an intracellular receptor that acts as a transcription factor. Which other messenger uses the same receptor superfamily?","options":{"A":"Epinephrine","B":"Thyroid hormone","C":"Insulin","D":"Interleukin-2","E":"Acetylcholine"},"answer":"B","explanation":"Lipophilic messengers (steroids, thyroid hormone, retinoic acid, vitamin D) cross the membrane and bind the steroid/thyroid hormone receptor superfamily. A: Catecholamines are polar and bind surface receptors. C: Insulin is a polypeptide acting on a surface receptor tyrosine kinase. D: Cytokines are proteins that use surface receptors. E: Acetylcholine acts on surface ion channel (nicotinic) receptors.","source_slide":"L06 Cell Signaling, slides 19, 21"},{"id":"FND-BIO-L06-02","block":"Foundations","lecture":"L06 Cell Signaling","discipline":"Biochemistry","style":"LAU","stem":"Endothelial cells release prostacyclin, which relaxes the adjacent vascular smooth muscle. This is an example of which signaling mode?","options":{"A":"Endocrine","B":"Autocrine","C":"Direct via gap junctions","D":"Direct via surface receptor contact","E":"Paracrine"},"answer":"E","explanation":"PGI2 from endothelial cells acts on nearby cells of a different type (smooth muscle): paracrine. A: Endocrine signals travel in the blood to distant cells. B: Autocrine acts on the secreting cell or cells of the same type. C: Gap junctions pass small molecules such as Ca²⁺ directly between cells. D: Direct signaling through surface receptors needs cell-to-cell contact, as in the immune system.","source_slide":"L06 Cell Signaling, slides 10, 17"},{"id":"FND-BIO-L06-03","block":"Foundations","lecture":"L06 Cell Signaling","discipline":"Biochemistry","style":"LAU","stem":"Compared with aspirin, a glucocorticoid reduces synthesis of a broader range of eicosanoids, including leukotrienes. Why?","options":{"A":"It inhibits cyclooxygenase irreversibly","B":"It inhibits phospholipase C, blocking IP3 and DAG","C":"It blocks prostaglandin receptors on target cells","D":"It inhibits phospholipase A2, so arachidonic acid isn't released","E":"It inhibits adenylyl cyclase in injured cells"},"answer":"D","explanation":"Glucocorticoids inhibit PLA2, which releases arachidonic acid from membrane phospholipids, so the whole eicosanoid cascade shuts down; aspirin and NSAIDs inhibit only downstream COX. A: Irreversible COX inhibition is aspirin's action, which spares leukotrienes. B: PLC makes IP3 and DAG, not arachidonate. C: Receptor blockade wouldn't reduce synthesis. E: Adenylyl cyclase makes cAMP, not eicosanoids.","source_slide":"L06 Cell Signaling, slide 16"},{"id":"FND-BIO-L06-04","block":"Foundations","lecture":"L06 Cell Signaling","discipline":"Biochemistry","style":"Step1","stem":"A 37-year-old woman has leg weakness that worsens with walking and recovers with rest, slurred speech after long phone calls, and ptosis by evening. What is the mechanism of her disease?","options":{"A":"Antibodies against presynaptic voltage-gated Ca²⁺ channels","B":"Loss of acetylcholinesterase activity","C":"Blockade of ACh release by a bacterial toxin","D":"Demyelination of motor neurons","E":"Antibodies against nicotinic ACh receptors"},"answer":"E","explanation":"Myasthenia gravis: anti-AChR antibodies cross-link receptors, which are endocytosed and degraded, giving fatigable weakness. A: Lambert–Eaton (improves with use). B: Loss of AChE would increase ACh effect. C: Botulism (descending paralysis, not fatigable pattern). D: Demyelination gives a different pattern (e.g., Guillain–Barré).","source_slide":"L06 Cell Signaling, slides 30–32"},{"id":"FND-BIO-L06-05","block":"Foundations","lecture":"L06 Cell Signaling","discipline":"Biochemistry","style":"LAU","stem":"Cortisol enters a cell and binds the glucocorticoid receptor in the cytoplasm. What happens next?","options":{"A":"The receptor autophosphorylates and recruits Grb2","B":"The receptor activates Gs, raising cAMP","C":"The receptor opens an ion channel in the membrane","D":"Heat shock proteins dissociate, exposing an NLS","E":"The receptor binds its response element in the cytoplasm"},"answer":"D","explanation":"Cortisol binding changes the receptor's conformation: it releases its heat shock proteins, exposing a nuclear localization signal, then dimerizes and moves to the nucleus to bind the hormone-response element. A: Autophosphorylation and Grb2 are RTK signaling. B: Gs and cAMP are GPCR signaling. C: Ion channel receptors are surface receptors for neurotransmitters. E: The hormone-response element is DNA, in the nucleus.","source_slide":"L06 Cell Signaling, slide 22"},{"id":"FND-BIO-L06-06","block":"Foundations","lecture":"L06 Cell Signaling","discipline":"Biochemistry","style":"LAU","stem":"In myasthenia gravis, antibodies reduce the number of nicotinic ACh receptors. Why does pyridostigmine improve muscle strength?","options":{"A":"It stimulates synthesis of new receptors","B":"More ACh reaches the remaining receptors","C":"It blocks binding of anti-receptor antibodies","D":"It irreversibly inactivates acetylcholinesterase","E":"It acts directly as a nicotinic agonist"},"answer":"B","explanation":"Pyridostigmine is a reversible acetylcholinesterase inhibitor: ACh accumulates in the cleft, so the fewer remaining receptors are occupied more often. It is symptomatic, so immunosuppressants are added. A: It doesn't increase receptor synthesis. C: Antibody production is reduced by immunosuppressants, not by AChE inhibitors. D: Pyridostigmine is reversible; irreversible AChE inhibitors are nerve agents. E: It acts on the enzyme, not on the receptor.","source_slide":"L06 Cell Signaling, slide 32"},{"id":"FND-BIO-L07-01","block":"Foundations","lecture":"L07 Intracellular Signal Transduction","discipline":"Biochemistry","style":"LAU","stem":"Cholera toxin and pertussis toxin act on opposite G proteins, yet both raise intracellular cAMP. Which pair of mechanisms is correct?","options":{"A":"Cholera activates Gi; pertussis activates Gs","B":"Both inhibit phosphodiesterase","C":"Cholera locks Gs active; pertussis blocks Gi","D":"Cholera blocks Gq; pertussis activates PLC","E":"Both directly activate adenylyl cyclase"},"answer":"C","explanation":"Cholera ADP-ribosylates Gαs (no GTPase → stays on); pertussis ADP-ribosylates Gi (can't inhibit AC). A: Reversed. B: PDE isn't the target. D: Gq and PLC aren't involved. E: Both act via G proteins, not AC directly.","source_slide":"L07 Signal Transduction, VI slides 19–20"},{"id":"FND-BIO-L07-02","block":"Foundations","lecture":"L07 Intracellular Signal Transduction","discipline":"Biochemistry","style":"LAU","stem":"A hormone activates a Gq-coupled receptor on a smooth muscle cell. Which second messenger directly releases Ca²⁺ from the ER?","options":{"A":"Diacylglycerol","B":"PIP3","C":"cAMP","D":"cGMP","E":"Inositol trisphosphate"},"answer":"E","explanation":"Gq activates phospholipase C, which cleaves PIP2 into IP3 and DAG; IP3 opens Ca²⁺ channels in the ER. A: DAG stays in the membrane and, with Ca²⁺, activates PKC. B: PIP3 is made by PI3-kinase and serves as a PH-domain docking site. C: cAMP is made by adenylyl cyclase (Gs). D: cGMP is made by guanylyl cyclase.","source_slide":"L07 Signal Transduction, VI slide 29; VII slides 8–9"},{"id":"FND-BIO-L07-03","block":"Foundations","lecture":"L07 Intracellular Signal Transduction","discipline":"Biochemistry","style":"LAU","stem":"After an RTK autophosphorylates, which protein links it to Ras activation by binding phosphotyrosine through an SH2 domain?","options":{"A":"Raf","B":"STAT","C":"Smad4","D":"Grb2","E":"PKA"},"answer":"D","explanation":"Grb2 binds phosphotyrosine via SH2 and recruits SOS (a Ras GEF) via SH3. A: Raf acts downstream of Ras. B: STATs bind JAK-phosphorylated cytokine receptors. C: Smad4 is in TGF-β signaling. E: PKA is cAMP-dependent.","source_slide":"L07 Signal Transduction, VII slide 6"},{"id":"FND-BIO-L07-04","block":"Foundations","lecture":"L07 Intracellular Signal Transduction","discipline":"Biochemistry","style":"LAU","stem":"TGF-β binds its type II receptor. What is the next step in the pathway?","options":{"A":"The receptor autophosphorylates on tyrosine","B":"Type II receptor phosphorylates type I on serine","C":"JAK phosphorylates the receptor","D":"Type I receptor phosphorylates Smad4","E":"R-Smad binds DNA without Smad4"},"answer":"B","explanation":"TGF-β receptors are serine/threonine kinases: ligand-bound type II recruits and phosphorylates type I, which phosphorylates an R-Smad; R-Smad joins Smad4 and regulates transcription in the nucleus. A: Tyrosine autophosphorylation is RTK signaling. C: JAK is used by cytokine receptors. D: Smad4 (Co-Smad) is not phosphorylated. E: R-Smad acts in a complex with Smad4.","source_slide":"L07 Signal Transduction, VII slides 19–21"},{"id":"FND-BIO-L07-05","block":"Foundations","lecture":"L07 Intracellular Signal Transduction","discipline":"Biochemistry","style":"Step1","stem":"A 9-month-old boy has recurrent severe infections, chronic diarrhea, and failure to thrive. He has almost no circulating T cells and his thymic shadow is absent. His maternal uncle died in infancy of infections. Which gene is most likely mutated?","options":{"A":"IL2RG","B":"ADA","C":"BTK","D":"WAS","E":"CD40L"},"answer":"A","explanation":"X-linked SCID: common γ chain (IL2RG) shared by many cytokine receptors. B: ADA deficiency causes autosomal recessive SCID. C: BTK causes X-linked agammaglobulinemia (B cells absent, T cells normal). D: WAS causes eczema, thrombocytopenia, infections. E: CD40L causes hyper-IgM syndrome.","source_slide":"L07 Signal Transduction, VII slide 18"},{"id":"FND-BIO-L07-06","block":"Foundations","lecture":"L07 Intracellular Signal Transduction","discipline":"Biochemistry","style":"Step1","stem":"A 14-year-old has multiple café-au-lait macules, axillary freckling, and cutaneous neurofibromas. The defective protein normally does what?","options":{"A":"Stimulates GDP release from Ras","B":"Phosphorylates STAT proteins","C":"Inhibits adenylyl cyclase","D":"Stimulates GTP hydrolysis by Ras","E":"Degrades cGMP"},"answer":"D","explanation":"Neurofibromin (NF1) is a Ras GAP; its loss keeps Ras active. A: That's a GEF (e.g., SOS), which activates Ras. B: JAK phosphorylates STATs. C: Gi inhibits adenylyl cyclase. E: Phosphodiesterases degrade cGMP.","source_slide":"L07 Signal Transduction, VI slide 21"},{"id":"FND-BIO-L07-07","block":"Foundations","lecture":"L07 Intracellular Signal Transduction","discipline":"Biochemistry","style":"LAU","stem":"A man taking sildenafil uses nitroglycerin for chest pain and becomes severely hypotensive. Which statement explains how the two drugs together raise cGMP?","options":{"A":"NO blocks cGMP breakdown; sildenafil activates guanylyl cyclase","B":"NO activates adenylyl cyclase; sildenafil blocks cAMP breakdown","C":"Both activate membrane guanylyl cyclase receptors","D":"Both inhibit cGMP phosphodiesterase","E":"NO activates soluble guanylyl cyclase; sildenafil blocks cGMP breakdown"},"answer":"E","explanation":"Nitroglycerin supplies NO, which activates the cytoplasmic guanylyl cyclase, so more cGMP is made; sildenafil inhibits a cGMP phosphodiesterase, so less is destroyed. Together they cause excessive vasodilation. A: Reversed. B: cAMP isn't the messenger here. C: NO's receptor is the cytoplasmic guanylyl cyclase, and sildenafil acts on the phosphodiesterase. D: Only sildenafil inhibits the phosphodiesterase.","source_slide":"L07 Signal Transduction, VII slides 25–27"},{"id":"FND-BIO-L07-08","block":"Foundations","lecture":"L07 Intracellular Signal Transduction","discipline":"Biochemistry","style":"LAU","stem":"With continuous exposure to epinephrine, a cell's β-adrenergic response fades. Which event underlies this desensitization?","options":{"A":"Phosphodiesterase phosphorylates the receptor","B":"Grb2 binds phosphotyrosines on the receptor","C":"β-ARK phosphorylates the receptor, which then binds β-arrestin","D":"Gαs loses its intrinsic GTPase activity","E":"PKA dissociates from its anchoring proteins"},"answer":"C","explanation":"β-adrenergic receptor kinase phosphorylates the receptor, creating a binding site for β-arrestin, which blocks further G protein binding; receptors are then endocytosed. A: Phosphodiesterase hydrolyzes cAMP; it isn't a kinase. B: Grb2 binds phosphotyrosines on RTKs. D: Loss of Gαs GTPase (as with cholera toxin) prolongs the signal. E: AKAPs set PKA location, not receptor sensitivity.","source_slide":"L07 Signal Transduction, VI slide 28"},{"id":"FND-BIO-L08-01","block":"Foundations","lecture":"L08 Glycolysis","discipline":"Biochemistry","style":"LAU","stem":"After a carbohydrate-rich meal, which change most directly accelerates hepatic glycolysis at the rate-limiting step?","options":{"A":"↑ Citrate","B":"↑ Fructose 2,6-bisphosphate","C":"↑ ATP","D":"↑ Glucose 6-phosphate inhibiting hexokinase","E":"↑ Acetyl-CoA"},"answer":"B","explanation":"Insulin raises F2,6BP (PFK-2 kinase active), the most potent PFK-1 activator. A: Citrate inhibits PFK-1. C: ATP inhibits PFK-1. D: G6P inhibits hexokinase, not PFK-1, and wouldn't accelerate glycolysis. E: Acetyl-CoA inhibits PDH, not PFK-1.","source_slide":"L08 Glycolysis, slides 20–22"},{"id":"FND-BIO-L08-02","block":"Foundations","lecture":"L08 Glycolysis","discipline":"Biochemistry","style":"LAU","stem":"In untreated type 1 diabetes, reduced glucose uptake by which tissue contributes to the hyperglycemia?","options":{"A":"Erythrocytes","B":"Neurons","C":"Skeletal muscle","D":"Hepatocytes","E":"Intestinal epithelium"},"answer":"C","explanation":"Insulin moves GLUT4 to the plasma membrane in skeletal muscle, adipose tissue and heart; without insulin these tissues take up little glucose. A: Erythrocytes use GLUT1, which is insulin-independent. B: Neurons use GLUT3, which is insulin-independent. D: Hepatocytes use bidirectional GLUT2, which is insulin-independent. E: Intestinal uptake uses the Na⁺-coupled SGLT.","source_slide":"L08 Glycolysis, slides 9–10"},{"id":"FND-BIO-L08-03","block":"Foundations","lecture":"L08 Glycolysis","discipline":"Biochemistry","style":"LAU","stem":"During intense exercise, why does skeletal muscle convert pyruvate to lactate?","options":{"A":"To make ATP at the lactate dehydrogenase step","B":"To relieve ATP inhibition of PFK-1","C":"To export glucose directly to the liver","D":"To supply NADH to the respiratory chain","E":"To regenerate NAD⁺ for glyceraldehyde 3-P dehydrogenase"},"answer":"E","explanation":"NADH production exceeds respiratory chain capacity; the high NADH/NAD⁺ ratio drives pyruvate → lactate, regenerating the limited NAD⁺ that glyceraldehyde 3-P dehydrogenase needs. A: LDH makes no ATP. B: Lactate doesn't regulate PFK-1. C: Lactate, not glucose, goes to the liver (Cori cycle). D: LDH consumes NADH; it doesn't supply it.","source_slide":"L08 Glycolysis, slides 28, 35"},{"id":"FND-BIO-L08-04","block":"Foundations","lecture":"L08 Glycolysis","discipline":"Biochemistry","style":"LAU","stem":"What is the net yield of anaerobic glycolysis (glucose → 2 lactate)?","options":{"A":"2 ATP","B":"4 ATP","C":"2 ATP + 2 NADH","D":"36–38 ATP","E":"0 ATP"},"answer":"A","explanation":"4 ATP made − 2 invested = 2 ATP; NADH is reoxidized when pyruvate becomes lactate. B: 4 is gross, not net. C: Aerobic glycolysis to pyruvate nets 2 ATP + 2 NADH. D: Complete oxidation. E: There is a net gain.","source_slide":"L08 Glycolysis, slides 12, 30"},{"id":"FND-BIO-L08-05","block":"Foundations","lecture":"L08 Glycolysis","discipline":"Biochemistry","style":"Step1","stem":"A 45-year-old man with chronic alcohol use is confused and ataxic. He is given thiamine before glucose. Which enzyme requires the coenzyme form of thiamine (TPP)?","options":{"A":"Lactate dehydrogenase","B":"Pyruvate carboxylase","C":"Glyceraldehyde 3-phosphate dehydrogenase","D":"Pyruvate dehydrogenase","E":"Pyruvate kinase"},"answer":"D","explanation":"PDH requires TPP (with lipoate, CoA, FAD, NAD⁺); giving glucose without thiamine can worsen Wernicke encephalopathy. A: LDH needs NADH only. B: Pyruvate carboxylase needs biotin. C: GAPDH needs NAD⁺. E: Pyruvate kinase needs no TPP.","source_slide":"L08 Glycolysis, slide 32"},{"id":"FND-BIO-L08-06","block":"Foundations","lecture":"L08 Glycolysis","discipline":"Biochemistry","style":"Step1","stem":"A lean 16-year-old has mild, stable fasting hyperglycemia found on routine testing. Her father and grandfather have the same finding and have never needed insulin. An inactivating mutation in which enzyme is most likely?","options":{"A":"Glucokinase","B":"Hexokinase","C":"Phosphofructokinase-1","D":"Pyruvate kinase","E":"Glucose 6-phosphatase"},"answer":"A","explanation":"MODY2: glucokinase, the high-Km glucose sensor of hepatocytes and pancreatic β cells, is inactivated, giving mild fasting hyperglycemia. B: Low-Km hexokinase is saturated at normal glucose and can't act as a sensor. C: PFK-1 is the rate-limiting step of glycolysis, not the glucose sensor. D: Pyruvate kinase deficiency causes hemolytic anemia. E: Glucose 6-phosphatase deficiency (von Gierke) causes fasting hypoglycemia.","source_slide":"L08 Glycolysis, slides 17–18"},{"id":"FND-BIO-L08-07","block":"Foundations","lecture":"L08 Glycolysis","discipline":"Biochemistry","style":"Step1","stem":"An infant has seizures, developmental delay and microcephaly. CSF glucose is low while blood glucose is normal. A ketogenic diet improves the seizures. Which transporter is deficient?","options":{"A":"GLUT2","B":"GLUT3","C":"GLUT1","D":"GLUT4","E":"SGLT"},"answer":"C","explanation":"GLUT1 haploinsufficiency: glucose doesn't cross the blood–brain barrier in sufficient amounts; ketone bodies from a high-fat diet are an alternative brain fuel. A: GLUT2 serves liver and kidney. B: GLUT3 is neuronal, but the defect here is entry across the blood–brain barrier. D: GLUT4 is the insulin-regulated transporter of muscle, fat and heart. E: SGLT is Na⁺-coupled transport in the intestine, renal tubules and choroid plexus; its loss isn't the known cause of this syndrome.","source_slide":"L08 Glycolysis, slides 9–10"},{"id":"FND-BIO-L09-01","block":"Foundations","lecture":"L09 Glycogen Metabolism","discipline":"Biochemistry","style":"LAU","stem":"A 22-year-old has cramps within minutes of sprinting, a \"second wind\" after slowing down, and dark urine after hard effort. Fasting glucose and liver size are normal. What will a forearm exercise test show?","options":{"A":"Lactate rises normally; ammonia flat","B":"Both lactate and ammonia flat","C":"Lactate rises excessively; ammonia normal","D":"Lactate flat; ammonia rises more than normal","E":"Normal rise of both lactate and ammonia"},"answer":"D","explanation":"McArdle disease (muscle phosphorylase, PYGM): no glucose 1-P from glycogen, so lactate doesn't rise; with ATP regeneration blocked, ADP accumulates, adenylate kinase makes AMP, and AMP deaminase releases extra ammonia. A: Lactate can't rise without glycogenolysis. B: Ammonia rises, typically more than normal. C: Glycolysis from glycogen is blocked. E: A normal result is expected in CPT-II deficiency, not here.","source_slide":"L09 Glycogen Metabolism, slides 6, 26, 30–31"},{"id":"FND-BIO-L09-02","block":"Foundations","lecture":"L09 Glycogen Metabolism","discipline":"Biochemistry","style":"LAU","stem":"During fasting, glucagon raises cAMP in hepatocytes. Which combination results?","options":{"A":"Phosphorylase dephosphorylated (active); synthase dephosphorylated (active)","B":"Phosphorylase phosphorylated (inactive); synthase phosphorylated (active)","C":"Phosphorylase phosphorylated (active); glycogen synthase phosphorylated (inactive)","D":"Both dephosphorylated and inactive","E":"Synthase activated by glucose 6-phosphate"},"answer":"C","explanation":"PKA cascades phosphorylate both: phosphorylase becomes active, synthase inactive, so no futile cycle. A: Dephosphorylation is the insulin/fed state for synthase, and phosphorylase is inactive then. B: Reverses the effect of phosphorylation on each enzyme. D: Not the glucagon effect. E: G6P activation is a fed-state allosteric signal.","source_slide":"L09 Glycogen Metabolism, slides 36, 38, 47"},{"id":"FND-BIO-L09-03","block":"Foundations","lecture":"L09 Glycogen Metabolism","discipline":"Biochemistry","style":"LAU","stem":"A 10-month-old has failure to thrive, hepatosplenomegaly and raised ALT/AST, with normal fasting glucose. Liver biopsy shows PAS-positive material that resists diastase digestion, with early fibrosis. Which enzyme is defective?","options":{"A":"Debranching enzyme","B":"Glycogen synthase","C":"Glycogenin","D":"Branching enzyme (4:6 transferase)","E":"Glucose 6-phosphatase"},"answer":"D","explanation":"Andersen disease (GSD IV): no branches, so insoluble, diastase-resistant polyglucosan drives fibrosis; degradation is intact, so fasting glucose stays normal early. A: Debranching deficiency (Cori) causes fasting hypoglycemia. B: Synthase deficiency means little glycogen. C: Glycogenin (GYG1) defects affect muscle glycogen storage (GSD XV). E: Von Gierke glycogen has normal structure, with severe fasting hypoglycemia.","source_slide":"L09 Glycogen Metabolism, slides 5, 20–23"},{"id":"FND-BIO-L09-04","block":"Foundations","lecture":"L09 Glycogen Metabolism","discipline":"Biochemistry","style":"LAU","stem":"Which statement explains why muscle glycogen cannot supply blood glucose?","options":{"A":"Muscle lacks glycogen phosphorylase","B":"Muscle lacks glucose 6-phosphatase","C":"Muscle glycogen has no branches","D":"Muscle lacks phosphoglucomutase","E":"Muscle glycogen is stored in lysosomes"},"answer":"B","explanation":"Without glucose 6-phosphatase, G6P can't become free glucose to export; it's used in local glycolysis. A: Muscle has its own phosphorylase (PYGM). C: Muscle glycogen is branched. D: Phosphoglucomutase is present. E: Most glycogen is cytosolic.","source_slide":"L09 Glycogen Metabolism, slides 29–30"},{"id":"FND-BIO-L09-05","block":"Foundations","lecture":"L09 Glycogen Metabolism","discipline":"Biochemistry","style":"Step1","stem":"A 4-month-old has severe fasting hypoglycemia with seizures, hepatomegaly, lactic acidosis, hyperuricemia and hyperlipidemia. Glucagon doesn't raise blood glucose. Which enzyme is deficient?","options":{"A":"Glucose 6-phosphatase","B":"Muscle glycogen phosphorylase","C":"Acid maltase","D":"Debranching enzyme","E":"Branching enzyme"},"answer":"A","explanation":"Von Gierke disease (GSD I): glycogen is normal and mobilized, but the final step to free glucose (shared with gluconeogenesis) is blocked; G6P is shunted to lactate, urate and lipid. B: McArdle disease affects muscle only. C: Pompe disease gives cardiomegaly with normal blood glucose. D: Cori disease causes fasting hypoglycemia, but lactate and urate stay normal (outside the slides). E: Andersen disease presents with cirrhosis and normal early glucose.","source_slide":"L09 Glycogen Metabolism, slides 44–45"},{"id":"FND-BIO-L09-06","block":"Foundations","lecture":"L09 Glycogen Metabolism","discipline":"Biochemistry","style":"Step1","stem":"A 3-month-old has hypotonia and massive cardiomegaly with heart failure. Blood glucose is normal. Muscle biopsy shows glycogen of normal structure inside membrane-bound vacuoles. Which enzyme is deficient?","options":{"A":"Glucose 6-phosphatase","B":"Lysosomal acid α-1,4-glucosidase","C":"Muscle glycogen phosphorylase","D":"Glycogen synthase","E":"Hexosaminidase A"},"answer":"B","explanation":"Pompe disease (GSD II, acid maltase/GAA): glycogen accumulates in lysosomal vacuoles; it is the only GSD that is a lysosomal storage disease, with massive cardiomegaly and normal glucose. A: Von Gierke disease causes severe fasting hypoglycemia. C: McArdle disease presents later with exercise cramps. D: Synthase deficiency means little glycogen is stored. E: Hexosaminidase A deficiency (Tay-Sachs) stores ganglioside, not glycogen.","source_slide":"L09 Glycogen Metabolism, slides 32, 44"},{"id":"FND-BIO-L09-07","block":"Foundations","lecture":"L09 Glycogen Metabolism","discipline":"Biochemistry","style":"LAU","stem":"A student sprints shortly after a large carbohydrate meal, while insulin is high. Why does his muscle still break down glycogen?","options":{"A":"Ca²⁺ and AMP activate the phosphorylase system allosterically","B":"Insulin activates glycogen phosphorylase in muscle","C":"Glucose 6-phosphate activates glycogen phosphorylase a","D":"Glucagon raises cAMP in muscle cells","E":"Free glucose activates muscle phosphorylase"},"answer":"A","explanation":"Allosteric signals override hormonal ones: contraction releases Ca²⁺, which activates phosphorylase kinase through its calmodulin subunit, and rising AMP activates muscle phosphorylase b without phosphorylation. B: Insulin, through protein phosphatase-1, inactivates phosphorylase. C: G6P inhibits phosphorylase a and activates synthase. D: Glucagon acts on the liver; muscle responds to epinephrine. E: Free glucose inhibits phosphorylase a, and only in liver.","source_slide":"L09 Glycogen Metabolism, slides 35, 39–41"},{"id":"FND-BIO-L09-08","block":"Foundations","lecture":"L09 Glycogen Metabolism","discipline":"Biochemistry","style":"LAU","stem":"A cell's glycogen is completely depleted, and glycogen synthase cannot start a chain on free glucose. How is the first primer made?","options":{"A":"Branching enzyme transfers glucose onto free glucose","B":"Debranching enzyme builds a primer from free glucose","C":"UDP-glucose pyrophosphorylase links glucose units","D":"Glycogen phosphorylase runs in reverse","E":"Glycogenin attaches glucose to its own tyrosine and extends it"},"answer":"E","explanation":"Glycogenin autoglucosylates one of its tyrosines using UDP-glucose and builds a short α(1→4) chain that glycogen synthase then elongates; glycogenin stays at the core of the granule. A: Branching enzyme only moves segments of existing chains. B: Debranching enzyme works in degradation. C: This enzyme makes UDP-glucose, not chains. D: Degradation is not a reversal of synthesis; phosphorylase only shortens chains.","source_slide":"L09 Glycogen Metabolism, slides 14–15"},{"id":"FND-BIO-L10-01","block":"Foundations","lecture":"L10 Pathways for Energy Production","discipline":"Biochemistry","style":"LAU","stem":"A toxin makes the inner mitochondrial membrane permeable to protons. What happens to O₂ consumption and ATP synthesis?","options":{"A":"O₂ consumption ↑, ATP synthesis ↓","B":"O₂ consumption ↓, ATP synthesis ↓","C":"O₂ consumption ↑, ATP synthesis ↑","D":"O₂ consumption unchanged, ATP synthesis ↑","E":"Both unchanged"},"answer":"A","explanation":"Uncoupling dissipates the gradient: electron flow (O₂ use) accelerates while ATP synthesis falls and heat rises. B: That pattern fits ETC or ATP synthase inhibitors. C: ATP can't rise without the gradient. D: Not possible. E: The gradient is lost.","source_slide":"L10 Energy Production, VIII slides 50–51"},{"id":"FND-BIO-L10-02","block":"Foundations","lecture":"L10 Pathways for Energy Production","discipline":"Biochemistry","style":"LAU","stem":"Why do electrons from succinate yield fewer ATP (~1.5) than electrons from malate (~2.5)?","options":{"A":"Succinate oxidation makes GTP instead of a reduced coenzyme","B":"FAD(2H) passes them directly to cytochrome c","C":"Complex II pumps protons back into the matrix","D":"Malate dehydrogenase is coupled directly to ATP synthase","E":"Succinate dehydrogenase passes them via FAD to CoQ, bypassing complex I"},"answer":"E","explanation":"Succinate dehydrogenase (complex II, the only TCA enzyme in the inner membrane) reduces FAD and passes electrons to CoQ, skipping complex I's proton pumping: 6 protons instead of 10. A: GTP comes from succinyl-CoA (succinate thiokinase). B: Electrons from complex II still pass through CoQ and complex III. C: Complex II doesn't pump protons at all. D: Malate's NADH enters at complex I; ATP synthase runs on the proton gradient.","source_slide":"L10 Energy Production, IX slides 16–18; VIII slides 29, 39"},{"id":"FND-BIO-L10-03","block":"Foundations","lecture":"L10 Pathways for Energy Production","discipline":"Biochemistry","style":"LAU","stem":"A child ingests a rodenticide and develops seizures and cardiac arrhythmias. Citrate accumulates in tissues. Which enzyme is inhibited?","options":{"A":"Citrate synthase","B":"Succinate dehydrogenase","C":"Aconitase","D":"Cytochrome c oxidase","E":"ATP synthase"},"answer":"C","explanation":"Fluoroacetate → fluorocitrate, which inhibits aconitase, so citrate accumulates. A: Citrate synthase forms fluorocitrate rather than being blocked. B: SDH inhibition would accumulate succinate. D: Cyanide/CO inhibit complex IV. E: Oligomycin inhibits ATP synthase.","source_slide":"L10 Energy Production, IX slides 9–10"},{"id":"FND-BIO-L10-04","block":"Foundations","lecture":"L10 Pathways for Energy Production","discipline":"Biochemistry","style":"LAU","stem":"Cytosolic NADH from glycolysis in skeletal muscle enters mitochondria via the glycerol 3-phosphate shuttle. Approximately how much ATP does each NADH yield?","options":{"A":"1","B":"2.5","C":"3","D":"1.5","E":"4"},"answer":"D","explanation":"The G3P shuttle passes electrons to FAD → CoQ, bypassing complex I (6 protons → ~1.5 ATP). A: Too low. B: 2.5 is via the malate–aspartate shuttle. C: An older textbook value for matrix NADH. E: Too high.","source_slide":"L10 Energy Production, VIII slides 38–39"},{"id":"FND-BIO-L10-05","block":"Foundations","lecture":"L10 Pathways for Energy Production","discipline":"Biochemistry","style":"Step1","stem":"A firefighter rescued from a burning building has headache, confusion, and severe lactic acidosis despite a normal PaO₂. Venous blood looks unusually bright red. Which ETC component is primarily inhibited?","options":{"A":"Complex IV","B":"Complex I","C":"Complex II","D":"Complex III","E":"ATP synthase"},"answer":"A","explanation":"Cyanide (from burning plastics) and CO inhibit cytochrome c oxidase (complex IV), blocking O₂ use; tissues can't extract O₂ → bright venous blood and lactic acidosis. B: Rotenone inhibits complex I. C: Malonate-type inhibitors affect complex II. D: Antimycin A inhibits complex III. E: Oligomycin inhibits ATP synthase.","source_slide":"L10 Energy Production, VIII slide 49"},{"id":"FND-BIO-L10-06","block":"Foundations","lecture":"L10 Pathways for Energy Production","discipline":"Biochemistry","style":"Step1","stem":"A 50-year-old man with alcohol use disorder has confusion, ophthalmoplegia and ataxia. Which blood finding is expected from his vitamin deficiency?","options":{"A":"Elevated citrate","B":"Elevated methylmalonate","C":"Elevated pyruvate and α-ketoglutarate","D":"Elevated succinate","E":"Low lactate"},"answer":"C","explanation":"Wernicke–Korsakoff syndrome: thiamine (TPP) deficiency impairs the α-keto acid dehydrogenases (PDH, α-KGDH, branched-chain), so pyruvate, α-ketoglutarate and other α-keto acids accumulate in blood. A: Citrate accumulates when aconitase is blocked (fluoroacetate). B: Methylmalonate rises in vitamin B12 deficiency. D: Succinate would rise with a block at succinate dehydrogenase. E: Pyruvate that can't enter PDH is shunted to lactate, so lactate rises.","source_slide":"L10 Energy Production, IX slides 25–28"},{"id":"FND-BIO-L10-07","block":"Foundations","lecture":"L10 Pathways for Energy Production","discipline":"Biochemistry","style":"LAU","stem":"α-Ketoglutarate is withdrawn from the TCA cycle for amino acid synthesis, and acetyl-CoA starts to accumulate. Which enzyme mainly restores the cycle?","options":{"A":"Pyruvate dehydrogenase","B":"Citrate synthase","C":"PEP carboxykinase","D":"α-Ketoglutarate dehydrogenase","E":"Pyruvate carboxylase"},"answer":"E","explanation":"Removing any intermediate depletes oxaloacetate, so acetyl-CoA can't enter. Pyruvate carboxylase (biotin, ATP) makes oxaloacetate from pyruvate and is activated by acetyl-CoA, the signal that oxaloacetate is short. A: PDH supplies acetyl-CoA, not 4-carbon intermediates. B: Citrate synthase consumes oxaloacetate. C: PEPCK removes oxaloacetate for gluconeogenesis. D: α-KGDH consumes α-ketoglutarate.","source_slide":"L10 Energy Production, IX slides 37–38"},{"id":"FND-BIO-L10-08","block":"Foundations","lecture":"L10 Pathways for Energy Production","discipline":"Biochemistry","style":"LAU","stem":"Approximately how many ATP are produced when one acetyl-CoA is oxidized by the TCA cycle and oxidative phosphorylation?","options":{"A":"12","B":"10","C":"7.5","D":"9","E":"2.5"},"answer":"B","explanation":"3 NADH × 2.5 + 1 FAD(2H) × 1.5 + 1 GTP = 10. A: 12 uses older values (3 ATP per NADH, 2 per FAD(2H)). C: 7.5 counts only the NADH. D: 9 leaves out the GTP. E: 2.5 is the yield of one NADH.","source_slide":"L10 Energy Production, IX slide 18"},{"id":"FND-BIO-L11-01","block":"Foundations","lecture":"L11 Gluconeogenesis","discipline":"Biochemistry","style":"LAU","stem":"Which enzyme pair together bypasses the irreversible pyruvate kinase step of glycolysis?","options":{"A":"Glucose 6-phosphatase and PEPCK","B":"Pyruvate carboxylase and PEP carboxykinase","C":"Pyruvate dehydrogenase and citrate synthase","D":"Fructose 1,6-bisphosphatase and aldolase","E":"Malate dehydrogenase and lactate dehydrogenase"},"answer":"B","explanation":"Pyruvate → OAA (pyruvate carboxylase, biotin, ATP) → PEP (PEPCK, GTP). A: G6Pase bypasses hexokinase. C: PDH and citrate synthase are oxidative, not gluconeogenic. D: FBPase bypasses PFK-1; aldolase is reversible. E: These aren't bypass enzymes.","source_slide":"L11 Gluconeogenesis, slides 11–18"},{"id":"FND-BIO-L11-02","block":"Foundations","lecture":"L11 Gluconeogenesis","discipline":"Biochemistry","style":"LAU","stem":"During a prolonged fast, which compound can the liver use for net glucose synthesis?","options":{"A":"Acetyl-CoA from palmitate oxidation","B":"Leucine","C":"Lysine","D":"Glycerol from adipose triacylglycerol","E":"Acetoacetate"},"answer":"D","explanation":"Hepatic glycerol kinase phosphorylates glycerol, which is oxidized to DHAP, a glycolytic intermediate. A: Acetyl-CoA's two carbons are lost as 2 CO₂ in the TCA cycle, so there is no net oxaloacetate. B, C: Leucine and lysine are the only exclusively ketogenic amino acids. E: Acetoacetate is a ketone body made from acetyl-CoA and gives no net glucose.","source_slide":"L11 Gluconeogenesis, slides 6, 8"},{"id":"FND-BIO-L11-03","block":"Foundations","lecture":"L11 Gluconeogenesis","discipline":"Biochemistry","style":"LAU","stem":"During fasting, which signal most directly activates hepatic pyruvate carboxylase?","options":{"A":"Insulin","B":"Fructose 2,6-bisphosphate","C":"Acetyl-CoA from β-oxidation","D":"AMP","E":"Citrate"},"answer":"C","explanation":"Fatty acid oxidation floods the liver with acetyl-CoA, an allosteric activator of pyruvate carboxylase. A: Insulin opposes gluconeogenesis. B: F2,6BP inhibits FBPase and activates glycolysis. D: AMP inhibits FBPase. E: Citrate isn't the activator of pyruvate carboxylase.","source_slide":"L11 Gluconeogenesis, slides 15, 29"},{"id":"FND-BIO-L11-04","block":"Foundations","lecture":"L11 Gluconeogenesis","discipline":"Biochemistry","style":"Step1","stem":"A 35-year-old man is found confused after 2 days of binge drinking with little food. Blood glucose is 40 mg/dL and lactate is elevated. Which change in the liver best explains the hypoglycemia?","options":{"A":"↑ NADH/NAD⁺ ratio","B":"↓ NADH/NAD⁺ ratio","C":"Induction of glucose 6-phosphatase","D":"Increased glycogen stores","E":"Activation of pyruvate carboxylase by ethanol"},"answer":"A","explanation":"Alcohol dehydrogenase raises the cytosolic NADH/NAD⁺ ratio, blocking lactate → pyruvate and malate → oxaloacetate, so gluconeogenesis fails once glycogen is depleted; mild lactic acidosis follows. B: The ratio rises. C: Induction would increase glucose output. D: Glycogen is depleted after days of little food. E: Ethanol doesn't activate pyruvate carboxylase.","source_slide":"L11 Gluconeogenesis, slide 37"},{"id":"FND-BIO-L11-05","block":"Foundations","lecture":"L11 Gluconeogenesis","discipline":"Biochemistry","style":"Step1","stem":"A 6-month-old girl has lactic acidosis, hypotonia, seizures and developmental delay. Lactate, pyruvate and alanine are elevated; blood glucose is normal. Thiamine doesn't help. Which dietary approach is most appropriate?","options":{"A":"High-carbohydrate diet","B":"High-protein diet rich in alanine","C":"Frequent cornstarch feeds","D":"Biotin supplementation","E":"Ketogenic (high-fat, low-carbohydrate) diet"},"answer":"E","explanation":"PDH deficiency, the most common cause of congenital lactic acidosis: pyruvate can't become acetyl-CoA, so a ketogenic diet supplies acetyl-CoA from fat, bypassing PDH. A: Carbohydrate increases pyruvate and lactate. B: Alanine adds more pyruvate. C: Cornstarch is for von Gierke disease. D: Biotin is the cofactor of pyruvate carboxylase, not PDH.","source_slide":"L11 Gluconeogenesis, slides 38–39"},{"id":"FND-BIO-L11-06","block":"Foundations","lecture":"L11 Gluconeogenesis","discipline":"Biochemistry","style":"LAU","stem":"Glucagon promotes hepatic gluconeogenesis partly by phosphorylating which glycolytic enzyme, inactivating it?","options":{"A":"Hexokinase","B":"Glucokinase","C":"Pyruvate kinase","D":"Aldolase","E":"Enolase"},"answer":"C","explanation":"PKA phosphorylates and inactivates hepatic pyruvate kinase, so PEP isn't lost to pyruvate. A: Hexokinase is regulated by G6P. B: Glucokinase is regulated by its regulatory protein, not PKA phosphorylation. D: Aldolase is unregulated. E: Enolase is unregulated.","source_slide":"L11 Gluconeogenesis, slide 27"},{"id":"FND-BIO-L11-07","block":"Foundations","lecture":"L11 Gluconeogenesis","discipline":"Biochemistry","style":"Step1","stem":"A 3-year-old boy has hemolytic anemia, jaundice and splenomegaly. Hemoglobin structure is normal. His red cells have low ATP and have lost their flexibility. Which enzyme is most likely deficient?","options":{"A":"Pyruvate dehydrogenase","B":"Pyruvate carboxylase","C":"Glucose 6-phosphatase","D":"Glucokinase","E":"Pyruvate kinase"},"answer":"E","explanation":"RBCs lack mitochondria and rely on anaerobic glycolysis; pyruvate kinase deficiency accounts for >95% of inherited glycolytic defects, and low ATP makes RBCs rigid, causing hemolysis. A: PDH is mitochondrial, so RBCs don't use it. B: Pyruvate carboxylase is mitochondrial, for gluconeogenesis and anaplerosis. C: Glucose 6-phosphatase is in liver and kidney. D: Glucokinase is in liver and β cells; RBCs use hexokinase.","source_slide":"L11 Gluconeogenesis, slides 32–33"},{"id":"FND-BIO-L11-08","block":"Foundations","lecture":"L11 Gluconeogenesis","discipline":"Biochemistry","style":"Step1","stem":"A 2-month-old is found comatose after sleeping through the night and wakes with IV glucose. Pyruvate, lactate and alanine are high, aspartate is low, and ammonia is raised. Vitamin supplements don't help. Which enzyme is deficient?","options":{"A":"Pyruvate carboxylase","B":"Pyruvate dehydrogenase","C":"Glucose 6-phosphatase","D":"Ornithine transcarbamoylase","E":"Medium-chain acyl-CoA dehydrogenase"},"answer":"A","explanation":"Without pyruvate carboxylase there is no oxaloacetate: gluconeogenesis fails (fasting hypoglycemia), pyruvate spills to lactate and alanine, and low oxaloacetate means low aspartate for the urea cycle (hyperammonemia). B: PDH deficiency gives lactic acidosis with normal fasting glucose. C: Von Gierke disease doesn't explain the low aspartate and raised ammonia. D: OTC deficiency raises ammonia but not pyruvate or lactate. E: MCAD deficiency gives hypoketotic hypoglycemia with medium-chain acylcarnitines.","source_slide":"L11 Gluconeogenesis, slides 40–43"},{"id":"FND-BIO-L12-01","block":"Foundations","lecture":"L12 Fatty Acid Metabolism","discipline":"Biochemistry","style":"LAU","stem":"Metformin lowers hepatic fatty acid synthesis mainly because AMPK activation causes which change?","options":{"A":"Phosphorylation and inactivation of acetyl-CoA carboxylase","B":"Allosteric activation of ACC by citrate","C":"Inhibition of HMG-CoA synthase","D":"Increased fatty acid synthase expression through SREBP-1","E":"Activation of hormone-sensitive lipase"},"answer":"A","explanation":"Metformin raises AMP/ATP, activating AMPK, which phosphorylates and inactivates ACC, so less malonyl-CoA (and less fat) is made. B: Citrate activates ACC, the opposite of AMPK's effect. C: HMG-CoA synthase belongs to ketogenesis. D: SREBP-1 is driven by insulin and would raise synthesis. E: HSL mobilizes stored TAG and isn't the mechanism here.","source_slide":"L12 Fatty Acid Metabolism, slides 20-22"},{"id":"FND-BIO-L12-02","block":"Foundations","lecture":"L12 Fatty Acid Metabolism","discipline":"Biochemistry","style":"Step1","stem":"An 18-month-old vomits and sleeps through breakfast, then is found unresponsive with glucose 1.8 mmol/L. Free fatty acids are high, ketones are low, and the acylcarnitine profile shows medium-chain species. His sister died suddenly in infancy. Which enzyme is deficient?","options":{"A":"CPT-I","B":"Medium-chain acyl-CoA dehydrogenase","C":"HMG-CoA synthase","D":"CPT-II","E":"Liver glycogen phosphorylase"},"answer":"B","explanation":"High FFAs show mobilization works; low ketones and medium-chain acylcarnitines show β-oxidation stalling at medium chain length: MCAD deficiency. A: CPT-I deficiency gives low acylcarnitines (they are never made). C: This ketogenesis step wouldn't produce medium-chain acylcarnitines. D: CPT-II deficiency raises C16/C18 acylcarnitines and mainly hits muscle. E: Glycogen phosphorylase deficiency causes fasting hypoglycemia with intact fat oxidation and raised ketones.","source_slide":"L12 Fatty Acid Metabolism, slides 45, 71-72"},{"id":"FND-BIO-L12-03","block":"Foundations","lecture":"L12 Fatty Acid Metabolism","discipline":"Biochemistry","style":"LAU","stem":"Which molecule is both the committed product of fatty acid synthesis and the inhibitor of the carnitine shuttle?","options":{"A":"Citrate","B":"Acetyl-CoA","C":"Malonyl-CoA","D":"Acylcarnitine","E":"Long-chain fatty acyl-CoA"},"answer":"C","explanation":"Malonyl-CoA is made by ACC and inhibits CPT-I, so newly made palmitate cannot be burned. A: Citrate activates ACC and carries acetyl units to the cytosol. B: Acetyl-CoA is the substrate of ACC, not a CPT-I inhibitor. D: Acylcarnitine is the product of CPT-I. E: Long-chain acyl-CoA inhibits ACC and is the CPT-I substrate.","source_slide":"L12 Fatty Acid Metabolism, slides 43, 64"},{"id":"FND-BIO-L12-04","block":"Foundations","lecture":"L12 Fatty Acid Metabolism","discipline":"Biochemistry","style":"Step1","stem":"A 24-year-old woman develops thigh pain and dark urine after a 9-hour hike with little food. CK is 48,000 U/L. She had similar episodes with fasting and fever, never with short intense exercise, and is normal between attacks. Long-chain (C16, C18) acylcarnitines are raised. What is the diagnosis?","options":{"A":"McArdle disease","B":"CPT-II deficiency (muscle form)","C":"CPT-I deficiency","D":"MCAD deficiency","E":"Von Gierke disease"},"answer":"B","explanation":"Prolonged effort or fasting forces muscle onto long-chain fatty acids, and a CPT-II defect raises long-chain acylcarnitines: CPT-II deficiency. A: McArdle is triggered by brief maximal effort, has a second wind, and CK stays raised between attacks. C: CPT-I deficiency affects the liver and gives low acylcarnitines. D: MCAD gives medium-chain species and presents with infant fasting hypoglycemia. E: Von Gierke gives fasting hypoglycemia with lactic acidosis and hepatomegaly, not recurrent rhabdomyolysis.","source_slide":"L12 Fatty Acid Metabolism, slides 44, 63-68"},{"id":"FND-BIO-L12-05","block":"Foundations","lecture":"L12 Fatty Acid Metabolism","discipline":"Biochemistry","style":"LAU","stem":"A patient with vitamin B12 deficiency excretes methylmalonate. Which step of odd-chain fatty acid oxidation is blocked?","options":{"A":"Propionyl-CoA to D-methylmalonyl-CoA","B":"D- to L-methylmalonyl-CoA","C":"Acetyl-CoA to malonyl-CoA","D":"L-Methylmalonyl-CoA to succinyl-CoA","E":"Acetoacetyl-CoA to HMG-CoA"},"answer":"D","explanation":"Methylmalonyl-CoA mutase needs the B12 coenzyme; when it fails, methylmalonate and propionate are excreted. A: Propionyl-CoA carboxylase needs biotin. B: The racemase needs no vitamin cofactor. C: This is the ACC step of fatty acid synthesis (biotin). E: This is ketogenesis, unrelated to B12.","source_slide":"L12 Fatty Acid Metabolism, slides 78-80"},{"id":"FND-BIO-L12-06","block":"Foundations","lecture":"L12 Fatty Acid Metabolism","discipline":"Biochemistry","style":"LAU","stem":"Why can the liver produce ketone bodies but not use them as fuel?","options":{"A":"It lacks thiophorase","B":"It lacks HMG-CoA synthase","C":"It lacks mitochondria","D":"It lacks 3-hydroxybutyrate dehydrogenase","E":"Ketone bodies cannot leave hepatocytes"},"answer":"A","explanation":"Liver mitochondria have no thiophorase (succinyl-CoA:acetoacetate CoA transferase), the enzyme that activates acetoacetate to acetoacetyl-CoA in peripheral tissues. B: HMG-CoA synthase is the liver's rate-limiting ketogenic enzyme. C: Hepatocytes have mitochondria (red blood cells don't). D: This enzyme interconverts acetoacetate and 3-hydroxybutyrate, depending on NAD⁺/NADH. E: Ketone bodies are released into blood and used by brain, muscle and kidney.","source_slide":"L12 Fatty Acid Metabolism, slides 93-96"},{"id":"FND-BIO-L12-07","block":"Foundations","lecture":"L12 Fatty Acid Metabolism","discipline":"Biochemistry","style":"LAU","stem":"A patient on fat-free parenteral nutrition for 8 months develops scaly dermatitis. Which fatty acid appears in their blood?","options":{"A":"Arachidonic acid","B":"Phytanic acid","C":"α-Linolenic acid","D":"Behenic acid (22:0)","E":"Mead acid (20:3 n-9)"},"answer":"E","explanation":"Without linoleate, desaturases act on oleate instead, producing Mead acid, which is diagnostic of essential fatty acid deficiency. A: Arachidonic acid is made from linoleate, so it falls. B: Phytanic acid accumulates in Refsum disease. C: α-Linolenic acid is an essential fatty acid and would also be absent. D: Very-long-chain fatty acids accumulate in peroxisomal disorders such as Zellweger and X-linked adrenoleukodystrophy.","source_slide":"L12 Fatty Acid Metabolism, slides 4, 12, 38-39"},{"id":"FND-BIO-L12-08","block":"Foundations","lecture":"L12 Fatty Acid Metabolism","discipline":"Biochemistry","style":"LAU","stem":"Adipocytes can store fatty acids as triacylglycerol only when glucose enters them. Why can't they use free glycerol instead?","options":{"A":"They lack glycerol phosphate dehydrogenase","B":"They lack fatty acyl-CoA synthetase","C":"They lack GLUT4","D":"They lack glycerol kinase","E":"Hormone-sensitive lipase is active after meals"},"answer":"D","explanation":"Adipocytes have no glycerol kinase, so glycerol phosphate must come from glucose via DHAP, and glucose enters through insulin-dependent GLUT4; the liver has glycerol kinase. A: They need this enzyme to reduce DHAP, so they have it. B: Fatty acids must be activated to acyl-CoA in all tissues that make TAG. C: Adipocytes do have GLUT4; it is how glucose enters. E: HSL is dephosphorylated and inactive when insulin is high.","source_slide":"L12 Fatty Acid Metabolism, slides 49–50, 57"},{"id":"FND-BIO-L12-09","block":"Foundations","lecture":"L12 Fatty Acid Metabolism","discipline":"Biochemistry","style":"LAU","stem":"A patient with the muscle form of CPT-II deficiency is advised to take medium-chain triglyceride supplements. Why do they help?","options":{"A":"Medium-chain fatty acids activate CPT-II","B":"Medium-chain fatty acids inhibit malonyl-CoA formation","C":"They enter mitochondria without carnitine","D":"They are converted to muscle glycogen","E":"They stimulate carnitine synthesis in muscle"},"answer":"C","explanation":"Fatty acids shorter than 12 carbons cross the inner mitochondrial membrane and are activated in the matrix, bypassing CPT-I, the translocase and CPT-II. A: They bypass the defective enzyme; they don't repair it. B: Their oxidation doesn't depend on CPT-I, so malonyl-CoA is irrelevant to them. D: Fatty acids can't make net glucose or glycogen. E: Muscle can't synthesize carnitine; liver and kidney make it.","source_slide":"L12 Fatty Acid Metabolism, slides 67–69"},{"id":"FND-BIO-L13-01","block":"Foundations","lecture":"L13 Amino Acid Metabolism","discipline":"Biochemistry","style":"LAU","stem":"
