lobulin is listed.", "source_slide": "Acute Inflammation doc: Systemic effects"}, {"id": "HEM-PATH-TBL1-89", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about resolution is correct?", "options": {"A": "New vessels and fibroblasts proliferate", "B": "Neutrophils are replaced by plasma cells", "C": "Recruitment ceases and mediators decay", "D": "Pus is walled off by connective tissue", "E": "The surface epithelium necroses and sloughs"}, "answer": "C", "explanation": "In resolution, mediators decay or are degraded, permeability normalizes, recruitment ceases, neutrophils undergo apoptosis, anti-inflammatory mediators are produced, and lymphatics and macrophages clear fluid and debris. A: That is repair by scarring or chronic inflammation. B: That is conversion to chronic inflammation. D: That is an abscess. E: That is ulceration.", "source_slide": "Acute Inflammation doc: Outcomes"}, {"id": "HEM-PATH-TBL1-90", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which outcome is an abnormal communication between two organs, or between an organ and a surface?", "options": {"A": "Ulcer", "B": "Fistula", "C": "Abscess", "D": "Scar", "E": "Effusion"}, "answer": "B", "explanation": "A fistula is an abnormal communication between two organs or between an organ and a surface. A: An ulcer is a surface excavation. C: An abscess is a localized collection of pus. D: A scar results from tissue destruction. E: An effusion is fluid in a mesothelial-lined cavity.", "source_slide": "Acute Inflammation doc: Ulcer and other outcomes"}, {"id": "HEM-PATH-TBL1-91", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Extensive organization of a fibrinous pericardial exudate can lead to:", "options": {"A": "Resolution with complete restoration of the pericardium", "B": "A purulent abscess in the pericardial cavity", "C": "Obliteration of the space and restricted cardiac function", "D": "A cell-poor serous pericardial effusion", "E": "Ulceration of the visceral pericardium"}, "answer": "C", "explanation": "If fibrin persists, organization (ingrowth of fibroblasts and vessels) can produce scar; extensive organization in the pericardial cavity may obliterate the space and restrict cardiac function. A: Resolution requires fibrin to be degraded and cleared. B: Abscesses need pyogenic bacteria. D: A serous effusion is a different, cell-poor exudate. E: Ulcers form at mucosal or ischemic surfaces.", "source_slide": "Acute Inflammation doc: Fibrinous inflammation"}, {"id": "HEM-PATH-TBL1-92", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Acute appendicitis is the doc's common example of:", "options": {"A": "Serous inflammation", "B": "Suppurative inflammation", "C": "Fibrinous inflammation", "D": "Chronic inflammation", "E": "Ulceration"}, "answer": "B", "explanation": "Acute appendicitis is a common example of suppurative (purulent) inflammation. A: Serous inflammation is cell-poor, as in blisters. C: Fibrinous inflammation affects the meninges, pericardium and pleura. D: Appendicitis here is acute. E: Peptic ulcer is the ulcer example.", "source_slide": "Acute Inflammation doc: Purulent inflammation"}, {"id": "HEM-PATH-TBL1-93", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "In the doc's rapid review, bronchoconstriction is matched with:", "options": {"A": "LTB4, HETE and C5a", "B": "Prostaglandins and bradykinin", "C": "IL-1 and TNF", "D": "Histamine, serotonin and kinins", "E": "LTC4, LTD4, LTE4 and PAF"}, "answer": "E", "explanation": "The integration lists bronchoconstriction → LTC4/LTD4/LTE4 and PAF. A: These are neutrophil chemoattractants. B: These are matched with pain. C: These are matched with fever and the acute-phase response. D: Histamine and kinins are permeability mediators; they are not matched with bronchoconstriction.", "source_slide": "Acute Inflammation doc: High-yield integration"}, {"id": "HEM-PATH-TBL1-94", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "In the doc's rapid review, pain (dolor) is matched with:", "options": {"A": "Histamine, vasodilation and increased flow", "B": "IL-1, TNF and acute-phase proteins", "C": "Bradykinin, prostaglandins, tissue pressure", "D": "Selectins, integrins and PECAM-1", "E": "LTC4, LTD4 and LTE4"}, "answer": "C", "explanation": "Pain is matched with bradykinin, prostaglandins and increased tissue pressure. A: These are matched with redness and warmth. B: These are matched with fever and the acute-phase response. D: These mediate rolling and adhesion. E: These are matched with bronchoconstriction.", "source_slide": "Acute Inflammation doc: Rapid review table"}, {"id": "HEM-PATH-TBL1-95", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about the origin of mediators is correct?", "options": {"A": "Endogenous mediators are often microbial products", "B": "Exogenous mediators are often microbial products", "C": "Exogenous mediators are plasma-protein-derived", "D": "Bradykinin is an exogenous, cell-derived mediator", "E": "Histamine is an exogenous, plasma-derived mediator"}, "answer": "B", "explanation": "Exogenous mediators are often microbial products; endogenous mediators may be cell-derived or plasma-protein-derived. A: Endogenous mediators come from the host. C: Plasma-protein-derived mediators are endogenous. D: Bradykinin is endogenous and plasma-protein-derived. E: Histamine is endogenous and cell-derived.", "source_slide": "Acute Inflammation doc: Mediators overview"}, {"id": "HEM-PATH-TBL1-96", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about histamine is correct?", "options": {"A": "It is released from mast cells, basophils and platelets", "B": "It is released from neutrophils and endothelial cells", "C": "It acts mainly by contracting arteriolar smooth muscle", "D": "It is produced by phospholipase A2 from membranes", "E": "It is generated from kininogen by kallikrein"}, "answer": "A", "explanation": "Histamine causes vasodilation and increased permeability, especially through endothelial contraction in postcapillary venules, and is released from mast cells, basophils and platelets. B: Neutrophils and endothelium are not listed sources. C: It acts through endothelial contraction in postcapillary venules. D: Phospholipase A2 releases arachidonic acid. E: That describes bradykinin.", "source_slide": "Acute Inflammation doc: Vasoactive amines"}, {"id": "HEM-PATH-TBL1-97", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which cells produce IL-1 and TNF, according to the doc?", "options": {"A": "Platelets during aggregation", "B": "Hepatocytes of the liver", "C": "Plasma cells in tissue", "D": "Macrophages and other cells", "E": "Mast cells in tissue"}, "answer": "D", "explanation": "IL-1 and TNF are produced by macrophages and other cells; they drive acute-phase and systemic responses, adhesion molecules, neutrophil degranulation and reduced thromboresistance. A: Platelets are not the source named. B: Hepatocytes make acute-phase proteins in response. C: Plasma cells make antibodies. E: Mast cells are not the source named.", "source_slide": "Acute Inflammation doc: PAF, cytokines and chemokines"}, {"id": "HEM-PATH-TBL1-98", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "The doc attributes rubor (redness) to:", "options": {"A": "Increased tissue pressure", "B": "Vasodilation", "C": "Extravascular fluid", "D": "Loss of function", "E": "Fibrin deposition"}, "answer": "B", "explanation": "Rubor results from vasodilation; calor from increased blood flow; tumor from extravascular fluid; dolor from tissue pressure and mediators such as bradykinin. A: Tissue pressure contributes to dolor. C: Extravascular fluid causes tumor. D: Loss of function is functio laesa. E: Fibrin deposition defines fibrinous inflammation.", "source_slide": "Acute Inflammation doc: Cardinal signs and causes"}, {"id": "HEM-PATH-TBL3-01", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about the onset of chronic inflammation is correct?", "options": {"A": "It can occur de novo, with no acute phase", "B": "It requires a failed acute reaction first", "C": "It cannot follow repeated bouts of acute inflammation", "D": "It requires a persistent infection", "E": "It begins when neutrophils undergo apoptosis"}, "answer": "A", "explanation": "Chronic inflammation can follow persistent or recurrent injury or an ineffective response, and it can also occur de novo. B: It can occur de novo. C: Repeated acute bouts are a listed cause. D: Infection is one of several etiologies. E: Neutrophil apoptosis is part of resolution.", "source_slide": "Chronic Inflammation notes p1"}, {"id": "HEM-PATH-TBL3-02", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which feature distinguishes chronic nonspecific inflammation from acute inflammation?", "options": {"A": "Destruction with concurrent repair", "B": "Increased vascular permeability", "C": "Infiltration of leukocytes", "D": "Activity of chemical mediators", "E": "Exudation of protein-rich fluid into tissue"}, "answer": "A", "explanation": "Chronic nonspecific inflammation shows mononuclear cells, tissue destruction with concomitant repair (new vessels, fibroblasts, fibrosis), and architectural distortion. B: Increased permeability is a hallmark of acute inflammation. C: Leukocyte infiltration occurs in both. D: Mediators act in both. E: Exudation is a hallmark of acute inflammation.", "source_slide": "Chronic Inflammation notes p1"}, {"id": "HEM-PATH-TBL3-03", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "In chronic inflammation, which statement about the macrophage–lymphocyte interaction is correct?", "options": {"A": "Lymphocyte cytokines further activate monocytes–macrophages", "B": "Macrophages inhibit lymphocytes to limit the response", "C": "Plasma cells arise from activated T lymphocytes in the tissue", "D": "Monocytes enter the tissue without chemotactic signals", "E": "Neutrophils present antigen to B lymphocytes"}, "answer": "A", "explanation": "Monocytes are recruited by chemotactic factors; macrophage cytokines activate lymphocytes, which in turn release cytokines that activate macrophages; B cells activated by macrophage-presented antigen become plasma cells. B: Macrophages activate lymphocytes. C: Plasma cells come from B cells. D: Chemotactic factors recruit monocytes. E: Macrophages present the antigen.", "source_slide": "Chronic Inflammation notes p1"}, {"id": "HEM-PATH-TBL3-04", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which etiology of chronic inflammation is matched with the example given in the notes?", "options": {"A": "Autoimmune disease – gallstone cholecystitis", "B": "Persistent infection – allergic asthma", "C": "Repeated acute bouts – gallstone cholecystitis", "D": "Allergic disease – pulmonary sarcoidosis", "E": "Prolonged toxic exposure – peptic ulcer"}, "answer": "C", "explanation": "Chronic cholecystitis due to gallstones is the example of repeated bouts of acute inflammation. A: Gallstone cholecystitis is the repeated-bouts example. B: Asthma is an allergic example. D: Sarcoidosis is granulomatous with unknown cause. E: Peptic ulcer is not given as the toxic example.", "source_slide": "Chronic Inflammation notes p2"}, {"id": "HEM-PATH-TBL3-05", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about granulomas is correct?", "options": {"A": "Giant cells form from fusion of epithelioid macrophages", "B": "Epithelioid cells are modified surface epithelial cells", "C": "Granulomas are surrounded by a rim of neutrophils", "D": "Giant cells form from fusion of lymphocytes", "E": "Granulomas are made mainly of plasma cells"}, "answer": "A", "explanation": "Granulomas are nodular collections of epithelioid cells (specialized macrophages) with a lymphocyte rim; giant cells form by fusion of macrophages. B: Epithelioid cells are specialized macrophages. C: The rim is lymphocytes. D: Giant cells come from macrophages. E: Plasma cells are not the main cells.", "source_slide": "Chronic Inflammation notes p2"}, {"id": "HEM-PATH-TBL3-06", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about giant cells is correct?", "options": {"A": "Langhans giant cells are specific for tuberculosis", "B": "Foreign-body giant cells have nuclei scattered in the cytoplasm", "C": "Foreign-body giant cells have a peripheral horseshoe of nuclei", "D": "Megakaryocytes are pathologic giant cells of granulomas", "E": "Giant cells in herpes come from macrophage fusion"}, "answer": "B", "explanation": "Foreign-body giant cells have scattered nuclei; Langhans cells have peripheral horseshoe nuclei and are characteristic of, but not specific for, TB. A: Langhans cells are not TB-specific. C: The horseshoe pattern belongs to Langhans cells. D: The notes list megakaryocytes and osteoclasts as normal multinucleated cells. E: Herpes giant cells are infected epithelial cells.", "source_slide": "Chronic Inflammation notes p2"}, {"id": "HEM-PATH-TBL3-07", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "Step1", "stem": "A lymph node biopsy from a patient with fever and cough shows granulomas with central cheese-like necrosis. Which statement about this necrosis is correct?", "options": {"A": "It is liquefactive necrosis caused by pyogenic staphylococci", "B": "It is typical of the non-caseating granulomas of sarcoidosis", "C": "It results from T cells killing mycobacteria-laden macrophages", "D": "It results from neutrophil elastase digesting the node", "E": "It is coagulative necrosis from vascular occlusion"}, "answer": "C", "explanation": "Caseating granulomas are characteristic of TB; caseous necrosis results from T-cell killing of mycobacteria-laden macrophages and from free-radical injury. A: Liquefactive necrosis by pyogenic bacteria produces abscesses. B: Sarcoidosis granulomas are non-caseating. D: Elastase injury is not the mechanism described. E: Ischemic necrosis is not the mechanism in TB.", "source_slide": "Chronic Inflammation notes p2"}, {"id": "HEM-PATH-TBL3-08", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "How does granuloma formation begin?", "options": {"A": "Neutrophils present antigen to CD8+ T cells", "B": "B cells present antigen to macrophages", "C": "Macrophages present antigen to CD4+ T cells", "D": "CD8+ T cells kill macrophages, releasing IFN-γ", "E": "Epithelioid cells release IL-1 to recruit T cells"}, "answer": "C", "explanation": "Poorly digestible antigen is presented by macrophages to CD4+ T cells; T-cell activation releases cytokines (especially IFN-γ) that transform macrophages into epithelioid and giant cells. A: Neutrophils are not the presenting cells. B: Macrophages present to T cells. D: The T cells involved are CD4+, and IFN-γ is released by activated T cells. E: Epithelioid cells are the result, not the starting signal.", "source_slide": "Chronic Inflammation notes p2–3"}, {"id": "HEM-PATH-TBL3-09", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about the etiology of granulomatous inflammation is correct?", "options": {"A": "Caseating granulomas are typical of autoimmune diseases", "B": "Sarcoidosis is the prototype of non-caseating granulomas", "C": "Crohn disease is listed as an infectious cause", "D": "Reactions to tumors produce abscesses rather than granulomas", "E": "Cat-scratch disease is caused by a fungus"}, "answer": "B", "explanation": "Non-caseating granulomas occur in several chronic inflammatory and autoimmune diseases; the prototype is sarcoidosis. A: Autoimmune diseases give non-caseating granulomas. C: Crohn disease is listed under unknown or autoimmune causes. D: Reaction to tumors is a listed cause. E: Cat-scratch disease is caused by a bacterium.", "source_slide": "Chronic Inflammation notes p2–3"}, {"id": "HEM-PATH-TBL3-10", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "All of the following are listed as infectious causes of granulomatous inflammation EXCEPT:", "options": {"A": "Mycobacterium leprae", "B": "Staphylococcus aureus", "C": "Coccidioides immitis", "D": "Treponema pallidum", "E": "Blastomyces dermatitidis"}, "answer": "B", "explanation": "Infectious causes listed are mycobacteria (M. tuberculosis, M. leprae), fungi (Blastomyces, Histoplasma, Coccidioides), T. pallidum and the cat-scratch bacterium. Staphylococci cause purulent inflammation and abscesses. A: M. leprae is listed. C: Coccidioides is listed. D: T. pallidum is listed. E: Blastomyces is listed.", "source_slide": "Chronic Inflammation notes p3"}, {"id": "HEM-PATH-TBL3-11", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about multinucleated cells is correct?", "options": {"A": "They are restricted to granulomatous lesions", "B": "Osteoclasts are pathologic multinucleated cells", "C": "They may be seen in virus-infected epithelial cells", "D": "Neutrophils become multinucleated in pus", "E": "They do not occur in tumors or in viral infections"}, "answer": "C", "explanation": "Multinucleated giant cells also occur in virus-infected cells (epithelial cells in herpes) and in some tumors; osteoclasts are normal multinucleated cells. A: They also occur outside granulomas. B: Osteoclasts are normal. D: Neutrophils are not multinucleated. E: Some tumors contain them.", "source_slide": "Chronic Inflammation notes p2"}, {"id": "HEM-PATH-TBL3-12", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "When eosinophils are prominent in chronic inflammation, which etiology is most likely?", "options": {"A": "Gallstones with chronic cholecystitis", "B": "A foreign body reaction", "C": "A parasitic or allergic cause", "D": "Mycobacterial infection", "E": "A pyogenic bacterial infection"}, "answer": "C", "explanation": "When chronic inflammation is due to parasites or allergic disorders, eosinophils are involved and seen at the site. A: Gallstone cholecystitis shows mononuclear cells. B: Foreign bodies cause granulomas with giant cells. D: Mycobacteria cause caseating granulomas. E: Pyogenic bacteria cause purulent inflammation.", "source_slide": "Chronic Inflammation notes p1"}, {"id": "HEM-PATH-TBL3-13", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Chronic inflammation occurs in which two major patterns?", "options": {"A": "Serous and fibrinous", "B": "Purulent and ulcerative", "C": "Caseating and non-caseating granulomatous", "D": "Nonspecific and granulomatous", "E": "Nonspecific and purulent"}, "answer": "D", "explanation": "Chronic inflammation occurs as chronic nonspecific inflammation and granulomatous inflammation. A: These are acute patterns. B: These are acute outcomes and patterns. C: These are the two granuloma types. E: Purulent is an acute pattern.", "source_slide": "Chronic Inflammation notes p1"}, {"id": "HEM-PATH-TBL3-14", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "In chronic inflammation, antibody-producing plasma cells arise from:", "options": {"A": "T lymphocytes activated by macrophage cytokines", "B": "Monocytes activated by lymphocyte cytokines", "C": "B lymphocytes activated by neutrophil-presented antigen", "D": "B lymphocytes activated by macrophage-presented antigen", "E": "Epithelioid cells activated by IFN-γ"}, "answer": "D", "explanation": "B lymphocyte activation by macrophage-presented antigen forms antibody-producing plasma cells. A: T cells do not become plasma cells. B: Monocytes become macrophages. C: Macrophages, not neutrophils, present the antigen. E: Epithelioid cells are modified macrophages.", "source_slide": "Chronic Inflammation notes p1"}, {"id": "HEM-PATH-TBL3-15", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Whenever a granuloma is found in a biopsy, which disease should always be excluded?", "options": {"A": "Sarcoidosis", "B": "Histoplasmosis", "C": "Crohn disease", "D": "Syphilis", "E": "Tuberculosis"}, "answer": "E", "explanation": "The notes state that in the presence of a granuloma, tuberculosis should always be excluded. A: Sarcoidosis is not the disease named for exclusion. B: Histoplasmosis is a cause, but TB is the one named. C: Crohn disease is a cause, but TB is the one named. D: Syphilis is a cause, but TB is the one named.", "source_slide": "Chronic Inflammation notes p3"}, {"id": "HEM-PATH-TBL3-16", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which cytokine transforms monocytes and macrophages into epithelioid and giant cells?", "options": {"A": "Tumor necrosis factor", "B": "Interferon-γ", "C": "Interleukin-1", "D": "Interleukin-8", "E": "Histamine"}, "answer": "B", "explanation": "Activated CD4+ T cells release cytokines, especially IFN-γ, which transform monocytes and macrophages into epithelioid and giant cells. A: TNF is not the cytokine named for this transformation. C: IL-1 drives systemic acute-phase effects. D: IL-8 is a neutrophil chemokine. E: Histamine is a vasoactive amine.", "source_slide": "Chronic Inflammation notes p2–3"}, {"id": "HEM-PATH-TBL3-17", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which group lists only the fungi named as causes of granulomatous inflammation?", "options": {"A": "Histoplasma, Coccidioides, Treponema", "B": "Blastomyces, Histoplasma, Coccidioides", "C": "Blastomyces, Candida, Histoplasma", "D": "Coccidioides, Aspergillus, Blastomyces", "E": "Histoplasma, M. leprae, Blastomyces"}, "answer": "B", "explanation": "The fungi listed are Blastomyces dermatitidis, Histoplasma capsulatum and Coccidioides immitis. A: Treponema is a bacterium. C: Candida is not in the list. D: Aspergillus is not in the list. E: M. leprae is a mycobacterium.", "source_slide": "Chronic Inflammation notes p3"}, {"id": "HEM-PATH-TBL3-18", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which of the following is listed as a normal multinucleated cell?", "options": {"A": "Plasma cell", "B": "Epithelioid cell", "C": "Neutrophil", "D": "Osteoclast", "E": "Monocyte"}, "answer": "D", "explanation": "The notes name megakaryocytes and osteoclasts as normal multinucleated cells. (Standard sources describe megakaryocytes as polyploid with a single multilobed nucleus.) A: Plasma cells have one nucleus. B: Epithelioid cells have one nucleus but can fuse into giant cells. C: Neutrophils have one multilobed nucleus. E: Monocytes have one indented nucleus.", "source_slide": "Chronic Inflammation notes p2"}, {"id": "HEM-PATH-TBL3-19", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "A granuloma contains giant cells whose nuclei form a horseshoe around the periphery. Which statement is correct?", "options": {"A": "These are foreign-body cells, specific for retained sutures", "B": "These are Langhans cells, specific for tuberculosis", "C": "These are foreign-body cells, formed from lymphocytes", "D": "These are virus-infected epithelial cells of herpes", "E": "These are Langhans cells, characteristic but not specific for TB"}, "answer": "E", "explanation": "Langhans giant cells have nuclei in a horseshoe at the periphery and are characteristic of, but not specific for, tuberculous granulomas. A: Foreign-body giant cells have scattered nuclei. B: Langhans cells are not specific for TB. C: Giant cells come from epithelioid macrophages, and foreign-body cells have scattered nuclei. D: Herpes giant cells are infected epithelial cells, not granuloma cells.", "source_slide": "Chronic Inflammation notes p2"}, {"id": "HEM-PATH-TBL3-20", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about the causes of granulomatous inflammation is correct?", "options": {"A": "Cat-scratch disease is caused by a bacterium", "B": "Crohn disease is listed as an infectious cause", "C": "Mycobacterium leprae is listed as a fungus", "D": "Treponema pallidum is listed as a fungus", "E": "Tumors are not listed as a cause"}, "answer": "A", "explanation": "Infectious causes are mycobacteria (M. tuberculosis, M. leprae), fungi (Blastomyces, Histoplasma, Coccidioides), Treponema pallidum and the bacterium of cat-scratch disease; Crohn disease and sarcoidosis are unknown/autoimmune causes; reaction to tumors is also listed. B: Crohn disease is under unknown or autoimmune causes. C: M. leprae is a mycobacterium. D: T. pallidum is the bacterium of syphilis. E: Reaction to tumors is listed.", "source_slide": "Chronic Inflammation notes p3"}, {"id": "HEM-PATH-TBL3-21", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which pairing of granulomatous cause and its category is correct?", "options": {"A": "Treponema pallidum – fungal", "B": "Coccidioides immitis – mycobacterial", "C": "Sarcoidosis – infectious", "D": "Retained surgical suture – reaction to tumor", "E": "Crohn disease – unknown or autoimmune"}, "answer": "E", "explanation": "Sarcoidosis and Crohn disease are listed as unknown or autoimmune causes. A: T. pallidum is a bacterium. B: Coccidioides is a fungus. C: Sarcoidosis is unknown or autoimmune. D: Retained material belongs to the foreign-body category.", "source_slide": "Chronic Inflammation notes p3"}, {"id": "HEM-PATH-TBL3-22", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which etiology of chronic nonspecific inflammation is listed?", "options": {"A": "A single brief thermal burn of the skin", "B": "Rapid elimination of a pyogenic bacterium", "C": "Spontaneous neutrophil apoptosis at the site", "D": "Transient histamine release", "E": "Prolonged exposure to a nondegradable toxin"}, "answer": "E", "explanation": "Etiologies are persistent infections, repeated bouts of acute inflammation, autoimmune diseases, allergic diseases and prolonged exposure to toxic (nondegradable) agents. A: A single brief injury usually resolves. B: Elimination of the agent leads to resolution. C: Neutrophil apoptosis is part of resolution. D: Transient histamine release is an acute event.", "source_slide": "Chronic Inflammation notes p2"}, {"id": "HEM-PATH-TBL3-23", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Non-caseating granulomas are mainly encountered in:", "options": {"A": "Pulmonary and lymph node tuberculosis", "B": "Pyogenic bacterial abscesses of the skin", "C": "Acute viral infections of the skin", "D": "Chronic inflammatory and autoimmune diseases", "E": "Fibrinous pericarditis after myocardial infarction"}, "answer": "D", "explanation": "Non-caseating (epithelioid) granulomas are encountered in several chronic inflammatory diseases, especially autoimmune ones; the prototype is sarcoidosis. Caseating granulomas are typical of TB. A: TB typically gives caseating granulomas. B: Abscesses are purulent. C: Acute viral infections give lymphocytic inflammation. E: Fibrinous pericarditis is a fibrinous exudate.", "source_slide": "Chronic Inflammation notes p2"}, {"id": "HEM-PATH-TBL3-24", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Chronic inflammation develops when:", "options": {"A": "The agent is eliminated within hours", "B": "Neutrophils undergo apoptosis at the site", "C": "Lymphatics drain the edema fluid", "D": "Mediators decay after the injury", "E": "The agent persists or cannot be degraded"}, "answer": "E", "explanation": "Chronic inflammation occurs when the injury is persistent or recurrent, or when the reaction cannot completely degrade the agent (bacteria, tissue debris, foreign bodies). A: Rapid elimination leads to resolution. B: Neutrophil apoptosis is part of resolution. C: Lymphatic drainage is part of resolution. D: Mediator decay is part of resolution.", "source_slide": "Chronic Inflammation notes p1"}, {"id": "HEM-PATH-TBL3-25", "block": "Hematology", "lecture": "TBL Chronic Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Besides infectious agents and unknown or autoimmune causes, granulomas also arise from:", "options": {"A": "Viral infections and allergic reactions", "B": "Infarction and ischemic necrosis", "C": "Burns and serous blisters", "D": "Foreign bodies and reactions to tumors", "E": "Parasites and hives"}, "answer": "D", "explanation": "The four etiology groups are infectious agents, foreign bodies, unknown or autoimmune causes (sarcoidosis, Crohn disease), and reactions to tumors. A: These are not listed granuloma causes. B: Infarction causes acute inflammation. C: Burns cause serous blisters. E: These relate to eosinophils, not granulomas.", "source_slide": "Chronic Inflammation notes p3"}];
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#count').textContent = Q.length + ' questions';
const tree = {}; Q.forEach(q => { (tree[q.discipline] ??= new Set()).add(q.lecture); });
$('#tree').innerHTML = Object.keys(tree).sort().map(d => `<details open><summary><label style="display:inline;padding:0"><input type="checkbox" class="disc" data-d="${esc(d)}" checked> ${esc(d)}</label></summary>` +
  [...tree[d]].sort().map(l => `<label><input type="checkbox" class="lec" data-d="${esc(d)}" value="${esc(l)}" checked> ${esc(l)}</label>`).join('') + '</details>').join('');
const lecs = () => [...document.querySelectorAll('.lec')];
function pool(){ const st = [...document.querySelectorAll('.sty:checked')].map(x => x.value), ls = new Set(lecs().filter(x => x.checked).map(x => x.dataset.d + '|' + x.value));
  return Q.filter(q => st.includes(q.style) && ls.has(q.discipline + '|' + q.lecture)); }
function upd(){ const n = pool().length; $('#sel').textContent = n + ' selected'; $('#start').disabled = !n; }
document.querySelectorAll('.disc').forEach(c => c.onchange = () => { lecs().filter(l => l.dataset.d === c.dataset.d).forEach(l => l.checked = c.checked); upd(); });
document.addEventListener('change', upd); $('#all').onclick = () => { document.querySelectorAll('.lec,.disc').forEach(x => x.checked = true); upd(); };
$('#none').onclick = () => { document.querySelectorAll('.lec,.disc').forEach(x => x.checked = false); upd(); }; upd();
let run = [], i = 0, ans = [];
$('#start').onclick = () => { run = pool(); if ($('#shuf').checked) run.sort(() => Math.random() - .5); i = 0; ans = []; $('#setup').hidden = true; $('#quiz').hidden = false; show(); };
function show(){ const q = run[i];
  $('#quiz').innerHTML = `<div class="mute">Question ${i+1} of ${run.length} · keys: A–E to answer, Enter for next</div><div class="card"><span class="tag">${esc(q.discipline)}</span><span class="tag">${esc(q.lecture)}</span><span class="tag">${esc(q.style)}</span>
   <p>${esc(q.stem)}</p>${Object.entries(q.options).map(([k,v]) => `<button class="opt" data-k="${k}">${k}. ${esc(v)}</button>`).join('')}<div id="exp"></div></div>
   <div class="row"><button id="next" disabled>${i+1 < run.length ? 'Next' : 'See score'}</button><button class="ghost" id="quit">End quiz</button></div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(b.dataset.k)); $('#next').onclick = () => { i++; i < run.length ? show() : score(); }; $('#quit').onclick = score; }
function pick(k){ const q = run[i]; if (ans[i] !== undefined) return; ans[i] = k;
  document.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b.dataset.k === q.answer) b.classList.add('right'); else if (b.dataset.k === k) b.classList.add('wrong'); });
  $('#exp').innerHTML = `<div class="exp"><b>${k === q.answer ? 'Correct' : 'Incorrect. Answer: ' + q.answer}</b><p>${esc(q.explanation)}</p><div class="mute">${esc(q.source_slide)}</div></div>`; $('#next').disabled = false; }
document.addEventListener('keydown', e => { if ($('#quiz').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  if (k.length === 1 && 'ABCDE'.includes(k) && run[i] && run[i].options[k]) { e.preventDefault(); pick(k); }
  else if ((e.key === 'Enter' || e.key === 'ArrowRight') && !$('#next').disabled) { e.preventDefault(); $('#next').click(); } });
function score(){ const done = run.map((q, j) => [q, ans[j]]).filter(x => x[1] !== undefined); const ok = done.filter(([q,a]) => a === q.answer).length;
  const by = {}; done.forEach(([q,a]) => { for (const key of [q.discipline, q.discipline + ' · ' + q.lecture]) { by[key] ??= [0,0]; by[key][1]++; if (a === q.answer) by[key][0]++; } });
  $('#quiz').hidden = true; $('#result').hidden = false;
  $('#result').innerHTML = `<div class="card"><h2>Score: ${ok} / ${done.length}${done.length ? ' (' + Math.round(100*ok/done.length) + '%)' : ''}</h2>
   <table><tr><th>Discipline / lecture</th><th class="n">Correct</th><th class="n">%</th></tr>${Object.keys(by).sort().map(k => `<tr><td>${k.includes(' · ') ? '&emsp;' + esc(k.split(' · ')[1]) : '<b>' + esc(k) + '</b>'}</td><td class="n">${by[k][0]}/${by[k][1]}</td><td class="n">${Math.round(100*by[k][0]/by[k][1])}</td></tr>`).join('')}</table></div>
   <div class="row"><button id="save">Save results (JSON)</button><button class="ghost" id="again">New quiz</button></div>
   `;
  $('#again').onclick = () => { $('#result').hidden = true; $('#setup').hidden = false; };
  $('#save').onclick = () => { const now = new Date(), stamp = now.toISOString().slice(0,16).replace(/[-:T]/g, '');
    const rows = done.map(([q,a]) => ({id: q.id, discipline: q.discipline, lecture: q.lecture, style: q.style, your_answer: a, correct_answer: q.answer, correct: a === q.answer, date: now.toISOString()}));
    const url = URL.createObjectURL(new Blob([JSON.stringify(rows, null, 1)], {type: 'application/json'}));
    const link = Object.assign(document.createElement('a'), {href: url, download: 'quiz_results_' + stamp + '.json'}); link.click(); URL.revokeObjectURL(url); }; }
</script></body></html>
