<script>
const Q = [{"id": "HEM-PATH-TBL1-01", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "An inflammatory response has already eliminated a bacterial agent. Which step comes next in the sequence described in the notes?", "options": {"A": "Resolution and repair of tissue", "B": "Regulation of the response", "C": "Recruitment of plasma proteins", "D": "Recognition of damaged tissue", "E": "Removal of necrotic debris"}, "answer": "B", "explanation": "The order is recognition → recruitment → removal → regulation → resolution and repair. Once the agent is removed, the next step is regulation of the response. A: Resolution and repair is the final step and comes after regulation. C: Recruitment comes before removal. D: Recognition is the first step. E: Removal is the step that has just been completed.", "source_slide": "Acute Inflammation doc: Purpose and sequence"}, {"id": "HEM-PATH-TBL1-02", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about the components of inflammation is correct?", "options": {"A": "Its two components are humoral and cellular, regulated by antibodies and complement", "B": "Its two components are vascular and lymphatic, regulated mainly by histamine", "C": "Its two components are cellular and fibrotic, regulated by cytokines and growth factors", "D": "Its two components are vascular and cellular, both regulated by mediators and adhesion molecules", "E": "Its two components are exudative and proliferative, regulated mainly by adhesion molecules"}, "answer": "D", "explanation": "Inflammation has a vascular and a cellular component; in acute inflammation both are regulated by chemical mediators and adhesion molecules. A: Humoral versus cellular describes adaptive immunity. B: Lymphatics participate, but the two components are vascular and cellular, and many mediators act. C: Fibrosis is part of repair, not a component of inflammation. E: These are not the two components named, and mediators also regulate the events.", "source_slide": "Acute Inflammation doc: Purpose and sequence"}, {"id": "HEM-PATH-TBL1-03", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which cardinal sign is matched with its correct mechanism?", "options": {"A": "Calor: increased interstitial pressure on nerves", "B": "Tumor: extravascular accumulation of fluid", "C": "Dolor: dilation of vessels with increased flow", "D": "Rubor: leakage of protein-rich fluid into tissue", "E": "Functio laesa: brief arteriolar vasoconstriction"}, "answer": "B", "explanation": "Tumor (swelling) is due to extravascular accumulation of fluid. A: Calor comes from increased blood flow; pressure on nerves contributes to pain. C: Dolor comes from interstitial pressure and mediators such as bradykinin; vasodilation causes redness and heat. D: Rubor comes from vessel dilation; fluid leakage causes swelling. E: Functio laesa is loss of function, not vasoconstriction.", "source_slide": "Acute Inflammation doc: Cardinal signs and causes"}, {"id": "HEM-PATH-TBL1-04", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "All of the following are listed as causes of inflammation EXCEPT:", "options": {"A": "Foreign bodies", "B": "Immunologic injury", "C": "Thermal extremes and ionizing radiation", "D": "Apoptosis of single cells", "E": "Tissue death"}, "answer": "D", "explanation": "The causes listed are infection, trauma, physical injury (thermal extremes, ionizing radiation), chemical injury, foreign bodies, immunologic injury and tissue death. Apoptosis is not listed; in resolution, neutrophil apoptosis is part of switching inflammation off. A: Foreign bodies are listed. B: Immunologic injury is listed. C: Physical injury from thermal extremes or radiation is listed. E: Tissue death is listed; inflammation occurs in the viable tissue next to it.", "source_slide": "Acute Inflammation doc: Cardinal signs and causes"}, {"id": "HEM-PATH-TBL1-05", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about the early vascular changes of acute inflammation is correct?", "options": {"A": "Arteriolar dilation begins at once, with no prior change", "B": "A brief vasoconstriction precedes arteriolar dilation", "C": "Vasoconstriction persists until leukocytes marginate", "D": "Dilation is mediated mainly by LTC4, LTD4 and LTE4", "E": "Dilation reduces blood flow, causing pallor and cooling"}, "answer": "B", "explanation": "Acute inflammation begins with a brief vasoconstriction followed by arteriolar dilation and increased blood flow, producing redness and warmth; histamine is an important mediator. A: A brief vasoconstriction comes first. C: The vasoconstriction is brief. D: LTC4, LTD4 and LTE4 are vasoconstrictors. E: Dilation increases flow, causing redness and warmth.", "source_slide": "Acute Inflammation doc: Vascular changes"}, {"id": "HEM-PATH-TBL1-06", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "All of the following are mechanisms of increased vascular permeability EXCEPT:", "options": {"A": "Endothelial contraction widening interendothelial gaps", "B": "Transmigration through PECAM-1", "C": "Direct endothelial injury", "D": "Leukocyte-mediated endothelial injury", "E": "VEGF-induced transcytosis and leaky new vessels"}, "answer": "B", "explanation": "The mechanisms listed are endothelial-cell contraction with widened gaps, direct endothelial injury, leukocyte-mediated injury, and VEGF-induced transcytosis with leaky new vessels. PECAM-1 mediates leukocyte transmigration, not fluid leakage. A: Endothelial contraction is listed. C: Direct endothelial injury is listed. D: Leukocyte-mediated injury is listed. E: VEGF effects are listed.", "source_slide": "Acute Inflammation doc: Vascular changes"}, {"id": "HEM-PATH-TBL1-07", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "Step1", "stem": "A child has an infected wound on the foot and a tender, enlarged inguinal lymph node. What is the main reason more microbes and debris reach that node during acute inflammation?", "options": {"A": "Leukocytes carry microbes into veins draining to the node", "B": "Lymphatic valves fail and lymph flows back", "C": "Increased extracellular fluid increases lymph drainage", "D": "Lymph nodes produce chemokines that pull microbes toward them", "E": "Increased capillary hydrostatic pressure pushes microbes into nodes"}, "answer": "C", "explanation": "In inflammation extracellular fluid increases, so lymph drainage increases. Leukocytes, debris and microbes are carried with the lymph, and the draining nodes may become inflamed and painful (lymphadenitis). A: Leukocytes travel in lymph, not veins, to the node. B: Valve failure is not described. D: Chemokines organize lymphoid tissue but do not pull microbes into nodes. E: Drainage is the route described, not capillary pressure into nodes.", "source_slide": "Acute Inflammation doc: Vascular changes"}, {"id": "HEM-PATH-TBL1-08", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "During leukocyte recruitment, which event directly precedes firm adhesion?", "options": {"A": "Pavementing along the endothelium", "B": "Margination toward the vessel wall", "C": "Transmigration through PECAM-1", "D": "Chemotaxis along a gradient", "E": "Rolling on selectins"}, "answer": "E", "explanation": "The order is margination → pavementing → rolling → adhesion → transmigration, so rolling comes right before adhesion. A: Pavementing precedes rolling. B: Margination is the first step. C: Transmigration follows adhesion. D: Chemotaxis is the movement toward the injury after emigration.", "source_slide": "Acute Inflammation doc: Leukocyte recruitment"}, {"id": "HEM-PATH-TBL1-09", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which pairing of adhesion molecule and its binding partner is correct?", "options": {"A": "L-selectin (leukocyte) – sialyl-Lewis X (endothelium)", "B": "E-selectin (endothelium) – sialyl-Lewis X (leukocyte)", "C": "ICAM-1 (leukocyte) – integrin (endothelium)", "D": "VCAM (leukocyte) – LFA-1 (endothelium)", "E": "PECAM-1 (endothelium) – GlyCAM-1 (leukocyte)"}, "answer": "B", "explanation": "E- and P-selectins on endothelium bind oligosaccharides such as sialyl-Lewis X on leukocytes. A: The leukocyte selectin binds endothelial mucin-like GlyCAM-1. C: ICAM-1 is endothelial and binds leukocyte integrins. D: VCAM is endothelial and binds leukocyte integrins. E: PECAM-1 binds PECAM-1 on both cells; GlyCAM-1 is endothelial.", "source_slide": "Acute Inflammation doc: Leukocyte recruitment"}, {"id": "HEM-PATH-TBL1-10", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "A drug blocks the integrins LFA-1, MAC-1 and VLA-4. Which step would be most directly impaired?", "options": {"A": "Rolling", "B": "Margination", "C": "Firm adhesion", "D": "Pavementing", "E": "Phagolysosome formation"}, "answer": "C", "explanation": "Integrins on leukocytes bind endothelial ICAM-1/2 and VCAM, producing firm adhesion before transmigration. A: Rolling depends on selectins. B: Margination happens as blood flow changes, before binding. D: Pavementing is lining of the endothelium before rolling. E: Phagolysosome formation occurs inside the phagocyte.", "source_slide": "Acute Inflammation doc: Leukocyte recruitment"}, {"id": "HEM-PATH-TBL1-11", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about P-selectin is correct?", "options": {"A": "Stored in Weibel–Palade bodies and platelet α-granules", "B": "Induced on neutrophils by IL-1 and TNF", "C": "Stored in platelet dense granules and neutrophil granules", "D": "Binds GlyCAM-1 on high endothelial venules", "E": "Relocated to the surface by C5a and LTB4"}, "answer": "A", "explanation": "P-selectin is stored in endothelial Weibel–Palade bodies and platelet α-granules, and relocates to the plasma membrane after stimulation by histamine and thrombin. B: P-selectin is endothelial and platelet, not neutrophil. C: Dense granules are not its store. D: GlyCAM-1 is the ligand of the leukocyte selectin; P-selectin binds sialyl-Lewis X. E: The relocating stimuli are histamine and thrombin.", "source_slide": "Acute Inflammation doc: Leukocyte recruitment"}, {"id": "HEM-PATH-TBL1-12", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which molecule is expressed on both leukocytes and endothelial cells?", "options": {"A": "PECAM-1", "B": "ICAM-2", "C": "E-selectin", "D": "VLA-4", "E": "GlyCAM-1"}, "answer": "A", "explanation": "PECAM-1 (CD31) is expressed on both leukocytes and endothelial cells and mediates transmigration. B: ICAM-2 is endothelial. C: E-selectin is endothelial. D: VLA-4 is a leukocyte integrin. E: GlyCAM-1 is an endothelial mucin-like molecule.", "source_slide": "Acute Inflammation doc: Leukocyte recruitment"}, {"id": "HEM-PATH-TBL1-13", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which of the following is NOT listed as a chemotactic factor for neutrophils?", "options": {"A": "Kallikrein", "B": "Leukotriene C4", "C": "HETE", "D": "C5a", "E": "Bacterial products"}, "answer": "B", "explanation": "The listed neutrophil chemotactic factors are bacterial products, C5a, LTB4, HETE and kallikrein. LTC4 is a vasoconstrictor, bronchoconstrictor and permeability mediator. A: Kallikrein is listed as chemotactic. C: HETE is listed as chemotactic. D: C5a is the main complement chemotactic factor. E: Bacterial products are listed.", "source_slide": "Acute Inflammation doc: Chemotaxis"}, {"id": "HEM-PATH-TBL1-14", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about phagocytosis is correct?", "options": {"A": "Opsonins dissolve particles before they are engulfed", "B": "The phagosome forms by fusion of two lysosomes", "C": "Phagolysosome formation accompanies degranulation", "D": "IgM and C5a are the most important opsonins", "E": "Monocytes are poor phagocytes compared with lymphocytes"}, "answer": "C", "explanation": "Pseudopods enclose the particle in a phagosome, which fuses with lysosomes to form a phagolysosome; this is associated with degranulation. A: Opsonins coat and immobilize particles on the phagocyte surface. B: The phagosome forms from the engulfing pseudopods. D: The most important opsonins are IgG and C3b. E: Neutrophils and monocytes–macrophages are the main phagocytes.", "source_slide": "Acute Inflammation doc: Phagocytosis"}, {"id": "HEM-PATH-TBL1-15", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "In which setting is leukocyte-mediated injury especially likely to worsen tissue damage after the original insult?", "options": {"A": "Myocardial infarction treated with reperfusion", "B": "Serous blister formation after a burn", "C": "Lymphatic drainage of a resolving abscess wall", "D": "Neutrophil apoptosis during resolution", "E": "Macrophage clearance of edema fluid"}, "answer": "A", "explanation": "Leukocytes damage host tissue during clearance of necrotic tissue, including after myocardial infarction, especially with reperfusion; also in infection, autoimmune reactions and allergic disease such as asthma. B: A serous blister is a cell-poor exudate. C: Lymphatic drainage is part of resolution. D: Neutrophil apoptosis ends the response. E: Macrophage clearance is part of resolution.", "source_slide": "Acute Inflammation doc: Leukocyte-mediated tissue injury"}, {"id": "HEM-PATH-TBL1-16", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "The most important substances released by activated leukocytes that injure host tissue are:", "options": {"A": "Histamine and serotonin from leukocyte granules", "B": "Prostacyclin and nitric oxide", "C": "Lipoxins and antiproteases", "D": "Complement C3b and IgG", "E": "Lysosomal enzymes and oxygen/nitrogen radicals"}, "answer": "E", "explanation": "The most important injurious leukocyte products are lysosomal enzymes (in the granules) and reactive oxygen and nitrogen species. A: Histamine and serotonin come from mast cells, basophils and platelets. B: PGI2 and NO are endothelial and protective. C: Lipoxins resolve inflammation and antiproteases protect tissue. D: C3b and IgG are opsonins.", "source_slide": "Acute Inflammation doc: Leukocyte-mediated tissue injury"}, {"id": "HEM-PATH-TBL1-17", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about neutrophils in acute inflammation is correct?", "options": {"A": "They dominate the focus for the first 2–3 days, then are replaced by lymphocytes", "B": "Early neutrophilia comes from division of mature circulating neutrophils", "C": "They are the main cells in viral infections", "D": "Neutrophilia is a typical response to parasitic infestation", "E": "Early neutrophilia comes from the marrow postmitotic reserve pool, with more band forms"}, "answer": "E", "explanation": "Early neutrophilia comes from release of the bone marrow postmitotic reserve pool, with more immature band neutrophils. A: Neutrophils dominate the first 24 hours and are replaced by monocytes–macrophages after 2–3 days. B: Mature neutrophils do not divide. C: Lymphocytes dominate many viral infections. D: Parasites cause eosinophilia.", "source_slide": "Acute Inflammation doc: Cells"}, {"id": "HEM-PATH-TBL1-18", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Why are monocytes–macrophages better suited than neutrophils to the later phase of an inflammatory focus?", "options": {"A": "They live longer, divide in tissue and engulf larger particles", "B": "They arrive first and degranulate within minutes of injury", "C": "They die after a single burst, which limits tissue damage", "D": "They are the main source of histamine in the tissue", "E": "They release lipoxins that recruit more neutrophils"}, "answer": "A", "explanation": "Monocytes–macrophages engulf larger particles, are longer-lived, and can divide and proliferate in the inflamed tissue. B: Neutrophils arrive first. C: Dying after one burst describes neutrophils. D: Histamine comes from mast cells, basophils and platelets. E: Lipoxins help resolve inflammation.", "source_slide": "Acute Inflammation doc: Cells"}, {"id": "HEM-PATH-TBL1-19", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which cell is matched with the setting in which it is prominent?", "options": {"A": "Basophils – viral infections", "B": "Eosinophils – allergic reactions and parasitic infestations", "C": "Lymphocytes – the first 24 hours of acute inflammation", "D": "Neutrophils – chronic inflammation alongside plasma cells", "E": "Monocytes – allergic reactions"}, "answer": "B", "explanation": "Eosinophils are prominent in allergic reactions and parasitic infestations. A: Lymphocytes are prominent in viral infections; basophilia occurs in CML. C: Neutrophils dominate the first 24 hours. D: Chronic inflammation features lymphocytes, macrophages and plasma cells. E: Monocytes become prominent after 2–3 days.", "source_slide": "Acute Inflammation doc: Cells in acute and chronic inflammation"}, {"id": "HEM-PATH-TBL1-20", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about the inflammatory cells is correct?", "options": {"A": "Eosinophils are the main source of histamine", "B": "Chronic inflammation is dominated by mononuclear cells", "C": "Basophilia is the typical response to allergic reactions", "D": "Neutrophils are capable of dividing in the inflamed tissue", "E": "Monocytes predominate in the first 24 hours"}, "answer": "B", "explanation": "Lymphocytes, along with monocytes–macrophages and plasma cells, are the most prominent cells in chronic inflammation. A: Mast cells and basophils are the histamine sources. C: Allergy causes eosinophilia; basophilia is from CML and myeloproliferative diseases. D: Macrophages, not neutrophils, can divide in the tissue. E: Neutrophils predominate in the first 24 hours.", "source_slide": "Acute Inflammation doc: Cells"}, {"id": "HEM-PATH-TBL1-21", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which mediator is matched with its correct origin category?", "options": {"A": "Histamine – plasma-protein-derived", "B": "C5a – cell-derived", "C": "E. coli peptides – endogenous", "D": "Platelet-activating factor – plasma-protein-derived", "E": "Bradykinin – plasma-protein-derived"}, "answer": "E", "explanation": "Endogenous mediators are cell-derived or plasma-protein-derived; bradykinin comes from the plasma kinin system. A: Histamine is cell-derived (mast cells, basophils, platelets). B: C5a comes from plasma complement proteins. C: Microbial peptides are exogenous mediators. D: PAF is made from cell membrane phospholipids.", "source_slide": "Acute Inflammation doc: Mediators overview"}, {"id": "HEM-PATH-TBL1-22", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Histamine release from mast cells and basophils is triggered by all of the following EXCEPT:", "options": {"A": "Antigen binding to cell-bound IgE", "B": "C3b binding to its receptor", "C": "Physical stimuli", "D": "Complement fragments C3a and C5a", "E": "Cytokines from inflammatory cells"}, "answer": "B", "explanation": "Triggers are antigen binding to IgE on mast cells and basophils, C3a and C5a, physical stimuli, and cytokines or products from inflammatory cells. C3b is an opsonin. A: IgE-bound antigen is a trigger. C: Physical stimuli are triggers. D: C3a and C5a are anaphylatoxins that trigger release. E: Cytokines and inflammatory-cell products are triggers.", "source_slide": "Acute Inflammation doc: Vasoactive amines"}, {"id": "HEM-PATH-TBL1-23", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about histamine and serotonin is correct?", "options": {"A": "Serotonin comes from platelets and acts like histamine", "B": "Serotonin comes from mast cells and opposes histamine", "C": "Histamine comes from basophils but not from platelets", "D": "Histamine acts mainly by damaging arteriolar endothelium", "E": "Serotonin is the main trigger of mast cell degranulation"}, "answer": "A", "explanation": "Histamine is released from mast cells, basophils and platelets and acts especially through endothelial contraction in postcapillary venules. Serotonin, released from platelets, has effects similar to histamine. B: The doc gives platelets as the serotonin source, with similar effects. C: Platelets also release histamine. D: Histamine acts by endothelial contraction in postcapillary venules. E: Degranulation triggers are IgE-bound antigen, C3a/C5a, physical stimuli and cytokines.", "source_slide": "Acute Inflammation doc: Vasoactive amines"}, {"id": "HEM-PATH-TBL1-24", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Phospholipase A2 releases arachidonic acid, the precursor of which mediators?", "options": {"A": "Bradykinin, kallikrein and prostaglandins", "B": "Prostaglandins, thromboxanes and leukotrienes", "C": "Histamine, serotonin and leukotrienes", "D": "Nitric oxide, prostacyclin and thromboxanes", "E": "C3a, C5a and prostaglandins"}, "answer": "B", "explanation": "Phospholipase A2 releases arachidonic acid from membrane phospholipids; the COX pathway makes prostaglandins and thromboxanes, and the lipoxygenase pathway makes leukotrienes and lipoxins. A: Bradykinin and kallikrein belong to the kinin system. C: Histamine and serotonin are preformed amines. D: NO is made by endothelial cells, not from arachidonic acid. E: C3a and C5a are complement fragments.", "source_slide": "Acute Inflammation doc: Arachidonic-acid metabolites"}, {"id": "HEM-PATH-TBL1-25", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which arachidonic acid product is matched with the correct pathway and action?", "options": {"A": "TxA2 – lipoxygenase – vasoconstriction, aggregation", "B": "LTB4 – cyclooxygenase – neutrophil chemotaxis", "C": "PGI2 – cyclooxygenase – vasodilation, inhibits aggregation", "D": "Lipoxins – cyclooxygenase – bronchoconstriction", "E": "HETE – cyclooxygenase – vasodilation and fever"}, "answer": "C", "explanation": "Endothelial PGI2 is a COX product, a powerful vasodilator and inhibitor of platelet aggregation. A: TxA2 is a COX product. B: LTB4 is a lipoxygenase product. D: Lipoxins come from 5-HPETE (lipoxygenase) and help resolve inflammation. E: HETE is a lipoxygenase product and is chemotactic.", "source_slide": "Acute Inflammation doc: Arachidonic-acid metabolites"}, {"id": "HEM-PATH-TBL1-26", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about the lipoxygenase pathway is correct?", "options": {"A": "Its products include thromboxane A2", "B": "It is not the pathway blocked by aspirin", "C": "It produces prostacyclin in endothelium", "D": "Its leukotrienes C4–E4 attract neutrophils", "E": "Its lipoxins promote bronchoconstriction"}, "answer": "B", "explanation": "Aspirin inhibits the cyclooxygenase pathway. The lipoxygenase pathway produces HPETEs, LTB4 (chemotactic), LTC4/LTD4/LTE4 (bronchoconstriction, vasoconstriction, permeability) and lipoxins (help resolve inflammation). A: TxA2 is a COX product. C: PGI2 is a COX product. D: Only LTB4 is described as chemotactic; LTC4–LTE4 constrict and increase permeability. E: Lipoxins help resolve inflammation.", "source_slide": "Acute Inflammation doc: Arachidonic-acid metabolites"}, {"id": "HEM-PATH-TBL1-27", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "Step1", "stem": "A patient with asthma has an attack after allergen exposure, with bronchoconstriction and increased vascular permeability that persist after antihistamine treatment. Which group of mediators best explains the persistent effects?", "options": {"A": "LTB4 and HETE", "B": "Prostacyclin and nitric oxide", "C": "Lipoxins", "D": "LTC4, LTD4 and LTE4", "E": "Thromboxane A2 and serotonin"}, "answer": "D", "explanation": "LTC4, LTD4 and LTE4 are potent vasoconstrictors, bronchoconstrictors and mediators of increased permeability (the slow-reacting substance of anaphylaxis). A: LTB4 and HETE are chemotactic for neutrophils. B: PGI2 and NO are vasodilators. C: Lipoxins help resolve inflammation. E: TxA2 and serotonin are platelet products; neither is the slow-reacting substance.", "source_slide": "Acute Inflammation doc: Arachidonic-acid metabolites"}, {"id": "HEM-PATH-TBL1-28", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about platelet-activating factor is correct?", "options": {"A": "It is a peptide cleaved from kininogen by kallikrein", "B": "It inhibits platelets and causes bronchodilation in asthma", "C": "It is a lipoxygenase product of leukocytes", "D": "It is a plasma protein made by the liver", "E": "It is more potent than histamine in increasing permeability"}, "answer": "E", "explanation": "PAF is generated from membrane phospholipids in several cell types. It stimulates platelets, causes bronchoconstriction, increases permeability, and is described as substantially more potent than histamine in increasing permeability and vasodilation. A: That describes bradykinin. B: PAF stimulates platelets and causes bronchoconstriction. C: PAF comes from membrane phospholipids; it is not a leukotriene. D: PAF is a lipid made by cells, not a hepatic protein.", "source_slide": "Acute Inflammation doc: PAF, cytokines and chemokines"}, {"id": "HEM-PATH-TBL1-29", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which effect is NOT attributed to IL-1 and TNF in the notes?", "options": {"A": "Inducing acute-phase responses", "B": "Inducing adhesion molecule synthesis", "C": "Triggering neutrophil degranulation", "D": "Causing fever and cachexia", "E": "Increasing endothelial thromboresistance"}, "answer": "E", "explanation": "IL-1 and TNF reduce, not increase, endothelial thromboresistance, which promotes thrombosis. A: Acute-phase responses are listed. B: Adhesion molecule synthesis is listed. C: Neutrophil degranulation is listed. D: Fever and cachexia are systemic effects listed.", "source_slide": "Acute Inflammation doc: PAF, cytokines and chemokines"}, {"id": "HEM-PATH-TBL1-30", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Besides attracting selected leukocyte populations, chemokines:", "options": {"A": "Induce fever and acute-phase proteins", "B": "Act as the main opsonins", "C": "Organize cells within lymphoid tissues", "D": "Form the membrane attack complex", "E": "Inhibit platelet aggregation"}, "answer": "C", "explanation": "Chemokines are small proteins that primarily attract selected leukocytes; they support recruitment and the normal organization of cells in lymphoid tissues. A: Fever and acute-phase responses come from IL-1 and TNF. B: The opsonins are IgG and C3b. D: The MAC is C5b–9. E: NO and PGI2 inhibit platelet aggregation.", "source_slide": "Acute Inflammation doc: PAF, cytokines and chemokines"}, {"id": "HEM-PATH-TBL1-31", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Nitric oxide contributes to endothelial thromboresistance by:", "options": {"A": "Inhibiting platelet aggregation", "B": "Stimulating PGI2 cleavage", "C": "Inducing P-selectin relocation", "D": "Activating Hageman factor", "E": "Promoting TxA2 synthesis"}, "answer": "A", "explanation": "NO, made by endothelial cells, relaxes smooth muscle, inhibits platelet aggregation (thromboresistance) and participates in microbial killing. B: NO does not cleave PGI2. C: P-selectin relocation is caused by histamine and thrombin. D: Factor XIIa starts the kinin and coagulation systems. E: TxA2 promotes aggregation.", "source_slide": "Acute Inflammation doc: Nitric oxide"}, {"id": "HEM-PATH-TBL1-32", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about reactive oxygen species is correct?", "options": {"A": "They are synthesized by phospholipase A2 in neutrophils", "B": "At low levels they cause tissue injury; at high levels they amplify signals", "C": "At low levels they increase chemokine and adhesion molecule expression", "D": "Catalase generates them from superoxide", "E": "They are neutralized mainly by α1-antitrypsin"}, "answer": "C", "explanation": "ROS are made by NADPH oxidase. At low levels they increase chemokine, cytokine and adhesion molecule expression; at higher levels they injure tissue. A: ROS come from NADPH oxidase. B: The relationship is reversed. D: Catalase detoxifies H2O2. E: α1-antitrypsin is an antiprotease; ROS are handled by SOD, catalase and glutathione peroxidase.", "source_slide": "Acute Inflammation doc: ROS"}, {"id": "HEM-PATH-TBL1-33", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "Step1", "stem": "A 40-year-old non-smoker develops panacinar emphysema. Uninhibited activity of which enzyme, from leukocyte granules, explains the lung destruction?", "options": {"A": "Neutrophil elastase", "B": "Myeloperoxidase", "C": "Phospholipase A2", "D": "NADPH oxidase", "E": "Kallikrein"}, "answer": "A", "explanation": "Lysosomal enzymes are checked by antiproteases; α1-antitrypsin is the major inhibitor of neutrophil elastase. Its deficiency in the lung lets leukocyte proteases destroy tissue, causing panacinar emphysema. B: MPO generates hypochlorous acid; it is not the protease checked by α1-antitrypsin. C: Phospholipase A2 releases arachidonic acid. D: NADPH oxidase generates ROS. E: Kallikrein makes bradykinin.", "source_slide": "Acute Inflammation doc: Leukocyte-mediated tissue injury"}, {"id": "HEM-PATH-TBL1-34", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about substance P is correct?", "options": {"A": "It is a lipid mediator generated by phospholipase A2", "B": "It transmits pain and regulates vascular tone and permeability", "C": "It is an acute-phase protein produced by hepatocytes in the liver", "D": "It is an anaphylatoxin formed during complement activation", "E": "It is stored in Weibel–Palade bodies with P-selectin"}, "answer": "B", "explanation": "Neuropeptides such as substance P transmit pain signals and regulate vascular tone and permeability; nerve fibers producing them are prominent in the lung and GI tract. A: Lipid mediators are arachidonic acid metabolites and PAF. C: Acute-phase proteins include CRP and fibrinogen. D: The anaphylatoxins are C3a and C5a. E: Weibel–Palade bodies store P-selectin.", "source_slide": "Acute Inflammation doc: Neuropeptides"}, {"id": "HEM-PATH-TBL1-35", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Activated Hageman factor (factor XIIa) directly activates all of the following EXCEPT:", "options": {"A": "The cyclooxygenase pathway", "B": "The kinin system", "C": "The intrinsic coagulation pathway", "D": "The plasminogen (fibrinolytic) system", "E": "Conversion of prekallikrein to kallikrein"}, "answer": "A", "explanation": "Factor XIIa initiates the kinin system (prekallikrein → kallikrein), the intrinsic coagulation pathway and the plasminogen system, which in turn activate complement. The COX pathway starts from arachidonic acid released by phospholipase A2. B: The kinin system is initiated by XIIa. C: XIIa activates intrinsic coagulation. D: XIIa activates the plasminogen system. E: Prekallikrein conversion is part of the kinin system.", "source_slide": "Acute Inflammation doc: Kinin and complement systems"}, {"id": "HEM-PATH-TBL1-36", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about the kinin system is correct?", "options": {"A": "Bradykinin is cleaved from prekallikrein by factor XIIa", "B": "Kallikrein is a vasoconstrictor that opposes bradykinin", "C": "Bradykinin is the chemotactic product of the system", "D": "Kininogen is released from mast cell granules", "E": "Kallikrein cleaves kininogen and is also chemotactic"}, "answer": "E", "explanation": "Kallikrein, generated from prekallikrein, cleaves high-molecular-weight kininogen to bradykinin; kallikrein can also act as a chemotactic factor. Bradykinin causes permeability, arteriolar dilation and pain. A: Bradykinin comes from kininogen, cleaved by kallikrein. B: Kallikrein is chemotactic, not a vasoconstrictor. C: Kallikrein, not bradykinin, is the chemotactic factor. D: Kininogen is a plasma protein.", "source_slide": "Acute Inflammation doc: Kinin and complement systems"}, {"id": "HEM-PATH-TBL1-37", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which action of C5a is described in the notes?", "options": {"A": "Opsonization of particles", "B": "Activation of the lipoxygenase pathway", "C": "Formation of membrane pores", "D": "Inhibition of leukocyte adhesion molecules", "E": "Conversion of prekallikrein to kallikrein"}, "answer": "B", "explanation": "C5a is chemotactic, releases histamine (including from platelet dense granules), induces leukocyte adhesion molecules and activates the lipoxygenase pathway. A: C3b is the opsonin. C: C5b-9 forms pores. D: C5a induces adhesion molecules. E: Factor XIIa converts prekallikrein.", "source_slide": "Acute Inflammation doc: Kinin and complement systems"}, {"id": "HEM-PATH-TBL1-38", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about complement in inflammation is correct?", "options": {"A": "C3b is the membrane attack complex", "B": "C5b–9 acts as the main opsonin", "C": "C3a and C5a are anaphylatoxins", "D": "C3a is the main chemotactic fragment", "E": "C5a inhibits leukocyte adhesion molecules"}, "answer": "C", "explanation": "C3a and C5a are anaphylatoxins that trigger mast-cell and basophil degranulation. C5a is also chemotactic; C3b is an opsonin; C5b–9 is the lytic MAC. A: C3b is an opsonin. B: C5b–9 lyses cells. D: C5a is the chemotactic fragment described. E: C5a promotes adhesion-molecule expression.", "source_slide": "Acute Inflammation doc: Kinin and complement systems"}, {"id": "HEM-PATH-TBL1-39", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about neutrophil extracellular traps is correct?", "options": {"A": "They are formed by fibrin deposited from plasma", "B": "They kill microbes inside the phagolysosome", "C": "They trap microbes in fibrils, limiting spread", "D": "They are released by macrophages after 2–3 days", "E": "They are the main cause of serous effusions"}, "answer": "C", "explanation": "NETs are extracellular fibrillar networks released by neutrophils that concentrate antimicrobial substances and prevent spread by trapping microbes. A: Fibrin comes from coagulation. B: NETs act outside the cell. D: They are released by neutrophils. E: Serous effusions come from plasma or mesothelium.", "source_slide": "Acute Inflammation doc: NETs"}, {"id": "HEM-PATH-TBL1-40", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "Step1", "stem": "A 45-year-old with bacterial pneumonia has fever, weight loss and raised serum CRP, fibrinogen and ferritin. Which is also listed as an acute-phase protein made by the liver under the same stimulus?", "options": {"A": "Bradykinin", "B": "Ceruloplasmin", "C": "Albumin", "D": "Immunoglobulin G", "E": "Histamine"}, "answer": "B", "explanation": "IL-1 and TNF drive hepatic acute-phase proteins: CRP, serum amyloid-associated protein, complement, fibrinogen, prothrombin, α1-antitrypsin, α2-macroglobulin, ferritin and ceruloplasmin. A: Bradykinin is a kinin. C: Albumin is not in the doc' acute-phase list (it falls in inflammation). D: IgG is made by plasma cells. E: Histamine is a vasoactive amine.", "source_slide": "Acute Inflammation doc: Systemic effects"}, {"id": "HEM-PATH-TBL1-41", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which pair of proteins is listed both as an antiprotease and among the acute-phase proteins?", "options": {"A": "Ferritin and ceruloplasmin", "B": "CRP and serum amyloid A", "C": "Fibrinogen and prothrombin", "D": "α1-antitrypsin and α2-macroglobulin", "E": "Catalase and superoxide dismutase"}, "answer": "D", "explanation": "α1-antitrypsin and α2-macroglobulin are the antiproteases that check lysosomal enzymes, and both are also in the acute-phase list. A: These are acute-phase proteins but not antiproteases. B: These are acute-phase proteins but not antiproteases. C: These are coagulation-related acute-phase proteins. E: These are antioxidant enzymes.", "source_slide": "Acute Inflammation doc: Systemic effects"}, {"id": "HEM-PATH-TBL1-42", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about selectins is correct?", "options": {"A": "IL-1 and TNF promote their endothelial expression", "B": "They mediate firm adhesion before transmigration", "C": "E-selectin is stored in Weibel–Palade bodies", "D": "They are integrins expressed on leukocytes", "E": "They bind ICAM-1 and VCAM on endothelium"}, "answer": "A", "explanation": "Selectins mediate rolling; IL-1 and TNF promote endothelial adhesion-molecule expression. E- and P-selectins bind sialyl-Lewis X; P-selectin is stored in Weibel–Palade bodies and platelet α-granules. B: Firm adhesion is mediated by integrins. C: P-selectin is the stored one. D: Integrins are a separate family. E: ICAM-1 and VCAM bind integrins.", "source_slide": "Acute Inflammation doc: Leukocyte recruitment"}, {"id": "HEM-PATH-TBL1-43", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which feature belongs to resolution of acute inflammation rather than to conversion to chronic inflammation?", "options": {"A": "Proliferation of fibroblasts and new vessels", "B": "Replacement of neutrophils by lymphocytes", "C": "Accumulation of plasma cells", "D": "Distortion of tissue architecture", "E": "Apoptosis of neutrophils at the site"}, "answer": "E", "explanation": "Resolution includes decay of mediators, normal permeability, neutrophil apoptosis, anti-inflammatory mediators, lymphatic drainage and macrophage clearance. A: Fibroblast and vessel proliferation mark chronic conversion. B: Lymphocytes replacing neutrophils marks chronic conversion. C: Plasma cells mark chronic conversion. D: Architectural distortion results from scarring.", "source_slide": "Acute Inflammation doc: Outcomes"}, {"id": "HEM-PATH-TBL1-44", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which outcome of acute inflammation is correctly defined?", "options": {"A": "Fistula – a localized collection of pus in an organ", "B": "Abscess – an abnormal communication between two hollow organs", "C": "Scar – restoration of normal structure and function", "D": "Ulcer – excavation of a surface from necrosis and sloughing", "E": "Effusion – sloughing of inflamed mucosa"}, "answer": "D", "explanation": "An ulcer is a local defect or excavation of a surface caused by necrosis and sloughing of inflamed necrotic tissue. A: That defines an abscess. B: That defines a fistula. C: A scar may distort structure or impair function. E: An effusion is fluid in a mesothelial-lined cavity.", "source_slide": "Acute Inflammation doc: Ulcer and other outcomes"}, {"id": "HEM-PATH-TBL1-45", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about abscesses is correct?", "options": {"A": "They are diffuse exudates spreading along tissue planes", "B": "They are usually caused by viral infections", "C": "Their center contains viable, preserved neutrophils", "D": "They consist mainly of fibrin with few cells", "E": "They may be walled off and replaced by connective tissue"}, "answer": "E", "explanation": "An abscess is a localized collection of pus within a tissue, organ or confined space; it may become walled off and replaced by connective tissue. A: An abscess is localized. B: Pyogenic bacteria such as staphylococci are the usual cause. C: The center contains necrotic leukocytes and tissue cells; viable neutrophils form the rim. D: That describes fibrinous inflammation.", "source_slide": "Acute Inflammation doc: Purulent inflammation and abscess"}, {"id": "HEM-PATH-TBL1-46", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Moving outward from the center of an abscess, which sequence is described?", "options": {"A": "Necrotic center → neutrophil rim → fibroblastic zone", "B": "Preserved neutrophils → necrotic cells → fibrous capsule", "C": "Fibroblastic proliferation → necrotic cells → preserved neutrophils", "D": "Necrotic cells → fibroblastic proliferation → rim of neutrophils", "E": "Granulation tissue → necrotic cells → rim of lymphocytes"}, "answer": "A", "explanation": "The center is a mass of necrotic leukocytes and tissue cells, surrounded by a rim of preserved neutrophils; outside, vascular congestion and parenchymal and fibroblastic proliferation indicate chronic inflammation and repair. B: Preserved neutrophils form the rim around the necrotic center. C: Fibroblastic proliferation is the outermost zone. D: Neutrophils lie between the center and the fibroblastic zone. E: Granulation tissue and a lymphocyte rim are not described.", "source_slide": "Acute Inflammation doc: Purulent inflammation and abscess"}, {"id": "HEM-PATH-TBL1-47", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about serous inflammation is correct?", "options": {"A": "It is defined by deposition of fibrin", "B": "It is rich in neutrophils and liquefied necrotic debris", "C": "It is typical of meningeal inflammation", "D": "Its fluid comes from plasma or mesothelium", "E": "It is the classic pattern of appendicitis"}, "answer": "D", "explanation": "Serous inflammation is a relatively cell-poor, serum-like, protein-rich exudate; the fluid may come from plasma leakage or mesothelial-cell secretion. A: Fibrin defines fibrinous inflammation. B: That describes pus. C: The meninges are a typical fibrinous site. E: Appendicitis is suppurative.", "source_slide": "Acute Inflammation doc: Serous inflammation"}, {"id": "HEM-PATH-TBL1-48", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "Step1", "stem": "Five days after a myocardial infarction, a patient has pericardial chest pain. Autopsy weeks later shows a shaggy eosinophilic meshwork on the pericardium. What allowed this exudate to form, unlike a serous one?", "options": {"A": "Pyogenic bacteria seeded the pericardium", "B": "Mesothelial cells secreted fluid after irritation", "C": "Lymphatic drainage of the pericardium increased", "D": "Greater permeability let fibrinogen escape", "E": "Neutrophils released NETs that trapped proteins"}, "answer": "D", "explanation": "Fibrinous inflammation follows more severe injury: greater permeability lets large molecules such as fibrinogen pass, and local coagulation deposits fibrin, seen as an eosinophilic meshwork. A: Bacteria would cause purulent inflammation. B: Mesothelial secretion produces serous fluid. C: Increased drainage removes, not deposits, exudate. E: NETs are neutrophil fibrils, not the fibrin meshwork described.", "source_slide": "Acute Inflammation doc: Fibrinous inflammation"}, {"id": "HEM-PATH-TBL1-49", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "A fibrinous exudate that is not removed undergoes organization. What does organization involve?", "options": {"A": "Fibrinolysis followed by clearance by macrophages", "B": "Ingrowth of fibroblasts and vessels, then scarring", "C": "Conversion of fibrin into pus by neutrophils", "D": "Formation of granulomas around the fibrin", "E": "Re-epithelialization of the serosal surface"}, "answer": "B", "explanation": "Fibrinous exudates may resolve by fibrinolysis and macrophage clearance; if not, they undergo organization, with ingrowth of fibroblasts and vessels that leads to scarring. A: That is resolution of the exudate, the alternative to organization. C: Pus is not described from fibrin. D: Granulomas are not described. E: Re-epithelialization is not described.", "source_slide": "Acute Inflammation doc: Fibrinous inflammation"}, {"id": "HEM-PATH-TBL1-50", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about purulent inflammation is correct?", "options": {"A": "It is cell-poor with sterile fluid", "B": "It mainly affects mesothelium-lined cavities as fibrin", "C": "Its classic example is a burn blister", "D": "Pyogenic bacteria cause liquefactive necrosis", "E": "It is also called serous inflammation"}, "answer": "D", "explanation": "Purulent (suppurative) inflammation produces pus. It is most often caused by bacteria that cause liquefactive necrosis (e.g., staphylococci), called pyogenic bacteria; acute appendicitis is a common example. A: That describes serous inflammation. B: That describes fibrinous inflammation. C: Blisters are serous. E: Purulent is also called suppurative.", "source_slide": "Acute Inflammation doc: Purulent inflammation and abscess"}, {"id": "HEM-PATH-TBL1-51", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Ulceration requires which condition?", "options": {"A": "Deposition of fibrin in a body cavity", "B": "Seeding of pyogenic bacteria into deep tissue", "C": "Fluid accumulation beneath the epidermis", "D": "Granuloma formation with caseation", "E": "Necrosis and inflammation on or near a surface"}, "answer": "E", "explanation": "An ulcer is a local defect produced by necrosis and sloughing of inflammatory necrotic tissue; it can occur only when necrosis and inflammation exist on or near a surface. A: That is fibrinous inflammation. B: That produces an abscess. C: That produces a blister (serous). D: Caseating granulomas are not required.", "source_slide": "Acute Inflammation doc: Ulcer and other outcomes"}, {"id": "HEM-PATH-TBL1-52", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about the morphologic patterns is correct?", "options": {"A": "Fibrinous exudates resolve without scarring", "B": "Skin blisters represent purulent inflammation", "C": "Serous effusions are rich in neutrophils", "D": "Peptic ulcers show both acute and chronic inflammation", "E": "Abscesses are the typical lesion of fibrinous pericarditis"}, "answer": "D", "explanation": "In peptic ulcers acute and chronic inflammation coexist: neutrophils and vascular dilation in the acute stage, scarring with lymphocytes, macrophages and plasma cells with chronicity. A: Fibrinous exudates may organize into scar. B: Blisters are serous. C: Serous fluid has few leukocytes. E: Pericardial exudates are fibrinous.", "source_slide": "Acute Inflammation doc: Ulcer and other outcomes"}, {"id": "HEM-PATH-TBL1-53", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Restoration of injured tissue to normal structure after inflammation depends mainly on:", "options": {"A": "The number of neutrophils recruited and their life span", "B": "The amount of fibrin deposited and how fast it is cleared", "C": "Extent of destruction and regenerative capacity", "D": "The cytokines released and how long fever lasts", "E": "The size of the draining lymph nodes and lymph flow"}, "answer": "C", "explanation": "Restoration depends on the extent of tissue destruction and the regenerative capacity of the specific tissue. A: Neutrophil numbers do not determine regeneration. B: Fibrin clearance affects fibrinous exudates, not the general rule given. D: Cytokines and fever are systemic effects. E: Lymph flow clears edema but does not determine restoration.", "source_slide": "Acute Inflammation doc: Purpose and sequence"}, {"id": "HEM-PATH-TBL1-54", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which term describes leukocytes moving from the central blood flow toward the vessel wall?", "options": {"A": "Pavementing", "B": "Rolling", "C": "Emigration", "D": "Margination", "E": "Chemotaxis"}, "answer": "D", "explanation": "Margination is localization of leukocytes to the outer margin of the blood flow, adjacent to the endothelium. A: Pavementing is lining the endothelial surface. B: Rolling is loose selectin binding along the surface. C: Emigration is passage between endothelial cells into the tissue. E: Chemotaxis is movement toward the injury along a chemical gradient.", "source_slide": "Acute Inflammation doc: Leukocyte recruitment"}, {"id": "HEM-PATH-TBL1-55", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Engagement of leukocyte receptors by microbial products leads to \"leukocyte activation\". Which of the following is NOT one of its listed results?", "options": {"A": "Enhanced phagocytosis", "B": "Production of substances that destroy microbes", "C": "Secretion of antibodies", "D": "Production of arachidonic acid metabolites", "E": "Production of cytokines"}, "answer": "C", "explanation": "Activation enhances phagocytosis, production of microbicidal substances and of amplifying mediators (arachidonic acid metabolites and cytokines). Antibodies are made by plasma cells. A: Enhanced phagocytosis is listed. B: Microbicidal substances are listed. D: Arachidonic acid metabolites are listed. E: Cytokines are listed.", "source_slide": "Acute Inflammation doc: Chemotaxis and leukocyte activation"}, {"id": "HEM-PATH-TBL1-56", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Intracellular killing of phagocytosed microbes is described as:", "options": {"A": "Oxygen-dependent through NADPH oxidase, without other routes", "B": "Complement-mediated inside the phagosome", "C": "Antibody-mediated inside the phagolysosome", "D": "Oxygen-dependent and oxygen-independent", "E": "Mediated by nitric oxide from the endothelium"}, "answer": "D", "explanation": "Intracellular killing in phagocytes uses oxygen-dependent and oxygen-independent mechanisms. A: Oxygen-independent mechanisms also exist. B: Complement acts at the cell surface. C: Antibodies act as opsonins outside the cell. E: Endothelial NO is not the intracellular mechanism described.", "source_slide": "Acute Inflammation doc: Phagocytosis"}, {"id": "HEM-PATH-TBL1-57", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which pair consists of the most important phagocytic cells?", "options": {"A": "Neutrophils and eosinophils", "B": "Monocytes and dendritic cells", "C": "Macrophages and mast cells", "D": "Eosinophils and basophils", "E": "Neutrophils and macrophages"}, "answer": "E", "explanation": "Neutrophils and monocytes–macrophages are the most important phagocytes. A: Eosinophils are not named as major phagocytes. B: Dendritic cells are not named here. C: Mast cells release histamine. D: Eosinophils and basophils are not the main phagocytes.", "source_slide": "Acute Inflammation doc: Phagocytosis"}, {"id": "HEM-PATH-TBL1-58", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Neutrophilia is typical of which pair of conditions?", "options": {"A": "Viral infection and infarction", "B": "Bacterial infection and hay fever", "C": "Tuberculosis and typhus", "D": "Bacterial infection and infarction", "E": "Parasitic infection and asthma"}, "answer": "D", "explanation": "Neutrophilia is caused by bacterial infections and other acute inflammation such as infarction. A: Viral infections cause lymphocytosis. B: Hay fever causes eosinophilia. C: These cause monocytosis. E: These cause eosinophilia.", "source_slide": "Acute Inflammation doc: Cells"}, {"id": "HEM-PATH-TBL1-59", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Aspirin's anti-inflammatory action targets which enzyme, and which products fall?", "options": {"A": "Phospholipase A2; prostaglandins and leukotrienes", "B": "5-lipoxygenase; leukotrienes and lipoxins", "C": "Cyclooxygenase; leukotrienes and HETE", "D": "Cyclooxygenase; prostaglandins and thromboxanes", "E": "Lipoxygenase; thromboxanes and prostacyclin"}, "answer": "D", "explanation": "The cyclooxygenase pathway (COX-1, COX-2) yields thromboxanes and prostaglandins and is inhibited by aspirin. A: Phospholipase A2 is upstream and not the aspirin target. B: Lipoxygenase is not the aspirin target. C: Leukotrienes and HETE are lipoxygenase products. E: Thromboxanes and prostacyclin are COX products.", "source_slide": "Acute Inflammation doc: Arachidonic-acid metabolites"}, {"id": "HEM-PATH-TBL1-60", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Prostaglandins (other than TxA2 and PGI2) are listed as causing:", "options": {"A": "Vasoconstriction, pain and fever", "B": "Vasodilation, chemotaxis and fever", "C": "Bronchoconstriction, pain and fever", "D": "Vasodilation, pain and platelet aggregation", "E": "Vasodilation, pain and fever"}, "answer": "E", "explanation": "Prostaglandins induce vasodilation, pain and fever. A: Prostaglandins dilate vessels. B: Chemotaxis is LTB4 and HETE. C: Bronchoconstriction is LTC4, LTD4 and LTE4. D: Platelet aggregation is TxA2.", "source_slide": "Acute Inflammation doc: Arachidonic-acid metabolites"}, {"id": "HEM-PATH-TBL1-61", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about lipoxins is correct?", "options": {"A": "They are lipoxygenase products that help resolve inflammation", "B": "They are COX products that cause pain and fever", "C": "They are lipoxygenase products that attract neutrophils strongly", "D": "They are lipoxygenase products causing bronchospasm", "E": "They are COX products that aggregate platelets"}, "answer": "A", "explanation": "Lipoxins come from the lipoxygenase pathway and generally help resolve inflammation, acting as anti-inflammatory mediators. B: Pain and fever come from prostaglandins. C: LTB4 attracts neutrophils. D: LTC4, LTD4 and LTE4 cause bronchoconstriction. E: TxA2 aggregates platelets.", "source_slide": "Acute Inflammation doc: Arachidonic-acid metabolites"}, {"id": "HEM-PATH-TBL1-62", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which set lists the antioxidant protections against oxygen-derived radicals?", "options": {"A": "Superoxide dismutase, catalase, glutathione peroxidase", "B": "NADPH oxidase, catalase, glutathione peroxidase", "C": "Superoxide dismutase, α1-antitrypsin, catalase", "D": "Ceruloplasmin, catalase, α2-macroglobulin", "E": "Superoxide dismutase, myeloperoxidase, catalase"}, "answer": "A", "explanation": "The antioxidant mechanisms named are superoxide dismutase, catalase (detoxifies H2O2) and glutathione peroxidase. B: NADPH oxidase generates ROS. C: α1-antitrypsin is an antiprotease. D: α2-macroglobulin is an antiprotease. E: Myeloperoxidase is a granule enzyme, not an antioxidant defense.", "source_slide": "Acute Inflammation doc: Leukocyte-mediated tissue injury"}, {"id": "HEM-PATH-TBL1-63", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Lysosomal enzymes of neutrophils and monocytes reach the extracellular space:", "options": {"A": "After cell death and by leakage during phagocytosis", "B": "By IgE-triggered degranulation and after cell death", "C": "Through C5b-9 pores and by leakage from phagosomes", "D": "By the platelet release reaction and after cell death", "E": "Through transcytosis and by leakage from phagosomes"}, "answer": "A", "explanation": "Lysosomal enzymes may be released after cell death or by leakage during formation of phagocytic vacuoles. B: IgE-triggered degranulation is the mast cell mechanism. C: C5b-9 pores lyse target cells. D: The release reaction is a platelet event. E: Transcytosis is a VEGF permeability mechanism.", "source_slide": "Acute Inflammation doc: Lysosomal enzymes"}, {"id": "HEM-PATH-TBL1-64", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Neuropeptide-secreting nerve fibers are especially prominent in:", "options": {"A": "Lung and gastrointestinal tract", "B": "Lung and kidney", "C": "Skin and gastrointestinal tract", "D": "Liver and spleen", "E": "Heart and lung"}, "answer": "A", "explanation": "Nerve fibers secreting neuropeptides are especially prominent in the lung and GI tract. B: The kidney is not named. C: The skin is not named. D: Liver and spleen are not named. E: The heart is not named.", "source_slide": "Acute Inflammation doc: Neuropeptides"}, {"id": "HEM-PATH-TBL1-65", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which is NOT listed among the systemic effects of inflammation caused by IL-1 and TNF?", "options": {"A": "Fever", "B": "Cachexia", "C": "Lymphocytopenia", "D": "Leukocytosis", "E": "Hepatic acute-phase protein synthesis"}, "answer": "C", "explanation": "IL-1 and TNF cause fever, cachexia, leukocytosis and hepatic synthesis of acute-phase proteins. Lymphocytopenia is not listed. A: Fever is listed. B: Cachexia is listed. D: Leukocytosis is listed. E: Acute-phase proteins are listed.", "source_slide": "Acute Inflammation doc: Systemic effects"}, {"id": "HEM-PATH-TBL1-66", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "An accumulation of fluid in a mesothelium-lined cavity is called:", "options": {"A": "Effusion", "B": "Edema", "C": "Exudate", "D": "Transudate", "E": "Abscess"}, "answer": "A", "explanation": "Fluid in a mesothelium-lined cavity is an effusion. B: Edema is interstitial fluid. C: Exudate describes protein-rich fluid, not its location. D: Transudate describes low-protein fluid, not its location. E: An abscess is a localized collection of pus.", "source_slide": "Acute Inflammation doc: Serous inflammation"}, {"id": "HEM-PATH-TBL1-67", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Fibrinous exudates are characteristic of inflammation of:", "options": {"A": "Meninges, pericardium and pleura", "B": "Pericardium, pleura and skin", "C": "Meninges, appendix and pleura", "D": "Peritoneum, skin and stomach", "E": "Pleura, stomach and duodenum"}, "answer": "A", "explanation": "Fibrinous exudates are characteristic of the linings of body cavities: meninges, pericardium and pleura. B: Skin blisters are serous. C: Appendicitis is purulent. D: Skin and stomach are not named. E: Stomach and duodenum give peptic ulcers.", "source_slide": "Acute Inflammation doc: Fibrinous inflammation"}, {"id": "HEM-PATH-TBL1-68", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Pus is composed of:", "options": {"A": "Neutrophils, fibrin and red cells", "B": "Lymphocytes, plasma cells and edema fluid", "C": "Macrophages, giant cells and debris", "D": "Neutrophils, eosinophils and serous fluid", "E": "Neutrophils, necrotic debris and edema fluid"}, "answer": "E", "explanation": "Pus is an exudate of neutrophils, liquefied debris of necrotic cells and edema fluid. A: Fibrin and red cells are not its components. B: Lymphocytes and plasma cells mark chronic inflammation. C: Giant cells belong to granulomas. D: Eosinophils are not a component.", "source_slide": "Acute Inflammation doc: Purulent inflammation and abscess"}, {"id": "HEM-PATH-TBL1-69", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Besides mucosal surfaces, where does the doc say ulceration may occur?", "options": {"A": "Mesothelium-lined body cavities", "B": "Ischemic lower-extremity tissues", "C": "Deep parenchyma of solid organs", "D": "Draining lymph nodes", "E": "The meninges"}, "answer": "B", "explanation": "Ulceration requires necrosis and inflammation at or near a surface and may occur in mucosa or in ischemic lower-extremity tissues. A: Fluid in these cavities is an effusion. C: Deep localized pus is an abscess. D: Lymph nodes show lymphadenitis. E: The meninges show fibrinous exudates.", "source_slide": "Acute Inflammation doc: Ulcer and other outcomes"}, {"id": "HEM-PATH-TBL1-70", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "According to the doc, inflammation is a protective response intended to:", "options": {"A": "Eliminate the cause of injury and remove necrotic tissue", "B": "Repair tissue before the injurious agent has been removed", "C": "Limit blood flow so that infection cannot spread", "D": "Replace injured tissue by fibrosis from the start", "E": "Generate antibodies against the injurious agent"}, "answer": "A", "explanation": "Inflammation is a protective response intended to eliminate the initial cause of cell injury and remove necrotic cells and tissues resulting from the original insult. B: Repair (resolution) is the last step, after removal. C: Vasodilation increases blood flow. D: Fibrosis is a possible outcome, not the aim. E: Antibody production is not the definition given.", "source_slide": "Acute Inflammation doc: Purpose and sequence"}, {"id": "HEM-PATH-TBL1-71", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "A patient has a zone of necrotic myocardium. Where do the inflammatory changes develop?", "options": {"A": "Within the core of the necrotic tissue", "B": "Once bacteria have colonized the necrotic tissue", "C": "In distant organs through circulating cytokines", "D": "In viable tissue adjacent to the necrotic area", "E": "Throughout the whole organ at the same time"}, "answer": "D", "explanation": "Tissue death is a cause of inflammation, and inflammation occurs in viable tissue adjacent to necrotic areas. A: Dead tissue cannot mount the response. B: Infection is not required. C: Systemic effects exist, but the local reaction is next to the necrosis. E: The reaction is located at the margin of the necrosis.", "source_slide": "Acute Inflammation doc: Cardinal signs and causes"}, {"id": "HEM-PATH-TBL1-72", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which cardinal sign is attributed specifically to increased blood flow?", "options": {"A": "Rubor", "B": "Tumor", "C": "Dolor", "D": "Calor", "E": "Functio laesa"}, "answer": "D", "explanation": "The doc attributes rubor to vasodilation and calor (heat) to increased blood flow; the rapid review links redness and warmth to vasodilation and increased local flow. A: Rubor is attributed to vasodilation. B: Tumor is extravascular fluid accumulation. C: Dolor is tissue pressure plus mediators such as bradykinin. E: Functio laesa is loss of function.", "source_slide": "Acute Inflammation doc: Cardinal signs and causes"}, {"id": "HEM-PATH-TBL1-73", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which pair of mediators does the doc name as important in increased vascular permeability?", "options": {"A": "Lipoxins and nitric oxide", "B": "TxA2 and prostacyclin", "C": "Catalase and superoxide dismutase", "D": "α1-antitrypsin and ceruloplasmin", "E": "Histamine and kinins"}, "answer": "E", "explanation": "Increased permeability lets protein-rich fluid leave vessels; histamine and kinins are important mediators. A: Lipoxins resolve inflammation; NO relaxes smooth muscle. B: TxA2 and PGI2 act mainly on vascular tone and platelets. C: These are antioxidant enzymes. D: These are acute-phase proteins.", "source_slide": "Acute Inflammation doc: Vascular changes"}, {"id": "HEM-PATH-TBL1-74", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Inflammation of draining lymph nodes is called:", "options": {"A": "Lymphangitis", "B": "Lymphedema", "C": "Lymphocytosis", "D": "Lymphadenopathy of fibrosis", "E": "Lymphadenitis"}, "answer": "E", "explanation": "Inflammation of lymphatic vessels is lymphangitis; inflammation of draining lymph nodes is lymphadenitis. Nodes may become enlarged and tender. A: Lymphangitis is inflammation of the lymphatic vessels. B: Lymphedema is lymph accumulation, not inflammation. C: Lymphocytosis is increased blood lymphocytes. D: Not a term used for this.", "source_slide": "Acute Inflammation doc: Vascular changes"}, {"id": "HEM-PATH-TBL1-75", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Leukocytes lining up along the endothelial surface, before rolling, is called:", "options": {"A": "Margination", "B": "Rolling", "C": "Pavementing", "D": "Diapedesis", "E": "Chemotaxis"}, "answer": "C", "explanation": "Leukocytes move toward the wall (margination), line the endothelium (pavementing), roll, adhere firmly, and then cross (transmigration/diapedesis). A: Margination is moving from the central flow toward the wall. B: Rolling follows pavementing. D: Diapedesis is crossing the endothelium. E: Chemotaxis is directed movement along a chemical gradient.", "source_slide": "Acute Inflammation doc: Leukocyte recruitment"}, {"id": "HEM-PATH-TBL1-76", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "P-selectin moves from its storage granules to the cell surface after stimulation by:", "options": {"A": "IL-1 or TNF", "B": "C5a or LTB4", "C": "Histamine or thrombin", "D": "Kallikrein or bradykinin", "E": "IgG or C3b"}, "answer": "C", "explanation": "P-selectin is stored in Weibel–Palade bodies and platelet α-granules and moves to the surface after stimulation by histamine or thrombin. A: IL-1 and TNF promote adhesion-molecule expression in general. B: C5a and LTB4 are chemotactic factors. D: These belong to the kinin system. E: These are opsonins.", "source_slide": "Acute Inflammation doc: Leukocyte recruitment"}, {"id": "HEM-PATH-TBL1-77", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Leukocyte integrins bind which endothelial molecules during firm adhesion?", "options": {"A": "E-selectin and P-selectin", "B": "Sialyl-Lewis X oligosaccharides", "C": "ICAM-1, ICAM-2 and VCAM", "D": "PECAM-1 (CD31) on the endothelium", "E": "Weibel–Palade body proteins"}, "answer": "C", "explanation": "Firm adhesion is mediated by leukocyte integrins (LFA-1, MAC-1, VLA-4) binding endothelial immunoglobulin-family proteins ICAM-1/ICAM-2 and VCAM. A: Selectins mediate rolling. B: Sialyl-Lewis X is the leukocyte ligand of E- and P-selectin. D: PECAM-1 mediates transmigration. E: Weibel–Palade bodies store P-selectin.", "source_slide": "Acute Inflammation doc: Leukocyte recruitment"}, {"id": "HEM-PATH-TBL1-78", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Chemotaxis is best defined as:", "options": {"A": "Random leukocyte movement within the central bloodstream", "B": "Loose leukocyte binding to selectins", "C": "Directed leukocyte movement along a chemical gradient", "D": "Coating of particles to aid phagocytosis", "E": "Passage of leukocytes between endothelial cells"}, "answer": "C", "explanation": "Chemotaxis is directed leukocyte movement along a chemical gradient; neutrophil chemoattractants include bacterial products, C5a, LTB4, HETE and kallikrein. A: Chemotaxis is directed, not random. B: That is rolling. D: That is opsonization. E: That is transmigration.", "source_slide": "Acute Inflammation doc: Chemotaxis"}, {"id": "HEM-PATH-TBL1-79", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which group consists entirely of neutrophil chemoattractants named in the doc?", "options": {"A": "Bacterial products, C5a, LTB4", "B": "C5a, LTC4, kallikrein", "C": "Bacterial products, C3b, HETE", "D": "LTB4, prostacyclin, kallikrein", "E": "HETE, C3a, serotonin"}, "answer": "A", "explanation": "The neutrophil chemoattractants named are bacterial products, C5a, LTB4, HETE and kallikrein. B: LTC4 is a constrictor, not a chemoattractant. C: C3b is an opsonin. D: Prostacyclin is a vasodilator. E: C3a and serotonin are not in the list.", "source_slide": "Acute Inflammation doc: Chemotaxis"}, {"id": "HEM-PATH-TBL1-80", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which is the correct order of events in phagocytosis?", "options": {"A": "Pseudopod engulfment → attachment → phagolysosome → phagosome", "B": "Attachment → phagolysosome → pseudopod engulfment → phagosome", "C": "Phagosome → attachment → pseudopod engulfment → phagolysosome", "D": "Attachment → pseudopod engulfment → phagosome → phagolysosome", "E": "Attachment → phagosome → pseudopod engulfment → phagolysosome"}, "answer": "D", "explanation": "Phagocytosis involves recognition and attachment, engulfment by pseudopodia, formation of a phagosome, fusion with lysosomes into a phagolysosome, then killing and degradation. A: Attachment comes before engulfment. B: The phagolysosome forms last. C: A phagosome cannot form before attachment. E: The phagosome forms from the pseudopod engulfment.", "source_slide": "Acute Inflammation doc: Phagocytosis"}, {"id": "HEM-PATH-TBL1-81", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "How does opsonization help phagocytosis?", "options": {"A": "It lyses the particle before it is engulfed", "B": "It attracts phagocytes toward the particle along a gradient", "C": "It fuses the phagosome with lysosomes", "D": "It coats the particle, improving phagocyte attachment", "E": "It generates reactive oxygen species"}, "answer": "D", "explanation": "Opsonization coats a particle to facilitate phagocytosis, improving phagocyte attachment and uptake; important opsonins are IgG and C3b. A: Lysis is the MAC's role. B: That is chemotaxis. C: Fusion is a later step inside the cell. E: ROS come from NADPH oxidase.", "source_slide": "Acute Inflammation doc: Phagocytosis"}, {"id": "HEM-PATH-TBL1-82", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "During which period do neutrophils predominate in an acute inflammatory focus?", "options": {"A": "The first 24 hours", "B": "The first 2–3 days, then lymphocytes", "C": "After 2–3 days, replacing macrophages", "D": "Throughout chronic inflammation", "E": "Once resolution has begun"}, "answer": "A", "explanation": "Neutrophils predominate during the first 24 hours; after about 2–3 days monocytes/macrophages become more prominent. B: Monocytes/macrophages take over after 2–3 days. C: Neutrophils come before macrophages. D: Chronic inflammation features lymphocytes, plasma cells and macrophages. E: Neutrophils undergo apoptosis in resolution.", "source_slide": "Acute Inflammation doc: Cells"}, {"id": "HEM-PATH-TBL1-83", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "Step1", "stem": "A shepherd drinks raw goat milk and develops prolonged fever. His blood shows increased monocytes. Which group lists infections that cause the same change?", "options": {"A": "Tuberculosis, mumps, rubella, influenza", "B": "Brucellosis, asthma, hay fever, parasites", "C": "Tuberculosis, brucellosis, typhus, salmonellosis", "D": "Typhus, staphylococci, streptococci, salmonellosis", "E": "Salmonellosis, CML, tuberculosis, brucellosis"}, "answer": "C", "explanation": "Monocytosis can occur in tuberculosis, brucellosis (the likely cause here), typhus and salmonellosis. A: Mumps, rubella and influenza are viral, which makes lymphocytes prominent. B: Allergy and parasites make eosinophils prominent. D: Pyogenic bacteria cause neutrophilia. E: CML causes basophilia.", "source_slide": "Acute Inflammation doc: Cells"}, {"id": "HEM-PATH-TBL1-84", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Basophilia may occur in:", "options": {"A": "Parasitic infestation", "B": "Bacterial pneumonia", "C": "Acute viral hepatitis", "D": "Myocardial infarction", "E": "Chronic myeloid leukemia"}, "answer": "E", "explanation": "Mast cells and basophils are histamine sources; basophilia may occur in CML and other myeloproliferative diseases. A: Parasites make eosinophils prominent. B: Bacterial infection causes neutrophilia. C: Viral infections make lymphocytes prominent. D: Infarction causes neutrophilia.", "source_slide": "Acute Inflammation doc: Cells"}, {"id": "HEM-PATH-TBL1-85", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which statement about nitric oxide is correct?", "options": {"A": "It is a platelet product causing arteriolar vasoconstriction", "B": "It is a leukotriene that increases permeability", "C": "It is an antiprotease that blocks elastase", "D": "It is made by NADPH oxidase in neutrophils", "E": "It is endothelial and relaxes vascular smooth muscle"}, "answer": "E", "explanation": "NO is produced by endothelial cells, relaxes vascular smooth muscle, inhibits platelet aggregation and contributes to microbial killing. A: NO is not a platelet product and dilates vessels. B: Leukotrienes are lipoxygenase products. C: α1-antitrypsin blocks elastase. D: NADPH oxidase generates ROS.", "source_slide": "Acute Inflammation doc: Nitric oxide"}, {"id": "HEM-PATH-TBL1-86", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Reactive oxygen species in inflammation are generated through:", "options": {"A": "Cyclooxygenase in platelets", "B": "Superoxide dismutase in hepatocytes", "C": "Lipoxygenase in activated mast cells", "D": "NADPH oxidase in phagocytes", "E": "Phospholipase A2 in endothelium"}, "answer": "D", "explanation": "ROS are generated through the NADPH oxidase pathway in activated neutrophils and macrophages. A: COX makes prostaglandins and thromboxanes. B: SOD is an antioxidant defense, not an ROS source. C: Lipoxygenase makes leukotrienes and lipoxins. E: Phospholipase A2 releases arachidonic acid.", "source_slide": "Acute Inflammation doc: ROS"}, {"id": "HEM-PATH-TBL1-87", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "Which complement product lyses susceptible cells?", "options": {"A": "C5a", "B": "C3b", "C": "C5b–9", "D": "C3a", "E": "C4b"}, "answer": "C", "explanation": "C5b–9 forms the membrane attack complex, which lyses susceptible cells. A: C5a is an anaphylatoxin and chemotactic factor. B: C3b is an opsonin. D: C3a is an anaphylatoxin. E: C4b is not described in the doc.", "source_slide": "Acute Inflammation doc: Complement"}, {"id": "HEM-PATH-TBL1-88", "block": "Hematology", "lecture": "TBL Acute Inflammation", "discipline": "Pathology", "style": "LAU", "stem": "All of the following are acute-phase proteins listed in the doc EXCEPT:", "options": {"A": "Serum amyloid-associated protein", "B": "Prothrombin", "C": "Complement components", "D": "α2-macroglobulin", "E": "Histamine"}, "answer": "E", "explanation": "The liver increases CRP, serum amyloid-associated protein, complement components, fibrinogen, prothrombin, α1-antitrypsin, α2-macroglobulin, ferritin and ceruloplasmin. Histamine is a vasoactive amine. A: SAA protein is listed. B: Prothrombin is listed. C: Complement components are listed. D: α2-macrog
