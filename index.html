Which amino acid is unique in undergoing rapid oxidative deamination by glutamate dehydrogenase, releasing free ammonia?","options":{"A":"Alanine","B":"Aspartate","C":"Glutamate","D":"Glutamine","E":"Lysine"},"answer":"C","explanation":"Most amino groups are funneled to glutamate by transamination, and glutamate is the only amino acid rapidly deaminated oxidatively. A: Alanine gives its amino group to α-KG via ALT. B: Aspartate donates nitrogen at argininosuccinate synthetase in the urea cycle. D: Glutamine is cleaved by glutaminase in the liver. E: Lysine isn't transaminated; it loses its amino group by a different deamination.","source_slide":"L13 Amino Acid Metabolism, slides 22, 28-29"},{"id":"FND-BIO-L13-02","block":"Foundations","lecture":"L13 Amino Acid Metabolism","discipline":"Biochemistry","style":"Step1","stem":"A 19-year-old woman who always disliked meat and milk becomes confused and drowsy after starting a high-protein diet. Ammonia is 240 µmol/L, plasma glutamine is high, citrulline and blood urea are low, urine orotic acid is high, and ALT/AST are normal. Her mother's brother died at 4 days of age. What is the diagnosis?","options":{"A":"CPS I deficiency","B":"OTC deficiency in a female carrier","C":"NAGS deficiency","D":"Argininosuccinate lyase deficiency","E":"Arginase deficiency"},"answer":"B","explanation":"Low citrulline with high orotic acid means carbamoyl phosphate is made but not passed to ornithine and spills into pyrimidine synthesis; X-linked inheritance explains the affected uncle and the mosaic female carrier. A, C: With CPS I or NAGS missing, no carbamoyl phosphate is made, so orotic acid is low. D: The block is after citrulline, so citrulline would be high. E: Arginase acts last, so citrulline and arginine would not be low.","source_slide":"L13 Amino Acid Metabolism, slides 4, 48, 53-54"},{"id":"FND-BIO-L13-03","block":"Foundations","lecture":"L13 Amino Acid Metabolism","discipline":"Biochemistry","style":"LAU","stem":"Why does a protein-rich meal speed up the urea cycle?","options":{"A":"Arginine directly activates CPS I","B":"N-Acetylglutamate activates ornithine transcarbamoylase","C":"Glutamine allosterically activates arginase","D":"Aspartate activates N-acetylglutamate synthase","E":"Glutamate and arginine raise N-acetylglutamate, which activates CPS I"},"answer":"E","explanation":"NAGS makes N-acetylglutamate from acetyl-CoA and glutamate, and arginine activates NAGS; the meal supplies both, and N-acetylglutamate is the essential activator of CPS I, the rate-limiting enzyme. A: Arginine activates NAGS, not CPS I directly. B: N-acetylglutamate acts on CPS I. C: The control point is CPS I, the first step, not arginase. D: Arginine, not aspartate, activates NAGS.","source_slide":"L13 Amino Acid Metabolism, slide 47"},{"id":"FND-BIO-L13-04","block":"Foundations","lecture":"L13 Amino Acid Metabolism","discipline":"Biochemistry","style":"LAU","stem":"Which pair of amino acids is exclusively ketogenic?","options":{"A":"Phenylalanine and tyrosine","B":"Leucine and lysine","C":"Isoleucine and threonine","D":"Alanine and serine","E":"Valine and methionine"},"answer":"B","explanation":"Leucine and lysine are the only exclusively ketogenic amino acids: their carbon skeletons can't make glucose. A, C: These amino acids are glucogenic or both, not exclusively ketogenic. D, E: These yield pyruvate or TCA intermediates, so they are glucogenic.","source_slide":"L13 Amino Acid Metabolism, slides 59-60"},{"id":"FND-BIO-L13-05","block":"Foundations","lecture":"L13 Amino Acid Metabolism","discipline":"Biochemistry","style":"Step1","stem":"A newborn screened on day 1 has a normal phenylalanine level. By 6 months, the infant has a musty urine odor, fair hair and light skin, seizures and developmental delay. Which enzyme is deficient?","options":{"A":"Tyrosinase","B":"Homogentisic acid oxidase","C":"Phenylalanine hydroxylase","D":"Branched-chain α-keto acid dehydrogenase","E":"Cystathionine β-synthase"},"answer":"C","explanation":"Phenylalanine hydroxylase deficiency (PKU): Phe builds up and tyrosine, hence melanin, falls. The early test was falsely normal because the mother cleared fetal Phe through the placenta (test after 24-48 h of protein feeding). A: Tyrosinase deficiency causes albinism without a musty odor or Phe accumulation. B: Homogentisic acid oxidase deficiency causes alkaptonuria (dark urine, arthritis later). D: This enzyme gives maple syrup urine disease. E: This enzyme gives homocystinuria.","source_slide":"L13 Amino Acid Metabolism, slides 64-69"},{"id":"FND-BIO-L13-06","block":"Foundations","lecture":"L13 Amino Acid Metabolism","discipline":"Biochemistry","style":"LAU","stem":"A 14-year-old has displaced lenses, osteoporosis and a deep vein thrombosis. Plasma methionine is high and cysteine is low. Which enzyme is deficient?","options":{"A":"Phenylalanine hydroxylase","B":"Homogentisic acid oxidase","C":"Branched-chain α-keto acid dehydrogenase","D":"Tyrosinase","E":"Cystathionine β-synthase"},"answer":"E","explanation":"Cystathionine β-synthase converts homocysteine to cystathionine (toward cysteine); its loss raises homocysteine and methionine and lowers cysteine. Pyridoxine (B6) helps responsive patients. A: PAH deficiency is PKU. B: Homogentisic acid oxidase is defective in alkaptonuria. C: This enzyme is defective in maple syrup urine disease. D: Tyrosinase deficiency causes albinism.","source_slide":"L13 Amino Acid Metabolism, slides 78-79"},{"id":"FND-BIO-L13-07","block":"Foundations","lecture":"L13 Amino Acid Metabolism","discipline":"Biochemistry","style":"LAU","stem":"A man with recurrent kidney stones excretes cystine, ornithine, arginine and lysine in his urine. Which statement best explains his disease?","options":{"A":"Transporter shared by gut and kidney; ornithine forms stones","B":"Kidney-only transporter; cystine forms stones","C":"Urea cycle enzyme defect; arginine forms stones","D":"Transporter shared by gut and kidney; cystine forms stones","E":"Neutral amino acid transporter defect; tryptophan is lost"},"answer":"D","explanation":"Cystinuria: a defect in the COAL transport system shared by the small intestine and proximal tubule; only cystine is insoluble enough to precipitate. A: Ornithine doesn't precipitate. B: The same transport systems exist in the intestine. C: It's a transport defect, not a urea cycle disorder. E: Neutral amino acid (tryptophan) loss is Hartnup disorder.","source_slide":"L13 Amino Acid Metabolism, slide 17"},{"id":"FND-BIO-L13-08","block":"Foundations","lecture":"L13 Amino Acid Metabolism","discipline":"Biochemistry","style":"LAU","stem":"During prolonged exercise, skeletal muscle sends amino nitrogen to the liver as alanine. What does the liver do with alanine's carbon skeleton?","options":{"A":"Transaminates it to pyruvate and makes glucose","B":"Oxidatively deaminates it to oxaloacetate","C":"Converts it to glutamine for excretion","D":"Converts it to lactate for the Cori cycle","E":"Converts it to acetoacetate"},"answer":"A","explanation":"Glucose–alanine (Cahill) cycle: muscle transaminates pyruvate to alanine; the liver transaminates alanine back to pyruvate (ALT) and uses it for gluconeogenesis, returning glucose to muscle. B: Only glutamate undergoes rapid oxidative deamination. C: Glutamine is the other ammonia carrier, made by glutamine synthetase in most tissues. D: The Cori cycle carries lactate from muscle to liver, not the reverse. E: Alanine is glucogenic; leucine and lysine are the only exclusively ketogenic amino acids.","source_slide":"L13 Amino Acid Metabolism, slides 33–34"},{"id":"FND-BIO-L13-09","block":"Foundations","lecture":"L13 Amino Acid Metabolism","discipline":"Biochemistry","style":"Step1","stem":"A 9-year-old develops a scaly rash on sun-exposed skin, diarrhea and episodes of confusion after a febrile illness. Urine contains increased neutral amino acids. What links his transport defect to the symptoms?","options":{"A":"Cystine precipitates in skin and gut","B":"Phenylalanine accumulation blocks melanin synthesis","C":"Homogentisic acid deposits in connective tissue","D":"Tryptophan loss limits niacin and NAD⁺ synthesis","E":"Branched-chain α-keto acids accumulate"},"answer":"D","explanation":"Hartnup disorder: defective neutral amino acid transport in gut and kidney causes loss of tryptophan, a precursor of niacin (nicotinamide of NAD⁺/NADP⁺), so it mimics pellagra. Treatment: high-protein diet, sun protection, niacin. A: Cystine forms kidney stones in cystinuria. B: PKU causes hypopigmentation, not a pellagra-like picture. C: Homogentisic acid pigments cartilage in alkaptonuria. E: Branched-chain keto acids accumulate in maple syrup urine disease.","source_slide":"L13 Amino Acid Metabolism, slide 18"},{"id":"FND-CS-L01-01","block":"Foundations","lecture":"L01 Introduction to Clinical Skills","discipline":"Clinical Skills","style":"LAU","stem":"According to the lecture, the medical history reveals approximately what share of the information needed for an accurate diagnosis?","options":{"A":"10–20%","B":"20–30%","C":"40–50%","D":"60–80%","E":"Over 90%"},"answer":"D","explanation":"The history reveals 60–80% of the information needed; the studies shown give history 60–76%, examination 12–20%, tests 11–20%. A: Roughly the share from examination or tests. B, C: Too low. E: Too high; examination and tests still add information.","source_slide":"L01 Introduction to Clinical Skills, slides 6–8"},{"id":"FND-CS-L01-02","block":"Foundations","lecture":"L01 Introduction to Clinical Skills","discipline":"Clinical Skills","style":"LAU","stem":"In Beckman's 1984 study, how long did patients usually need to finish their opening statement if not interrupted?","options":{"A":"About 18 seconds","B":"Less than 60 seconds","C":"90–120 seconds","D":"About 150 seconds","E":"More than 3 minutes"},"answer":"B","explanation":"Most patients who weren't interrupted finished in under 60 seconds and none took longer than 150 seconds, so interrupting saves little time and costs information. A: 18 seconds is when doctors interrupted. C: Longer than most needed. D: 150 seconds was the maximum, not the usual. E: No patient took this long.","source_slide":"L01 Introduction to Clinical Skills, slides 55–59"},{"id":"FND-CS-L01-03","block":"Foundations","lecture":"L01 Introduction to Clinical Skills","discipline":"Clinical Skills","style":"LAU","stem":"A doctor types on the computer while asking questions. The patient pauses before answering and shifts in her chair to catch the doctor's attention. Which non-verbal element is missing?","options":{"A":"Touch","B":"Proximity","C":"Vocal cues","D":"Use of time","E":"Eye contact"},"answer":"E","explanation":"Without eye contact, patients give less information, withhold their initial reply until eye contact is given, and use body movement to catch the doctor's gaze. A: Handshake or physical contact. B: Physical distance between communicators. C: Rate, volume, rhythm, intonation. D: Punctuality, being hurried or slow to respond.","source_slide":"L01 Introduction to Clinical Skills, slide 35"},{"id":"FND-CS-L01-04","block":"Foundations","lecture":"L01 Introduction to Clinical Skills","discipline":"Clinical Skills","style":"LAU","stem":"Which is an appropriate way to open the interview after introductions?","options":{"A":"\"You have chest pain, right?\"","B":"\"Do you smoke?\"","C":"\"What would you like to discuss today?\"","D":"\"Is the pain sharp or dull?\"","E":"\"Let's start with your medications.\""},"answer":"C","explanation":"An open question identifies the patient's reasons for coming. A: Leading. B, D: Closed questions too early. E: Doctor's agenda first.","source_slide":"L01 Introduction to Clinical Skills, slide 53"},{"id":"FND-CS-L01-05","block":"Foundations","lecture":"L01 Introduction to Clinical Skills","discipline":"Clinical Skills","style":"LAU","stem":"Which property belongs to non-verbal rather than verbal communication?","options":{"A":"It is discrete, with clear endpoints","B":"It occurs in a single mode at a time","C":"It is mostly under voluntary control","D":"It continues as long as both are present","E":"It carries less weight than verbal cues"},"answer":"D","explanation":"Non-verbal communication is continuous, occurs in several modes at once, and operates at or beyond conscious awareness. A, B, C: Properties of verbal communication. E: Non-verbal wins out over verbal cues.","source_slide":"L01 Introduction to Clinical Skills, slides 33, 45–47"},{"id":"FND-CS-L01-06","block":"Foundations","lecture":"L01 Introduction to Clinical Skills","discipline":"Clinical Skills","style":"LAU","stem":"Diagnostic errors occur in 10–15% of diagnoses. According to the lecture, about 80% of these errors stem from:","options":{"A":"Laboratory test errors","B":"Misread imaging studies","C":"Missed history or examination findings","D":"Delayed specialist referral","E":"Treatment-plan errors"},"answer":"C","explanation":"80% of diagnostic errors are based on information missed in the history or physical examination. A, B: Tests contribute only a minority of diagnostic information. D, E: Not cited as the source of diagnostic error.","source_slide":"L01 Introduction to Clinical Skills, slides 8, 10"},{"id":"FND-CS-L02-01","block":"Foundations","lecture":"L02 The Medical Interview","discipline":"Clinical Skills","style":"LAU","stem":"\"Anyone would find this very difficult.\" Which empathic technique is this?","options":{"A":"Legitimation","B":"Reflection","C":"Partnership","D":"Personal support","E":"Summarization"},"answer":"A","explanation":"Legitimation validates the patient's feelings as understandable. B: Reflection names the emotion (\"I can see this upsets you\"). C: Partnership is \"Let's work together.\" D: Support is \"I want to help.\" E: Summarizing restates content.","source_slide":"L02 The Medical Interview, slides 9–12"},{"id":"FND-CS-L02-02","block":"Foundations","lecture":"L02 The Medical Interview","discipline":"Clinical Skills","style":"LAU","stem":"Which question is a leading question that should be avoided?","options":{"A":"\"Tell me more about the pain.\"","B":"\"Where is the pain?\"","C":"\"Do you have chest pain, cough, or fever?\"","D":"\"How would you rate the pain from 1 to 10?\"","E":"\"You haven't had any urine problems, have you?\""},"answer":"E","explanation":"A leading question suggests the expected answer. A: An open question. B, D: Appropriate focused questions. C: A multiple question, also to be avoided, but it doesn't suggest an answer.","source_slide":"L02 The Medical Interview, slide 20"},{"id":"FND-CS-L02-03","block":"Foundations","lecture":"L02 The Medical Interview","discipline":"Clinical Skills","style":"LAU","stem":"While taking a pain history, the student asks, \"Does the pain interfere with your daily activities or with your sleep?\" Which SOCRATES component is this?","options":{"A":"Timing","B":"Severity","C":"Associations","D":"Character","E":"Exacerbating and relieving factors"},"answer":"B","explanation":"In the lecture's SOCRATES, Severity asks whether the pain interferes with daily activities or sleep. A: Timing is variation in intensity during the day. C: Associations are other accompanying features. D: Character describes the pain (sharp, burning, crushing). E: What makes it better or worse.","source_slide":"L02 The Medical Interview, slides 24–25"},{"id":"FND-CS-L02-04","block":"Foundations","lecture":"L02 The Medical Interview","discipline":"Clinical Skills","style":"LAU","stem":"After obtaining the HPI, the student asks how the illness affects daily life, what the patient thinks is causing it, how they feel, and what they hope for. Which approach is this?","options":{"A":"SOCRATES","B":"LOCATES","C":"FIFE","D":"SOAP","E":"Review of systems"},"answer":"C","explanation":"FIFE: Function, Ideas, Feelings, Expectations. A, B: Characterize symptoms. D: A note format. E: A head-to-toe screen.","source_slide":"L02 The Medical Interview, slide 34"},{"id":"FND-CS-L02-05","block":"Foundations","lecture":"L02 The Medical Interview","discipline":"Clinical Skills","style":"LAU","stem":"Which is a correctly written chief complaint?","options":{"A":"JN, 45-year-old male truck driver, with three weeks of \"bad back pains.\"","B":"JN, 45-year-old man with three weeks of acute lumbar radiculopathy.","C":"Back pain for three weeks.","D":"JN, 45, sharp back pain since lifting, worse in the morning, 6/10.","E":"JN, 45-year-old smoker with hypertension and back pain."},"answer":"A","explanation":"The chief complaint is a one-liner in the patient's own words with age, sex, occupation, problem and duration. B: Uses medical jargon. C: Missing age, sex and occupation. D: Characterizing the pain belongs in the HPI. E: Habits and chronic problems belong in social and past medical history; no duration.","source_slide":"L02 The Medical Interview, slides 22–25"},{"id":"FND-CS-L02-06","block":"Foundations","lecture":"L02 The Medical Interview","discipline":"Clinical Skills","style":"LAU","stem":"During the review of systems, a patient with abdominal pain reports nausea, which is relevant to the present illness. Where should it be recorded?","options":{"A":"In the review of systems only","B":"In both the HPI and the review of systems","C":"In the HPI, not repeated in the review of systems","D":"In the past medical history","E":"In the chief complaint"},"answer":"C","explanation":"Symptoms relevant to the HPI go in the HPI and are not repeated in the review of systems. A: The ROS screens for symptoms not otherwise elicited. B: The slide says not to repeat HPI information. D: For major past health events. E: A one-line reason for the visit.","source_slide":"L02 The Medical Interview, slides 49, 72"},{"id":"FND-CS-L02-07","block":"Foundations","lecture":"L02 The Medical Interview","discipline":"Clinical Skills","style":"LAU","stem":"Using the lecture's definitions, how is a woman with 3 pregnancies and 2 live births recorded?","options":{"A":"G2P3","B":"G3P2","C":"G3P3","D":"G2P2","E":"G5P2"},"answer":"B","explanation":"G (gravida) = number of pregnancies = 3; P (para) = live births = 2. A: Reverses G and P. C: P counts live births, not pregnancies. D: G counts all pregnancies. E: G is not pregnancies plus births.","source_slide":"L02 The Medical Interview, slide 42"},{"id":"FND-GEN-L01-01","block":"Foundations","lecture":"L01 The Human Genome","discipline":"Genetics","style":"LAU","stem":"A DNA sample is 30% adenine. What percentage is guanine?","options":{"A":"30%","B":"40%","C":"20%","D":"35%","E":"15%"},"answer":"C","explanation":"Chargaff: A = T = 30%, so G + C = 40% and G = 20%. A: 30% is thymine. B: 40% is G + C combined. D: 35% splits the remaining 70% without subtracting thymine. E: Halves the correct value.","source_slide":"L01 The Human Genome, slide 11"},{"id":"FND-GEN-L01-02","block":"Foundations","lecture":"L01 The Human Genome","discipline":"Genetics","style":"LAU","stem":"Five double-stranded DNA fragments of equal length differ only in base composition. Which needs the most heat to denature?","options":{"A":"40% adenine","B":"15% adenine","C":"30% thymine","D":"20% guanine","E":"25% cytosine"},"answer":"B","explanation":"By Chargaff's rule, 15% A means 30% A–T and 70% G–C, the highest; G–C pairs have 3 hydrogen bonds versus 2 for A–T. A: 80% A–T, so only 20% G–C. C: 60% A–T, so 40% G–C. D: 40% G–C. E: 50% G–C.","source_slide":"L01 The Human Genome, slides 11, 23"},{"id":"FND-GEN-L01-03","block":"Foundations","lecture":"L01 The Human Genome","discipline":"Genetics","style":"LAU","stem":"Which feature is true of the mitochondrial genome but not of the nuclear genome?","options":{"A":"Linear chromosomes wrapped around histones","B":"More than 90% of the sequence is noncoding","C":"Lower mutation rate than the other genome","D":"Some codons don't follow the universal code","E":"Double-stranded DNA with antiparallel strands"},"answer":"D","explanation":"Per the comparison slide, some mitochondrial codons deviate from the universal code. A: mtDNA is circular; nuclear DNA is linear. B: Only ~3% of mtDNA is noncoding; >90% describes nuclear DNA. C: mtDNA has a higher mutation rate. E: Both genomes are double-stranded.","source_slide":"L01 The Human Genome, slide 34"},{"id":"FND-GEN-L01-04","block":"Foundations","lecture":"L01 The Human Genome","discipline":"Genetics","style":"LAU","stem":"A drug inhibits histone deacetylases. What is the expected effect on chromatin near target genes?","options":{"A":"Chromatin stays acetylated and open, increasing transcription","B":"Chromatin condenses and transcription falls","C":"Histone tails keep a stronger positive charge","D":"DNA becomes methylated","E":"Nucleosomes are lost entirely"},"answer":"A","explanation":"Acetylation neutralizes histone tails, loosening chromatin; blocking deacetylation keeps genes active. B: That's the effect of deacetylation. C: Acetylation removes positive charge. D: HDAC inhibition doesn't directly methylate DNA. E: Nucleosomes remain.","source_slide":"L01 The Human Genome, slide 42"},{"id":"FND-GEN-L01-05","block":"Foundations","lecture":"L01 The Human Genome","discipline":"Genetics","style":"LAU","stem":"At one level of compaction, DNA is about 50 times shorter than its extended form, with about 6 nucleosomes per turn. Which level is this?","options":{"A":"Nucleosome","B":"Loops (~300 nm)","C":"Euchromatin","D":"Histone octamer core","E":"Solenoid (30-nm fiber)"},"answer":"E","explanation":"The 2nd level, the 30-nm solenoid, shortens DNA ~50-fold with 6 nucleosomes per turn. A: Nucleosomes (1st level) shorten DNA ~7-fold. B: Loops are the 3rd level, formed by supercoiling the solenoid. C: Euchromatin is the decondensed, transcriptionally active state. D: The octamer is the protein core DNA wraps around in a nucleosome.","source_slide":"L01 The Human Genome, slides 36–38"},{"id":"FND-GEN-L01-06","block":"Foundations","lecture":"L01 The Human Genome","discipline":"Genetics","style":"LAU","stem":"Whose X-ray diffraction image (Photo 51) confirmed the helical structure that Watson and Crick had only theorized?","options":{"A":"Rosalind Franklin","B":"Maurice Wilkins","C":"Miriam Stimson","D":"Erwin Chargaff","E":"Phoebus Levene"},"answer":"A","explanation":"Franklin's Photo 51 revealed the helical structure. B: Wilkins, her colleague, showed her work to Watson and Crick and shared the 1962 Nobel Prize. C: Stimson showed the bases lie inside the molecule. D: Chargaff described the base-pairing ratios. E: Levene proposed the incorrect tetranucleotide model.","source_slide":"L01 The Human Genome, slides 10–14"},{"id":"FND-GEN-L01-07","block":"Foundations","lecture":"L01 The Human Genome","discipline":"Genetics","style":"LAU","stem":"A molecule consists of deoxyribose bonded to adenine, with no phosphate group. What is it?","options":{"A":"A purine nucleotide","B":"A purine nucleoside","C":"A pyrimidine nucleoside","D":"A pyrimidine nucleotide","E":"A free nitrogenous base"},"answer":"B","explanation":"Sugar + base = nucleoside, and adenine is a purine. A: A nucleotide also needs a phosphate. C: Adenine is a purine, not a pyrimidine. D: Wrong base class, and there is no phosphate. E: A free base has no sugar.","source_slide":"L01 The Human Genome, slides 20–21"},{"id":"FND-GEN-L02-01","block":"Foundations","lecture":"L02 Basic Concepts of Inheritance","discipline":"Genetics","style":"LAU","stem":"Humans have about 20,000 genes but more than 160,000 proteins. What mainly explains this?","options":{"A":"Pseudogenes","B":"Alternative splicing","C":"Gene families","D":"Housekeeping genes","E":"Retrotransposition of SINEs and LINEs"},"answer":"B","explanation":"Alternative splicing produces several proteins from one gene. A: Pseudogenes don't make functional proteins. C: Gene families are separate genes. D: Housekeeping genes are a category, not a mechanism. E: These are repetitive elements, not a way one gene yields several proteins.","source_slide":"L02 Basic Concepts of Inheritance, slide 18"},{"id":"FND-GEN-L02-02","block":"Foundations","lecture":"L02 Basic Concepts of Inheritance","discipline":"Genetics","style":"LAU","stem":"A sequence resembles an active gene but lacks introns and a promoter and ends in a poly(A) stretch. What is it?","options":{"A":"Nonprocessed pseudogene","B":"Housekeeping gene","C":"Microsatellite","D":"Long noncoding RNA gene","E":"Processed pseudogene"},"answer":"E","explanation":"Processed pseudogenes arise by retrotransposition of mRNA, so they lack introns and promoters. A: Nonprocessed pseudogenes keep introns. B: Housekeeping genes are functional. C: Microsatellites are short tandem repeats. D: lncRNA genes are transcribed from promoters.","source_slide":"L02 Basic Concepts of Inheritance, slide 23"},{"id":"FND-GEN-L02-03","block":"Foundations","lecture":"L02 Basic Concepts of Inheritance","discipline":"Genetics","style":"LAU","stem":"A forensic lab compares DNA from a crime scene with suspects. Which markers vary most usefully between individuals?","options":{"A":"Short tandem repeats (microsatellites)","B":"Centromeric alpha-satellite DNA","C":"SINEs","D":"Housekeeping gene exons","E":"Telomeric TTAGGG repeats"},"answer":"A","explanation":"STR repeat number varies among people, enabling human identification. B: Centromeric repeats aren't used for routine identification. C: SINEs are interspersed retrotransposed elements, not the identification markers. D: Housekeeping exons are highly conserved. E: Telomere sequence is identical across people.","source_slide":"L02 Basic Concepts of Inheritance, slides 45–46"},{"id":"FND-GEN-L02-04","block":"Foundations","lecture":"L02 Basic Concepts of Inheritance","discipline":"Genetics","style":"LAU","stem":"Which RNA acts as the peptidyl transferase during translation and makes up ~80% of cellular RNA?","options":{"A":"mRNA","B":"tRNA","C":"snRNA","D":"rRNA","E":"miRNA"},"answer":"D","explanation":"rRNA is the catalytic and structural core of ribosomes. A: mRNA is ~3–7% of RNA. B: tRNA is ~10–15%. C: snRNA functions in splicing. E: miRNA regulates gene expression.","source_slide":"L02 Basic Concepts of Inheritance, slide 27"},{"id":"FND-GEN-L02-05","block":"Foundations","lecture":"L02 Basic Concepts of Inheritance","discipline":"Genetics","style":"LAU","stem":"A regulatory RNA of 22 nucleotides reduces protein production from a target gene. What is its mechanism?","options":{"A":"Binding complementary mRNA, which RISC then degrades or blocks","B":"Methylating CpG islands in the target promoter","C":"Guiding splicing of the target pre-mRNA","D":"Remodeling chromatin as a capped, polyadenylated transcript","E":"Acting as a peptidyl transferase on the ribosome"},"answer":"A","explanation":"miRNAs (18–25 nt) act by RNA interference: they bind complementary mRNA, and the RISC complex suppresses translation and promotes degradation. B: Promoter methylation isn't an miRNA function. C: Splicing involves snRNAs. D: That describes lncRNAs (>200 nt). E: Peptidyl transferase activity belongs to rRNA.","source_slide":"L02 Basic Concepts of Inheritance, slides 31–33"},{"id":"FND-GEN-L02-06","block":"Foundations","lecture":"L02 Basic Concepts of Inheritance","discipline":"Genetics","style":"Step1","stem":"Normal fibroblasts stop dividing after a limited number of divisions, but a cancer cell line divides indefinitely while keeping its chromosome ends stable. Which enzyme activity is most likely increased?","options":{"A":"DNA ligase","B":"Topoisomerase","C":"Telomerase","D":"Primase","E":"RNase H"},"answer":"C","explanation":"Telomerase adds TTAGGG repeats to chromosome ends; its activity is abundant in cancer and insufficient in aging. A: Ligase joins DNA fragments. B: Topoisomerase relieves supercoiling. D: Primase makes RNA primers. E: RNase H removes primers.","source_slide":"L02 Basic Concepts of Inheritance, slides 42–44"},{"id":"FND-GEN-L02-07","block":"Foundations","lecture":"L02 Basic Concepts of Inheritance","discipline":"Genetics","style":"LAU","stem":"A tandem repeat array consists of a 30-bp unit repeated about 100 times (3 kb). How is it classified?","options":{"A":"Microsatellite (STR)","B":"SINE","C":"LINE","D":"Minisatellite (VNTR)","E":"Telomeric repeat"},"answer":"D","explanation":"Minisatellites (VNTRs) have 10–100-bp units in 0.5–30-kb arrays. A: STRs have 2–5-bp units. B: SINEs are interspersed retrotransposed elements <500 bp, not tandem arrays. C: LINEs are ~6-kb interspersed elements. E: Telomeres are 6-bp TTAGGG repeats at chromosome ends.","source_slide":"L02 Basic Concepts of Inheritance, slide 45"},{"id":"FND-GEN-L02-08","block":"Foundations","lecture":"L02 Basic Concepts of Inheritance","discipline":"Genetics","style":"LAU","stem":"In C0t analysis, denatured genomic DNA is allowed to reanneal. Which fraction renatures at the lowest C0t values?","options":{"A":"Single-copy genes","B":"Satellite DNA of centromeres","C":"SINEs and LINEs","D":"Housekeeping genes","E":"Processed pseudogenes"},"answer":"B","explanation":"Reassociation rate is proportional to copy number, so highly repetitive satellite DNA renatures first (C0t <10⁻²). A: Unique sequences renature last (C0t 10–10⁴). C: Moderately repetitive DNA renatures at intermediate C0t (10⁻²–10). D: Mostly single-copy genes. E: Mostly single copies too.","source_slide":"L02 Basic Concepts of Inheritance, slides 38–39"},{"id":"FND-GEN-L03-01","block":"Foundations","lecture":"L03 Replication, Transcription and Translation","discipline":"Genetics","style":"LAU","stem":"Why is the lagging strand synthesized discontinuously?","options":{"A":"DNA polymerase synthesizes only in the 5′→3′ direction","B":"Helicase unwinds only the lagging-strand template","C":"Primase can prime only the leading strand","D":"DNA polymerase reads the template only 5′→3′","E":"Ligase must seal each fragment before the next begins"},"answer":"A","explanation":"Polymerase adds nucleotides only to a 3′ end (synthesis 5′→3′), so the strand oriented against fork movement is made in Okazaki fragments. B: Helicase unwinds both strands. C: Every new strand needs a primer. D: Polymerase reads the template 3′→5′. E: Ligase joins the fragments afterward.","source_slide":"L03 Replication, Transcription and Translation, slides 6–7"},{"id":"FND-GEN-L03-02","block":"Foundations","lecture":"L03 Replication, Transcription and Translation","discipline":"Genetics","style":"LAU","stem":"In which order are RNA primers handled at the end of DNA replication?","options":{"A":"Ligase → RNase H → DNA polymerase I","B":"RNase H → DNA polymerase I → ligase","C":"Primase → DNA polymerase III → ligase","D":"RNase H → DNA polymerase III → topoisomerase","E":"DNA polymerase I → RNase H → ligase"},"answer":"B","explanation":"Per the lecture: RNase H removes the primers, DNA polymerase I fills the gaps, DNA ligase seals the nicks. A: Nicks can't be sealed before primers are replaced. C: Primase makes primers; it doesn't remove them. D: Topoisomerase relieves supercoiling; it doesn't seal nicks. E: Primers must be removed before pol I fills the gap.","source_slide":"L03 Replication, Transcription and Translation, slide 8"},{"id":"FND-GEN-L03-03","block":"Foundations","lecture":"L03 Replication, Transcription and Translation","discipline":"Genetics","style":"LAU","stem":"A template DNA strand reads 3′-TACGGA-5′. What is the mRNA sequence?","options":{"A":"5′-TACGGA-3′","B":"5′-UCCGUA-3′","C":"5′-ATGCCT-3′","D":"5′-AUGCCU-3′","E":"3′-AUGCCU-5′"},"answer":"D","explanation":"RNA is complementary to the template and antiparallel, matching the coding strand (5′-ATGCCT-3′) with U for T. A: That's the template itself. B: Reversed. C: Uses T, so it's DNA. E: Wrong orientation.","source_slide":"L03 Replication, Transcription and Translation, slides 14–15, 18"},{"id":"FND-GEN-L03-04","block":"Foundations","lecture":"L03 Replication, Transcription and Translation","discipline":"Genetics","style":"LAU","stem":"A mutation changes the intron's first two nucleotides from GU to AU. What is the most likely consequence?","options":{"A":"Loss of the 5′ cap","B":"Loss of the polyadenylation signal","C":"Abnormal splicing at the donor site","D":"Premature stop codon in the exon","E":"Loss of the Kozak sequence"},"answer":"C","explanation":"GU marks the 5′ (donor) splice site; altering it disrupts splicing (exon skipping or intron retention). A: Capping is independent of splice sites. B: AAUAAA is the poly(A) signal. D: Not a coding change. E: Kozak surrounds the start codon.","source_slide":"L03 Replication, Transcription and Translation, slide 24"},{"id":"FND-GEN-L03-05","block":"Foundations","lecture":"L03 Replication, Transcription and Translation","discipline":"Genetics","style":"LAU","stem":"Which enzyme ensures each tRNA carries the correct amino acid?","options":{"A":"Peptidyl transferase","B":"Aminoacyl-tRNA synthetase","C":"RNA polymerase III","D":"Release factor","E":"Poly(A) polymerase"},"answer":"B","explanation":"Aminoacyl-tRNA synthetases attach each amino acid to its tRNA. A: Peptidyl transferase forms peptide bonds. C: RNA pol III transcribes tRNA genes. D: Release factors end translation. E: Poly(A) polymerase adds the tail.","source_slide":"L03 Replication, Transcription and Translation, slide 32"},{"id":"FND-GEN-L03-06","block":"Foundations","lecture":"L03 Replication, Transcription and Translation","discipline":"Genetics","style":"LAU","stem":"During elongation, where does an incoming aminoacyl-tRNA bind?","options":{"A":"P site","B":"E site","C":"A site","D":"Small subunit cap-binding site","E":"Kozak sequence"},"answer":"C","explanation":"New aminoacyl-tRNAs enter the A site; the growing chain sits in the P site; empty tRNAs exit from the E site. A: P holds the peptidyl-tRNA. B: E is the exit. D: Cap binding happens at initiation. E: Kozak is an mRNA sequence.","source_slide":"L03 Replication, Transcription and Translation, slide 36"},{"id":"FND-GEN-L03-07","block":"Foundations","lecture":"L03 Replication, Transcription and Translation","discipline":"Genetics","style":"Step1","stem":"A mutation in the AAUAAA sequence of a gene's 3′ region would most directly impair which step?","options":{"A":"5′ capping","B":"Splicing at branch-point A","C":"Translation initiation at AUG","D":"Transcription initiation at the TATA box","E":"Cleavage and polyadenylation of the pre-mRNA"},"answer":"E","explanation":"AAUAAA signals the endonuclease to cleave and poly(A) polymerase to add the tail. A: Capping is at the 5′ end. B: Branch points are within introns. C: AUG is the start codon. D: TATA is in the promoter.","source_slide":"L03 Replication, Transcription and Translation, slides 18, 23"},{"id":"FND-GEN-L03-08","block":"Foundations","lecture":"L03 Replication, Transcription and Translation","discipline":"Genetics","style":"LAU","stem":"A point variant changes the codon UGG (Trp) to UGA. What happens when the ribosome reaches this codon?","options":{"A":"A release factor recognizes it and the chain is released","B":"A tRNA reads UGA as tryptophan by wobble pairing","C":"The ribosome skips the codon and continues","D":"A different amino acid is inserted","E":"Translation continues to the normal stop codon"},"answer":"A","explanation":"UGA is a stop codon (with UAA and UAG); release factors recognize it, water is added instead of a peptide bond, and a truncated protein is released. B: Wobble lets a tRNA read synonymous sense codons; no tRNA reads stop codons. C: Stop codons end translation; they aren't skipped. D: Stop codons don't encode amino acids. E: Translation ends at the new stop codon.","source_slide":"L03 Replication, Transcription and Translation, slides 31, 37"},{"id":"FND-GEN-L03-09","block":"Foundations","lecture":"L03 Replication, Transcription and Translation","discipline":"Genetics","style":"LAU","stem":"During DNA replication, the error rate falls from about 1 in 10⁴ to about 1 in 10⁸ nucleotides. Which activity is mainly responsible during replication?","options":{"A":"Primer removal by RNase H","B":"Gap filling by DNA polymerase I","C":"Nick sealing by DNA ligase","D":"Proofreading by DNA polymerase III","E":"Unwinding by helicase"},"answer":"D","explanation":"Per the lecture, DNA polymerase III proofreads during replication, and pol II corrects remaining errors at the end. A: RNase H removes RNA primers. B: Pol I fills gaps left by primers. C: Ligase seals nicks. E: Helicase breaks hydrogen bonds to open the fork.","source_slide":"L03 Replication, Transcription and Translation, slide 9"},{"id":"FND-GEN-L04-01","block":"Foundations","lecture":"L04 Genetic Variability and Disease","discipline":"Genetics","style":"LAU","stem":"The variant c.621C>A changes codon UAC (Tyr) to UAA. What type of variant is this?","options":{"A":"Synonymous","B":"Frameshift","C":"Missense","D":"Nonsense","E":"Splice-site"},"answer":"D","explanation":"UAA is a stop codon, so translation ends early (p.Tyr207X). The slide writes this as c.621U>A; in c. notation DNA bases are used and the changed base is C. A: Synonymous keeps the same amino acid. B: Frameshift needs an indel not divisible by 3. C: Missense substitutes a different amino acid. E: The change is within a codon, not a splice site.","source_slide":"L04 Genetic Variability and Disease, slide 16"},{"id":"FND-GEN-L04-02","block":"Foundations","lecture":"L04 Genetic Variability and Disease","discipline":"Genetics","style":"LAU","stem":"A report reads c.16_17delAG (p.Ser6ProfsX2). Which best describes this variant?","options":{"A":"Frameshift deletion with a premature stop","B":"In-frame deletion of serine 6","C":"Nonsense substitution at codon 6","D":"Missense change Ser6Pro only","E":"Synonymous change"},"answer":"A","explanation":"Deleting 2 nt shifts the reading frame; 'fs' means frameshift and 'X2' means the stop is at position 2 of the shifted frame (Pro6 = 1, stop at codon 7). B: In-frame deletions remove a multiple of 3 nt. C: Nonsense is a single-base substitution creating a stop. D: Pro6 is only the first changed residue; the frame stays shifted after it. E: The protein is altered.","source_slide":"L04 Genetic Variability and Disease, slides 12, 24"},{"id":"FND-GEN-L04-03","block":"Foundations","lecture":"L04 Genetic Variability and Disease","discipline":"Genetics","style":"LAU","stem":"In the variant c.133C>T (p.Arg45Trp), what do the prefixes c. and p. indicate?","options":{"A":"c. = chromosome; p. = short arm","B":"c. = coding DNA numbering; p. = protein level","C":"c. = codon number; p. = polypeptide length","D":"c. = cytosine change; p. = promoter","E":"c. = genomic numbering; p. = pathogenic"},"answer":"B","explanation":"c. numbers the coding DNA (cDNA) sequence and p. gives the protein change. A: Here p. is the protein level, not the short chromosome arm. C: 133 is a nucleotide position; the codon number (45) is in the p. part. D: C>T shows the base change; prefixes give the reference type. E: Genomic numbering uses g.; pathogenicity isn't part of the name.","source_slide":"L04 Genetic Variability and Disease, slides 11–12, 42"},{"id":"FND-GEN-L04-04","block":"Foundations","lecture":"L04 Genetic Variability and Disease","discipline":"Genetics","style":"LAU","stem":"A variant is found in 8% of the general population. How is it best described?","options":{"A":"A pathogenic mutation","B":"A de novo variant","C":"A variant of uncertain significance by definition","D":"A somatic mutation","E":"A polymorphism, likely benign"},"answer":"E","explanation":"A variant in ≥1% of the population is a polymorphism and is more likely benign. A: Common variants are rarely pathogenic for rare disease. B: Frequency doesn't define de novo status. C: VUS is a classification, not set by frequency. D: Somatic status is unrelated.","source_slide":"L04 Genetic Variability and Disease, slides 31–32"},{"id":"FND-GEN-L04-05","block":"Foundations","lecture":"L04 Genetic Variability and Disease","discipline":"Genetics","style":"Step1","stem":"A woman with AD osteogenesis imperfecta carries a glycine substitution in one COL1A1 allele. The abnormal chains are incorporated into triple helices and disrupt them. What mechanism is this?","options":{"A":"Haploinsufficiency","B":"Gain of novel function","C":"Dominant negative","D":"Imprinting","E":"Loss of heterozygosity"},"answer":"C","explanation":"The mutant protein interferes with the normal protein in the multimer. A: Haploinsufficiency is reduced quantity, not interference. B: No novel function is gained. D: Imprinting is parent-of-origin silencing. E: LOH applies to tumor suppressors.","source_slide":"L04 Genetic Variability and Disease, slide 37; L06 reading p2"},{"id":"FND-GEN-L04-06","block":"Foundations","lecture":"L04 Genetic Variability and Disease","discipline":"Genetics","style":"LAU","stem":"How many disease-causing variants does a typical individual exome contain?","options":{"A":"About 20,000","B":"About 9,000","C":"About 1,000","D":"About 200","E":"About 1–2"},"answer":"E","explanation":"Of ~20,000 exome variants, only ~1–2 are disease-causing. A: Total variants. B: Non-synonymous. C: Rare variants. D: Homozygous rare variants.","source_slide":"L04 Genetic Variability and Disease, slide 36"},{"id":"FND-GEN-L04-07","block":"Foundations","lecture":"L04 Genetic Variability and Disease","discipline":"Genetics","style":"LAU","stem":"A rare missense variant is found in a gene that fits the patient's phenotype, but the evidence is insufficient to call it either benign or pathogenic. How is it classified?","options":{"A":"Likely benign","B":"Polymorphism","C":"Variant of uncertain significance","D":"Likely pathogenic","E":"Pathogenic"},"answer":"C","explanation":"A VUS is the middle ACMG category, used when evidence is insufficient either way. A: Likely benign requires evidence favoring benign. B: A polymorphism is defined by frequency ≥1%; this variant is rare. D: Likely pathogenic requires evidence favoring pathogenicity. E: Pathogenic requires strong evidence.","source_slide":"L04 Genetic Variability and Disease, slide 34"},{"id":"FND-GEN-L05-01","block":"Foundations","lecture":"L05 Recombination and Structural Variants","discipline":"Genetics","style":"LAU","stem":"Non-allelic homologous recombination between segmental duplications in opposite orientation on the same chromosome produces:","options":{"A":"A deletion","B":"A duplication","C":"An inversion","D":"A translocation","E":"A point mutation"},"answer":"C","explanation":"Inverted repeats recombine to flip the intervening segment. A, B: Direct repeats yield deletions or duplications. D: SDs on different chromosomes yield translocations. E: NAHR causes structural, not point, changes.","source_slide":"L05 Recombination and Structural Variants, slide 17"},{"id":"FND-GEN-L05-02","block":"Foundations","lecture":"L05 Recombination and Structural Variants","discipline":"Genetics","style":"Step1","stem":"A 20-year-old has slowly progressive distal leg weakness; nerve conduction studies show a demyelinating neuropathy, and he is diagnosed with Charcot-Marie-Tooth type 1A. Which genetic change is most likely?","options":{"A":"1.5-Mb deletion on chromosome 17 including PMP22","B":"1.5-Mb duplication on chromosome 17 including PMP22","C":"Balanced translocation disrupting PMP22","D":"Inversion of the PMP22 region","E":"Chromothripsis of chromosome 17"},"answer":"B","explanation":"Most CMT1A is a 1.5-Mb chr17 duplication including PMP22, produced by NAHR between flanking segmental duplications. A: A single PMP22 copy causes HNPP. C: The classic mechanism changes PMP22 dosage; a translocation doesn't. D: Inversions don't change dosage. E: Chromothripsis is a complex multi-rearrangement event, not the usual cause.","source_slide":"L05 Recombination and Structural Variants, slide 18"},{"id":"FND-GEN-L05-03","block":"Foundations","lecture":"L05 Recombination and Structural Variants","discipline":"Genetics","style":"LAU","stem":"Which abnormality would a chromosomal microarray (array-CGH) detect?","options":{"A":"A balanced reciprocal translocation","B":"A pericentric inversion","C":"A single-nucleotide substitution","D":"A 200-kb deletion","E":"A 3-bp in-frame deletion"},"answer":"D","explanation":"Microarrays detect copy-number changes larger than ~1 kb. A: A balanced translocation has no gain or loss. B: An inversion is balanced too. C: Far below ~1-kb resolution; sequencing is needed. E: Also below the resolution.","source_slide":"L05 Recombination and Structural Variants, slides 12, 26"},{"id":"FND-GEN-L05-04","block":"Foundations","lecture":"L05 Recombination and Structural Variants","discipline":"Genetics","style":"LAU","stem":"Which abnormality is most likely to be missed by a standard karyotype?","options":{"A":"Trisomy 21","B":"A large reciprocal translocation","C":"A large pericentric inversion","D":"A ring chromosome","E":"A 1-Mb deletion"},"answer":"E","explanation":"Standard karyotyping resolves only changes >5 Mb; a 1-Mb deletion needs a microarray (>1 kb resolution). A: A whole extra chromosome is visible. B: Large translocations are visible. C: Large inversions are visible. D: Ring chromosomes are visible.","source_slide":"L05 Recombination and Structural Variants, slide 26"},{"id":"FND-GEN-L05-05","block":"Foundations","lecture":"L05 Recombination and Structural Variants","discipline":"Genetics","style":"LAU","stem":"Exome sequencing is done for a child with a rare disease. Which variant is most likely removed at the first filtering step?","options":{"A":"A rare frameshift variant (MAF 0.01%)","B":"A missense variant with MAF 15%","C":"A novel nonsense variant","D":"A rare homozygous missense variant in a known disease gene","E":"A rare splice-site variant"},"answer":"B","explanation":"The first filter removes common variants (minor allele frequency >1%), which are unlikely to cause a rare disease. A: Rare and predicted damaging, so kept. C: Novel and truncating, so kept. D: Rare and in a disease gene, so kept. E: Rare and predicted damaging, so kept.","source_slide":"L05 Recombination and Structural Variants, slide 31"},{"id":"FND-GEN-L05-06","block":"Foundations","lecture":"L05 Recombination and Structural Variants","discipline":"Genetics","style":"LAU","stem":"Which DNA repair pathway joins double-strand break ends with little or no homology, often leaving small insertions or deletions?","options":{"A":"Non-homologous end joining","B":"Non-allelic homologous recombination","C":"Fork stalling and template switching","D":"Serial replication slippage","E":"Crossing-over between homologs"},"answer":"A","explanation":"NHEJ fuses double-strand break ends with little or no homology, especially in G0/G1, leaving insertions or deletions at the junction. B: NAHR needs highly identical segmental duplications. C: FoSTeS is a replication error, not break repair. D: Serial replication slippage is also replication-based. E: Crossing-over is normal meiotic exchange between non-sister chromatids.","source_slide":"L05 Recombination and Structural Variants, slide 19"},{"id":"FND-GEN-L05-07","block":"Foundations","lecture":"L05 Recombination and Structural Variants","discipline":"Genetics","style":"LAU","stem":"Two 15-kb regions on the same chromosome share 97% sequence identity. How are they best classified?","options":{"A":"Segmental duplications (LCRs)","B":"Microsatellites","C":"SINEs","D":"Minisatellites","E":"LINEs"},"answer":"A","explanation":"SDs/LCRs are regions ≥1 kb present in more than one copy with ≥90% identity; they mediate NAHR. B: STRs have 2–5-bp repeat units. C: SINEs are <500 bp. D: VNTR units are 10–100 bp. E: LINEs are ~6 kb interspersed retrotransposons.","source_slide":"L05 Recombination and Structural Variants, slide 13"},{"id":"FND-GEN-L06-01","block":"Foundations","lecture":"L06 Mendelian Patterns and Inheritance","discipline":"Genetics","style":"LAU","stem":"A pedigree shows affected individuals in every generation, both sexes affected, and an affected father with an affected son. What is the most likely inheritance?","options":{"A":"X-linked recessive","B":"X-linked dominant","C":"Autosomal recessive","D":"Autosomal dominant","E":"Mitochondrial"},"answer":"D","explanation":"Vertical transmission with male-to-male transmission indicates AD. A, B: X-linked inheritance never shows male-to-male transmission. C: AR is horizontal (siblings). E: Mitochondrial disease isn't passed by fathers.","source_slide":"L06 Mendelian Patterns and Inheritance, reading p1"},{"id":"FND-GEN-L06-02","block":"Foundations","lecture":"L06 Mendelian Patterns and Inheritance","discipline":"Genetics","style":"LAU","stem":"Two unaffected parents have a child with cystic fibrosis. What is the chance their next child will be an unaffected carrier?","options":{"A":"50%","B":"25%","C":"75%","D":"2/3","E":"100%"},"answer":"A","explanation":"Each child: 25% affected, 50% carrier, 25% non-carrier. B: 25% is the risk of being affected. C: 75% is the chance of being unaffected. D: 2/3 is the carrier probability for an already unaffected sibling. E: Not all children are carriers.","source_slide":"L06 Mendelian Patterns and Inheritance, reading p3"},{"id":"FND-GEN-L06-03","block":"Foundations","lecture":"L06 Mendelian Patterns and Inheritance","discipline":"Genetics","style":"LAU","stem":"A man with Marfan syndrome has an unaffected daughter whose son has Marfan syndrome. What explains the daughter's status?","options":{"A":"Variable expressivity","B":"Germline mosaicism","C":"Anticipation","D":"Pleiotropy","E":"Incomplete penetrance"},"answer":"E","explanation":"She carries the mutation but shows no phenotype: non-penetrance. A: Variable expressivity is differing severity in affected carriers. B: Mosaicism would involve her father's gonads. C: Anticipation is worsening over generations from repeat expansion. D: Pleiotropy is multiple effects of one gene.","source_slide":"L06 Mendelian Patterns and Inheritance, reading p2"},{"id":"FND-GEN-L06-04","block":"Foundations","lecture":"L06 Mendelian Patterns and Inheritance","discipline":"Genetics","style":"LAU","stem":"A man with hemophilia A and a non-carrier woman have children. What is the risk to their sons and daughters?","options":{"A":"All sons affected; daughters unaffected","B":"50% of sons affected; 50% of daughters carriers","C":"No sons affected; all daughters carriers","D":"All children carriers","E":"All daughters affected"},"answer":"C","explanation":"An affected male gives his X to all daughters (carriers) and his Y to all sons. A: Sons get his Y. B: That's the pattern for a carrier mother. D: Sons aren't carriers. E: Daughters are heterozygous carriers, usually unaffected.","source_slide":"L06 Mendelian Patterns and Inheritance, reading p3"},{"id":"FND-GEN-L06-05","block":"Foundations","lecture":"L06 Mendelian Patterns and Inheritance","discipline":"Genetics","style":"Step1","stem":"A girl has progressive proximal weakness and markedly elevated CK. Dystrophin testing shows a pathogenic variant on one X; her father is healthy. Which mechanism best explains her symptoms?","options":{"A":"Uniparental disomy","B":"Skewed X inactivation","C":"Anticipation","D":"Pseudodominance","E":"Imprinting"},"answer":"B","explanation":"If most cells inactivate the normal X, a heterozygous female can manifest an X-linked recessive disease. A: UPD is possible but far less common than skewing. C: DMD isn't a repeat disease. D: Pseudodominance relates to consanguinity in AR. E: Dystrophin isn't imprinted.","source_slide":"L06 Mendelian Patterns and Inheritance, reading p4"},{"id":"FND-GEN-L06-06","block":"Foundations","lecture":"L06 Mendelian Patterns and Inheritance","discipline":"Genetics","style":"LAU","stem":"Unaffected parents have two children with achondroplasia, both carrying the same FGFR3 mutation. Neither parent has the mutation in blood DNA. What best explains the recurrence?","options":{"A":"Incomplete penetrance in a parent","B":"Autosomal recessive inheritance","C":"Anticipation","D":"Locus heterogeneity","E":"Germline (gonadal) mosaicism in a parent"},"answer":"E","explanation":"A mutation in part of a parent's germline can recur in several gametes. A: Achondroplasia is fully penetrant, so a carrier parent would be affected. B: It's dominant. C: Not a repeat disorder. D: The same gene is involved.","source_slide":"L06 Mendelian Patterns and Inheritance, reading p2"},{"id":"FND-GEN-L06-07","block":"Foundations","lecture":"L06 Mendelian Patterns and Inheritance","discipline":"Genetics","style":"LAU","stem":"Hereditary deafness can be caused by mutations in many different genes with AD, AR, or X-linked inheritance. This is an example of:","options":{"A":"Allelic heterogeneity","B":"Pleiotropy","C":"Locus (genetic) heterogeneity","D":"Variable expressivity","E":"Phenocopy"},"answer":"C","explanation":"Different genes causing the same phenotype is locus heterogeneity. A: Allelic heterogeneity is different mutations in one gene. B: Pleiotropy is one gene with multiple effects. D: Variable expressivity is varying severity. E: A phenocopy is a non-genetic mimic (e.g., rubella deafness).","source_slide":"L06 Mendelian Patterns and Inheritance, reading p5"},{"id":"FND-GEN-L06-08","block":"Foundations","lecture":"L06 Mendelian Patterns and Inheritance","discipline":"Genetics","style":"LAU","stem":"A healthy woman's brother and maternal uncle both have hemophilia A. Her parents are unaffected. What is the probability that her first son will be affected?","options":{"A":"1/2","B":"1/4","C":"1/8","D":"2/3","E":"0"},"answer":"B","explanation":"Her mother is an obligate carrier (affected son and affected brother), so the woman has a 1/2 chance of being a carrier, and a carrier's son has a 1/2 risk: 1/2 × 1/2 = 1/4. A: That's the risk if she were a known carrier. C: 1/8 is the risk for a child of unknown sex. D: 2/3 is the carrier risk of an unaffected sibling in AR disease. E: Unaffected women can still be carriers.","source_slide":"L06 Mendelian Patterns and Inheritance, slides 45–46; reading p3–4"},{"id":"FND-GEN-L06-09","block":"Foundations","lecture":"L06 Mendelian Patterns and Inheritance","discipline":"Genetics","style":"LAU","stem":"Different FGFR3 mutations cause achondroplasia, hypochondroplasia, thanatophoric dysplasia, or craniosynostosis. What does the lecture call this?","options":{"A":"Clinical heterogeneity","B":"Locus heterogeneity","C":"Incomplete penetrance","D":"Germline mosaicism","E":"Phenocopy"},"answer":"A","explanation":"One gene producing several distinct phenotypes is clinical heterogeneity. B: Locus heterogeneity is many genes causing one phenotype (e.g., deafness). C: Penetrance is whether a carrier shows any phenotype. D: Germline mosaicism explains recurrence from unaffected parents. E: A phenocopy is a non-genetic mimic.","source_slide":"L06 Mendelian Patterns and Inheritance, slides 20–21, 35"},{"id":"FND-GEN-L07-01","block":"Foundations","lecture":"L07 Unusual Patterns of Inheritance","discipline":"Genetics","style":"LAU","stem":"A woman with a mitochondrial myopathy has several children with very different severity. Her brother, also affected, has unaffected children. What explains both observations?","options":{"A":"Maternal inheritance with heteroplasmy","B":"X-linked inheritance with lyonization","C":"Autosomal dominant inheritance with reduced penetrance","D":"Genomic imprinting","E":"Anticipation"},"answer":"A","explanation":"mtDNA passes only through mothers; heteroplasmy (via the bottleneck) gives variable severity. B: Affected X-linked males would pass it to daughters. C: AD would allow paternal transmission. D: Imprinting depends on parent of origin of a nuclear gene. E: Anticipation needs repeat expansion.","source_slide":"L07 Unusual Patterns of Inheritance, slides 7; reading p9–10"},{"id":"FND-GEN-L07-02","block":"Foundations","lecture":"L07 Unusual Patterns of Inheritance","discipline":"Genetics","style":"LAU","stem":"A 15q11–13 deletion is found in a child with severe intellectual disability, absent speech, ataxia, seizures, and frequent laughter. On which parental chromosome is the deletion?","options":{"A":"Paternal","B":"Either; imprinting doesn't apply","C":"Both","D":"Paternal; UBE3A is expressed only from the paternal copy in brain","E":"Maternal"},"answer":"E","explanation":"Angelman results from loss of maternal UBE3A expression (maternal deletion in ~70%, paternal UPD, or UBE3A mutation). A: A paternal deletion causes Prader-Willi. B: This region is imprinted. C: A homozygous deletion isn't the mechanism. D: UBE3A is paternally imprinted (silenced) in brain, so the maternal copy is the expressed one.","source_slide":"L07 Unusual Patterns of Inheritance, slide 30; reading p8"},{"id":"FND-GEN-L07-03","block":"Foundations","lecture":"L07 Unusual Patterns of Inheritance","discipline":"Genetics","style":"Step1","stem":"A hypotonic newborn later develops hyperphagia, obesity, and hypogonadism. FISH for 15q11–13 is normal, but methylation testing is abnormal. What is the most likely mechanism?","options":{"A":"Paternal uniparental disomy 15","B":"UBE3A point mutation","C":"Maternal uniparental disomy 15","D":"Paternal 15q11–13 deletion","E":"Maternal 15q11–13 deletion"},"answer":"C","explanation":"Prader-Willi without a deletion is almost always maternal UPD15 (no paternal copy). A: Paternal UPD15 causes Angelman. B: UBE3A mutations cause Angelman. D: A deletion would show on FISH. E: A maternal deletion causes Angelman and would also show on FISH.","source_slide":"L07 Unusual Patterns of Inheritance, slide 30; reading p8"},{"id":"FND-GEN-L07-04","block":"Foundations","lecture":"L07 Unusual Patterns of Inheritance","discipline":"Genetics","style":"LAU","stem":"A young man has intellectual disability, a long face, large ears, and macroorchidism. What is the molecular basis?","options":{"A":"CAG expansion in the coding region of huntingtin","B":"CGG expansion in the FMR1 5′ UTR with methylation and silencing","C":"CTG expansion in the DMPK 3′ UTR","D":"GAA expansion in frataxin","E":"Deletion of 15q11–13"},"answer":"B","explanation":"Fragile X: a full CGG expansion in the FMR1 5′ UTR (>250 repeats per the slide) is methylated, so FMRP is absent. A: Huntington disease. C: Myotonic dystrophy. D: Friedreich ataxia. E: Prader-Willi/Angelman.","source_slide":"L07 Unusual Patterns of Inheritance, slides 33–34"},{"id":"FND-GEN-L07-05","block":"Foundations","lecture":"L07 Unusual Patterns of Inheritance","discipline":"Genetics","style":"LAU","stem":"A 38-year-old woman has premature ovarian failure. Her nephew has fragile X syndrome. What is her most likely genotype?","options":{"A":"Full FMR1 mutation","B":"Normal FMR1 allele","C":"Maternal UPD of chromosome X","D":"FMR1 premutation","E":"Skewed X inactivation of a normal X"},"answer":"D","explanation":"Premutation carriers (59 to ~200 CGG repeats) have a ~20% risk of premature ovarian failure before 40; full-mutation carriers don't. A: Full mutations aren't linked to ovarian failure. B: A normal allele wouldn't explain it. C: UPD of X isn't the mechanism. E: Skewing of a normal X doesn't cause ovarian failure.","source_slide":"L07 Unusual Patterns of Inheritance, slide 35"},{"id":"FND-GEN-L07-06","block":"Foundations","lecture":"L07 Unusual Patterns of Inheritance","discipline":"Genetics","style":"LAU","stem":"Which mtDNA defect is typical of Kearns-Sayre syndrome?","options":{"A":"m.3243A>G point mutation","B":"m.8344A>G point mutation","C":"m.11778G>A point mutation","D":"Nuclear POLG mutation","E":"Single large mtDNA deletion"},"answer":"E","explanation":"KSS, Pearson syndrome, and CPEO are caused by single mtDNA deletions. A: MELAS. B: MERRF. C: LHON. D: POLG causes SANDO/MIRAS.","source_slide":"L07 Unusual Patterns of Inheritance, slides 14–16"},{"id":"FND-GEN-L07-07","block":"Foundations","lecture":"L07 Unusual Patterns of Inheritance","discipline":"Genetics","style":"Step1","stem":"A 34-year-old woman has diabetes and progressive bilateral hearing loss; her mother had the same, and her brother has recurrent stroke-like episodes with lactic acidosis. Which variant is most likely?","options":{"A":"m.3243A>G","B":"m.8344A>G","C":"m.8993T>G","D":"m.11778G>A","E":"FMR1 premutation"},"answer":"A","explanation":"m.3243A>G most often presents as maternally inherited diabetes and deafness, and also causes MELAS. B: MERRF (myoclonus, ragged red fibers). C: NARP. D: LHON. E: Fragile X–associated disorders.","source_slide":"L07 Unusual Patterns of Inheritance, slides 15, 17"},{"id":"FND-GEN-L07-08","block":"Foundations","lecture":"L07 Unusual Patterns of Inheritance","discipline":"Genetics","style":"LAU","stem":"A complete hydatidiform mole has a 46,XX karyotype. What is the parental origin of its genome?","options":{"A":"Entirely maternal","B":"Equal maternal and paternal","C":"Maternal with one extra paternal set","D":"Entirely paternal","E":"Paternal with one extra maternal set"},"answer":"D","explanation":"Complete moles are androgenetic, so paternal genome leads to placental overgrowth with no fetus. A: Entirely maternal is an ovarian teratoma. B: That's normal. C: That's a partial mole (69,XXY). E: A maternal extra set gives a small placenta.","source_slide":"L07 Unusual Patterns of Inheritance, reading p8"},{"id":"FND-GEN-L07-09","block":"Foundations","lecture":"L07 Unusual Patterns of Inheritance","discipline":"Genetics","style":"LAU","stem":"A man inherited from his mother an allele that is silenced by maternal imprinting in his somatic cells. What imprint will this allele carry in his sperm?","options":{"A":"Maternal imprint, maintained","B":"Paternal imprint, after erasure and resetting","C":"No imprint, permanently erased","D":"Maternal imprint in half of his sperm","E":"A random imprint set at fertilization"},"answer":"B","explanation":"Imprints are maintained through somatic divisions but erased and reset during gametogenesis, so all of a man's gametes carry a paternal imprint. A: Maintenance applies to somatic cells, not gametes. C: The imprint is reset, not lost. D: Gametes are 100% maternal or 100% paternal by the parent's sex. E: Imprints are set during gametogenesis, before fertilization.","source_slide":"L07 Unusual Patterns of Inheritance, slides 24, 26"},{"id":"FND-HIST-L08-01","block":"Foundations","lecture":"L08 The Blood Vessels","discipline":"Histology","style":"LAU","stem":"A vessel has a thick media of many smooth muscle layers with scanty elastic fibers, bounded by distinct internal and external elastic laminae. Which vessel is it?","options":{"A":"Aorta","B":"Femoral artery","C":"Femoral vein","D":"Inferior vena cava","E":"Arteriole"},"answer":"B","explanation":"Muscular (distributing) arteries, e.g., femoral, radial, coronary, have a thick smooth-muscle media and both elastic laminae. A: The aorta is an elastic artery; its media is dominated by fenestrated elastic membranes. C, D: Veins lack distinct internal and external elastic laminae. E: Arterioles have only 2–3 smooth muscle layers.","source_slide":"L08 The Blood Vessels, slides 8–11, 20"},{"id":"FND-HIST-L08-02","block":"Foundations","lecture":"L08 The Blood Vessels","discipline":"Histology","style":"LAU","stem":"A biopsy shows capillaries whose endothelial cells are perforated by fenestrae but rest on a continuous basal lamina. Which organ was most likely biopsied?","options":{"A":"Liver","B":"Lung","C":"Skeletal muscle","D":"Spleen","E":"Pancreas"},"answer":"E","explanation":"Fenestrated (visceral) capillaries have fenestrae with a continuous basal lamina; they occur where exchange is extensive: endocrine glands, intestine, pancreas, renal glomeruli. A, D: Liver and spleen have sinusoidal capillaries (large fenestrae, discontinuous basal lamina). B, C: Lung and muscle have continuous capillaries (no fenestrae).","source_slide":"L08 The Blood Vessels, slide 15"},{"id":"FND-HIST-L08-03","block":"Foundations","lecture":"L08 The Blood Vessels","discipline":"Histology","style":"LAU","stem":"Which feature best distinguishes a medium-sized vein from its companion muscular artery?","options":{"A":"Thicker tunica media","B":"Distinct internal elastic lamina","C":"Adventitia as the thickest layer","D":"Fewer vasa vasorum","E":"Smaller, rounder lumen"},"answer":"C","explanation":"In veins the adventitia is the thickest, most prominent layer and the media is thin (2–4 smooth muscle layers). A, B: These describe the artery. D: Vasa vasorum are more numerous in veins. E: Veins have larger, more irregular lumina.","source_slide":"L08 The Blood Vessels, slides 19–20, 23"},{"id":"FND-HIST-L08-04","block":"Foundations","lecture":"L08 The Blood Vessels","discipline":"Histology","style":"Step1","stem":"A 55-year-old teacher who stands all day has dilated, tortuous superficial leg veins and ankle edema. What is the primary structural failure?","options":{"A":"Incompetent venous valves","B":"Loss of arterial elastic laminae","C":"Thickened arteriolar media","D":"Loss of lymphatic anchoring filaments","E":"Loss of capillary pericytes"},"answer":"A","explanation":"Valve failure in leg veins is the basis of varicose veins; the valves are intimal folds. B, C: These are arterial changes. D: Anchoring filaments hold lymphatic capillaries open; their loss would impair lymph drainage, not dilate veins. E: Pericytes surround capillaries and postcapillary venules, not the superficial leg veins.","source_slide":"L08 The Blood Vessels, slide 19"},{"id":"FND-HIST-L08-05","block":"Foundations","lecture":"L08 The Blood Vessels","discipline":"Histology","style":"LAU","stem":"Veins contain approximately what percentage of the body's total blood volume at any given time?","options":{"A":"10%","B":"30%","C":"50%","D":"70%","E":"90%"},"answer":"D","explanation":"The slides state veins hold about 70% of total blood volume (capacitance vessels). A, B, C: Too low. E: Too high; arteries, capillaries and the heart hold the rest.","source_slide":"L08 The Blood Vessels, slide 19"},{"id":"FND-HIST-L08-06","block":"Foundations","lecture":"L08 The Blood Vessels","discipline":"Histology","style":"LAU","stem":"What keeps lymphatic capillaries open when interstitial pressure rises?","options":{"A":"Anchoring filaments tethering them to connective tissue","B":"Thick smooth muscle","C":"Continuous tight junctions","D":"Fenestrated endothelium","E":"Valves at the blind end"},"answer":"A","explanation":"Anchoring filaments pull the endothelium open as tissue swells. B: Lymphatic capillaries lack muscle. C: Their junctions are loose. D: They lack fenestrae. E: Valves occur in larger lymphatics.","source_slide":"L08 The Blood Vessels, slide 26"},{"id":"FND-HIST-L08-07","block":"Foundations","lecture":"L08 The Blood Vessels","discipline":"Histology","style":"LAU","stem":"Contraction of which structures prevents blood from entering a capillary bed?","options":{"A":"Smooth muscle of muscular venules","B":"Venous valves","C":"External elastic lamina","D":"Vasa vasorum","E":"Precapillary sphincters"},"answer":"E","explanation":"Precapillary sphincters are individual smooth muscle cells around capillaries at their origin from metarterioles; their constriction stops blood entering the bed. A: Muscular venules are downstream of the bed. B: Valves prevent venous backflow. C: Elastic laminae don't contract. D: Vasa vasorum supply the walls of large vessels.","source_slide":"L08 The Blood Vessels, slides 12–13"},{"id":"FND-HIST-L08-08","block":"Foundations","lecture":"L08 The Blood Vessels","discipline":"Histology","style":"LAU","stem":"Which combination of features describes the capillaries of the spleen and bone marrow?","options":{"A":"No fenestrae; continuous basal lamina","B":"Small fenestrae; continuous basal lamina","C":"Many large fenestrae; discontinuous basal lamina","D":"No fenestrae; sparse basal lamina with anchoring filaments","E":"Smooth muscle layer; continuous basal lamina"},"answer":"C","explanation":"Sinusoidal capillaries (liver, spleen, bone marrow, lymph nodes, adrenal cortex) have many large fenestrae and a discontinuous basal lamina. A: Continuous capillaries. B: Fenestrated capillaries. D: Lymphatic capillaries. E: Capillaries have no muscular layer.","source_slide":"L08 The Blood Vessels, slides 14–15, 26"},{"id":"FND-HIST-L08-09","block":"Foundations","lecture":"L08 The Blood Vessels","discipline":"Histology","style":"LAU","stem":"The common carotid artery is classified as which vessel type, with which tunica media?","options":{"A":"Muscular artery; layers of smooth muscle with scanty elastic fibers","B":"Muscular artery; fenestrated elastic membranes","C":"Elastic artery; 2–3 layers of smooth muscle","D":"Elastic artery; fenestrated elastic membranes","E":"Arteriole; 2–3 layers of smooth muscle"},"answer":"D","explanation":"The aorta and its major branches (common carotid, subclavian, large pulmonary arteries) are elastic (conducting) arteries; their broad media of fenestrated elastic membranes damps pressure changes with each heartbeat. A: Describes muscular arteries such as the femoral or radial. B: Mismatch; muscular arteries have scanty elastic fibers. C, E: A 2–3-layer smooth muscle media describes arterioles.","source_slide":"L08 The Blood Vessels, slides 8–9, 11"},{"id":"FND-ETH-L01-01","block":"Foundations","lecture":"L01 Introduction to Bioethics","discipline":"Medical Ethics","style":"LAU","stem":"A competent adult Jehovah's Witness refuses a life-saving transfusion after being fully informed. Which principle most directly requires the physician to respect this?","options":{"A":"Beneficence","B":"Paternalism","C":"Autonomy","D":"Justice","E":"Utility"},"answer":"C","explanation":"A voluntary, informed, competent refusal must be respected, even for life-saving treatment (autonomy). A: Beneficence pulls toward transfusing. B: Overriding the refusal would be paternalism, which the lecture says is no longer the accepted norm. D: Justice concerns fair distribution. E: Utility is the consequentialist principle of the greatest good for the greatest number.","source_slide":"L01 Introduction to Bioethics, slides 47, 50–51"},{"id":"FND-ETH-L01-02","block":"Foundations","lecture":"L01 Introduction to Bioethics","discipline":"Medical Ethics","style":"LAU","stem":"A resident believes she must disclose a colleague's missed lesion to the patient because lying is wrong regardless of consequences. Which theory is she applying?","options":{"A":"Deontology","B":"Consequentialism","C":"Virtue theory","D":"Utilitarianism","E":"Doctrine of double effect"},"answer":"A","explanation":"Deontology (Kant, duty-based): an act is right or wrong in itself under a rule, regardless of outcome; Kant's first formulation is to always tell patients the truth. B, D: These judge an act by its consequences. C: Virtue theory asks what a good person would do. E: Double effect concerns an act with an intended good effect and a foreseen, unintended harmful one.","source_slide":"L01 Introduction to Bioethics, slides 34–36"},{"id":"FND-ETH-L01-03","block":"Foundations","lecture":"L01 Introduction to Bioethics","discipline":"Medical Ethics","style":"LAU","stem":"Which Belmont Report principle is applied through fair selection of research subjects?","options":{"A":"Respect for persons","B":"Beneficence","C":"Autonomy","D":"Justice","E":"Non-maleficence"},"answer":"D","explanation":"Justice → fair subject selection. A: Respect for persons → informed consent. B: Beneficence → risk/benefit assessment. C, E: Not Belmont's three principles.","source_slide":"L01 Introduction to Bioethics, slide 25"},{"id":"FND-ETH-L01-04","block":"Foundations","lecture":"L01 Introduction to Bioethics","discipline":"Medical Ethics","style":"LAU","stem":"A hysterectomy for uterine cancer in a pregnant woman ends the pregnancy. Which reasoning justifies the surgery?","options":{"A":"Utilitarian calculus","B":"Doctrine of double effect","C":"Paternalism","D":"Distributive justice","E":"Virtue theory"},"answer":"B","explanation":"The intended, good effect is saving her life; fetal death is foreseen but neither intended nor the means to the good effect. A: Weighing the greatest good for the greatest number is not the reasoning the lecture applies. C: She decides, so it isn't paternalism. D: Justice concerns fair distribution of resources. E: Virtue theory asks what a good person would do, not how to treat a harmful side effect.","source_slide":"L01 Introduction to Bioethics, slides 45–46"},{"id":"FND-ETH-L01-05","block":"Foundations","lecture":"L01 Introduction to Bioethics","discipline":"Medical Ethics","style":"LAU","stem":"Which set of criteria do standard (UNOS-style) organ-allocation ethics weigh?","options":{"A":"Urgency, age, social role, time on the waiting list","B":"Compatibility, social support, number of dependents, urgency","C":"Likelihood of benefit, ability to pay, compatibility, waiting time","D":"Lifestyle, urgency, compatibility, time on the waiting list","E":"Urgency, compatibility, likelihood of benefit, time on the waiting list"},"answer":"E","explanation":"Medical urgency, compatibility, likelihood of benefit and waiting time are weighed; judgments of social worth, lifestyle or 'deservingness' are deliberately excluded. A: Social role is a social-worth judgment. B: Social support and dependents are social-worth judgments. C: Ability to pay is not a criterion. D: Lifestyle is excluded.","source_slide":"L01 Introduction to Bioethics, slide 12"},{"id":"FND-ETH-L01-06","block":"Foundations","lecture":"L01 Introduction to Bioethics","discipline":"Medical Ethics","style":"LAU","stem":"On the lecture's risk–benefit grid, how is an intervention with high risk and high benefit classified and handled?","options":{"A":"Futile: avoid it","B":"Consented: the most common case","C":"Unacceptable: avoid it","D":"Hazardous: the patient decides","E":"Hazardous: the physician decides"},"answer":"D","explanation":"High risk with high benefit is 'hazardous', and the decision is the patient's. A: Futile is low risk, low benefit. B: Consented is low risk, high benefit. C: Unacceptable is high risk, low benefit. E: Letting the physician decide would be paternalism.","source_slide":"L01 Introduction to Bioethics, slide 40"},{"id":"FND-ETH-L01-07","block":"Foundations","lecture":"L01 Introduction to Bioethics","discipline":"Medical Ethics","style":"LAU","stem":"In which situation does the lecture describe paternalism as broadly accepted?","options":{"A":"A competent Jehovah's Witness refusing a transfusion","B":"An 88-year-old choosing watchful waiting for metastatic cancer","C":"A patient who is an immediate danger to himself after a suicide attempt","D":"A well-informed patient who disagrees with the physician's preferred option","E":"A patient who asks that his HIV status be kept from his wife"},"answer":"C","explanation":"Justified paternalism: when a patient is a danger to themselves, beneficence requires intervening because the patient cannot, at that moment, act in their own best interest. A, B: Competent, informed refusals that autonomy requires respecting. D: The ideal physician respects the informed patient as a partner. E: A confidentiality question, not one of overriding the patient's own treatment choice.","source_slide":"L01 Introduction to Bioethics, slides 41, 47–50"},{"id":"FND-ETH-L02-01","block":"Foundations","lecture":"L02 Relationship Between Physician and Patient","discipline":"Medical Ethics","style":"LAU","stem":"A physician becomes angry at her 80-year-old patient for not following his diet; her own father died of heart failure after ignoring similar advice. What is happening?","options":{"A":"Positive transference","B":"Negative transference","C":"Denial","D":"Countertransference","E":"Paternalism"},"answer":"D","explanation":"The physician's unconscious reaction stems from her own past. A, B: Transference is the patient's reaction to the physician. C: Denial is a patient defense. E: Paternalism is deciding for the patient.","source_slide":"L02 Relationship Between Physician and Patient, slides 37, 46"},{"id":"FND-ETH-L02-02","block":"Foundations","lecture":"L02 Relationship Between Physician and Patient","discipline":"Medical Ethics","style":"LAU","stem":"Which model has the physician explain options and help the patient clarify their own values before choosing?","options":{"A":"Interpretive","B":"Paternalistic","C":"Informative","D":"Deliberative","E":"Doctor-centred"},"answer":"A","explanation":"The interpretive model elucidates the patient's values and helps select matching interventions. B: The physician decides. C: The physician informs; the patient chooses alone. D: The physician guides toward the best health values as a teacher/friend. E: A practice style, not one of the four models.","source_slide":"L02 Relationship Between Physician and Patient, slides 15–16"},{"id":"FND-ETH-L02-03","block":"Foundations","lecture":"L02 Relationship Between Physician and Patient","discipline":"Medical Ethics","style":"LAU","stem":"Which factor does the lecture link to a patient not adhering to the treatment plan?","options":{"A":"Low level of education","B":"Low socioeconomic status","C":"Negative transference","D":"Female gender","E":"Lower intelligence"},"answer":"C","explanation":"Patients with negative transference feel excessive resentment or anger when their expectations aren't met and may not adhere to the treatment plan. A, B, D, E: The lecture states adherence is not related to gender, religion, socioeconomic or marital status, race, intelligence, or education.","source_slide":"L02 Relationship Between Physician and Patient, slides 36–37"},{"id":"FND-ETH-L02-04","block":"Foundations","lecture":"L02 Relationship Between Physician and Patient","discipline":"Medical Ethics","style":"LAU","stem":"A 7-year-old girl involved in an accident won't say her name. What should the physician do?","options":{"A":"Repeat the question using direct closed questions","B":"Ask her questions in the third person","C":"Avoid speaking with her until a parent arrives","D":"Tell her that nothing bad will happen to her","E":"Ask open-ended questions about the accident"},"answer":"B","explanation":"For young children the lecture recommends questions in the third person and non-verbal means such as drawing together. A: Repeating direct questions doesn't help a child who won't answer. C: Waiting delays communication. D: Falsely reassuring statements are inappropriate. E: Open-ended questions suit adults who speak freely; the slide's child-specific techniques are third-person questions and drawing.","source_slide":"L02 Relationship Between Physician and Patient, slides 32, 45"},{"id":"FND-ETH-L02-05","block":"Foundations","lecture":"L02 Relationship Between Physician and Patient","discipline":"Medical Ethics","style":"LAU","stem":"In a two-person conversation, roughly how much of the social meaning is carried by non-verbal components?","options":{"A":"10%","B":"25%","C":"35%","D":"50%","E":"65% or more"},"answer":"E","explanation":"Non-verbal cues (eye contact, posture, voice, proximity) carry ≥65%; verbal content carries <35%. A, B, C, D: Too low.","source_slide":"L02 Relationship Between Physician and Patient, slide 29"},{"id":"FND-ETH-L02-06","block":"Foundations","lecture":"L02 Relationship Between Physician and Patient","discipline":"Medical Ethics","style":"LAU","stem":"A patient is overly talkative and keeps drifting to unrelated topics. Which interviewing technique does the lecture recommend?","options":{"A":"Open-ended questions","B":"Direct questions","C":"Third-person questions","D":"Remaining silent until the patient stops","E":"Non-verbal drawing exercises"},"answer":"B","explanation":"Direct questions elicit information quickly in an emergency or when the patient is seductive or overly talkative. A: Open-ended questions encourage free speech, the opposite of what's needed here. C, E: Techniques for young children. D: Silence lets the digression
