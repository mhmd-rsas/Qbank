<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="description" content="Personal question bank for LAU medical school modules.">
<meta name="theme-color" content="#1f6f8b">
<title>LAU QBank</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="#/" aria-label="LAU QBank home">LAU QBank</a>
  <nav aria-label="Main">
    <a href="#/" data-nav="home">Home</a>
    <a href="#/mistakes" data-nav="mistakes">Mistakes</a>
    <a href="#/stats" data-nav="stats">Stats</a>
    <a href="#/search" data-nav="search">Search</a>
    <a href="#/settings" data-nav="settings">Settings</a>
  </nav>
  <button class="icon" id="themeBtn" type="button" aria-label="Switch between light and dark mode" title="Light / dark">◐</button>
</header>
<div id="offline" class="banner" hidden role="status">You are offline. Saved questions still work; progress is stored on this device.</div>
<main id="main" tabindex="-1"><p class="mute">Loading questions…</p></main>
<div id="live" class="sr" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="dlgT"><h2 id="dlgT"></h2><div id="dlgB"></div><div class="row end"><button class="btn ghost" id="dlgNo" type="button">Cancel</button><button class="btn" id="dlgYes" type="button">OK</button></div></dialog>
<noscript><p style="padding:16px">This question bank needs JavaScript turned on.</p></noscript>
<script src="app.js"></script>
</body>
</html>
